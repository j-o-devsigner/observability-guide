<script id="docs" type="application/json">[{"group": "1 · Foundations", "path": "standard/00-start-here.md", "slug": "standard-00-start-here", "title": "00 · Start here", "md": "# 00 · Start here\n\n> **In 30 seconds:** this guide is a standard for observability with **OpenTelemetry (collection) and Dynatrace\n> (backend)**. It has six parts. Pick your situation below, read that section, and use the rest as reference.\n> Open-source variants (Prometheus, Grafana) appear in collapsed boxes where useful.\n\n## The six parts\n\n| Part | Sections | Answers |\n|---|---|---|\n| **1. Foundations** | [01 Layers](#standard-01-layers) · [02 Maturity](#standard-02-maturity-model) · [03 Definition of done](#standard-03-definition-of-done) | Where does a problem live? How good are we? When is a service \"monitored\"? |\n| **2. Signals** | [04 Endpoints](#standard-04-endpoint-coverage) · [05 Logging](#standard-05-logging-standard) · [06 Queues, batch, external](#standard-06-workload-types) · [07 Frontend](#standard-07-frontend-experience) · [08 Kubernetes](#standard-08-kubernetes-cluster) · [09 Internal & platform services](#standard-09-internal-services) | What must each kind of component emit? |\n| **3. Reliability** | [10 SLOs](#standard-10-slos-and-error-budgets) · [11 Alerting](#standard-11-alerting) · [12 Releases & DORA](#standard-12-releases-and-dora) · [13 Capacity](#standard-13-capacity-and-saturation) | What do we promise, when do we page, which change broke it, will it fit next quarter? |\n| **4. Dashboards** | [14 Dashboards](#standard-14-dashboards) | How do we show it? |\n| **5. Platform** | [15 OTel practices](#standard-15-opentelemetry-practices) · [16 Collectors](#standard-16-collector-templates) · [17 Dynatrace](#standard-17-dynatrace-integration) · [18 Automation](#standard-18-automation-and-scale) · [19 Cost](#standard-19-cost-and-cardinality) | How is the pipeline built, run, scaled and paid for? |\n| **6. People & process** | [20 Ownership & severity](#standard-20-ownership-and-communication) · [21 Incidents & on-call](#standard-21-incident-response-and-on-call) · [22 Resilience](#standard-22-resilience) · [23 Measuring effectiveness](#standard-23-measuring-effectiveness) · [transition plan](#framework-transition-plan) · playbooks · [case study](#examples-case-study) | Who does what, how we respond and learn, how we prove it works |\n\n## I have a problem right now\n\n```text\nWhat do you see?\n├─ Users or clients complain ─────────────► 01 locate the layer → 04 per client → playbooks/multi-client-endpoint\n├─ Errors or latency went up ─────────────► Did something change? → 12 releases → playbooks/release-regression\n├─ It's slow and the service looks fine ──► 09 measure from the caller → dependencies, pools, timeouts\n├─ A queue is late ───────────────────────► 06 queue model (arrival vs processing, oldest age) → 13 capacity\n├─ An alert fired and I don't trust it ───► 11 (percentage vs count, guards, one source per symptom)\n├─ Pods / nodes look bad ─────────────────► 08 Kubernetes → then check users (10 SLO): are they affected?\n├─ We'll run out soon (traffic growing) ──► 13 capacity: load test, headroom, forecast\n├─ Telemetry is missing ──────────────────► 16 collector self-monitoring\n├─ An incident is happening ──────────────► 20 severity → 21 runbook, roles, comms\n└─ Business number looks wrong ───────────► 04 business metrics → 01 business layer\n```\n\n## I want to build or improve something\n\n| Goal | Read | Then use |\n|---|---|---|\n| Monitor a new service | [18](#standard-18-automation-and-scale) (service file + archetype), [03](#standard-03-definition-of-done) | `observability.yaml` |\n| Measure microservices with one template | [18 · microservices](#standard-18-automation-and-scale--measuring-microservices-with-templates) | Baseline + archetype + parameters |\n| Define SLOs and a policy | [10](#standard-10-slos-and-error-budgets) | [SLO document](#framework-slo-document-template), [error budget policy](#framework-error-budget-policy-template) |\n| Reduce alert noise | [11 §7](#standard-11-alerting--7-cleaning-up-a-noisy-alert-set) | [playbook](#playbooks-noisy-alerts-cleanup) |\n| Plan capacity, right-size, autoscale | [13](#standard-13-capacity-and-saturation) | Monthly capacity review |\n| Write a runbook / a postmortem | [21](#standard-21-incident-response-and-on-call) | [runbook](#framework-runbook-template), [postmortem](#framework-postmortem-template) templates |\n| Test backups, failover and alerts on purpose | [22](#standard-22-resilience) | [game day template](#framework-game-day-template) |\n| Prove the observability works; measure my impact | [23](#standard-23-measuring-effectiveness) | Scorecard + impact log |\n| Measure internal and shared platform services | [09](#standard-09-internal-services) | Archetype `platform-service` in [dynatrace/](#dynatrace-readme) |\n| Connect incidents to releases, track DORA | [12](#standard-12-releases-and-dora) | [playbook](#playbooks-dora-from-pipelines) |\n| Build dashboards | [14](#standard-14-dashboards) | One L1 template with a `service` variable |\n| Deploy collectors | [16](#standard-16-collector-templates) | [collector/](#collector-readme) |\n| Decide OneAgent vs OpenTelemetry, control cost | [17](#standard-17-dynatrace-integration), [19](#standard-19-cost-and-cardinality) | – |\n| Change an existing setup | [02](#standard-02-maturity-model) | [transition plan](#framework-transition-plan) |\n\n## The ten ideas behind the whole guide\n\n| # | Idea | Section |\n|---|---|---|\n| 1 | Find the **layer** first: Business, UX, Service, Resources, Delivery | 01 |\n| 2 | Every signal carries **service, version, team, environment** (and client when it matters) | 04, 15 |\n| 3 | **Page on symptoms**, diagnose with causes; a **percentage** says how bad, a **count** says how many | 11 |\n| 4 | **SLO + burn rate** beats fixed thresholds, and needs an **error budget policy** | 10 |\n| 5 | **Most incidents start with a change**: version on every signal, deployment events | 12 |\n| 6 | **Measure dependencies from the caller**; internal SLOs are stricter than the ones that depend on them | 09 |\n| 7 | **Capacity is demand vs load-tested supply**; alert on the forecast, not on CPU | 13 |\n| 8 | **One template, many services**: baseline + archetype + parameters, as code with Monaco | 18 |\n| 9 | **OpenTelemetry collects, Dynatrace analyzes**; the gateway is your control point | 16, 17 |\n| 10 | **No alert without an owner** and a runbook; every claim links to official docs or is marked as a rule of thumb | 20, [REFERENCES](#references) |\n\nWords you don't know: [GLOSSARY](#glossary).\n"}, {"group": "1 · Foundations", "path": "standard/01-layers.md", "slug": "standard-01-layers", "title": "01 · Layers and methods", "md": "# 01 · Layers and methods\n\n> Every observability question lives in a **layer**. Find the layer first, then pick the method.\n> **Alert on the top layers** (symptoms). **Diagnose with the lower layers** (causes).\n> **Delivery** runs alongside all of them: changes are the most common cause of incidents.\n\n## The five layers\n\n| Layer | Question it answers | Method | Example signals | Alert? |\n|---|---|---|---|---|\n| **Business** | Is the business doing well? | Custom KPIs | orders/min, revenue, avg price vs goal, conversion | Yes, to the business owner (ticket/chat) |\n| **User experience** | Can users actually use it? | Synthetic checks + RUM | external uptime, journey success, Apdex, Core Web Vitals | Yes (page if a key journey fails) |\n| **Service / endpoint** | Is my endpoint healthy? | **RED** / **Golden Signals** | req/s, error %, p95/p99 latency, saturation | Yes, SLO burn rate (page) |\n| **Resources** | Is something underneath saturated? | **USE** | CPU throttling, memory vs limit, pool/queue depth, disk | Rarely (only on predicted exhaustion) |\n| **Delivery** (cross-cutting) | Did a change cause this? How fast and safe do we ship? | **DORA** + release markers | deploys, `service.version`, lead time, change failure rate, time to restore | Yes, regression after a deploy (see [12](#standard-12-releases-and-dora)) |\n\n<div data-widget=\"viz\" data-chart=\"layers\"><\/div>\n\n## Methods\n\n| Method | Signals | Apply to | Source |\n|---|---|---|---|\n| **RED** | Rate, Errors, Duration | Request-driven things: endpoints, services, gRPC methods | Tom Wilkie, *The RED Method* |\n| **USE** | Utilization, Saturation, Errors | Resources: nodes, pods, connection/thread pools, queues, disks | Brendan Gregg, *The USE Method* |\n| **Golden Signals** | Latency, Traffic, Errors, Saturation | Per-service view (RED + Saturation) | Google SRE Book, ch. 6 |\n| **DORA** | Deployment frequency, Lead time for changes, Change failure rate, Failed deployment recovery time | The delivery process | DORA / *Accelerate* (Forsgren, Humble, Kim) |\n\n## How to use this file to locate a problem\n\n| The symptom sounds like… | Start at layer | Then check |\n|---|---|---|\n| \"Sales dropped\", \"price below goal\" | Business | User experience → Service |\n| \"Users can't log in / checkout\" | User experience | Service (which route?) → Resources |\n| \"Errors / latency went up\" | Service | **Delivery** (was there a deploy?) → Resources |\n| \"Pods restarting\", \"node pressure\" | Resources | Service (are users affected? if not, it's not urgent) |\n| \"It broke after the release\" | Delivery | Service by `service.version` |\n| \"Client X complains, dashboard looks fine\" | Service, **per client** | See [04 · multi-client](#standard-04-endpoint-coverage--multiple-clients-on-one-service) |\n\n> Official links and verification status: [REFERENCES.md](#references)\n"}, {"group": "1 · Foundations", "path": "standard/02-maturity-model.md", "slug": "standard-02-maturity-model", "title": "02 · Maturity model: what good observability looks like", "md": "# 02 · Maturity model: what good observability looks like\n\n> Score each dimension 0–4 for the current setup, decide the target, and the gap becomes the plan\n> ([framework/transition-plan.md](#framework-transition-plan)). Don't aim for 4 everywhere: aim for what the business needs.\n\n## Levels\n\n| Level | Name | In one sentence |\n|---|---|---|\n| 0 | **Blind** | We learn about problems from users |\n| 1 | **Reactive** | We have metrics and many alerts, mostly on causes (CPU, pods) |\n| 2 | **Service-aware** | RED per service, SLOs, symptom alerts with owners and runbooks |\n| 3 | **Correlated** | Metrics ↔ traces ↔ logs linked; releases, clients and owners on every signal |\n| 4 | **Proactive** | SLOs drive decisions; deploys are gated by telemetry; business KPIs watched |\n\n## Scorecard by dimension\n\n| Dimension | 1 · Reactive | 2 · Service-aware | 3 · Correlated | 4 · Proactive |\n|---|---|---|---|---|\n| **Instrumentation** | Infra metrics, some app logs | RED via OTel / semconv on key services | Traces end to end, exemplars, structured logs with `trace_id` | Business events instrumented; auto-instrumentation by default |\n| **Context** | Host / pod labels | `service.name`, env | + `service.version`, `team`, `client.id` | Service catalog drives labels |\n| **Alerting** | Thresholds on causes, many duplicates | SLO burn rate, 2 severities, runbooks | Per-client / per-version, grouped, deploy-aware | Few pages, > 90% actionable, reviewed |\n| **Dashboards** | One per person, no standard | Template per service (RED + SLO) | Drill-down to traces/logs, deploy annotations | Business + technical in one view |\n| **Ownership** | \"Whoever knows\" | Team label on alerts | Routing by team, catalog | Owners review SLOs monthly with business |\n| **Delivery** | Deploys invisible | Deploy annotations | Version dimension, regression alerts | Canary analysis, budget-based freezes, DORA tracked |\n| **Process** | No postmortems | Postmortems for big incidents | Action items tracked, alert reviews | Learnings feed the standard; game days |\n| **Cost / governance** | Unknown | Retention set per signal | Cardinality budgets, sampling | Cost per team visible |\n| **Culture** (Westrum) | Pathological: messengers blamed, information hoarded | Bureaucratic: information follows the rules and channels | Generative leaning: blameless postmortems, failures lead to inquiry | Generative: high cooperation, information flows to who needs it |\n\n### Measuring culture\n\nDORA measures culture with Westrum's survey: people rate statements such as *\"information is actively sought\"*, *\"failures are treated as opportunities to improve\"*, *\"new ideas are welcomed\"* on a 1–7 scale, and the scores are averaged. DORA's research found that a high-trust culture where information flows freely predicts software delivery and organizational performance. Run it anonymously, once per quarter ⚠️.\n\n## How to score fast (per dimension)\n\n| Question | If no → level ≤ |\n|---|---|\n| Can you tell users are failing before they tell you? | 0 |\n| Does every page have an owner and a runbook? | 1 |\n| Is there an SLO for the top 3 user journeys? | 1 |\n| Can you go metric → trace → log for one request in ≤ 3 clicks? | 2 |\n| Can you split errors by version and by client? | 2 |\n| Does a bad deploy get detected (or rolled back) automatically? | 3 |\n\n## Showing the result\n\nA dumbbell per dimension shows where the team moved, and how far it still is from the target:\n\n<div data-widget=\"viz\" data-chart=\"maturity-dumbbell\"><\/div>\n\n## Output format\n\n```markdown\n| Dimension | Current | Target | Gap (one line) |\n|---|---|---|---|\n| Alerting | 1 | 3 | 240 cause alerts, no SLOs, no grouping |\n```\n\n## Sources\n\n- Google SRE Book & Workbook (SLOs, alerting, postmortems)\n- CNCF TAG Observability, *Observability Whitepaper*\n- DORA research: monitoring & observability capability (dora.dev)\n- *Observability Engineering* (Majors, Fong-Jones, Miranda)\n- [DORA: Generative organizational culture](https://dora.dev/capabilities/generative-organizational-culture/) ✅ 2026-11-20\n\n*(The level names and the scorecard are this guide's own synthesis, not an official model.)*\n\n> Official links and verification status: [REFERENCES.md](#references)\n"}, {"group": "1 · Foundations", "path": "standard/03-definition-of-done.md", "slug": "standard-03-definition-of-done", "title": "03 · Definition of done: is this endpoint/service monitored?", "md": "# 03 · Definition of done: is this endpoint/service monitored?\n\n> Use this table as the **Production Readiness Review (PRR)** checklist before a service goes live or joins on-call\n> ([SRE Workbook, Engagement Model](https://sre.google/workbook/engagement-model/)).\n>\n> A service is well monitored when you can **break it on purpose** and the system tells you\n> **what broke, for whom, which change caused it, and who owns it**, before a client does.\n\n<div data-widget=\"checklist\"><\/div>\n\n| # | Check | Layer | Standard |\n|---|---|---|---|\n| 1 | RED metrics by `http.route` (histogram, not summary) | Service | [04](#standard-04-endpoint-coverage) |\n| 2 | Resource attributes: `service.name`, `service.version`, `team`, env | All | [04](#standard-04-endpoint-coverage) |\n| 3 | SLO document approved (availability + latency) and an error budget policy agreed | Service | [10](#standard-10-slos-and-error-budgets) |\n| 4 | Burn-rate alerts, per client if multi-tenant, with min-count guard | Service | [11](#standard-11-alerting) |\n| 5 | Every alert has `team`, `severity`, `runbook_url`, `dashboard_url` | Process | [20](#standard-20-ownership-and-communication) |\n| 6 | Traces end to end, dependencies as child spans | Traces | [04](#standard-04-endpoint-coverage) |\n| 7 | Structured logs with `trace_id`: metric → trace → log in ≤ 3 clicks | Logs | [04](#standard-04-endpoint-coverage) |\n| 8 | Saturation of the resources behind it covered (USE) | Resources | [01](#standard-01-layers), [08](#standard-08-kubernetes-cluster) |\n| 9 | Deploy markers on the dashboard + errors splittable by version | Delivery | [12](#standard-12-releases-and-dora) |\n| 10 | Synthetic check from outside the cluster | UX | [01](#standard-01-layers) |\n| 11 | At least one business KPI with an owner | Business | [04](#standard-04-endpoint-coverage) |\n| 12 | **Tested**: failure injected (bad version, killed dependency, latency), the alert fired, the dashboard showed it, the trace found the cause | Validation | – |\n\n> Official links and verification status: [REFERENCES.md](#references)\n"}, {"group": "2 · Signals", "path": "standard/04-endpoint-coverage.md", "slug": "standard-04-endpoint-coverage", "title": "04 · Endpoint coverage (metrics, traces, logs)", "md": "# 04 · Endpoint coverage (metrics, traces, logs)\n\n> What every endpoint must emit. Based on the OpenTelemetry HTTP semantic conventions,\n> so names are the same in every language.\n\n## Required signals\n\n| Signal | Job | Required |\n|---|---|---|\n| **Metrics** | Detect | `http.server.request.duration` histogram with `http.route`, `http.request.method`, `http.response.status_code`. Saturation: `http.server.active_requests`, pool/queue metrics |\n| **Traces** | Locate | One server span per request; child spans for DB, cache, downstream calls. Tail sampling: keep 100% of errors and slow requests + a small share of the rest. Exemplars on the histogram |\n| **Logs** | Explain | Structured JSON with `trace_id`, `span_id`. Errors and business events, not every 200 OK |\n\n## Required resource attributes (on every signal)\n\n| Attribute | Example | Why |\n|---|---|---|\n| `service.name` | `checkout` | Groups everything by service |\n| `service.version` | `1.42.0` or image tag / git SHA | **Release correlation**, see [12](#standard-12-releases-and-dora) |\n| `service.namespace` / `team` | `payments` | **Ownership and alert routing**, see [20](#standard-20-ownership-and-communication) |\n| `deployment.environment.name` | `prod` | Keep test traffic out of prod SLOs |\n| `k8s.*` (via k8sattributes processor) | `k8s.pod.name`, `k8s.deployment.name` | Link to Resources layer |\n\n⚠️ Use `http.route` (`/orders/{id}`), never the raw URL. Never put `user.id` or `order.id` on metrics.\n\n## Business metrics\n\nInfrastructure can't know business rules: the app emits them (or you derive them from span attributes).\n\n<details>\n<summary>Open-source variant (PromQL)<\/summary>\n\n```promql\n# Average order price over 1h below a goal of 50\nsum(rate(order_value_sum[1h])) / sum(rate(order_value_count[1h])) < 50\n```\n\n<\/details>\n\n| Practice | Why |\n|---|---|\n| Histograms for amounts | count + sum (average) + percentiles from one metric |\n| Long windows, compare with last week | Business numbers are noisy minute by minute |\n| Route to a business owner | Usually not a reason to page on-call |\n| Bounded labels only (`client.id`, `category`) | IDs belong in traces/logs |\n\n## Multiple clients on one service\n\n**If you only alert on the total, the big client hides the small ones.** Client C = 2% of traffic, 100% failing → global error rate 2% → nothing fires.\n\n1. Put `client.id` on spans and metrics (middleware from API key/JWT), or derive RED metrics at the gateway:\n\n```yaml\n# Component renamed to span_metrics; the old name spanmetrics still works but is deprecated (README, 2026-11)\nconnectors:\n  spanmetrics:\n    dimensions:\n      - name: http.route\n      - name: client.id\n```\n\n2. Alert on ratios **per client**, with a minimum-count guard ([11 §3](#standard-11-alerting)).\n3. Policy per client:\n\n| Situation | Approach |\n|---|---|\n| Different contracts | SLO target per client (Gold 99.95%, Standard 99.5%) |\n| Low-traffic client | Longer windows, min-count guard, or synthetic traffic |\n| Client stopped calling | Traffic drop vs last week (`offset 1w`) |\n| Global view | Keep a total SLO for capacity and the platform team |\n"}, {"group": "2 · Signals", "path": "standard/05-logging-standard.md", "slug": "standard-05-logging-standard", "title": "05 · Logging standard", "md": "# 05 · Logging standard\n\n> **In 30 seconds:** logs **explain** what metrics detect and traces locate. Every log line is **structured** (one\n> JSON object per line), follows the **OpenTelemetry log data model** (timestamp, severity, body, attributes, resource,\n> trace context), uses **standard field names**, carries **`trace_id` / `span_id`**, and never contains secrets or\n> unmasked personal data. Mask in **layers** (don't log it → logger → collector gateway → Dynatrace OpenPipeline),\n> collect **once** per stream, and give each class of logs the **retention** it needs.\n\n## The log record (OpenTelemetry data model)\n\n| Field | Meaning | Who sets it |\n|---|---|---|\n| `Timestamp` | When the event happened (UTC, ns precision) | Logger |\n| `ObservedTimestamp` | When the collector saw it | Collector |\n| `SeverityText` / `SeverityNumber` | Level as text and as a number (1–24) | Logger / agent parsing |\n| `Body` | The human-readable message | Logger |\n| `Attributes` | Structured fields of **this event** (route, status, client, error) | Logger / code |\n| `Resource` | **Who** sent it: `service.name`, `service.version`, `k8s.*`, env | OTel SDK / collector (`k8sattributes`, gateway), **not** the app code |\n| `TraceId` / `SpanId` | Link to the trace and span | Logger with OTel context / agent parsing |\n| `EventName` | Stable name of the event type (e.g. `order.payment_failed`) | Code (for events you will search or alert on) |\n\n## One line, before and after\n\n```text\n❌ 2026-11-20 14:05:12 ERROR Payment failed for john@example.com card 4111111111111111 order 98123 after 3 retries\n```\n\n```json\n{\n  \"timestamp\": \"2026-11-20T14:05:12.418Z\",\n  \"level\": \"ERROR\",\n  \"message\": \"Payment authorization failed\",\n  \"event.name\": \"checkout.payment_failed\",\n  \"trace_id\": \"4bf92f3577b34da6a3ce929d0e0e4736\",\n  \"span_id\": \"00f067aa0ba902b7\",\n  \"http.route\": \"/api/checkout\",\n  \"client.id\": \"fabrikam\",\n  \"payment.provider\": \"acme-pay\",\n  \"checkout.order_id\": \"98123\",\n  \"checkout.retry_count\": 3,\n  \"error.type\": \"PROVIDER_TIMEOUT\",\n  \"exception.type\": \"System.TimeoutException\",\n  \"exception.message\": \"Provider did not answer within 2000 ms\"\n}\n```\n\nThe second line is searchable (`event.name`, `error.type`), joinable (`trace_id`), groupable (`client.id`), and contains no email or card number. Service, version, pod and cluster are **not** in it: the collectors add them as resource attributes.\n\n## Required and recommended fields\n\n| Field | Level | Rule |\n|---|---|---|\n| `timestamp` | Required | ISO 8601, **UTC**, millisecond precision or better |\n| `level` (→ severity) | Required | One of the levels below |\n| `message` (→ body) | Required | Short, constant wording; variable data goes in attributes |\n| `trace_id`, `span_id` | Required when in a request | Hex, from the OTel context (W3C) |\n| `event.name` | Recommended for business, security and error events | `<domain>.<event>` lowercase, e.g. `checkout.payment_failed` |\n| `error.type` | Required on errors | Stable, low-cardinality class (`PROVIDER_TIMEOUT`, `ValidationError`) |\n| `exception.type`, `exception.message`, `exception.stacktrace` | On exceptions | OTel semconv; the stack trace belongs to ERROR/FATAL, not WARN |\n| `http.route`, `http.response.status_code`, `client.id` | When relevant | Same names as metrics and spans ([04](#standard-04-endpoint-coverage)) |\n| `service.*`, `k8s.*`, `deployment.environment.name` | Never in app code | Added once as resource attributes by the SDK / collectors ([16](#standard-16-collector-templates)) |\n\n## Naming (nomenclature)\n\n| Rule | Example | Source |\n|---|---|---|\n| Use **OTel semantic convention names** when one exists | `http.route`, `error.type`, `exception.message`, `db.system.name`, `messaging.destination.name` | OTel semconv |\n| Lowercase, dot-separated namespaces, `snake_case` inside a part | `checkout.retry_count` | OTel naming rules |\n| Custom fields: prefix with the **application or domain name**, never an existing semconv namespace and never `otel.` | `checkout.order_id`, not `http.order_id` | OTel naming rules |\n| Same concept, same name, in logs, spans and metrics | `client.id` everywhere | This standard |\n| Constant `message`, variable data in attributes | `\"Payment authorization failed\"` + `error.type` | Searchability |\n| No units or types in names; put units in the value or the name's meaning | `duration_ms` only if the logger can't carry units; prefer `duration` in seconds | OTel naming (metrics) ⚠️ |\n\n## Severity levels\n\n| Level | SeverityNumber | Use for | Production |\n|---|---|---|---|\n| TRACE | 1–4 | Step-by-step internals | Off |\n| DEBUG | 5–8 | Diagnostic detail for developers | Off, or sampled / time-boxed |\n| INFO | 9–12 | Lifecycle and business events (`order.created`, startup, config loaded) | On |\n| WARN | 13–16 | Something unexpected, **handled** (retry succeeded, fallback used) | On |\n| ERROR | 17–20 | The operation **failed**: a request, a message, a job | On |\n| FATAL | 21–24 | The process cannot continue | On |\n\nOTel: ERROR (17) and above mean an erroneous situation; unhandled exceptions that don't stop the app are ERROR, ones that shut it down are FATAL. A log level is **not an alert**: alerts come from SLOs and counts ([11](#standard-11-alerting)).\n\n## What to log, and what never to log\n\n| Log | Don't log |\n|---|---|\n| Errors with context (what failed, for whom, why) | Every successful request (metrics and spans cover it) |\n| Business events (order placed, payment failed, refund) | Secrets: passwords, tokens, API keys, connection strings, JWTs |\n| State changes (config loaded, feature flag flipped, circuit opened) | Full card numbers (PCI), CVV, bank accounts |\n| Security events (login failed, permission denied) → also to the audit trail | Personal data in clear text (email, phone, name, address, national IDs) |\n| Retries and fallbacks (WARN) | Whole request/response bodies, file contents, large payloads |\n| Startup / shutdown with version | Stack traces at WARN or INFO; the same error once per loop iteration |\n\n## Masking in layers\n\n<div data-widget=\"viz\" data-chart=\"log-masking\"><\/div>\n\n| Layer | How | Catches |\n|---|---|---|\n| **1. Don't log it** | Code review, structured logging (log fields, not objects), allow-lists of fields | Most leaks: the cheapest fix |\n| **2. Logger redaction** | Redaction / destructuring policies in the logging library (e.g. classify fields as personal and redact or hash them) | Known sensitive fields in your own code |\n| **3. Collector gateway** | `transform/redact`: credentials in key=value pairs, Bearer/Basic, JWTs, emails, card numbers, URL query values ([collector/gateway.yaml](#collector-readme)) | Library and third-party logs you don't control; one rule set for all services |\n| **4. Dynatrace OpenPipeline** | Masking processor in the Processing stage, before storage in Grail; works for all ingest channels | A central safety net for anything that slipped through |\n| **5. Storage** | Bucket per log class with retention and access rights; audit logs separate | Limits exposure of what remains |\n\nDynatrace recommends combining masking **at capture** and **at ingest** (two layers). Lab evidence: before gateway masking, auto-instrumentation sent a database username in **40,892** spans to Dynatrace; the gateway rules fixed it for every backend at once, proven by an end-to-end redaction test.\n\n**Pseudonymize instead of deleting** when you need to correlate: a salted hash of a user ID lets you count \"affected users\" and follow one session without storing who it is ⚠️ (check your privacy/legal rules).\n\n## Collection\n\n| Rule | Why |\n|---|---|\n| Containers write to **stdout/stderr**; the OTel agent reads `/var/log/pods` with `filelog` and parses JSON ([16](#standard-16-collector-templates)) | No log files or sidecars per app |\n| Or the app sends OTLP logs through an OTel log bridge/appender | Trace context attached automatically |\n| **One path per stream** (file collection *or* OTLP *or* OneAgent log module) | Two paths = duplicates and double cost |\n| Multiline stack traces: emit them **inside** the JSON (`exception.stacktrace`), not as separate lines | Line-based collectors split them otherwise |\n| Persistent queue + checkpoints on the agent | Lab: 0 log lines lost during a 10-min backend outage (83% lost with defaults) |\n| Don't log the collector's own logs through the same pipeline | Feedback loops |\n\n## Volume, retention and cost\n\n| Log class | Retention ⚠️ | Dynatrace |\n|---|---|---|\n| Application logs (debugging) | 14–35 days | Default log bucket (35 days) or a custom bucket |\n| Audit / security logs | Per compliance (often 1+ year) | Custom bucket with long retention and restricted access |\n| Debug / verbose (when enabled) | 3–7 days | Short-retention bucket |\n| Health checks, probe noise | Drop at the gateway | – |\n\nGrail stores logs in **buckets** with their own retention (custom buckets from 1 day to ~10 years; default log bucket 35 days), assigned by rules or OpenPipeline. Logs are billed per GiB ingested, retained and queried ([17](#standard-17-dynatrace-integration--cost-what-drives-the-bill-dps)). Biggest levers: don't log successes, keep DEBUG off, drop noise at the gateway, route each class to the right bucket.\n\n## Correlation\n\n| Link | How |\n|---|---|\n| Log → trace | `trace_id` / `span_id` on the record. With OTLP ingest, Dynatrace maps them to `trace_id` / `span_id` fields; the UI links logs and traces |\n| Trace → logs | Logs view filtered by the trace ID |\n| Logs ↔ service, version, team | Same resource attributes as spans and metrics ([04](#standard-04-endpoint-coverage)) |\n| Mixed OneAgent + OTel | IDs from the OTel API differ from OneAgent's: keep one tracing agent per service ([17](#standard-17-dynatrace-integration)) |\n\n## Log-based alerts\n\nAlerts need numbers, so turn the log query into a time series first.\n\n```text\n// Dynatrace (DQL shape): provider timeouts in payment logs, per provider\nfetch logs\n| filter service.name == \"payments\" and error.type == \"PROVIDER_TIMEOUT\"\n| makeTimeseries timeouts = count(), by:{ payment.provider }, interval:5m\n// Custom alert: timeouts > 20 for 5 min → ticket to payments\n```\n\n| Practice | Why |\n|---|---|\n| Alert on `event.name` / `error.type`, not on free text | Wording changes; fields don't |\n| If a log alert fires often and matters, emit a **metric** instead | Cheaper and faster |\n| Absence: alert when a service **stops logging** (count == 0 for 10 min) | A silent service is often a dead one |\n\n<details>\n<summary>Open-source variant (Loki ruler)<\/summary>\n\n```yaml\ngroups:\n  - name: payments-logs\n    rules:\n      - alert: PaymentProviderTimeouts\n        expr: sum by (provider) (count_over_time({service_name=\"payments\"} | json | error_type=\"PROVIDER_TIMEOUT\" [5m])) > 20\n        for: 5m\n        labels: { severity: ticket, team: payments }\n```\n\n<\/details>\n\n## Checklist (per service)\n\n| # | Check |\n|---|---|\n| 1 | JSON, one object per line, to stdout |\n| 2 | Required fields present: timestamp (UTC), level, message, `trace_id`/`span_id` in requests, `error.type` on errors |\n| 3 | Field names follow OTel semconv; custom fields prefixed with the app/domain |\n| 4 | DEBUG off in production; no logging of successful requests |\n| 5 | No secrets or clear-text personal data (redaction test passes) |\n| 6 | One collection path; no duplicates in Dynatrace |\n| 7 | Correct bucket / retention for each log class |\n| 8 | Key events (`event.name`) defined for business and security flows |\n\n## Sources\n\n- [OTel: Logs data model](https://opentelemetry.io/docs/specs/otel/logs/data-model/) (fields, SeverityNumber ranges, ERROR ≥ 17) · [Logs concepts](https://opentelemetry.io/docs/concepts/signals/logs/) ✅ 2026-11-20\n- [OTel semconv: Exceptions in logs](https://opentelemetry.io/docs/specs/semconv/exceptions/exceptions-logs/) · [Naming](https://opentelemetry.io/docs/specs/semconv/general/naming/) (lowercase, namespaces, custom prefixes, `otel.` reserved) ✅ 2026-11-20\n- [Dynatrace: Mask sensitive data in logs](https://docs.dynatrace.com/docs/analyze-explore-automate/logs/lma-use-cases/methods-of-masking-sensitive-data) · [Log processing with OpenPipeline](https://docs.dynatrace.com/docs/analyze-explore-automate/logs/lma-log-processing/lma-openpipeline) · [Mask with the OTel Collector](https://docs.dynatrace.com/docs/ingest-from/opentelemetry/collector-use-cases/redact) ✅ 2026-11-20\n- [Dynatrace: Log storage and retention (buckets)](https://docs.dynatrace.com/docs/analyze-explore-automate/logs/lma-bucket-assignment) · [Optimize log retention](https://docs.dynatrace.com/docs/analyze-explore-automate/logs/lma-use-cases/optimize-log-retention) ✅ 2026-11-20\n- [Dynatrace: Connect log data to traces](https://docs.dynatrace.com/docs/analyze-explore-automate/logs/lma-log-enrichment) · [Ingest OTLP logs](https://docs.dynatrace.com/docs/ingest-from/opentelemetry/otlp-api/ingest-logs) ✅ 2026-11-20\n- Lab: redaction test and log-loss results (`~/projects/aks-observability/results/`) ✅ measured\n- Retention per class, pseudonymization advice: rules of thumb ⚠️ (check your compliance requirements)\n"}, {"group": "2 · Signals", "path": "standard/06-workload-types.md", "slug": "standard-06-workload-types", "title": "06 · Workload types: queues, batch jobs, external dependencies", "md": "# 06 · Workload types: queues, batch jobs, external dependencies\n\n> RED fits request/response services. Other workloads need different signals: for a queue, \"how far behind\";\n> for a batch job, \"did it succeed recently\"; for a third-party API, \"how is *it* treating us\".\n\n## Pick the model\n\n| Workload | Key question | Core signals | Alert type |\n|---|---|---|---|\n| Request/response API | Are requests served correctly and fast? | RED ([04](#standard-04-endpoint-coverage)) | SLO burn rate |\n| **Queue consumer** (Kafka, RabbitMQ, SQS) | Are we keeping up? | Lag, age of oldest message, processing errors, processing duration | Lag/age over threshold, DLQ count |\n| **Batch / cron job** | Did it run, succeed, and finish in time? | Last success timestamp, duration, failures | \"No success in 2 intervals\", count of failures |\n| **External dependency** (payment provider, SaaS API) | Is the provider failing us? | Client-side RED by `server.address`, timeouts, circuit-breaker state | Ratio + min count; synthetic checks |\n| **Data pipeline** | Is the data fresh and correct? | Freshness (data age), row counts, validation failures | Freshness SLO |\n\n## Queues and async processing\n\n### The queue model: why a backlog grows\n\n<div data-widget=\"viz\" data-chart=\"queue-flow\"><\/div>\n\n| Quantity | Meaning |\n|---|---|\n| **Arrival rate** (λ) | Messages produced per second |\n| **Processing rate** (μ) | Messages the consumers finish per second (consumers × rate per consumer) |\n| **Backlog** (L) | Messages waiting. Grows whenever λ > μ, by (λ − μ) per second |\n| **Wait time** (W) | How late the work is |\n\n**Little's law:** in steady state, L = λ × W, so **W ≈ backlog / processing rate**. 60,000 waiting messages at 500 msg/s processed = 2 minutes late. That is why **oldest-message age** (or end-to-end delay) is the SLI users feel, and lag in messages is only its cause: the same lag means seconds at peak throughput and hours when consumers are slow.\n\n### Signals\n\n| Signal | Source | Why |\n|---|---|---|\n| Arrival rate | Producer spans / `messaging.client.sent.messages`, broker metrics | Demand |\n| Processing rate | `messaging.client.consumed.messages`, `messaging.process.duration` (OTel semconv, development) | Supply |\n| **Oldest message age** / end-to-end delay | Broker metric (e.g. SQS age of oldest message), or now − produce timestamp on the consumer span | **The SLI** |\n| Backlog / lag | Broker or kafka-exporter (`kafka_consumergroup_lag`), **per partition** | Cause; capacity planning |\n| Processing errors and retries | Consumer spans with `error.type`, retry counter | Poison messages, flaky dependencies |\n| Dead-letter queue | DLQ depth / messages added | Every DLQ message is a failed promise → **count alert** |\n| Consumer utilization | Busy time / total, consumers vs max | At max = capacity limit ([13](#standard-13-capacity-and-saturation)) |\n\n### Problems you only find per partition, per group, per message\n\n| Problem | Symptom | Measure |\n|---|---|---|\n| **Partition skew** (Kafka) | Total lag looks fine; one partition stuck or hot | Lag and age **per partition**; consumers per partition |\n| More consumers than partitions | Extra consumers sit idle | Max useful consumers = partitions |\n| **Poison message** | Same message fails again and again, blocks a partition | Retries per message, DLQ growth |\n| **Retry storm** | Retries multiply load during an incident | Retry rate vs arrival rate; exponential backoff with jitter ([09](#standard-09-internal-services--protect-callers-from-slow-dependencies)) |\n| Rebalancing loops | Throughput drops to 0 repeatedly | Consumer group rebalances per hour |\n\n### Alerts ⚠️\n\n| Alert | Condition | Severity |\n|---|---|---|\n| Queue SLO burn | Oldest-message-age SLO burning fast ([10](#standard-10-slos-and-error-budgets)) | Page (tier 1) |\n| Backlog growing at max consumers | Autoscaler at max AND backlog grew for 15 min | Page / ticket |\n| DLQ received messages | Count > 0 | Ticket (page if money) |\n| Consumer group stopped | Processing rate = 0 while arrival > 0 for 5 min | Page |\n\n```text\n// DQL shape: processing rate vs arrival rate for one queue (consumer and producer spans)\nfetch spans\n| filter messaging.destination.name == \"orders\"\n| makeTimeseries { produced = countIf(span.kind == \"producer\"), consumed = countIf(span.kind == \"consumer\") }, interval:1m\n| fieldsAdd net_growth = produced[] - consumed[]\n```\n\n### Autoscaling consumers\n\nKEDA scales consumers on lag or queue length (Kafka, RabbitMQ, SQS, …). Set the maximum to the number of partitions, alert when it is at max while age grows, and check what `lagThreshold` means in your KEDA version (total vs average lag differs between versions).\n\n<details>\n<summary>Open-source variant (PromQL)<\/summary>\n\n```promql\n# Lag growing for 15 minutes (consumers not keeping up)\nsum by (consumergroup, topic) (kafka_consumergroup_lag) > 10000\nand\nderiv(sum by (consumergroup, topic) (kafka_consumergroup_lag)[15m:1m]) > 0\n```\n\n<\/details>\n\n### Traces across the queue\n\nPropagate trace context in message headers. The consumer span **links** to the producer span (OTel messaging conventions), so one order stays one trace from the API through the queue to the worker. Lab finding: an experimental .NET instrumentation broke this continuity; test it after every agent upgrade ([15](#standard-15-opentelemetry-practices)).\n\n## Batch and cron jobs\n\n| Signal | How |\n|---|---|\n| Last success time | Job pushes `job_last_success_timestamp_seconds` at the end (Pushgateway for **service-level** jobs; node-exporter textfile collector for machine-level jobs) |\n| Kubernetes Jobs | kube-state-metrics: `kube_job_status_failed`, `kube_job_status_succeeded`, `kube_cronjob_status_last_successful_time` |\n| Duration | `job_duration_seconds` pushed at the end, or Job start/completion times |\n\n<details>\n<summary>Open-source variant (PromQL)<\/summary>\n\n```promql\n# Nightly job (runs every 24h) hasn't succeeded in 2 intervals → alert\ntime() - job_last_success_timestamp_seconds{job=\"nightly-billing\"} > 2 * 86400\n\n# Kubernetes CronJob: last success too old\ntime() - kube_cronjob_status_last_successful_time{cronjob=\"nightly-billing\"} > 2 * 86400\n\n# Any failed Job (count alert)\nkube_job_status_failed{namespace=\"batch\"} > 0\n```\n\n<\/details>\n\nPrometheus guidance: alert when a batch job **hasn't succeeded recently enough**, with a threshold of at least two full run intervals. Jobs that run more often than about every 15 minutes should become long-running services.\n\n## Data pipelines (freshness, coverage, correctness)\n\n| SLI | Definition (SRE Workbook) | Example SLO ⚠️ |\n|---|---|---|\n| **Freshness** | % of data processed within a time bound, or age of the newest complete data, or time since the last successful run | 99% of orders visible in reporting within 30 min |\n| **Coverage** | Batch: % of runs that processed (at least) the expected amount of data. Streaming: % of records processed within a window | 99% of nightly runs cover 100% of the day's partitions |\n| **Correctness** | % of output that is right, checked **independently** of the pipeline's own logic, e.g. with **golden data** (test records with known expected results) | 99.99% of golden records correct |\n\n| Practice | Why |\n|---|---|\n| Measure **end to end** (source → final table), not only per stage | Data can be lost *between* stages (a dropped field, a skipped partition) |\n| Inject golden / canary records and check them at the end | Correctness without knowing every real answer |\n| Alert on freshness SLO burn and on \"no successful run in 2 intervals\" | Late data is the most common pipeline failure |\n| Row counts vs the same period last week | Silent partial loads |\n\n## External dependencies\n\nYou don't own the provider, but you own your experience of it.\n\n| Signal | Example | Why |\n|---|---|---|\n| Client-side RED | `http.client.request.duration` by `server.address` | Their errors and latency, seen from your side |\n| Timeouts / retries | `error.type=\"timeout\"`, retry counters | Hidden latency and load amplification |\n| Circuit breaker state | `circuit_breaker_state{dependency=\"payments-api\"}` | Shows when you're failing fast on purpose |\n| Synthetic check | Blackbox exporter / k6 against the provider's health or sandbox | Detects outages even with no traffic |\n\n<details>\n<summary>Open-source variant (PromQL)<\/summary>\n\n```promql\n# Provider error ratio from our side, with a minimum-count guard\n(\n  sum by (server_address) (rate(http_client_request_duration_seconds_count{server_address=\"api.payments.example\", http_response_status_code=~\"5..|429\"}[10m]))\n  /\n  sum by (server_address) (rate(http_client_request_duration_seconds_count{server_address=\"api.payments.example\"}[10m]))\n  > 0.05\n)\nand\nsum by (server_address) (increase(http_client_request_duration_seconds_count{server_address=\"api.payments.example\", http_response_status_code=~\"5..|429\"}[10m])) > 20\n```\n\n<\/details>\n\n| Practice | Why |\n|---|---|\n| Route provider alerts to the **owning team**, with the provider's status page in the runbook | You can't fix it, but you must communicate and mitigate |\n| Track the provider's SLA vs what you measure | Evidence for service credits and vendor reviews |\n| Separate \"they're down\" from \"we're calling wrong\" (4xx vs 5xx) | Different owners |\n\n## Sources\n\n- [OTel semconv: messaging metrics](https://opentelemetry.io/docs/specs/semconv/messaging/messaging-metrics/): `messaging.client.consumed.messages`, `messaging.process.duration` (development stage) ✅ 2026-11-20\n- [OTel semconv: messaging spans](https://opentelemetry.io/docs/specs/semconv/messaging/messaging-spans/): links between producer and consumer 📚\n- [Prometheus: When to use the Pushgateway](https://prometheus.io/docs/practices/pushing/): service-level batch jobs only; textfile collector for machine-level ✅ 2026-11-20\n- [Prometheus: Alerting practices](https://prometheus.io/docs/practices/alerting/): batch jobs, \"not succeeded recently enough\", 2 intervals ✅ 2026-11-20\n- [OTel semconv: HTTP client metrics](https://opentelemetry.io/docs/specs/semconv/http/http-metrics/) 📚\n- [kube-state-metrics: Job and CronJob metrics](https://github.com/kubernetes/kube-state-metrics/tree/main/docs/metrics/workload) 📚\n"}, {"group": "2 · Signals", "path": "standard/07-frontend-experience.md", "slug": "standard-07-frontend-experience", "title": "07 · Frontend and user experience", "md": "# 07 · Frontend and user experience\n\n> Backend metrics say the API answered in 120 ms. The user may still have waited 4 s for the page.\n> Measure **what the user's browser experienced** (real user monitoring), **whether key journeys work when nobody\n> is using them** (synthetic monitoring), and **link both to backend traces**.\n\n## How it fits together\n\n<div data-widget=\"viz\" data-chart=\"frontend-flow\"><\/div>\n\n| Method | Answers | Tool (Dynatrace backend) | Open-source alternative |\n|---|---|---|---|\n| **Real User Monitoring (RUM)** | What did real users experience, on which browser, country, page? | Dynatrace RUM JavaScript | Grafana Faro, OTel browser SDK (experimental) |\n| **Synthetic monitoring** | Does login/checkout work right now, from outside, even at 3 a.m.? | Dynatrace synthetic monitors (browser clickpaths, HTTP) | k6, blackbox exporter, OTel `httpcheck` (internal only) |\n| **Frontend → backend link** | Which backend call made this page slow? | W3C trace context from RUM to the OTel-instrumented backend | Faro + OTel traces |\n\nOpenTelemetry has **no stable RUM specification** yet, and the browser SDK is **experimental**. If you send frontend data through plain OTel SDKs into Dynatrace, you lose RUM features (sessions, user actions, Core Web Vitals scoring, session replay). Dynatrace's recommended setup is **RUM JavaScript in the frontend + OpenTelemetry in the backend**, linked by W3C trace context.\n\n## What to measure\n\n### Core Web Vitals (Google's user-experience metrics)\n\n| Metric | Measures | Good | Needs improvement | Poor |\n|---|---|---|---|---|\n| **LCP** (Largest Contentful Paint) | Loading: when the main content appeared | ≤ 2.5 s | 2.5–4.0 s | > 4.0 s |\n| **INP** (Interaction to Next Paint) | Responsiveness: delay after a click or key press | ≤ 200 ms | 200–500 ms | > 500 ms |\n| **CLS** (Cumulative Layout Shift) | Visual stability: content jumping around | ≤ 0.1 | 0.1–0.25 | > 0.25 |\n\nJudge each at the **75th percentile of real page visits** (3 of 4 visits must be \"good\"). INP replaced FID; tools that still show FID are outdated.\n\n### Beyond Web Vitals\n\n| Signal | Why | Typical SLI |\n|---|---|---|\n| JavaScript errors per session | Broken UI that the backend never sees | % of sessions without errors |\n| Failed XHR/fetch calls (by endpoint) | Backend errors as the user saw them, incl. CORS and timeouts | % of successful requests from the browser |\n| User action duration (click → done) | The real \"it's slow\" | % of key actions < 2 s |\n| Journey / funnel completion | Business impact (login → cart → pay) | conversion rate per step |\n| Apdex | One satisfaction score per app | Apdex ≥ 0.9 ⚠️ |\n| Segment: browser, device, country, release | Problems hidden in averages | per-segment p75 |\n\n### Frontend SLOs (examples ⚠️)\n\n| SLO | Target |\n|---|---|\n| LCP ≤ 2.5 s for the checkout page | 75% of visits (Google's threshold), tighten to 90% if you can |\n| Key user action \"Pay\" completes without error | 99.5% over 28 days |\n| Synthetic checkout journey succeeds | 99.9% of runs, from 3 locations |\n\nAlert on SLO burn, not on single slow page views ([11](#standard-11-alerting), [10](#standard-10-slos-and-error-budgets)).\n\n## Synthetic monitoring\n\n| Rule | Why |\n|---|---|\n| Script the **business journeys** (login, search, checkout), not only the home page | The home page is rarely what breaks |\n| Run from **several locations** and alert when ≥ 2 fail ⚠️ | One location failing is often the location's network |\n| Use **dedicated test accounts** and mark synthetic traffic (header / user agent) | Filter it out of real-user SLOs and business KPIs |\n| Internal endpoints: OTel `httpcheck` in the cluster collector ([collector/cluster.yaml](#collector-readme)) | Cheap availability check for services without public UI |\n| Low-traffic apps: synthetics are the only reliable SLI at night | Real traffic is too thin for ratios ([11 §3](#standard-11-alerting)) |\n\n## Privacy and cost\n\n| Topic | Practice |\n|---|---|\n| Personal data | Mask user input, IP addresses and URLs with IDs; session replay masked by default |\n| Consent | Respect the cookie/consent banner (opt-in mode in the RUM agent) |\n| Cost | RUM is billed per session (session replay costs more); sample sessions for high-traffic sites |\n| Sampling | Keep 100% of sessions with errors if your tool allows it |\n\n## Sources\n\n- [web.dev: Web Vitals](https://web.dev/articles/vitals) · [How the thresholds were defined](https://web.dev/articles/defining-core-web-vitals-thresholds) · [INP](https://web.dev/articles/inp): LCP/INP/CLS thresholds, 75th percentile ✅ 2026-11-20\n- [Dynatrace: OpenTelemetry and Dynatrace](https://docs.dynatrace.com/docs/ingest-from/opentelemetry): no stable OTel RUM spec; RUM JS + OTel backend linked by W3C trace context ✅ 2026-11-20\n- [Dynatrace: Real User Monitoring](https://docs.dynatrace.com/docs/observe/digital-experience/rum) · [Experience Vitals](https://docs.dynatrace.com/docs/observe/digital-experience/new-rum-experience/experience-vitals) ✅ 2026-11-20\n- [OpenTelemetry JS: Browser](https://opentelemetry.io/docs/languages/js/getting-started/browser/): experimental ✅ 2026-11-20\n- [Grafana Faro](https://grafana.com/oss/faro/) (open-source alternative) ✅ 2026-11-20\n- SLO targets, synthetic location rule, Apdex target: rules of thumb ⚠️\n"}, {"group": "2 · Signals", "path": "standard/08-kubernetes-cluster.md", "slug": "standard-08-kubernetes-cluster", "title": "08 · Kubernetes cluster", "md": "# 08 · Kubernetes cluster\n\n> **In 30 seconds:** \"down\" has levels (scheduled → running → ready → serving → users happy). Page on the user level,\n> use the others to find the cause. The checklist below says what to measure at each level, which OpenTelemetry\n> component produces it (templates in [collector/](#collector-readme)), and what Dynatrace gives natively.\n> Metric names are OTel receiver names as they arrive in Dynatrace; \"lab\" = seen in the aks-observability lab.\n\n## \"Down\" has levels\n\n| Level | Question | Signal | Example |\n|---|---|---|---|\n| 1. Exists | Is it scheduled? | Pod phase | Pod stuck in `Pending` (no capacity) |\n| 2. Running | Is the process alive? | Container state, restarts | `CrashLoopBackOff`, `OOMKilled` |\n| 3. Ready | Does Kubernetes send it traffic? | Readiness, ready endpoints | Running but readiness probe failing |\n| 4. Serving | Does it answer correctly? | RED ([04](#standard-04-endpoint-coverage)) | 5xx, slow responses |\n| 5. Users happy | Is the experience OK? | SLOs, synthetic checks ([10](#standard-10-slos-and-error-budgets)) | Budget burning |\n\n⚠️ `up == 1` only means \"Prometheus could scrape it\", not that the service works.\n\n## Coverage checklist\n\n| Level | What to measure | OTel source → metric / signal | Dynatrace native (OneAgent / ActiveGate) | Alert? |\n|---|---|---|---|---|\n| **Cluster** | Nodes ready / pressure | `k8s_cluster` → `k8s.node.condition_ready`, `…_memory_pressure`, `…_disk_pressure` (`node_conditions_to_report`) | Kubernetes app, node conditions | Yes (ticket; page if capacity at risk) |\n| | Pods that can't schedule | `k8s_cluster` → `k8s.pod.phase` = Pending + `k8sobjects` events `FailedScheduling` | Workload / pod status, events | Yes, > 10 min |\n| | Requests vs allocatable (room to scale) | `k8s_cluster` → `k8s.node.allocatable_cpu/memory`; `kubeletstats` → requests utilization | Cluster utilization views | Dashboard + capacity review |\n| **Control plane** | API server errors and latency | `prometheus` receiver on the API server metrics (self-managed clusters; AKS/EKS expose less) | Kubernetes API monitoring via ActiveGate | Ticket |\n| | DNS failures / latency | `prometheus` receiver on CoreDNS | Partial | Ticket |\n| **Node** | CPU, memory, disk, network | `kubeletstats` → `k8s.node.cpu.usage`, `k8s.node.memory.working_set`, `k8s.node.filesystem.available`, `k8s.node.network.io` (lab) | OneAgent host metrics | Predict disk full (page if < 4h) |\n| **Workload** | Available vs desired replicas | `k8s_cluster` → `k8s.deployment.available`, `k8s.deployment.desired` (lab) | Workload health | Yes: 0 available = down |\n| | Rollout stuck | Deployment generation / events | Events | Ticket |\n| | HPA at max | `k8s_cluster` → `k8s.hpa.current_replicas`, `k8s.hpa.max_replicas` | Workload metrics | Ticket |\n| | Jobs failed | `k8s_cluster` → `k8s.job.failed_pods` | Events | Ticket ([06](#standard-06-workload-types)) |\n| **Pod / container** | Restarts | `k8s_cluster` → `k8s.container.restarts` (lab) | Container restarts anomaly | Yes, burst |\n| | OOMKilled | `k8s_cluster` resource attr `k8s.container.status.last_terminated_reason` (lab) | **OOM problem in ~1 min** (lab) | Yes |\n| | Memory vs limit, CPU vs request | `kubeletstats` → `k8s.container.memory_limit_utilization`, `k8s.container.cpu_request_utilization` (lab) | Container metrics | Dashboard; alert on OOM, not on %. |\n| | CPU throttling | Not in `kubeletstats`: scrape cAdvisor with the `prometheus` receiver (`container_cpu_cfs_throttled_periods_total`) | Container throttling | Dashboard |\n| | Image pull / crash loop | `k8sobjects` events (`BackOff`, `Failed`) (lab) | Events + problems | Yes |\n| **Storage** | Volume space | `kubeletstats` → `k8s.volume.available`, `k8s.volume.capacity` | PV metrics | Predict full |\n| **Network** | Pod network I/O, errors | `kubeletstats` → `k8s.pod.network.io`, `k8s.pod.network.errors` | Network metrics | Dashboard |\n| | Flows, drops between workloads | CNI metrics (Cilium/Hubble) via `prometheus` receiver | OneAgent network | Ticket on drops |\n| **Events** | Kubernetes events as logs | `k8sobjects` → logs (lab) | Kubernetes events | Via event rules |\n| **Applications** | RED per service, route, client, version | App OTLP (auto-instrumentation) → `http.server.request.duration` (lab) | OneAgent services (routes need key requests: `NON_KEY_REQUESTS`, lab) | SLO burn ([10](#standard-10-slos-and-error-budgets)) |\n| | Dependencies (DB, queue, HTTP clients) | `db.client.operation.duration`, `messaging.*`, `http.client.request.duration` (lab: names the slow DB) | Traces / service flow | Via SLO + traces |\n| | Logs with trace context | `filelog` + JSON parsing + `trace_id` (lab) | OneAgent log module | Error-rate rules |\n| **Synthetics** | Internal endpoint up | `httpcheck` → `httpcheck.status` (lab) | Synthetic HTTP monitors | Yes |\n| **Pipeline** | Collectors healthy, no data loss | Internal telemetry `otelcol_*` → Dynatrace ([16](#standard-16-collector-templates--self-monitoring)) | ActiveGate / OneAgent self-monitoring | Yes, tested |\n\n## What OneAgent does that OTel needs a setting for\n\n| OneAgent does automatically | OTel equivalent |\n|---|---|\n| Detects the language and injects | Annotate the namespace with the language ([15](#standard-15-opentelemetry-practices)) |\n| Kubernetes problems (OOM, crash loops) out of the box | Write the alerts on `k8s_cluster` data ([16](#standard-16-collector-templates), Dynatrace anomaly detectors) |\n| Service names and topology | `service.name` via Operator; `k8s.*` attributes for topology links |\n| Stable series across restarts (0 new series, lab) | Label allow-list in the gateway (18 new series, lab) |\n| Log buffering during outages | Persistent queue on the agent (lab: both 0 lost) |\n\n## What OTel does better (lab)\n\n| OTel | Why it matters |\n|---|---|\n| Per-route RED by default (`http.route`) | No key-request configuration |\n| DB client latency metric names the dependency | Root cause without traces |\n| Masking before data leaves the cluster | Compliance |\n| Collector failure alerts in 4–11 min vs ~24 min | Faster detection of blind spots |\n\n## Minimum viable cluster monitoring (start here)\n\n| # | Signal | Template |\n|---|---|---|\n| 1 | Node ready + pressure, pods pending | cluster.yaml |\n| 2 | Deployment available = 0 | cluster.yaml |\n| 3 | Restarts + OOMKilled reason | cluster.yaml |\n| 4 | Memory vs limit, CPU vs request | agent.yaml |\n| 5 | Kubernetes events as logs | cluster.yaml |\n| 6 | Container logs with trace context | agent.yaml |\n| 7 | App RED via auto-instrumentation | Operator `Instrumentation` |\n| 8 | Collector self-monitoring + alerts | gateway.yaml |\n| 9 | One SLO per tier-1 service | [10](#standard-10-slos-and-error-budgets) |\n\n## Triage order: \"the service is down\"\n\n1. **Users / SLO**: error ratio and latency. Is it really broken, and for whom?\n2. **Ready endpoints**: `0` means Kubernetes sends traffic nowhere → step 3. Not 0 → step 5.\n3. **Pods**: crash loop, OOM, image pull, not ready. `kubectl describe pod` → Events.\n4. **Scheduling / capacity**: Pending pods, node pressure, requests vs allocatable.\n5. **Dependencies**: traces, network flows, DNS errors.\n6. **Changes**: recent rollout? ([12](#standard-12-releases-and-dora)). Most incidents start with a change.\n\n<details>\n<summary>Open-source variant (PromQL with kube-state-metrics, node-exporter, cAdvisor)<\/summary>\n\n## Cluster\n\n| What | Query | Bad when |\n|---|---|---|\n| API server errors | `sum(rate(apiserver_request_total{code=~\"5..\"}[5m])) / sum(rate(apiserver_request_total[5m]))` | `> 0.01` |\n| API server p99 | `histogram_quantile(0.99, sum by (le) (rate(apiserver_request_duration_seconds_bucket{verb!~\"WATCH\\|CONNECT\"}[5m])))` | `> 1` s |\n| Nodes not Ready | `count(kube_node_info) - sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})` | `> 0` |\n| Node pressure | `kube_node_status_condition{condition=~\"MemoryPressure\\|DiskPressure\\|PIDPressure\",status=\"true\"} == 1` | any |\n| Pending pods | `sum(kube_pod_status_phase{phase=\"Pending\"})` | `> 0` for 10 min |\n| CPU requested vs allocatable | `sum(kube_pod_container_resource_requests{resource=\"cpu\"}) / sum(kube_node_status_allocatable{resource=\"cpu\"})` | `> 0.8` (no room to scale) |\n| DNS failures | `sum(rate(coredns_dns_responses_total{rcode=\"SERVFAIL\"}[5m]))` | `> 0` |\n| DNS p99 | `histogram_quantile(0.99, sum by (le) (rate(coredns_dns_request_duration_seconds_bucket[5m])))` | `> 0.1` s |\n\n## Node\n\n| What | Query | Bad when |\n|---|---|---|\n| CPU used | `1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))` | `> 0.9` sustained |\n| Memory available | `node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes` | `< 0.1` |\n| Disk available | `min by (instance) (node_filesystem_avail_bytes{fstype=~\"ext4\\|xfs\"} / node_filesystem_size_bytes{fstype=~\"ext4\\|xfs\"})` | `< 0.15` |\n| Disk full soon | `predict_linear(node_filesystem_avail_bytes{fstype=~\"ext4\\|xfs\"}[6h], 4*3600) < 0` | any (page) |\n\n## Workload\n\n| What | Query | Bad when |\n|---|---|---|\n| Deployment completely down | `(kube_deployment_spec_replicas > 0) and (kube_deployment_status_replicas_available == 0)` | any |\n| Degraded | `kube_deployment_status_replicas_available / kube_deployment_spec_replicas < 1` | for 15 min |\n| Rollout stuck | `kube_deployment_status_observed_generation != kube_deployment_metadata_generation` | for 15 min |\n| HPA maxed out | `kube_horizontalpodautoscaler_status_current_replicas >= kube_horizontalpodautoscaler_spec_max_replicas` | for 15 min |\n| DaemonSet missing pods | `kube_daemonset_status_number_unavailable > 0` | any |\n\n## Pod / container\n\n| What | Query | Bad when |\n|---|---|---|\n| Crash loop | `kube_pod_container_status_waiting_reason{reason=\"CrashLoopBackOff\"} == 1` | any |\n| Image pull failing | `kube_pod_container_status_waiting_reason{reason=~\"ImagePullBackOff\\|ErrImagePull\"} == 1` | any |\n| OOMKilled | `kube_pod_container_status_last_terminated_reason{reason=\"OOMKilled\"} == 1` | any |\n| Memory vs limit | `sum by (namespace, pod) (container_memory_working_set_bytes{container!=\"\"}) / sum by (namespace, pod) (kube_pod_container_resource_limits{resource=\"memory\"})` | `> 0.9` |\n| CPU throttling | `sum by (namespace, pod) (rate(container_cpu_cfs_throttled_periods_total[5m])) / sum by (namespace, pod) (rate(container_cpu_cfs_periods_total[5m]))` | `> 0.25` |\n| No ready endpoints | `sum by (endpointslice) (kube_endpointslice_endpoints{ready=\"true\"}) == 0` | service down even if pods exist |\n\nMost of these are **ticket or dashboard**, not page. Page when users are affected (level 5), and put these in the alert's dashboard link.\n\n\n<\/details>\n\n## Sources\n\n- [OTel: Important components for Kubernetes](https://opentelemetry.io/docs/platforms/kubernetes/collector/components/) 📚\n- [Dynatrace: Monitor Kubernetes clusters with the OTel Collector](https://docs.dynatrace.com/docs/ingest-from/opentelemetry/collector/use-cases/kubernetes/k8s-monitoring) ✅ 2026-11-20\n- [Dynatrace: Kubernetes Platform Monitoring](https://docs.dynatrace.com/docs/license/capabilities/container-monitoring/kubernetes-platform-monitoring) ✅ 2026-11-20\n- Receiver metric names: `k8sclusterreceiver` and `kubeletstatsreceiver` documentation in opentelemetry-collector-contrib 📚 (names marked \"lab\" were seen in the lab's Dynatrace tenant and Prometheus)\n- Lab: `~/projects/aks-observability/results/` ✅ measured\n"}, {"group": "2 · Signals", "path": "standard/09-internal-services.md", "slug": "standard-09-internal-services", "title": "09 · Internal services and shared platform services", "md": "# 09 · Internal services and shared platform services\n\n> **In 30 seconds:** most services are called by other services, not by users. Measure them **from the caller's\n> side** (client spans), give them **internal SLOs stricter than the user-facing SLO** that depends on them, and treat\n> shared platform services (databases, caches, Kafka, auth, gateways) as products with an **owner, SLOs and a list of\n> consumers**. Timeouts, retry budgets and circuit breakers stop one slow dependency from taking everything down.\n\n## The dependency chain\n\n<div data-widget=\"viz\" data-chart=\"internal-deps\"><\/div>\n\n| Idea | Why |\n|---|---|\n| A user-facing request is a **chain**: if checkout calls 4 dependencies in series, each at 99.9%, the best checkout can do is ~99.6% | Dependencies need **better** targets than the service that relies on them |\n| The caller sees failures the callee can't (network, DNS, TLS, timeouts, pool exhaustion) | Measure **client-side** too |\n| One slow dependency fills the caller's threads and connection pools | Cascading failure: the slow part takes down the healthy parts |\n\n## Measure from both sides\n\n| Side | Signal (OTel) | Answers |\n|---|---|---|\n| **Server** (the internal service itself) | Server spans / `http.server.request.duration`, `rpc.server.duration` | Is my service healthy? |\n| **Client** (every caller) | Client spans: `http.client.request.duration`, `db.client.operation.duration`, `messaging.*`, with `server.address` / `db.system.name` | What do my callers actually get, including network and timeouts? |\n| **Service map** | Traces → Dynatrace service flow / Smartscape | Who depends on whom; blast radius |\n\n```text\n// DQL shape: what callers of payments-api experience (client spans), by calling service\nfetch spans\n| filter span.kind == \"client\" and server.address == \"payments-api\"\n| makeTimeseries { calls = count(), failed = countIf(http.response.status_code >= 500 or isNotNull(error.type)) }, by:{ service.name }\n| fieldsAdd failure_ratio = failed[] / calls[]\n```\n\nWhen server-side looks fine but client-side doesn't, the problem is **between** them: network, DNS, connection pools, TLS, a proxy, or timeouts set too short.\n\n## Internal SLOs\n\n| Rule ⚠️ | Example |\n|---|---|\n| Internal SLO **stricter** than every user-facing SLO that depends on it | checkout 99.9% → payments-api 99.95%, orders DB 99.99% |\n| Measured where the **callers** are (client-side), plus server-side | The SLO reflects what consumers get |\n| Latency SLO per **critical operation**, not one average | `POST /authorize` < 200 ms for 99% |\n| Agreed with the main consumers, written down | [SLO document](#framework-slo-document-template) with a \"consumers\" section |\n| No hard SLA chains between internal teams | SLOs + error budget policy, not contracts |\n\n## Shared platform services\n\nDatabases, caches, message brokers, identity/auth, API gateways, the collector pipeline itself: one team runs them, many teams depend on them.\n\n| Practice | Why |\n|---|---|\n| **Owner** (platform team) and on-call | Someone answers when it breaks |\n| **Consumers listed** (from traces / service map) | You know who to inform and the blast radius |\n| **SLOs** on availability, latency and saturation per platform service | Consumers can design for it |\n| **Saturation dashboards**: connections vs max, replication lag, memory, disk, throughput ([13](#standard-13-capacity-and-saturation)) | Platform services fail by running out |\n| **One template per platform service type** (Postgres, Redis, Kafka) | Same as microservices ([18](#standard-18-automation-and-scale)): archetype `platform-service` |\n| Announce maintenance and changes to consumers | Change flow ([20](#standard-20-ownership-and-communication)) |\n\n| Platform service | Key signals |\n|---|---|\n| PostgreSQL / SQL | Query latency (client-side `db.client.operation.duration`), connections vs max, replication lag, locks, disk |\n| Redis / cache | Hit ratio, latency, evictions, memory vs max, connected clients |\n| Kafka / broker | Under-replicated partitions, request latency, consumer lag per group ([06](#standard-06-workload-types--queues-and-async-processing)), disk |\n| Auth / identity | Token issuance latency and errors, as seen by callers |\n| API gateway | Upstream errors by backend, rate limiting, latency added by the gateway |\n\n## Protect callers from slow dependencies\n\n| Mechanism | What it does | Signal to watch |\n|---|---|---|\n| **Timeouts / deadlines** | Stop waiting; propagate one deadline through the whole request | Timeout errors by dependency (`error.type`) |\n| **Retry budget** | Limit retries (e.g. up to 3 per request, ≤ 10% extra load per client) with exponential backoff and jitter | Retry rate; retries per original request |\n| **Retry only at one layer** | The layer just above the failing one; avoid multiplying retries per layer | Calls at the bottom layer vs user requests |\n| **Circuit breaker** | Fail fast while a dependency is broken | Breaker state per dependency |\n| **Load shedding / priorities** | Under overload, drop low-priority work first | Rejected requests by priority |\n| **Bulkheads** | Separate pools per dependency so one can't exhaust all | Pool usage per dependency |\n\nThese come from the Google SRE book's chapters on overload and cascading failures: retries multiply across layers, synchronized retries create thundering herds, and the fix is budgets, jitter and deadlines.\n\n## Common mistakes\n\n| ❌ | ✅ |\n|---|---|\n| Internal service SLO equal to (or looser than) the user-facing one | Stricter, because of the chain |\n| Only server-side metrics | Client-side spans from every caller |\n| Retries at every layer, no backoff | One layer, budget, exponential backoff + jitter |\n| Shared database \"owned by everyone\" | One owner, SLOs, consumer list |\n| Timeouts longer than the caller's own deadline | Propagate deadlines; inner timeouts shorter than outer |\n\n## Sources\n\n- [Google SRE Book: Addressing cascading failures](https://sre.google/sre-book/addressing-cascading-failures/) · [Handling overload](https://sre.google/sre-book/handling-overload/) (retry budgets, deadlines, jitter, load shedding) ✅ 2026-11-20\n- [Google SRE Workbook: Managing load](https://sre.google/workbook/managing-load/) ✅ 2026-11-20\n- [OTel semconv: HTTP client](https://opentelemetry.io/docs/specs/semconv/http/http-metrics/) · [Database client](https://opentelemetry.io/docs/specs/semconv/db/database-metrics/) 📚\n- [Dynatrace: Event analysis and correlation (topology)](https://docs.dynatrace.com/docs/discover-dynatrace/platform/davis-ai/root-cause-analysis/concepts/events) ✅\n- Internal SLO margins, platform signals per service: rules of thumb ⚠️\n"}, {"group": "3 · Reliability", "path": "standard/10-slos-and-error-budgets.md", "slug": "standard-10-slos-and-error-budgets", "title": "10 · SLOs and error budgets", "md": "# 10 · SLOs and error budgets\n\n> **In 30 seconds:** an SLO is a target for \"good events / all events\" over 28–30 days. The gap to 100% is the\n> **error budget**. Alert when the budget **burns too fast**, and agree in advance (the **error budget policy**) what\n> happens when it's gone. In Dynatrace, the SLI is a **DQL query** in the Service-Level Objectives app.\n\n## Terms\n\n| Term | Meaning | Example |\n|---|---|---|\n| **SLI** | Good events / valid events, as a % (100% = all good) | % of `/checkout` requests that return non-5xx in < 500 ms |\n| **SLO** | Target for the SLI over a window | 99.9% over 28 days |\n| **Error budget** | 100% − SLO: the failure you may spend | 0.1% → 1,000 bad requests of 1,000,000 in 4 weeks |\n| **Burn rate** | How fast the budget is used (1 = exactly on budget) | 14.4 = a 30-day budget gone in ~2 days |\n| **Error budget policy** | Agreed actions when the budget is spent | Freeze releases except P0 and security fixes |\n| **SLA** | Contract with a client, usually looser than the SLO | 99.5% with service credits |\n\n## Choosing SLIs\n\n| Service type | SLI | Measured from |\n|---|---|---|\n| Request/response API | Availability (non-5xx), latency (< threshold) | Server spans / request metrics, as close to the user as possible |\n| User journey | RUM or synthetic success rate | Dynatrace RUM / synthetic ([07](#standard-07-frontend-experience)) |\n| Queue consumer | Age of oldest message, processing success | [06](#standard-06-workload-types) |\n| Batch / pipeline | Freshness, success of each run | [06](#standard-06-workload-types) |\n| Per client (multi-tenant) | Same SLI split by `client.id`, target per contract | [04](#standard-04-endpoint-coverage--multiple-clients-on-one-service) |\n\nRules of thumb ⚠️: 1–2 SLIs per user journey; window 28 or 30 days; start the target from **current performance**, tighten later.\n\n## The SLI in Dynatrace (DQL)\n\n```text\n// Availability SLI for checkout from OTel server spans (shape; check field names in your tenant)\nfetch spans\n| filter service.name == \"checkout\" and span.kind == \"server\"\n| makeTimeseries { total = count(), bad = countIf(http.response.status_code >= 500) }\n| fieldsAdd sli = 100 * (1 - bad[] / total[])\n```\n\n| Step | How |\n|---|---|\n| 1. Create the SLO | Service-Level Objectives app → custom SLI in DQL (as above) or a built-in template; target 99.9, window 28 days |\n| 2. Burn rate | Dynatrace docs: burn rate = error rate / error budget over the look-back window; computed per service |\n| 3. Alert | Anomaly detection (custom alert) on the burn rate, **-1h** look-back, static threshold starting around **10–14** (Dynatrace docs) |\n| 4. As code | Monaco `slo-v2` config + template ([18](#standard-18-automation-and-scale)) |\n\n**Multi-window** (Google SRE Workbook): page when **both** a long and a short window burn fast, so the alert also resolves fast. In Dynatrace, build it as two conditions (two custom alerts combined in one workflow, or one query that requires both) ⚠️.\n\n| Severity | Burn rate | Long window | Short window | Budget used |\n|---|---|---|---|---|\n| Page | 14.4 | 1h | 5m | 2% |\n| Page | 6 | 6h | 30m | 5% |\n| Ticket | 1 | 3d | 6h | 10% |\n\nAfter a fix, the slower pair keeps alerting until its short window is clean (up to ~30 min for the 6h/30m pair).\n\n<details>\n<summary>Open-source variant (Prometheus)<\/summary>\n\n```promql\n# Availability SLI, 28d\n1 - (\n  sum(increase(http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=~\"5..\"}[28d]))\n  /\n  sum(increase(http_server_request_duration_seconds_count{service_name=\"checkout\"}[28d]))\n)\n```\n\nTested burn-rate rules with promtool unit tests: [rules/](#rules-readme). Generators: Sloth, Pyrra.\n\n<\/details>\n\n## The two documents every SLO needs\n\n| Document | Template | Signed by |\n|---|---|---|\n| **SLO document**: what is measured, target, why | [framework/slo-document-template.md](#framework-slo-document-template) | Service owner, SRE, business owner |\n| **Error budget policy**: what happens when it's spent | [framework/error-budget-policy-template.md](#framework-error-budget-policy-template) | Same + engineering manager |\n\n## How the policy connects to everything else\n\n| Budget state | Alerting | Releases | Planning |\n|---|---|---|---|\n| Healthy (> 50% left) ⚠️ | Normal burn-rate alerts | Ship normally | Feature work |\n| Burning fast | Page (14.4× / 6×) | Pause risky changes | – |\n| Exhausted (4-week window) | – | **Freeze** except P0 and security fixes (release gate: Site Reliability Guardian objective on the SLO, [12](#standard-12-releases-and-dora)) | Reliability work first |\n| One incident > 20% of budget | – | – | Postmortem with at least one P0 action item |\n\n<div data-widget=\"viz\" data-chart=\"budget-burndown\"><\/div>\n\nThe freeze and 20% rows come from the Workbook's example policy; \"> 50%\" is a rule of thumb.\n\n## Review cadence\n\n| When | Who | Question |\n|---|---|---|\n| Monthly | Team, SRE, business owner | Budget status; is the target still right? |\n| After a big incident | Postmortem attendees | Did the budget reflect user pain? |\n| Quarterly | Leadership | Trend across services; where to invest |\n\n## Common mistakes\n\n| ❌ | ✅ |\n|---|---|\n| SLO = 100% | Leave room to change things; 100% means no releases |\n| Target picked from a wish | Start from the last 4 weeks, tighten later |\n| SLO without a policy | Nothing changes when it's missed |\n| Alert on the SLI value itself | Alert on the **burn rate** |\n\n## Sources\n\n- [Dynatrace: Service-Level Objectives](https://docs.dynatrace.com/docs/deliver/service-level-objectives) · [SLO examples](https://docs.dynatrace.com/docs/deliver/service-level-objectives/service-level-objective-examples): DQL SLI, burn rate formula, anomaly detection threshold ~10–14 on -1h ✅ 2026-11-20\n- [Dynatrace: DQL aggregation commands (makeTimeseries, countIf)](https://docs.dynatrace.com/docs/platform/grail/dynatrace-query-language/commands/aggregation-commands) ✅ 2026-11-20\n- [SRE Workbook: Implementing SLOs](https://sre.google/workbook/implementing-slos/) · [Alerting on SLOs](https://sre.google/workbook/alerting-on-slos/) · [Error budget policy](https://sre.google/workbook/error-budget-policy/) ✅ 2026-11-20\n- Multi-window construction in Dynatrace, \"> 50%\" boundary: rules of thumb ⚠️\n"}, {"group": "3 · Reliability", "path": "standard/11-alerting.md", "slug": "standard-11-alerting", "title": "11 · Alerting", "md": "# 11 · Alerting\n\n> **In 30 seconds:** page on **symptoms users feel**, never on causes like CPU. A **percentage** says how bad, a\n> **count** says how many: good alerts check both. Prefer **SLO burn rate** over fixed thresholds. In Dynatrace,\n> Davis covers infrastructure anomalies; you add **custom alerts on DQL** and **SLO burn-rate alerts** for service\n> symptoms, and **Workflows** route them to the owning team.\n\n## Choose the alert type\n\n| Ask yourself… | Alert on… | Example |\n|---|---|---|\n| Is **every single occurrence** bad (money, security, data loss)? | **Count** (`> 0` or `> N`) | failed payment, message in DLQ, failed backup |\n| Is it a **high-volume flow** where some failures are normal? | **Percentage (ratio)** | 5xx %, dependency timeout % |\n| Is there an **SLO**? | **Burn rate** | 2% of the monthly budget burned in 1h ([10](#standard-10-slos-and-error-budgets)) |\n| Is traffic **low or variable** (nights, small clients)? | **Ratio AND minimum count** | error % > 5% **and** ≥ 20 errors |\n| Is the **absence** of something the problem? | **Count == 0** | no orders in 15 min, a client stopped calling |\n| Is it a **resource limit**? | **% of capacity + time to exhaustion** | disk full in < 4h |\n\n<div data-widget=\"alert-type-picker\"><\/div>\n\n## Who alerts on what (Dynatrace + OpenTelemetry)\n\n| Symptom family | Source | Why |\n|---|---|---|\n| Kubernetes / infrastructure anomalies (OOM, restarts, node problems) | **Davis** (built-in) | Raised an OOM problem in 1 min with no setup (lab) |\n| Service SLOs (availability, latency) | **SLO app** + burn-rate custom alert | Your targets, not a baseline |\n| Per client, per version, business counts and absence | **Custom alerts** (anomaly detectors) on DQL | Bounded segments you control |\n| Collector pipeline health | Custom alerts on collector self-monitoring metrics ([16](#standard-16-collector-templates--self-monitoring)) | A dead pipeline can't alert on itself |\n| Frontend | RUM health alerts / synthetic monitors ([07](#standard-07-frontend-experience)) | What users experience |\n\nAlert severity (`page` / `ticket`) says what the alert does now; **incident severity** (SEV1–SEV4) says how big the response is: criteria and actions in [20](#standard-20-ownership-and-communication--severity-levels-and-actions).\n\nRule: **each symptom has exactly one alert source**. Davis groups related events into one problem; Workflows route by team.\n\n## 1. Percentage (ratio)\n\nNormalizes against traffic, so one threshold works at 10 req/s and at 10,000 req/s. Use it for high-volume flows and for comparing segments of different sizes.\n\n```text\n// DQL shape: 5xx ratio per route for checkout (server spans)\nfetch spans\n| filter service.name == \"checkout\" and span.kind == \"server\"\n| makeTimeseries { total = count(), errors = countIf(http.response.status_code >= 500) }, by:{ http.route }\n| fieldsAdd error_ratio = errors[] / total[]\n```\n\n**Weak spot: low traffic.** 1 error out of 2 requests = 50% → a page at 3 a.m. for one request.\n\n## 2. Count\n\nEach event matters on its own (payments, DLQ, security), the event is rare by design, or you alert on absence.\n\n```text\n// DQL shape: messages that reached the dead-letter queue in the last window (from your DLQ metric or logs)\ntimeseries dlq = sum(<dlq messages metric>), by:{ queue }\n```\n\n**Weak spot: high traffic.** `errors > 100` storms at peak and stays silent when 100% of a small flow fails.\n\n## 3. Ratio AND minimum count (the default service alert)\n\n```text\n// DQL shape: per client, error ratio > 5% AND more than 20 errors in the window\nfetch spans\n| filter service.name == \"checkout\" and span.kind == \"server\"\n| makeTimeseries { total = count(), errors = countIf(http.response.status_code >= 500) }, by:{ client.id }, interval:10m\n| fieldsAdd error_ratio = errors[] / total[]\n// Custom alert: condition on error_ratio, plus a second condition (or filter) on errors > 20\n```\n\n<div data-widget=\"low-traffic-checker\"><\/div>\n\n| Guard | When |\n|---|---|\n| Minimum **errors** | Default: enough people were affected |\n| Minimum **traffic** | When the ratio must be statistically meaningful |\n| **Longer window** for small segments | Low-traffic clients: 1h instead of 10m |\n| **Synthetic traffic** | When real traffic is too thin to ever be meaningful |\n\n<details>\n<summary>Open-source variant (Prometheus)<\/summary>\n\n```promql\n(\n  sum by (client_id) (rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[10m]))\n  / sum by (client_id) (rate(http_server_request_duration_seconds_count[10m])) > 0.05\n)\nand on (client_id)\n( sum by (client_id) (increase(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[10m])) > 20 )\n```\n\nTested versions of every pattern, with promtool unit tests: [rules/](#rules-readme).\n\n<\/details>\n\n## 4. Burn rate\n\nCompare the error ratio with the error budget instead of a fixed %. Details, multi-window table and the Dynatrace SLO setup: [10](#s
