eries must reach the same gateway replica | Dynatrace docs ✅ |\n| Endpoint | SaaS `https://\u003ctenant>.live.dynatrace.com/api/v2/otlp` (lab) or ActiveGate `https://\u003cag>:9999/e/\u003cenv-id>/api/v2/otlp`; signals under `/v1/traces`, `/v1/metrics`, `/v1/logs` | Dynatrace docs ✅ + lab |\n| Token scopes | Classic: `metrics.ingest`, `logs.ingest`, `openTelemetryTrace.ingest`; platform token: `openpipeline:*:ingest` | Dynatrace docs ✅ |\n| ≤ 50 dimensions per data point | Above it the whole point is dropped: allow-list labels | Dynatrace docs ✅ + lab |\n| ≤ 4 MB per request, protobuf | Cap batches in bytes; JSON was rejected (415) in the lab | Lab |\n| Topology enrichment | Set `k8s.*` and host resource attributes so data links to Smartscape | Dynatrace docs ✅ |\n| No duplicates | Don't enable the OneAgent OpenTelemetry Span Sensor on a service that also exports OTLP | Dynatrace docs ✅ |\n\n## Cost: what drives the bill (DPS)\n\n| Capability | Unit | Notes |\n|---|---|---|\n| Full-Stack Monitoring | memory GiB-hour | Includes trace volume (200 KiB/min per GiB) and a metric data-point allowance |\n| Infrastructure Monitoring | host-hour | Host, process, network, logs; no code-level |\n| Foundation & Discovery | host-hour, lowest tier | Basic health, discovery, topology; no custom metrics |\n| Kubernetes Platform Monitoring | **pod-hour** (list $0.002) | Pods on Full-Stack hosts are covered by Full-Stack. **Pure OTel setups consume no pod-hours** |\n| Metrics – Ingest & Process | per 100,000 data points | **A histogram data point counts as 10**; gauges and counters as 1 |\n| Traces – Ingest & Process | per GiB | 10 days retention included |\n| Logs | per GiB ingested + retain + query | – |\n\n| Cost lever (in the gateway) | Saves |\n|---|---|\n| Send only the histograms you use for percentiles | Each histogram = 10 data points |\n| Label allow-list (also keeps you under 50 dimensions) | Series and dropped points |\n| Tail sampling: all errors and slow traces + a share of the rest | Trace GiB |\n| Drop health-check spans and debug logs | Trace and log GiB |\n| One log collector per stream | Log GiB |\n\nList prices are Dynatrace's documentation examples; your rate card decides. Track usage with the billing metrics and cost notebooks. More levers: [19](19-cost-and-cardinality.md).\n\n## How an SRE uses it\n\n\u003cdiv data-widget=\"viz\" data-chart=\"sre-flow\">\u003c/div>\n\n| Question during an incident | Look in |\n|---|---|\n| Which service is burning its SLO? | L0 overview dashboard, SLO app |\n| Which client / version is affected? | L1 service dashboard: per client, per `service.version` (OTel attributes) |\n| What else broke? Root cause across topology? | Problems app (Davis grouping), Smartscape |\n| Pod OOM, restarts, node pressure | Davis problems (OOM in ~1 min in the lab) |\n| Which hop or method is slow? | Distributed traces; code-level where OneAgent runs |\n| What did the logs say? | Logs filtered by `trace_id` / service |\n\n**Alerting rule:** every symptom has **one** alert source: SLO burn rate, per-client, release regression and business alerts as custom alerts; infrastructure anomalies from Davis. Workflows route each problem to the owning team, so one incident means one page ([11](11-alerting.md)).\n\n## What the lab measured (aks-observability, 2026-10)\n\n| Topic | OpenTelemetry | Dynatrace OneAgent |\n|---|---|---|\n| OOM kill | Data present (`OOMKilled`, restarts), no alert until rules were written | Problem in **1 min**, no setup |\n| +200 ms on PostgreSQL | DB latency metric **names the dependency** | Symptom visible, no DB latency metric without traces; no problem raised |\n| RabbitMQ down 2 min | 5xx 86–100% visible | Failure rate 58–91% visible; no problem raised |\n| Per-route metrics | `http.route` by default | `NON_KEY_REQUESTS` until key requests are configured |\n| Log loss during a 10-min backend cut | 0% after resilience settings (83% before) | 0% |\n| Series churn on container restart | 18 new series (with label allow-list) | 0 |\n| Pipeline / ActiveGate cut-off detected | 4–11 min (collector self-monitoring alerts) | ~24 min (\"Monitoring not available\") |\n\nOne lab on a trial tenant: Davis may behave differently after a longer learning period.\n\n## Moving from OneAgent to OpenTelemetry (Dynatrace stays the backend)\n\n| Step | Done when |\n|---|---|\n| 1. Deploy the three collector tiers; send OTel data **alongside** OneAgent | Same RED numbers from both for one service |\n| 2. Decide per workload (table above); keep OneAgent code modules only where code-level depth is needed | Workload list with owner and path |\n| 3. Move Prometheus-exporter scraping to the collector | ActiveGate scraping off, no gaps |\n| 4. One log path per stream | No duplicate log lines |\n| 5. Rebuild alerts on OTel data (custom alerts, SLOs); keep Davis for infrastructure | Each alert fired once in a chaos test |\n| 6. Remove OneAgent where replaced; keep the ActiveGate for Kubernetes monitoring | Cost per signal per team visible for 30 days |\n\nUse the [transition plan](../framework/transition-plan.md) phases (shadow, then cutover) for each step.\n\n## Sources\n\n- [Dynatrace: OTLP API endpoints](https://docs.dynatrace.com/docs/ingest-from/opentelemetry/otlp-api) · [Telemetry ingest on Kubernetes](https://docs.dynatrace.com/docs/ingest-from/setup-on-k8s/extend-observability-k8s/telemetry-ingest) ✅ 2026-11-20\n- [Dynatrace: OTel Collector](https://docs.dynatrace.com/docs/ingest-from/opentelemetry/collector) · [configuration](https://docs.dynatrace.com/docs/ingest-from/opentelemetry/collector/configuration) ✅ 2026-11-20\n- [Dynatrace: Monitor Prometheus metrics](https://docs.dynatrace.com/docs/observe/infrastructure-observability/container-platform-monitoring/kubernetes-monitoring/monitor-prometheus-metrics) ✅ 2026-11-20\n- [Dynatrace: OneAgent with OpenTelemetry data](https://docs.dynatrace.com/docs/ingest-from/dynatrace-oneagent/oneagent-and-opentelemetry/oneagent-otel) ✅ 2026-11-20\n- [Dynatrace: DynaKube modes](https://docs.dynatrace.com/docs/ingest-from/setup-on-k8s/reference/code-modules-delivery-modes) · [host monitoring](https://docs.dynatrace.com/docs/ingest-from/setup-on-k8s/how-it-works/other-deployment-modes/host-monitoring) ✅ 2026-11-20\n- [Dynatrace: Kubernetes Platform Monitoring](https://docs.dynatrace.com/docs/license/capabilities/container-monitoring/kubernetes-platform-monitoring) · [Host monitoring modes](https://docs.dynatrace.com/docs/license/capabilities/host-monitoring) · [Foundation & Discovery](https://docs.dynatrace.com/docs/license/capabilities/app-infra-observability/foundation-and-discovery) ✅ 2026-11-20\n- [Dynatrace: OpenTelemetry licensing](https://docs.dynatrace.com/docs/ingest-from/opentelemetry/opentelemetry-licensing) · [Metrics consumption](https://docs.dynatrace.com/docs/license/capabilities/telemetry/dps-metrics) · [Traces ingest](https://docs.dynatrace.com/docs/license/capabilities/traces/dps-traces-ingest) ✅ 2026-11-20\n- Lab: `~/projects/aks-observability/results/` ✅ measured\n- Per-workload recommendations, migration steps: rules of thumb ⚠️\n", "standard/18-automation-and-scale.md": "# 18 · Automation and scale: from 5 services to 500\n\n> By hand, observability works for a handful of services. At scale it only works if **one template, kept in one\n> place, is applied to every service automatically**. The SRE team builds the templates and the pipeline (the\n> \"golden path\"); each service team only fills in a short file. Data automation comes from **OpenTelemetry**\n> (Operator, collectors); configuration automation comes from **Dynatrace as code** (Monaco, Terraform, Settings API);\n> response automation comes from **Dynatrace Workflows**.\n\n## What the SRE team provides vs what a service team provides\n\n| SRE team (platform, built once) | Service team (per service, minutes) |\n|---|---|\n| This standard and its rules | `observability.yaml`: name, team, tier, SLO targets, runbook link |\n| Collector templates: agent, cluster, gateway ([16](16-collector-templates.md)) | Namespace label to opt in |\n| OTel `Instrumentation` per language ([15](15-opentelemetry-practices.md)) | Business spans and metrics, if needed |\n| **Templates (one side)**: service dashboard, SLOs, alerts, routing | Their SLO targets and thresholds, via the file |\n| The onboarding pipeline (CI / GitOps + Monaco) | Merge the PR |\n| Workflows for notification and safe remediation | Their runbooks |\n| Self-monitoring, cost reports, reviews ([20](20-ownership-and-communication.md)) | Attend the monthly SLO review |\n\n## Measuring microservices with templates\n\n**Does one template apply to every microservice?** Mostly yes. Each microservice is a single component that emits the\nsame OpenTelemetry signals with the same names (semantic conventions), so **one baseline** covers all of them. What\ndiffers is the *kind* of service and a few per-service values, so the template has three layers:\n\n\u003cdiv data-widget=\"viz\" data-chart=\"microservice-template\">\u003c/div>\n\n| Layer | Applies to | Contents | Who sets it |\n|---|---|---|---|\n| **1. Baseline** (every service) | All | RED from server spans (`http.server.request.duration` / spans), saturation (memory vs limit, CPU vs request, restarts, OOM), dependencies (DB / HTTP client / messaging durations), logs with `trace_id`, `service.version` split, owner and runbook | SRE template, automatic |\n| **2. Archetype add-on** | By service type | See next table | SRE template, chosen by `archetype:` in the service file |\n| **3. Service parameters** | One service | SLO targets, critical routes, clients, business KPIs, thresholds | Service team, in `observability.yaml` |\n\n| Archetype | Extra signals | Default SLI | Typical alerts |\n|---|---|---|---|\n| **HTTP / gRPC API** | Per route, per client, per version | Availability + latency per critical route | Burn rate, per-client ratio + min count |\n| **Queue consumer / worker** | Consumer lag, age of oldest message, DLQ, processing duration | Age of oldest message \u003c X | Lag growing, DLQ count, processing errors |\n| **Batch / CronJob** | Last success time, duration, failed runs | Success within 2 intervals | No success in 2 intervals, failed job |\n| **Gateway / BFF** | Upstream errors by backend, rate limiting, auth failures | Availability at the edge (closest to the user) | Burn rate, upstream ratio by backend |\n| **Frontend** | Web Vitals, JS errors, user actions | LCP / action success at p75 | RUM health alerts, synthetic journeys |\n| **Platform service** (DB, cache, broker) | Callers' client spans, connections vs max, replication lag | Availability as seen by callers, stricter than consumers' SLOs ([09](09-internal-services.md)) | Saturation, replication lag |\n\n### What a template can't do for you\n\n| Not templatable | Why | Where it goes |\n|---|---|---|\n| Which routes are critical | Business knowledge | `observability.yaml` → `critical_routes` |\n| SLO targets | Contract and user expectations | `slo:` block, reviewed monthly |\n| Business KPIs (orders, payments) | Needs SDK instrumentation | Service code + a business-metrics add-on |\n| **User journeys across services** | One journey (login → cart → pay) crosses many services | **Journey SLOs** measured at the edge (gateway or RUM), owned by a product team |\n\n### Microservices are not islands\n\n| Practice | Why |\n|---|---|\n| Measure **journey SLOs** at the entry point (gateway/BFF or RUM), not by multiplying service SLOs | Users feel the journey; ten 99.9% services in a chain are not \"99.9%\" |\n| Every service also alerts on **its dependencies' errors and latency** (client-side spans) | The caller sees the failure first |\n| Use traces + the service map to find **which hop** is slow | A per-service dashboard can't show the chain |\n| Same `team` / `service.namespace` on every service of a product | Overviews per product and per team come for free |\n\n```yaml\n# observability.yaml with archetype and service parameters\nservice: orders-worker\nteam: payments\ntier: 2\narchetype: queue-consumer        # baseline + queue add-on\nlanguage: dotnet\nslo:\n  oldest_message_age_s: 60       # 99% of the time\ncritical_routes: []              # not an HTTP service\nrunbook: https://wiki.example/runbooks/orders-worker\n```\n\n## Onboarding a service\n\n\u003cdiv data-widget=\"viz\" data-chart=\"onboarding-flow\">\u003c/div>\n\n### 1. The service file (the only thing a team writes)\n\n```yaml\n# observability.yaml, in the service's repo\nservice: checkout\nteam: payments\ntier: 1                      # decides the defaults below\nlanguage: dotnet             # which OTel Instrumentation to inject\nslo:\n  availability: 99.9         # % non-5xx, 28 days\n  latency_ms: 500\n  latency_target: 99         # % of requests under latency_ms\nper_client: true             # adds client.id views and alerts\nrunbook: https://wiki.example/runbooks/checkout\n```\n\n### 2. Tier defaults (so teams don't have to decide everything)\n\n| | Tier 1 (customer-facing, revenue) | Tier 2 (internal, important) | Tier 3 (batch, tools) |\n|---|---|---|---|\n| Instrumentation | OTel auto + business spans | OTel auto | OTel auto or metrics only |\n| SLO | Availability + latency | Availability | None (count / absence alerts) |\n| Burn-rate alert | Page | Ticket | – |\n| Per-client / per-version views | Yes | Optional | No |\n| Dashboard | Service template (L1) + team overview | Service template | Team overview row only |\n| Synthetic check | External journey | Internal `httpcheck` | – |\n| Trace sampling at the gateway | Keep errors + slow + 25% ⚠️ | errors + slow + 10% ⚠️ | errors only ⚠️ |\n\n### 3. What the pipeline does on merge\n\n| Step | Tool | Result |\n|---|---|---|\n| Validate the file (owner, runbook, tier, SLO in range) | CI check | The [definition of done](03-definition-of-done.md) enforced, not hoped for |\n| Label the workload (`team`, `app.kubernetes.io/version`) and annotate the namespace | Helm / Argo CD | OTel auto-instrumentation injects; collectors add `team` and `service.version` |\n| Render SLOs, alerts and routing from the templates with the file's values | `dynatrace/generate.py` → Monaco configs | One config per service, never hand-edited |\n| Deploy (dry run in the PR, real on merge) | `monaco deploy --dry-run` / `monaco deploy` | Dynatrace SLO (`slo-v2`), custom alerts, alerting rules |\n| Register the service on the team overview | Monaco / dashboard variable values | Visible in L0 the same day |\n\nTarget ⚠️: a new service is fully observed **the same day** it deploys, with no ticket to the SRE team.\n\n## Dashboards as templates, on one side\n\nKeep **one** set of dashboard templates in one repository. Services never copy dashboards.\n\n| Option | How | Use for |\n|---|---|---|\n| **A. One dashboard + a `service` variable** | A DQL variable lists services; every tile filters with `filter service.name == $service` | The L1 service dashboard ([14](14-dashboards.md)). One thing to maintain, works for service 501 automatically |\n| **B. Generated per service** | Monaco renders the same JSON template with parameters (service, team, SLO) | Team overviews (L0), or when a tier needs different tiles |\n\nRecommendation: **A for L1**, **B only for team overviews**. Either way the template lives in one place, changes go through a PR, and every service gets the change at once.\n\n```text\n// Dashboard variable \"service\" (DQL type) – distinct services that send request metrics\ntimeseries requests = sum(\u003crequest-count metric>), by:{service.name}\n| fields service.name\n// Every tile then filters: filter service.name == $service\n```\n\n## Dynatrace as code with Monaco\n\nThe whole Dynatrace side of the baseline lives in one Monaco project: [dynatrace/](../dynatrace/). SRE owns the\ntemplates; services only contribute their `observability.yaml`; a small generator renders the Monaco configs.\n\n| Piece | What it is | Owner |\n|---|---|---|\n| `templates/*.json` | SLO, custom-alert and workflow templates with `{{ .service }}`, `{{ .target }}`, … | SRE |\n| `shared/` | The ONE L1 dashboard (`document`, `$service` variable), deployed once | SRE |\n| `services-src/*.yaml` | Each service's `observability.yaml` (in reality: pulled from the service repos) | Service teams |\n| `generate.py` | Archetype → which templates; tier → default thresholds; writes one config per service and one workflow per team | SRE |\n| `projects/` | Generated Monaco configs, never edited by hand | Generated |\n| `manifest.yaml` | Environments (prod, staging) and credentials from CI secrets | SRE |\n\n```yaml\n# projects/services/checkout/config.yaml (generated)\nconfigs:\n  - id: checkout-slo-availability           # the service name in every ID: Monaco identifies objects by ID\n    type: slo-v2\n    config:\n      name: checkout · availability\n      template: ../../../templates/slo-availability.json\n      parameters: { service: checkout, team: payments, target: 99.9, runbook: https://wiki.example/runbooks/checkout }\n  - id: checkout-alert-burn-rate\n    type:\n      settings:\n        schema: builtin:davis.anomaly-detectors\n        scope: environment\n    config:\n      name: checkout · SLO fast burn\n      template: ../../../templates/alert-burn-rate.json\n      parameters: { service: checkout, team: payments, target: 99.9, threshold: 14.4, runbook: https://wiki.example/runbooks/checkout }\n```\n\n| Monaco rule | Why |\n|---|---|\n| One config per service, service name in the `id` | Reusing an ID makes each deploy overwrite the previous service |\n| Get template JSON from `monaco download` of a pilot service built in the UI | The schema comes from your tenant, not from memory |\n| `--dry-run` on every PR, `deploy` on merge, `delete` for retired services | Reviewable, repeatable, no orphans |\n| Workflow expressions escaped as `{{ \"{{\" }} … {{ \"}}\" }}` | Both Monaco and Workflows use `{{ }}` |\n| Dashboards: `private: false` | Monaco-created documents are private by default |\n| No edits in the UI on generated objects | The next deploy overwrites them |\n\n## Automating the response\n\n| Automation | Dynatrace feature | Guardrail |\n|---|---|---|\n| Route a problem to the owning team | Workflow with a **problem trigger** (\"wait for root cause\"), team from the `team` attribute | One route per team, tested |\n| Open a ticket / post to the team channel | Workflow actions (Slack, email, ticketing) | Deduplicate by problem ID |\n| Roll back a bad release | Workflow → pipeline webhook when the problem is linked to a deployment event ([12](12-releases-and-dora.md)) | Production: human approval; staging: automatic |\n| Restart / scale | Workflow → Kubernetes action | Only idempotent, reversible actions; log every run |\n| Close the loop | Problem closed → update the incident record | Postmortem still written by people ([20](20-ownership-and-communication.md)) |\n\nRule ⚠️: automate **notification and diagnosis** first, **remediation** second, and only for actions you would do the same way every time.\n\n## Governance: keep it from drifting\n\n| Practice | Why |\n|---|---|\n| Everything from Git; UI changes are overwritten on the next deploy | One source of truth |\n| PR review against the standard (13–15 for dashboards, 03 for alerts) | Quality at the door |\n| CI checks every service: owner, tier, SLO, runbook, dashboard registered | The definition of done becomes automatic |\n| Template changes roll out to all services at once | No \"old version\" dashboards |\n| Delete what a service no longer has (removed services, renamed alerts) | No orphan alerts paging nobody |\n\n## Measure the platform\n\n| KPI | Target ⚠️ |\n|---|---|\n| Services onboarded via the pipeline | 100% of tier 1–2 |\n| Services with an SLO | 100% of tier 1 |\n| Time from first deploy to fully observed | \u003c 1 day |\n| Hand-made dashboards / alerts outside Git | 0 |\n| Pages without an owner or runbook | 0 |\n\n## Sources\n\n- [Dynatrace: Configuration as Code (Monaco)](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/monaco-getting-started) · [projects and manifest](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/configuration/projects) · [YAML structure](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/configuration/yaml-configuration-saas) · [get started (slo-v2, dry run)](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/get-started/get-started-with-dynatrace-configuration-for-monaco) · [Go templating](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/guides/configuration-as-code-advanced-use-case) ✅ 2026-11-20\n- [Dynatrace Terraform provider](https://registry.terraform.io/providers/dynatrace-oss/dynatrace/latest/docs) 📚\n- [Dynatrace: Dashboard variables](https://docs.dynatrace.com/docs/analyze-explore-automate/dashboards-and-notebooks/dashboards-new/components/dashboard-component-variable): DQL variables, `$var` in queries ✅ 2026-11-20\n- [Dynatrace: Workflow event triggers](https://docs.dynatrace.com/docs/analyze-explore-automate/workflows/build/trigger/event-trigger) · [Alerting and notifications](https://docs.dynatrace.com/docs/analyze-explore-automate/alerting-and-notifications): problem trigger, wait for root cause ✅ 2026-11-20\n- [OpenTelemetry Operator](https://opentelemetry.io/docs/platforms/kubernetes/operator/) 📚\n- Tier defaults, onboarding target, platform KPIs: rules of thumb ⚠️\n", "standard/19-cost-and-cardinality.md": "# 19 · Cost and cardinality\n\n> Every unique combination of label values is a new time series. Series drive memory, storage and cost.\n> Most observability bills and outages of the monitoring system itself come from **one bad label**.\n\n## How cardinality explodes\n\n| Label | Values | Series for one histogram with 12 buckets × 5 routes × 3 status codes |\n|---|---|---|\n| none extra | – | 12 × 5 × 3 = 180 |\n| `client_id` (3 clients) | 3 | 540 ✅ fine |\n| `pod` (20 pods, churn on every deploy) | 20+ | 3,600+ ⚠️ watch it |\n| `user_id` (100k users) | 100,000 | 18,000,000 ❌ never |\n| raw URL `/orders/48213` | unbounded | ❌ never: use `http.route` |\n\nRule ⚠️: a label is OK for metrics if its values are **bounded and known** (tens, not thousands). Put IDs in traces and logs.\n\n## Cardinality budget (per service)\n\n| Item | Budget (starting point ⚠️) |\n|---|---|\n| Active series per service | ≤ 10,000 |\n| Labels per metric | ≤ 10 |\n| Values per label | ≤ 100 |\n| New label on a shared metric | Needs review (PR to the standard) |\n\n## Find what's expensive\n\n\u003cdetails>\n\u003csummary>Open-source variant (PromQL)\u003c/summary>\n\n```promql\n# Top 10 metrics by series count\ntopk(10, count by (__name__) ({__name__=~\".+\"}))\n\n# Which label of a metric is exploding\ncount(count by (http_route) (http_server_request_duration_seconds_count))\n\n# Series per job (who sends the most)\ntopk(10, count by (job) ({__name__=~\".+\"}))\n```\n\n\u003c/details>\n\n```bash\n# Prometheus TSDB stats: head series, top metric names and label pairs by series count\ncurl -s 'http://prometheus:9090/api/v1/status/tsdb?limit=20' | jq '.data.seriesCountByMetricName'\n```\n\n`{__name__=~\".+\"}` touches every series: run it on demand, not in dashboards.\n\n## Reduce\n\n| Where | How |\n|---|---|\n| In the app | Use `http.route`; don't add IDs as attributes on metrics; fewer histogram buckets |\n| OTel Collector | `filter` processor (drop metrics), `transform` processor (drop or rewrite attributes), span metrics `aggregation_cardinality_limit` |\n| Prometheus scrape | `metric_relabel_configs` with `action: drop` / `labeldrop` |\n| Prometheus OTLP ingest | Promote only the resource attributes you need (`promote_resource_attributes`), don't use `promote_all_resource_attributes` |\n| Traces | Tail sampling ([15](15-opentelemetry-practices.md#sampling)) |\n| Logs | Drop debug logs in production at the collector; short retention for verbose streams |\n\n```yaml\n# Prometheus: drop a noisy metric and a high-cardinality label at scrape time\nmetric_relabel_configs:\n  - source_labels: [__name__]\n    regex: \"go_gc_duration_seconds.*\"\n    action: drop\n  - regex: \"request_id\"\n    action: labeldrop\n```\n\n## Retention per signal (starting point ⚠️)\n\n| Signal | Hot retention | Why |\n|---|---|---|\n| Metrics (raw) | 15–30 days | SLO windows (28–30d) need it |\n| Metrics (downsampled / recording rules) | 13 months | Year-over-year comparisons |\n| Traces | 7–14 days | Debugging recent incidents |\n| Logs (app) | 14–30 days | Postmortems |\n| Logs (audit / security) | Per compliance | Legal requirements |\n\n## Make cost visible\n\n| Practice | How |\n|---|---|\n| Cost per team | Series / GB ingested grouped by the `team` attribute ([20](20-ownership-and-communication.md)) |\n| Alert on cardinality growth | `count({job=\"x\"}) > 1.5 * count({job=\"x\"} offset 1d)` ⚠️ |\n| Review | Monthly, with the alert and SLO review |\n\n## In Dynatrace\n\n| Concern | Where to act |\n|---|---|\n| Cost driver | Metric data points (histogram = 10), log and trace GiB, retention, queries ([17](17-dynatrace-integration.md#cost-what-drives-the-bill-dps)) |\n| Cardinality limit | ≤ 50 dimensions per data point; allow-list labels in the gateway ([16](16-collector-templates.md)) |\n| Reduce before ingest | Gateway filters and transforms (your control point); OpenPipeline processing after ingest |\n| Track usage | Billing usage metrics and the cost notebooks in Account Management, split by team via the `team` attribute |\n\n## Sources\n\n- [Prometheus: Metric and label naming](https://prometheus.io/docs/practices/naming/): don't use labels for unbounded values 📚\n- [Prometheus HTTP API: TSDB stats](https://prometheus.io/docs/prometheus/latest/querying/api/): `/api/v1/status/tsdb`, `seriesCountByMetricName`, `limit` ✅ 2026-11-20\n- [Prometheus configuration: `metric_relabel_configs`, `otlp`](https://prometheus.io/docs/prometheus/latest/configuration/configuration/) ✅ 2026-11-20\n- [Span metrics connector: `aggregation_cardinality_limit`](https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/connector/spanmetricsconnector/README.md) ✅ 2026-11-20\n", "standard/20-ownership-and-communication.md": "# 20 · Ownership and communication\n\n> An alert without an owner is noise. A standard nobody hears about doesn't exist.\n> This file defines **who is responsible for what** and **how information flows**.\n\n## Who owns what (RACI)\n\nR = Responsible (does it) · A = Accountable (one per row) · C = Consulted · I = Informed\n\n| Activity | Service team | Platform / Observability team | SRE | Business owner | Eng. manager |\n|---|---|---|---|---|---|\n| Collector, backends, retention, cost | I | **A/R** | C | – | I |\n| The standard (this guide) | C | C | **A/R** | – | I |\n| Instrumentation of a service | **A/R** | C | C | – | I |\n| SLO definition | R | – | C | C | **A** |\n| Alerts + runbooks for a service | **A/R** | – | C (review) | – | I |\n| Dashboards for a service | **A/R** | C (templates) | C | – | – |\n| Business KPIs and their alerts | R | – | C | **A** | I |\n| On-call response | **A/R** | C (platform issues) | C | I | I |\n| Postmortem | R | C | **A** (facilitates) | I | I |\n| Monthly alert / SLO review | R | C | **A** | I | I |\n\n## Make ownership machine-readable\n\nOwnership must be in the telemetry, not only on a wiki:\n\n| Where | Label / attribute | Used for |\n|---|---|---|\n| K8s workloads | `app.kubernetes.io/part-of`, `team: payments` | k8sattributes → every signal |\n| Telemetry | `service.namespace` or `team` | Alert routing, dashboard filters |\n| Alert rules | `labels: { team: payments, severity: page }` | Alertmanager routing |\n| Service catalog | Backstage `catalog-info.yaml` (owner, on-call, runbooks) | Single source of truth |\n\n```yaml\n# Alertmanager: route by team, then by severity\nroute:\n  receiver: platform-default\n  group_by: [alertname, service_name, client_id]\n  routes:\n    - matchers: [team=\"payments\"]\n      routes:\n        - matchers: [severity=\"page\"]\n          receiver: payments-pager\n        - matchers: [severity=\"ticket\"]\n          receiver: payments-tickets\n```\n\nRule: **no alert merges without `team`, `severity` and `runbook_url`** (check it in CI with a linter / `promtool` + a small script).\n\n## Severity levels and actions\n\nThree scales, each with one job. Don't mix them:\n\n| Scale | Answers | Values | Set by |\n|---|---|---|---|\n| **Service tier** | How important is the service? | Tier 1 / 2 / 3 ([18](18-automation-and-scale.md)) | Service file, reviewed yearly |\n| **Alert severity** | What should the alert do right now? | `page` / `ticket` ([11](11-alerting.md)) | Alert definition |\n| **Incident severity** | How bad is the impact, and how big is the response? | SEV1 – SEV4 | Incident Commander / on-call, can change during the incident |\n\n### Incident severity: criteria\n\n\u003cdiv data-widget=\"viz\" data-chart=\"severity-matrix\">\u003c/div>\n\n| Level | Criteria (any one is enough) ⚠️ | Examples |\n|---|---|---|\n| **SEV1 · Critical** | Tier-1 journey down or unusable for most users · data loss or a security breach exposing customer data · SLA breach in progress for a key client | Checkout returns errors for > 50% of requests; customer data exposed |\n| **SEV2 · Major** | Tier-1 journey degraded for many users, or down for one important client · tier-2 service down with user impact · fast error-budget burn on a tier-1 SLO | Fabrikam (SLA client) can't pay; p99 latency 5× for 30 min |\n| **SEV3 · Minor** | Partial loss of functionality for a minority of users · tier-2/3 degradation with a workaround · issue that becomes SEV2 if ignored | One region slow; batch job late but within the business deadline |\n| **SEV4 · Low** | No current user impact · cosmetic or internal issue · risk to address in working hours | Disk forecast full in 10 days; a non-critical alert misbehaving |\n\nMake the criteria **measurable** in your own version (e.g. % of users or requests affected, which journeys, which clients). Google's rule of thumb for declaring an incident at all: a **second team** is needed, the problem is **visible to customers**, or it is **unsolved after an hour** of focused work.\n\n### Incident severity: actions\n\n| | SEV1 | SEV2 | SEV3 | SEV4 |\n|---|---|---|---|---|\n| **Notification** | Page on-call + Incident Commander + team lead | Page on-call + IC | Page the owning team (high urgency in hours, ticket out of hours if no user impact) | Ticket |\n| **Acknowledge within** ⚠️ | 5 min | 5 min | 30 min | Next working day |\n| **Roles** | IC, Ops lead, Comms lead (separate people) | IC + Ops (IC may handle comms) | Owner on-call | Owner |\n| **Incident channel / doc** | Yes, immediately | Yes | Optional | No |\n| **Internal updates** ⚠️ | Every 30 min | Every 60 min | At resolution | – |\n| **External / client comms** | Status page + affected clients within 30 min | Affected clients | Only if asked | – |\n| **Leadership** | Informed immediately | Informed | – | – |\n| **Change freeze** | Yes, for affected services | Yes, for affected services | No | No |\n| **Postmortem** | **Required** (blameless), within 5 working days | **Required** | Optional (required if it repeats) | No |\n| **Error budget** | Counts; triggers the policy if > 20% used ([10](10-slos-and-error-budgets.md)) | Counts | Counts | – |\n\n### Rules\n\n| Rule | Why |\n|---|---|\n| **When unsure, pick the higher level**; lower it later | Under-reacting costs more than over-reacting |\n| **Don't debate severity on the incident call**; settle it in the postmortem | Time goes to mitigation |\n| Severity can go **up or down** during the incident; announce every change | The response must match the current impact |\n| Severity is about **impact**, not about how hard the fix is | A one-line fix to a full outage is still SEV1 |\n| Mitigate first (rollback, failover, feature flag), find the root cause later | Users first |\n| Only the Ops lead changes production during SEV1/SEV2 | No conflicting changes |\n\n### In Dynatrace\n\n| Concept | Dynatrace |\n|---|---|\n| Severity of events and problems | Standardized event severity: **1 Critical · 2 Major · 3 Minor · 4 Warning · 5 Informational**; a problem takes the highest severity of its events |\n| Category of the problem | Availability, Error, Slowdown, Resource contention, Custom alert, Monitoring unavailable |\n| Map to SEV and route | A **Workflow** on the problem trigger reads severity, category and the service's `tier` / `team`, sets the SEV, and notifies accordingly (SEV1/2 page the IC and the team; SEV3 pages the team; SEV4 opens a ticket). Routing workflows are generated per team ([dynatrace/](../dynatrace/)) |\n| Custom alerts | Set the event severity in the alert's event template, consistent with the tier (e.g. tier-1 SLO fast burn → Critical/Major) |\n\n## Communication flows\n\n### 1. Incident flow\n\n```text\nAlert fires → routed by team label → on-call acknowledges (≤ 5 min for pages)\n  → incident channel opened (#inc-YYYYMMDD-checkout) → roles: Incident Commander, Ops, Comms\n  → status updates every 30 min (internal) / per SLA (clients)\n  → resolved → postmortem in ≤ 5 working days (blameless)\n  → action items with owners → tracked until closed → standard/playbook updated\n```\n\n| Role | Does |\n|---|---|\n| Incident Commander | Coordinates, decides, keeps the timeline |\n| Ops lead | Investigates and fixes |\n| Comms | Status page, client and stakeholder updates |\n\n### 2. Change flow (deploys)\n\n| Step | Communication |\n|---|---|\n| Deploy starts / ends | Automatic message + Grafana annotation (who, what version, PR link) |\n| Regression detected | Alert with `suspect: deploy` to the deploying team |\n| Rollback | Message in the deploy channel + annotation |\n| Error budget exhausted | Notice to team + manager: freeze non-critical changes |\n\n### 3. Standard-change flow (changing alerts, dashboards, SLOs)\n\n| Step | How |\n|---|---|\n| Propose | Pull request to the alert rules / this guide |\n| Review | Service owner + SRE review against [11-alerting](11-alerting.md) |\n| Shadow | New or changed alerts go to a non-paging receiver for 1–2 weeks |\n| Announce | Short note in the team channel: what changed, why, what to expect |\n| Changelog | Every change recorded with date and reason |\n\n### 4. Recurring rituals\n\n| Ritual | Cadence | Who | Output |\n|---|---|---|---|\n| On-call handover | Each rotation | Outgoing + incoming on-call | Open issues, noisy alerts list |\n| Alert review | Weekly / bi-weekly | Team + SRE | Delete, tune or fix noisy alerts |\n| SLO review | Monthly | Team, manager, business owner | Budget status, targets, priorities |\n| Observability health report | Quarterly | SRE → leadership | Maturity score, KPIs, roadmap |\n\n## Sources\n\n- Google SRE Book, ch. 14 *Managing Incidents*, ch. 15 *Postmortem Culture*\n- PagerDuty Incident Response docs (roles, IC)\n- [PagerDuty: Severity levels](https://response.pagerduty.com/before/severity_levels/) · [Atlassian: Incident severity levels](https://www.atlassian.com/incident-management/kpis/severity-levels) · [Atlassian incident handbook (postmortems for SEV1/2)](https://www.atlassian.com/incident-management/handbook/incident-response) ✅ 2026-11-20\n- [Google SRE Book: Managing incidents (when to declare)](https://sre.google/sre-book/managing-incidents/) · [Workbook: Incident response (IC, CL, OL)](https://sre.google/workbook/incident-response/) ✅ 2026-11-20\n- [Dynatrace: Standardized event severity](https://docs.dynatrace.com/docs/analyze-explore-automate/alerting-and-notifications/standardized-event-severity) · [Categories of Davis events](https://docs.dynatrace.com/docs/discover-dynatrace/platform/davis-ai/root-cause-analysis/concepts/events/event-types) ✅ 2026-11-20\n- SEV criteria thresholds, acknowledgement times, update cadences: rules of thumb ⚠️\n- Backstage software catalog\n- Prometheus Alertmanager routing docs\n\n> Official links and verification status: [REFERENCES.md](../REFERENCES.md)\n", "standard/21-incident-response-and-on-call.md": "# 21 · Incident response, runbooks, postmortems and on-call\n\n> **In 30 seconds:** the loop is **alert → runbook → incident → postmortem → better alert and runbook**. Every page\n> links to a **runbook** with first checks and safe mitigations; incidents follow the severity rules ([20](20-ownership-and-communication.md#severity-levels-and-actions));\n> every SEV1/SEV2 gets a **blameless postmortem** with tracked actions; and **on-call** is designed so people can do it\n> for years: ≤ 2 incidents per shift, clean handovers, clear escalation, practice before the real thing.\n\n## The incident loop\n\n\u003cdiv data-widget=\"viz\" data-chart=\"incident-lifecycle\">\u003c/div>\n\n| Phase | Ends when | Metric ([23](23-measuring-effectiveness.md)) |\n|---|---|---|\n| Detect | An alert fires (or a customer reports) | Time to detect (MTTD); % detected by monitoring |\n| Acknowledge | A human owns it | Time to acknowledge (MTTA) |\n| Mitigate | Users are no longer affected (rollback, failover, flag off) | Time to mitigate |\n| Resolve | The system is back to normal and stable | Time to restore/resolve (define which \"R\" you use) |\n| Learn | Postmortem done, actions tracked | % actions closed on time; repeat incidents |\n\n## Runbooks\n\nThe SRE book reports about a **3× better MTTR** when responders follow a playbook written in advance instead of \"winging it\". Every alert that pages has one.\n\n| Section | Contents |\n|---|---|\n| **What this alert means** | The symptom in user terms, the SLO or threshold, why it pages |\n| **Impact** | Who is affected, how to see how many (dashboard link with variables filled) |\n| **First checks (5 min)** | 3–5 concrete checks in order: recent deployment? one client or all? dependencies? saturation? |\n| **Mitigations** | Safe actions, most reversible first: roll back, scale out, disable a feature flag, fail over, shed load. Exact commands or buttons |\n| **Escalation** | When and whom: second line, owning team of a dependency, Incident Commander (SEV rules) |\n| **Verify** | How to confirm it's fixed (which tile turns green) |\n| **Background** | Architecture notes, known issues, links to past postmortems |\n\n| Runbook rule | Why |\n|---|---|\n| Written for someone tired at 3 a.m. who doesn't know this service | That's who reads it |\n| Commands copy-pasteable, with the namespace/service filled in | No mistakes under stress |\n| Owned by the service team; reviewed when the alert fires (update it right after) | Runbooks rot otherwise; the SRE workbook asks on-call to update the playbook when its page fires |\n| One runbook per alert, linked from the alert itself (`runbook` property) | One click from the page |\n| Automate the steps you repeat every time (Workflows, scripts) | Toil reduction ([23](23-measuring-effectiveness.md#toil)) |\n\nTemplate: [framework/runbook-template.md](../framework/runbook-template.md).\n\n## Postmortems\n\n| Rule | Why |\n|---|---|\n| **Required** for SEV1 and SEV2, a single incident using > 20% of the error budget, and any repeat incident | Learning, not blame ([10](10-slos-and-error-budgets.md)) |\n| **Blameless**: describe systems and decisions, not people's mistakes | People must feel safe to tell the truth |\n| Draft within **5 working days**, reviewed with the people involved | Memory fades fast |\n| Timeline from data: problem events, deployment events, chat, traces | Facts, not recollection |\n| **Contributing factors**, not one \"root cause\" | Incidents have several causes |\n| Every action has an **owner, priority and due date**, tracked in the backlog | Untracked actions never happen |\n| Monthly review of open actions; share learnings widely | Close the loop |\n| Update the guide: playbook status, runbook, alert, dashboard | The standard improves from real incidents |\n\nTemplate: [framework/postmortem-template.md](../framework/postmortem-template.md).\n\n## On-call\n\n| Practice | Rule ⚠️ | Source |\n|---|---|---|\n| **Load** | ≤ 2 incidents per 12-hour shift; median close to 0 | SRE book / workbook |\n| **Rotation size** | At least 6–8 people per rotation (or two time zones) so nobody is on call more than ~1 week in 6–8 | SRE book (≥ 8 single-site, 6 per site multi-site) |\n| **Escalation** | Primary → secondary (5–10 min) → team lead / Incident Commander | – |\n| **Handover** | At every shift change: open incidents, noisy alerts, ongoing changes, things to watch | SRE workbook |\n| **After a rough night** | Time off the next morning; follow-up work moves to the next shift | Sustainability |\n| **Training** | Shadow a shift, then reverse-shadow, then primary; **Wheel of Misfortune** role-plays on past incidents | SRE book |\n| **Tooling** | Pages carry runbook + dashboard links; one page per incident (Davis grouping + Workflow routing) | [11](11-alerting.md) |\n| **Review** | Weekly: pages, noisy alerts, toil; give the pager back to the dev team if the service stays below standard | SRE workbook |\n\n```text\nHandover note (end of shift)\n- Incidents: SEV3 #1234 orders-worker lag, mitigated (scaled to 6), RCA pending → owner payments\n- Noisy alerts: \"checkout · per-client ratio\" fired twice at night for client \"tiny\" → raise min errors (ticket #567)\n- Changes in flight: Postgres minor upgrade Thursday 10:00 (platform-data)\n- Watch: disk forecast for orders-db crosses limit in ~9 days\n```\n\n## Wheel of Misfortune (practice)\n\nA role-play of a past incident: one person acts as \"the system\", the on-call trainee investigates and responds, a facilitator keeps time and notes. Afterwards, update the runbook and the dashboards with what was missing. Run it monthly with new on-call members; use real postmortems as scripts.\n\n## Common mistakes\n\n| ❌ | ✅ |\n|---|---|\n| Alert without a runbook, or a runbook that says \"investigate\" | Concrete checks and mitigations |\n| Root cause = \"human error\" | Ask why the system allowed it |\n| Postmortem actions in a document nobody reads | Tracked tickets with owners and dates |\n| Same 3 people always on call | Bigger rotation, follow-the-sun, fewer pages |\n| Severity debated during the incident | Decide fast, adjust later ([20](20-ownership-and-communication.md#severity-levels-and-actions)) |\n\n## Sources\n\n- [Google SRE Book: Being on-call](https://sre.google/sre-book/being-on-call/) · [Managing incidents](https://sre.google/sre-book/managing-incidents/) · [Postmortem culture](https://sre.google/sre-book/postmortem-culture/) · [Accelerating SREs to on-call (Wheel of Misfortune)](https://sre.google/sre-book/accelerating-sre-on-call/) · [Introduction (playbooks ~3× MTTR)](https://sre.google/sre-book/introduction/) ✅ 2026-11-20\n- [Google SRE Workbook: On-call (handoffs, playbook upkeep)](https://sre.google/workbook/on-call/) · [Incident response](https://sre.google/workbook/incident-response/) · [Postmortem culture](https://sre.google/workbook/postmortem-culture/) · [Operational overload](https://sre.google/workbook/overload/) ✅ 2026-11-20\n- [Atlassian: MTTA, MTTR, MTBF](https://www.atlassian.com/incident-management/kpis/common-metrics) ✅ 2026-11-20\n- Escalation timings, handover format: rules of thumb ⚠️\n", "standard/22-resilience.md": "# 22 · Resilience: backups, disaster recovery, chaos engineering, progressive delivery\n\n> **In 30 seconds:** a backup you have never restored is a hope, not a backup. Give every important service an\n> **RPO** (how much data you may lose) and **RTO** (how long recovery may take), **test restores and failover** against\n> them, run **game days** to prove alerts, runbooks and failover work, and limit the blast radius of every change with\n> **canaries, feature flags and automatic rollback**.\n\n## RPO and RTO\n\n| Term | Meaning | Example |\n|---|---|---|\n| **RPO** (recovery point objective) | Maximum acceptable data loss, measured in time | 5 min: replicas or log shipping every few minutes |\n| **RTO** (recovery time objective) | Maximum acceptable time to restore business operations | 1 h: restore + switch traffic within an hour |\n\n| Tier ⚠️ | RPO | RTO | Typical setup |\n|---|---|---|---|\n| 1 | ≤ 5 min | ≤ 1 h | Replication across zones/regions, automated failover, tested runbook |\n| 2 | ≤ 1 h | ≤ 4 h | Frequent backups, scripted restore |\n| 3 | ≤ 24 h | ≤ 1 day | Daily backups, documented restore |\n\nAzure Well-Architected guidance: measure **actual restore times against RPO and RTO**, test **whole critical flows** (a component can restore in time while the flow misses its RTO because dependencies restore after it), test **failback** too, and run **at least one production DR drill per year**.\n\n## What to measure\n\n| Signal | Why | Source |\n|---|---|---|\n| Last successful backup per data store (age) | RPO at risk when it's older than the RPO | Backup job metrics / logs → custom alert (\"no success in 2 intervals\", [06](06-workload-types.md#batch-and-cron-jobs)) |\n| Backup size trend | A sudden drop often means a broken backup | Backup job metrics |\n| Replication lag | Real RPO for replicated stores | DB / broker metrics ([09](09-internal-services.md)) |\n| **Restore test result and duration** | The only proof the backup works; real RTO | Restore test runs (scheduled job + SDLC/custom event) |\n| Failover drill duration | Real RTO for the full flow | Game day record |\n\n## Chaos engineering and game days\n\nPrinciples of Chaos Engineering: define **steady state** as a measurable output that shows normal behavior, hypothesize it holds while you inject a real-world failure, run it (eventually in production), and **minimize the blast radius**.\n\n| Step | Example |\n|---|---|\n| 1. Steady state | checkout SLI ≥ 99.9%, p95 \u003c 300 ms, orders queue age \u003c 60 s |\n| 2. Hypothesis | \"If one orders-db replica dies, checkout stays within SLO and an alert fires in \u003c 5 min\" |\n| 3. Blast radius | Staging first; then production, one zone, business hours, a kill switch ready |\n| 4. Inject | Kill pods, add latency, drop a dependency, fill a disk, cut the collector (Chaos Mesh, Azure Chaos Studio, scripts) |\n| 5. Observe | SLO, alerts, problems, traces, runbook usefulness |\n| 6. Abort rules | Stop immediately if the SLO burns fast or customers complain |\n| 7. Learn | Fix gaps, update runbooks and alerts, schedule the next one |\n\n| Game day calendar (quarterly ⚠️) | Proves |\n|---|---|\n| Kill a tier-1 pod / node / zone | Redundancy, autoscaling, alerting |\n| Dependency latency or outage | Timeouts, retries, circuit breakers ([09](09-internal-services.md)) |\n| Restore a database from backup into a new instance | RPO/RTO, restore runbook |\n| Cut the telemetry pipeline | Collector self-monitoring alerts ([16](16-collector-templates.md#self-monitoring)) |\n| Bad release | Release regression alert, rollback ([12](12-releases-and-dora.md)) |\n\nThe aks-observability lab already ran these patterns: pod kill, DB latency, RabbitMQ outage, OOM, pipeline cut-offs, log-loss during a backend outage. Its results are in [17](17-dynatrace-integration.md#what-the-lab-measured-aks-observability-2026-10). Template: [framework/game-day-template.md](../framework/game-day-template.md).\n\n## Progressive delivery: limit the blast radius of changes\n\n| Technique | How | Signal that decides |\n|---|---|---|\n| **Canary** | Send a small share of traffic to the new version, compare with the old | Error ratio / latency **by `service.version`** ([12](12-releases-and-dora.md)) |\n| **Automatic analysis and rollback** | Argo Rollouts / Flagger analysis, or Dynatrace Site Reliability Guardian after the deployment event | SLO and golden-signal objectives |\n| **Feature flags** | Ship code dark, turn on gradually, turn off instantly | Error ratio per flag variant; flag change events on dashboards |\n| **Blue/green** | Two environments, switch traffic at once, switch back fast | Same as canary, at the switch |\n| **Error budget gate** | No risky releases when the budget is spent ([10](10-slos-and-error-budgets.md)) | SLO budget |\n\nFeature flags: prefer a vendor-neutral API (OpenFeature, a CNCF project) so code doesn't lock into one flag vendor; emit flag evaluations or changes as events so \"errors started when flag X turned on\" is visible next to deployments.\n\n## Common mistakes\n\n| ❌ | ✅ |\n|---|---|\n| Backups monitored, restores never tested | Scheduled restore tests with measured duration |\n| RTO for a database, not for the business flow | Test the whole flow, including DNS and clients |\n| Chaos in production on day one | Staging first, small blast radius, abort rules |\n| Canary judged by eye | Automated analysis by version against SLO objectives |\n| Feature flags that live forever | Remove flags after rollout; track flag age |\n\n## Sources\n\n- [Azure Well-Architected: Disaster recovery](https://learn.microsoft.com/en-us/azure/well-architected/reliability/disaster-recovery) · [Reliability testing](https://learn.microsoft.com/en-us/azure/well-architected/reliability/reliability-test) · [Reliability targets (RTO/RPO)](https://learn.microsoft.com/en-us/azure/well-architected/reliability/metrics) ✅ 2026-11-20\n- [Principles of Chaos Engineering](https://principlesofchaos.org/) ✅ 2026-11-20\n- [Google SRE Book: Testing for reliability](https://sre.google/sre-book/testing-reliability/) · [Workbook: Canarying releases](https://sre.google/workbook/canarying-releases/) ✅ 2026-11-20\n- [OpenFeature](https://openfeature.dev/) ✅ 2026-11-20 · [Argo Rollouts analysis](https://argo-rollouts.readthedocs.io/en/stable/features/analysis/) ✅ · [Dynatrace: Release validation (Site Reliability Guardian)](https://docs.dynatrace.com/docs/deliver/quality-gates) ✅\n- RPO/RTO per tier, game day cadence: rules of thumb ⚠️\n", "standard/23-measuring-effectiveness.md": "# 23 · Measuring effectiveness: is the observability working, and what did I change?\n\n> **In 30 seconds:** measure **outcomes**, not outputs. Not \"dashboards built\" but: are problems **found by monitoring\n> before customers** (detection), **fixed faster** (response), are pages **worth waking up for** (alert quality), is\n> every service **covered** (coverage), and does it cost what it should (cost)? Record a few fields on every incident,\n> compute the same KPIs every month, and keep an **impact log** of what you changed and what moved.\n\n## The scorecard\n\n\u003cdiv data-widget=\"viz\" data-chart=\"effectiveness-tiles\">\u003c/div>\n\n| Family | KPI | Definition | Target ⚠️ | Data from |\n|---|---|---|---|---|\n| **Detection** | % incidents detected by monitoring | Incidents whose first signal was an alert ÷ all incidents | > 80% | Incident record (`detected_by`) |\n| | MTTD (time to detect) | First alert − impact start | Down, minutes | Incident record, problem start |\n| **Response** | MTTA (time to acknowledge) | Acknowledged − alerted | \u003c 5 min (pages) | On-call tool |\n| | Time to mitigate | Users no longer affected − impact start | Down | Incident record |\n| | MTTR (define one \"R\") | Resolved − impact start (state which R: repair, recovery, resolve) | Down | Incident record / problem end |\n| **Alert quality** | Precision | Pages that needed action ÷ all pages | > 80–90% | On-call review |\n| | Recall | Incidents preceded by an alert ÷ incidents | > 80% | Incident record |\n| | Pages per on-call shift | Incidents per 12 h shift | ≤ 2 | On-call tool |\n| | Notifications per incident | Notifications ÷ incidents | ≈ 1 | On-call tool / Workflows |\n| **Coverage** | Services meeting the definition of done | Tier-1/2 services passing [03](03-definition-of-done.md) ÷ all | 100% tier 1 | Monaco/CI checks ([18](18-automation-and-scale.md)) |\n| | Services with an SLO | Tier-1 services with SLO + policy ÷ all tier-1 | 100% | SLO app |\n| | Time to onboard a new service | First deploy → fully observed | \u003c 1 day | Pipeline events |\n| **Reliability** | SLO compliance | Services within SLO over 28 days ÷ all with SLO | Up | SLO app |\n| | Repeat incidents | Incidents with the same contributing factor within 90 days | Down | Postmortems |\n| | Postmortem actions closed on time | Closed by due date ÷ due | > 80% | Backlog |\n| **Delivery** | DORA (frequency, lead time, CFR, recovery, rework) | [12](12-releases-and-dora.md) | Trend | SDLC events |\n| **Operations** | Toil % | Time on toil ÷ total ops time | \u003c 50% | Survey / ticket tags ([below](#toil)) |\n| | After-hours pages | Pages outside working hours per week | Down | On-call tool |\n| **Cost** | Observability cost per service / per team | Ingest + retention cost by `team` | Stable or down per unit of traffic | Billing metrics ([17](17-dynatrace-integration.md#cost-what-drives-the-bill-dps)) |\n| **Adoption** | Dashboards and alerts outside Git | Hand-made objects | 0 | Monaco diff |\n| | Maturity score | [02](02-maturity-model.md) per dimension | Up each quarter | Quarterly self-assessment |\n\n## Record these fields on every incident\n\nEvery KPI above comes from a handful of fields. Make them mandatory in the incident template.\n\n| Field | Example |\n|---|---|\n| Impact start | 14:05 (from data, not from the first message) |\n| Detected at · **detected by** | 14:09 · alert / customer / employee / synthetic |\n| Acknowledged at | 14:10 |\n| Mitigated at · resolved at | 14:14 · 14:19 |\n| Severity (SEV1–4) · service · tier | SEV2 · checkout · 1 |\n| Alert(s) that fired · runbook used (y/n) · runbook helpful (y/n) | release regression · y · y |\n| Change related? (deployment / config / none) | deployment 1.42.0 |\n| Postmortem link · actions | link · 2 actions |\n\n## How the trend should look\n\n\u003cdiv data-widget=\"viz\" data-chart=\"detection-trend\">\u003c/div>\n\n## Toil\n\nToil (SRE book): work that is **manual, repetitive, automatable, tactical, without enduring value, and grows with the service**. Google keeps it **under 50%** of SRE time; its surveys average about a third.\n\n| Step | How |\n|---|---|\n| Measure | Tag tickets as toil; quarterly survey \"% of your time on toil\"; count manual runbook steps executed |\n| Rank | By hours per month × people affected |\n| Remove | Top 3 per quarter: automate (Workflows, scripts), fix the cause, or delete the work |\n| Track | Toil % per quarter in the scorecard |\n\n## Cases: what \"effective\" looks like in numbers\n\n| Case | Before | Change | After | Evidence type |\n|---|---|---|---|---|\n| **Pipeline resilience** | 83% of logs lost in a 10-min backend outage | Persistent agent queue, retries without limit, backpressure | **0% lost**, also with an agent restart | ✅ Measured in the aks-observability lab |\n| **Label churn** | 470 new series per container restart, 50 labels | Label allow-list in the gateway | **18 new series**, 28 labels | ✅ Measured in the lab |\n| **Pipeline failure detection** | Dynatrace built-in \"monitoring unavailable\": ~24 min | Collector self-monitoring alerts | **4–11 min** | ✅ Measured in the lab |\n| **Alert noise** | ~9 pages/week, 12% acted on | Symptom/SLO alerts, guards, shadow mode, deleted 29 alerts | ~1 page/week, 90% acted on | Example ([case study](../examples/case-study.md)) |\n| **Detection** | 60% of incidents reported by customers, MTTD 40 min | Per-client and per-version alerts, synthetic journeys | 15% customer-reported, MTTD 4 min | Example ⚠️ |\n| **Coverage at scale** | 10% of services with an SLO, 2 weeks to onboard | `observability.yaml` + Monaco pipeline | 95% with SLO, onboard in \u003c 1 day | Example ⚠️ |\n| **Release safety** | Change failure rate 18%, recovery 45 min | Version split, deployment events, release validation, rollback runbook | CFR 8%, recovery 14 min | Example ⚠️ |\n| **Cost** | All metrics and histograms sent to Dynatrace | Gateway filter: drop unused histograms, label allow-list | −35% metric data points billed | Example ⚠️ |\n\nUse the same definitions before and after; otherwise the comparison means nothing.\n\n## Measuring yourself (impact as an SRE)\n\n| Practice | How |\n|---|---|\n| **Impact log** | One line per change: date · problem · what you did · **measurable result** · link (PR, postmortem, dashboard) |\n| **Baseline first** | Record the KPI *before* you change anything (pages/week, MTTD, cost, coverage) |\n| **Outcomes over outputs** | \"Pages −80%\" beats \"built 12 dashboards\"; \"MTTD 40 → 4 min\" beats \"added alerts\" |\n| **Quarterly review** | Scorecard + maturity rescore ([02](02-maturity-model.md)); pick next quarter's top 3 |\n| **Ask the users of your work** | On-call survey (sleep, trust in alerts, runbook quality); service teams' onboarding feedback |\n| **Tell it as a story** | Situation → task → action → result with numbers: for reviews, interviews and posts |\n\n```text\nImpact log\n2026-10-22 · Logs lost during backend outages (83%) · persistent queue + backpressure in collectors · 0% lost in chaos test · results/log-loss.md\n2026-10-20 · Collector failures invisible for ~24 min · self-monitoring alerts on otelcol_* · detected in 4–11 min · results/pipeline-faults.md\n```\n\n## Common mistakes\n\n| ❌ | ✅ |\n|---|---|\n| Counting outputs (dashboards, alerts, configs) | Outcomes: detection, response, quality, coverage, cost |\n| MTTR without saying which \"R\" | Define the start and end points once |\n| Using KPIs as targets for individuals or to rank teams | Trends per team; DORA warns against metrics as targets (Goodhart's law) |\n| Measuring only after the change | Baseline first |\n| A scorecard nobody looks at | Monthly review, quarterly decisions |\n\n## Sources\n\n- [Atlassian: MTTA, MTTR, MTBF](https://www.atlassian.com/incident-management/kpis/common-metrics) · [Choosing incident KPIs](https://www.atlassian.com/incident-management/kpis) ✅ 2026-11-20\n- [Google SRE Book: Eliminating toil](https://sre.google/sre-book/eliminating-toil/) · [Being on-call](https://sre.google/sre-book/being-on-call/) ✅\n- [Google SRE Workbook: Operational overload (pager budget)](https://sre.google/workbook/overload/) ✅ 2026-11-20\n- [DORA four keys](https://dora.dev/guides/dora-metrics-four-keys/) ✅\n- Lab cases: `~/projects/aks-observability/results/` (log-loss, cardinality, pipeline-faults) ✅ measured\n- Targets and the example cases: rules of thumb / illustrative ⚠️\n"}</script>

<script>
/* Architecture diagrams (inline SVG). Inlined by site/build.py after charts.js.
   Colors: orange = path to Dynatrace, blue = path to the open-source stack, gray = into the pipeline.
   Every arrow carries a label; wide diagrams scroll inside their own box on phones. */
(function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const COL = { n: 'var(--muted)', dt: 'var(--viz-s2)', os: 'var(--viz-s1)', key: 'var(--accent)' };
  let uid = 0;

  function make(host, title, caption, W, H, minW, draw) {
    const id = 'dg' + (++uid);
    const defs = `<defs>${Object.keys(COL).map(k => `<marker id="${id}-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:${COL[k]}"/></marker>`).join('')}</defs>`;
    const g = { box, arrow, text, pill, id };
    function box(x, y, w, h, title, sub = [], kind) {
      const stroke = kind ? COL[kind] : 'var(--line)';
      const sw = kind ? 1.75 : 1;
      return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" style="fill:var(--bg);stroke:${stroke};stroke-width:${sw}"/>` +
        `<text x="${x + 12}" y="${y + 21}" class="dg-t">${esc(title)}</text>` +
        sub.map((s, i) => `<text x="${x + 12}" y="${y + 38 + i * 15}" class="dg-s">${esc(s)}</text>`).join('') + '</g>';
    }
    function arrow(d, kind, label, lx, ly, opts = {}) {
      return `<path d="${d}" style="fill:none;stroke:${COL[kind]};stroke-width:1.75${opts.dash ? ';stroke-dasharray:5 4' : ''}" marker-end="url(#${id}-${kind})"/>` +
        (label ? text(lx, ly, label, opts.anchor || 'middle') : '');
    }
    function text(x, y, s, anchor = 'start', cls = 'dg-l') {
      return `<text x="${x}" y="${y}" text-anchor="${anchor}" class="${cls}">${esc(s)}</text>`;
    }
    function pill(x, y, s, kind) {
      const w = s.length * 6.3 + 20;
      return `<g><rect x="${x}" y="${y}" width="${w}" height="22" rx="11" style="fill:var(--viz-surface);stroke:${COL[kind] || 'var(--line)'};stroke-width:1"/><text x="${x + 10}" y="${y + 15}" class="dg-p">${esc(s)}</text></g>`;
    }
    host.className = 'viz diagram';
    host.innerHTML = `<figure><div class="viz-title">${esc(title)}</div><div class="dg-scroll"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(caption)}" style="min-width:${minW}px">${defs}${draw(g)}</svg></div><figcaption>${esc(caption)}</figcaption></figure>`;
  }

  function legend(g, y) {
    const items = [['dt', 'to Dynatrace'], ['os', 'to the open-source stack'], ['n', 'into the pipeline']];
    return items.map(([k, s], i) => { const x = 24 + i * 190; return `<line x1="${x}" y1="${y}" x2="${x + 28}" y2="${y}" style="stroke:${COL[k]};stroke-width:1.75"/>` + g.text(x + 36, y + 4, s); }).join('') +
      `<line x1="${24 + 3 * 190}" y1="${y}" x2="${24 + 3 * 190 + 28}" y2="${y}" style="stroke:var(--muted);stroke-width:1.75;stroke-dasharray:5 4"/>` + g.text(24 + 3 * 190 + 36, y + 4, 'query');
  }

  const D = {
    'dt-architecture'(host) {
      make(host, 'OpenTelemetry collects, Dynatrace analyzes',
        'Services are instrumented with OpenTelemetry (or OneAgent for selected tier-1 services). Agents read node data and buffer on disk, one cluster collector watches the Kubernetes API, and the gateway applies every rule once before exporting to Dynatrace. The ActiveGate adds Kubernetes monitoring and routes OneAgent traffic. A second backend is optional: one more exporter.',
        900, 420, 760, g => [
          `<rect x="8" y="30" width="652" height="350" rx="12" class="dg-frame"/>`, g.text(20, 22, 'Kubernetes cluster', 'start', 'dg-s'),
          g.box(24, 52, 208, 62, 'Tier-1 services (optional)', ['OneAgent code module']),
          g.box(24, 142, 208, 62, 'Services', ['OTel auto-instrumentation']),
          g.box(24, 232, 208, 62, 'Nodes', ['container logs · kubelet']),
          g.box(24, 318, 208, 50, 'Kubernetes API', ['objects · events']),
          g.box(270, 142, 170, 104, 'OTel agent', ['DaemonSet', 'k8sattributes · logs', 'disk buffer'], 'key'),
          g.box(270, 300, 170, 62, 'Cluster collector', ['1 replica', 'k8s_cluster · events']),
          g.box(470, 160, 170, 150, 'OTel gateway', ['identity · redact', 'label allow-list', 'to delta', 'self-monitoring'], 'key'),
          g.box(470, 46, 170, 76, 'ActiveGate', ['k8s monitoring', 'OneAgent routing']),
          g.box(740, 120, 150, 140, 'Dynatrace', ['Grail · Davis', 'SLOs · alerts', 'dashboards', 'Workflows'], 'dt'),
          g.box(740, 300, 150, 50, 'Second backend', ['optional']),
          g.arrow('M232,80 L468,80', 'dt', 'OneAgent traffic', 350, 72),
          g.arrow('M232,174 L268,178', 'n', 'OTLP', 250, 168),
          g.arrow('M232,262 L268,226', 'n', 'read', 250, 256),
          g.arrow('M232,343 L268,334', 'n', 'watch', 250, 330),
          g.arrow('M440,196 L468,204', 'n', 'OTLP', 454, 190),
          g.arrow('M440,330 L468,292', 'n', 'OTLP', 458, 322),
          g.arrow('M640,235 L738,205', 'dt', 'OTLP/HTTP · delta', 690, 210),
          g.arrow('M640,84 C690,84 690,140 738,148', 'dt', '443', 694, 100),
          g.arrow('M640,286 L738,322', 'n', 'optional', 690, 318, { dash: true }),
          `<line x1="24" y1="402" x2="52" y2="402" style="stroke:var(--viz-s2);stroke-width:1.75"/>`, g.text(60, 406, 'to Dynatrace'),
          `<line x1="190" y1="402" x2="218" y2="402" style="stroke:var(--muted);stroke-width:1.75"/>`, g.text(226, 406, 'inside the pipeline'),
          `<line x1="380" y1="402" x2="408" y2="402" style="stroke:var(--muted);stroke-width:1.75;stroke-dasharray:5 4"/>`, g.text(416, 406, 'optional'),
        ].join(''));
    },
    'dt-paths'(host) {
      make(host, 'Same service, two ways into Dynatrace',
        'The OpenTelemetry path adds one hop: your gateway. That hop is where you decide what is sent and paid for, and where the same data could also go to a second backend. The OneAgent path needs almost no work and gives more depth, but sends what the agent captures.',
        900, 384, 760, g => [
          g.text(20, 30, 'OneAgent path', 'start', 'dg-h'),
          g.box(20, 44, 180, 60, 'Service pod', ['+ OneAgent code module']),
          g.box(480, 44, 150, 60, 'ActiveGate', ['routing']),
          g.box(700, 44, 160, 60, 'Dynatrace', ['traces · code-level', 'topology · Davis'], 'dt'),
          g.arrow('M200,74 L478,74', 'dt', 'automatic deep traces, everything captured', 339, 66),
          g.arrow('M630,74 L698,74', 'dt', '', 0, 0),
          g.pill(20, 116, 'Billed: Full-Stack memory GiB-hours (trace + metric allowance included)', 'dt'),
          `<line x1="20" y1="160" x2="880" y2="160" class="dg-frame"/>`,
          g.text(20, 190, 'OpenTelemetry path', 'start', 'dg-h'),
          g.box(20, 204, 180, 60, 'Service pod', ['+ OTel auto-instrumentation']),
          g.box(250, 196, 180, 76, 'OTel agent → gateway', ['filter · drop labels', 'mask · sample · delta'], 'key'),
          g.box(700, 204, 160, 60, 'Dynatrace', ['what you chose to send'], 'dt'),
          g.box(250, 296, 180, 38, 'Second backend (optional)', []),
          g.arrow('M200,234 L248,234', 'n', 'OTLP', 224, 226),
          g.arrow('M430,234 L698,234', 'dt', 'OTLP/HTTP · delta (direct or via ActiveGate)', 564, 226),
          g.arrow('M340,272 L340,294', 'n', 'same stream', 348, 287, { anchor: 'start', dash: true }),
          g.text(340, 188, 'the control point', 'middle', 'dg-k'),
          g.pill(20, 352, 'Billed: metric data points (histogram = 10) · trace GiB · log GiB · no pod-hours', 'n'),

    },
    'sre-flow'(host) {
      make(host, 'Incident flow in Dynatrace: one alert source per symptom, one page',
        'Custom alerts and SLO burn-rate alerts cover service symptoms (per client, per version, business); Davis covers infrastructure and Kubernetes anomalies and groups related events into one problem. A Workflow routes the problem to the owning team, and the engineer then uses each view for the question it answers best.',
        900, 320, 760, g => [
          g.box(20, 40, 210, 62, 'Custom alerts · SLO burn', ['per client · per version', 'business · pipeline'], 'dt'),
          g.box(20, 140, 210, 62, 'Davis', ['k8s / infra anomalies', 'OOM · restarts'], 'dt'),
          g.box(300, 86, 170, 70, 'Problem + Workflow', ['grouped by Davis', 'route by team']),
          g.box(530, 94, 110, 54, 'On-call', ['one page']),
          g.box(700, 20, 190, 60, 'L1 service dashboard', ['who? which version?'], 'dt'),
          g.box(700, 100, 190, 60, 'Problems · Smartscape', ['what else broke?'], 'dt'),
          g.box(700, 180, 190, 60, 'Traces · logs', ['why, in the code?']),

<script>
/* Charts for the Observability Guide page. Inlined by site/build.py.
   Method: one y-axis per chart, thin marks (2px lines, <=24px bars), hairline solid grid, legend for 2+ series
   plus selective direct labels, text in ink tokens (never series color), status colors only for state and always
   with an icon/word, hover tooltip on every chart, "Show data" table view. All data here is EXAMPLE data. */
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- deterministic example data ----------
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const range = n => Array.from({ length: n }, (_, i) => i);
  const hhmm = mins => `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;

  // 12:00 → 18:00 every 5 min; deploy 14:02, rollback 14:14, recovered 14:19
  const T = range(73).map(i => 720 + i * 5);
  const reqs = T.map(t => +(78 + 22 * Math.sin((t - 720) / 360 * Math.PI) + (rnd() - 0.5) * 6).toFixed(1));
  const errs = T.map(t => {
    const base = 0.25 + (rnd() - 0.5) * 0.12;
    if (t >= 845 && t <= 855) return +(base + (t === 845 ? 1.6 : t === 850 ? 2.6 : 2.2)).toFixed(2);
    if (t === 860) return +(base + 0.6).toFixed(2);
    return +base.toFixed(2);
  });

  // ---------- tooltip ----------
  const tip = document.createElement('div');
  tip.className = 'viz-tip'; tip.hidden = true; tip.setAttribute('role', 'status');
  document.body.appendChild(tip);
  function showTip(html, cx, cy) {
    tip.innerHTML = html; tip.hidden = false;
    const r = tip.getBoundingClientRect();
    let x = cx + 14, y = cy + 14;
    if (x + r.width > innerWidth - 8) x = cx - r.width - 14;
    if (y + r.height > innerHeight - 8) y = cy - r.height - 14;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  }
  const hideTip = () => { tip.hidden = true; };

  // ---------- helpers ----------
  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const html = (tag, cls, inner) => { const n = document.createElement(tag); if (cls) n.className = cls; if (inner != null) n.innerHTML = inner; return n; };
  function dataTable(cols, rows) {
    return `<details class="viz-data"><summary>Show data</summary><div class="tw"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  }
  function card(host, title, sub) {
    host.className = 'viz';
    host.innerHTML = `<div class="viz-head"><div class="viz-title">${esc(title)}</div>${sub ? `<div class="viz-sub">${esc(sub)}</div>` : ''}</div><div class="viz-body"></div><div class="viz-foot"><span class="viz-example">Example data</span></div>`;
    return host.querySelector('.viz-body');
  }
  function legend(items) {
    return `<div class="viz-legend">${items.map(i => `<span><i class="key ${i.kind || 'line'}" style="--c:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`;
  }
  function responsive(node, draw) {
    let last = 0;
    const run = () => { const w = Math.round(node.clientWidth); if (w && Math.abs(w - last) > 4) { last = w; draw(w); } };
    if ('ResizeObserver' in window) new ResizeObserver(run).observe(node);
    run();
  }
  const niceMax = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return ([1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(s => n <= s)) * p; };

  // ---------- line chart (one y-axis) ----------
  function lineChart(host, cfg) {
    const H = cfg.height || 170;
    const api = { setHover: () => {}, clear: () => {} };
    responsive(host, W => {
      host.innerHTML = '';
      const m = { l: 46, r: cfg.labelRoom ?? 92, t: 10, b: 22 };
      const n = cfg.x.length, iw = W - m.l - m.r, ih = H - m.t - m.b;
      const all = cfg.series.flatMap(s => s.values.filter(v => v != null));
      const yMax = cfg.yMax || niceMax(Math.max(...all) * 1.1);
      const X = i => m.l + (n === 1 ? 0 : i * iw / (n - 1));
      const Y = v => m.t + (1 - v / yMax) * ih;
      const svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': cfg.aria || cfg.series.map(s => s.name).join(', ') }, host);
      // bands (alert zones) behind everything
      (cfg.bands || []).forEach(b => {
        el('rect', { x: m.l, width: iw, y: Y(Math.min(b.to, yMax)), height: Y(b.from) - Y(Math.min(b.to, yMax)), fill: 'var(--viz-band)', class: 'band' }, svg);
        const t = el('text', { x: m.l + 6, y: Y(Math.min(b.to, yMax)) + 13, class: 'viz-note' }, svg); t.textContent = b.label;
      });
      // grid + y ticks
      const ticks = cfg.yTicks || 4;
      for (let k = 0; k <= ticks; k++) {
        const v = yMax * k / ticks, y = Y(v);
        el('line', { x1: m.l, x2: m.l + iw, y1: y, y2: y, class: k === 0 ? 'viz-axis' : 'viz-grid' }, svg);
        const t = el('text', { x: m.l - 6, y: y + 4, 'text-anchor': 'end', class: 'viz-tick' }, svg); t.textContent = cfg.yFmt(v, true);
      }
      // x labels
      const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 70))));
      for (let i = 0; i < n; i += every) { const t = el('text', { x: X(i), y: H - 6, 'text-anchor': 'middle', class: 'viz-tick' }, svg); t.textContent = cfg.x[i]; }
      // reference lines
      (cfg.refs || []).forEach(r => {
        el('line', { x1: m.l, x2: m.l + iw, y1: Y(r.y), y2: Y(r.y), class: 'viz-ref' }, svg);
        const t = r.inside
          ? el('text', { x: m.l + 6, y: Y(r.y) - 5, class: 'viz-note' }, svg)
          : el('text', { x: m.l + iw + 6, y: Y(r.y) + 4, class: 'viz-note' }, svg);
        t.textContent = r.label;
      });
      // markers (deploy, rollback)
      (cfg.markers || []).forEach(mk => {
        el('line', { x1: X(mk.i), x2: X(mk.i), y1: m.t, y2: m.t + ih, class: 'viz-marker' }, svg);
        const left = mk.anchor === 'end';
        const t = el('text', { x: X(mk.i) + (left ? -4 : 4), y: m.t + 10, 'text-anchor': left ? 'end' : 'start', class: 'viz-note' }, svg); t.textContent = mk.label;
      });
      // series
      cfg.series.forEach(s => {
        let d = '', a = '', pen = false, first = -1, lastI = -1;
        s.values.forEach((v, i) => {
          if (v == null) { if (pen && s.area) a += `L${X(lastI)},${Y(0)}Z`; pen = false; return; }
          if (!pen) { d += `M${X(i)},${Y(v)}`; if (s.area) a += `M${X(i)},${Y(0)}L${X(i)},${Y(v)}`; first = first < 0 ? i : first; }
          else { d += `L${X(i)},${Y(v)}`; if (s.area) a += `L${X(i)},${Y(v)}`; }
          pen = true; lastI = i;
        });
        if (pen && s.area) a += `L${X(lastI)},${Y(0)}Z`;
        if (s.area) el('path', { d: a, fill: s.color, 'fill-opacity': 0.1, stroke: 'none' }, svg);
        el('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-dasharray': s.dash ? '6 4' : 'none' }, svg);
        if (lastI >= 0 && cfg.endDots !== false) {
          el('circle', { cx: X(lastI), cy: Y(s.values[lastI]), r: 4, fill: s.color, stroke: 'var(--viz-surface)', 'stroke-width': 2 }, svg);
          if (cfg.labelRoom !== 0 && s.label !== false) {
            const t = el('text', { x: X(lastI) + 8, y: Y(s.values[lastI]) + (s.dy || 4), class: 'viz-label' }, svg);
            t.textContent = s.endLabel || (cfg.series.length === 1 ? cfg.yFmt(s.values[lastI]) : `${s.name} ${cfg.yFmt(s.values[lastI])}`);
          }
        }
      });
      // hover layer
      const cross = el('g', { class: 'viz-cross', visibility: 'hidden' }, svg);
      const vline = el('line', { y1: m.t, y2: m.t + ih }, cross);
      const dots = cfg.series.map(s => el('circle', { r: 4, fill: s.color, stroke: 'var(--viz-surface)', 'stroke-width': 2 }, cross));
      const hit = el('rect', { x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent' }, svg);
      const setHover = (i, cx, cy, withTip) => {
        if (i == null) { cross.setAttribute('visibility', 'hidden'); return; }
        cross.setAttribute('visibility', 'visible');
