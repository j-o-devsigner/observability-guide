        markers: [{ i: 13, label: 'now', anchor: 'end' }, { i: cross, label: `crosses N+2 in ${cross - 13} weeks` }] });
    },
    'capacity-tiles'(host) {
      tiles(host, 'checkout · capacity review', 'Monthly, tier-1 services', [
        { label: 'Peak (30 days)', value: '1,050', unit: ' req/s', delta: '+6% vs previous month', good: false, spark: [880, 900, 910, 930, 950, 960, 980, 990, 1000, 1020, 1040, 1050] },
        { label: 'Tested capacity', value: '1,400', unit: ' req/s', note: '14 pods × 100 req/s within the SLO (load test, 2 weeks ago)' },
        { label: 'Headroom left to the N+2 limit', value: '13', unit: '%', meter: 13, meterStatus: 'warn', note: 'N+2 limit = 12 pods = 1,200 req/s' },
        { label: 'Forecast to cross N+2', value: '9', unit: ' weeks', note: 'Action: new load test + node pool in 6 weeks' },
      ]);
    },
    'queue-flow'(host) {
      const body = card(host, 'orders queue · arrival vs processing, and the backlog', 'Consumers capped at 5 (500 msg/s); a traffic burst from minute 15 to 35');
      body.innerHTML = legend([{ name: 'Arrival rate', color: 'var(--viz-s1)' }, { name: 'Processing rate', color: 'var(--viz-s2)' }]) +
        '<div class="viz-mini">Messages per second</div><div class="c1"></div><div class="viz-mini">Backlog (messages) · wait ≈ backlog ÷ processing rate</div><div class="c2"></div>';
      const mins = range(61); let backlog = 0; const arr = [], proc = [], back = [];
      mins.forEach(m => {
        const a = Math.round((m >= 15 && m <= 35 ? 680 : 400) + (rnd() - 0.5) * 30);
        const p = Math.min(500, a + backlog / 60);
        backlog = Math.max(0, backlog + (a - p) * 60);
        arr.push(a); proc.push(Math.round(p)); back.push(Math.round(backlog));
      });
      body.insertAdjacentHTML('beforeend', dataTable(['Minute', 'Arrival msg/s', 'Processing msg/s', 'Backlog', 'Wait (s)'],
        mins.filter(m => m % 3 === 0).map(m => [m, arr[m], proc[m], back[m], Math.round(back[m] / Math.max(proc[m], 1))])));
      const x = mins.map(m => `${m} min`), markers = [{ i: 15, label: 'burst', anchor: 'end' }, { i: 35, label: 'burst ends' }];
      let a, b;
      a = lineChart(body.querySelector('.c1'), { x, height: 150, yMax: 800, labelRoom: 120, markers,
        yFmt: (v, t) => t ? Math.round(v) : Math.round(v) + ' msg/s',
        series: [{ name: 'Arrival', color: 'var(--viz-s1)', values: arr, dy: 16 }, { name: 'Processing', color: 'var(--viz-s2)', values: proc, dy: -6 }],
        onHover: i => b && b.setHover(i) });
      b = lineChart(body.querySelector('.c2'), { x, height: 140, labelRoom: 120, markers, yMax: 250000, yTicks: 5,
        yFmt: (v, t) => t ? (v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v)) : Math.round(v).toLocaleString() + ' msgs',
        series: [{ name: 'Backlog', color: 'var(--viz-s1)', values: back, area: true }],
        onHover: i => a && a.setHover(i) });
    },
    'severity-matrix'(host) {
      const body = card(host, 'Incident severity = service tier × user impact', 'Starting point; when unsure, pick the higher level');
      const cols = ['Most users down, data loss or security', 'Many users, or one SLA client', 'Some users, workaround exists', 'No user impact yet'];
      const rows = [['Tier 1', [1, 2, 3, 4]], ['Tier 2', [2, 3, 3, 4]], ['Tier 3', [3, 3, 4, 4]]];
      const cls = { 1: 'sev1', 2: 'sev2', 3: 'sev3', 4: 'sev4' }, name = { 1: 'Critical', 2: 'Major', 3: 'Minor', 4: 'Low' };
      body.innerHTML = `<div class="tw sevm"><table><thead><tr><th>Service tier</th>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(([t, v]) =>
        `<tr><th scope="row">${t}</th>${v.map((n, i) => `<td class="${cls[n]}" title="${t} · ${esc(cols[i])} → SEV${n}"><b>SEV${n}</b><span>${name[n]}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    },
    'effectiveness-tiles'(host) {
      tiles(host, 'Observability effectiveness · this quarter', 'Same definitions every quarter; compare with the previous one', [
        { label: 'Incidents detected by monitoring', value: '86', unit: '%', delta: 'from 41%', good: true, spark: [41, 45, 52, 58, 63, 70, 74, 79, 82, 84, 85, 86] },
        { label: 'Time to detect (median)', value: '4', unit: ' min', delta: 'from 38 min', good: true, dir: 'down', spark: [38, 35, 31, 26, 20, 15, 12, 9, 7, 6, 5, 4] },
        { label: 'Pages acted on (precision)', value: '89', unit: '%', delta: 'from 14%', good: true, spark: [14, 18, 25, 36, 48, 59, 67, 74, 80, 84, 87, 89] },
        { label: 'Pages per on-call shift', value: '0.6', delta: 'from 4.1', good: true, dir: 'down', spark: [4.1, 3.8, 3.2, 2.7, 2.1, 1.6, 1.3, 1.0, 0.9, 0.8, 0.7, 0.6] },
        { label: 'Tier-1 services meeting DoD', value: '92', unit: '%', meter: 92, meterStatus: 'good', note: '11 of 12 tier-1 services' },
        { label: 'Toil', value: '31', unit: '%', delta: 'from 55%', good: true, dir: 'down', spark: [55, 54, 50, 48, 45, 42, 40, 37, 35, 33, 32, 31] },
      ]);
    },
    'detection-trend'(host) {
      const body = card(host, 'Who finds problems first, and how fast', 'Quarterly; example of an observability program that works');
      const q = ['Q1 25', 'Q2 25', 'Q3 25', 'Q4 25', 'Q1 26', 'Q2 26', 'Q3 26', 'Q4 26'];
      const mon = [41, 48, 55, 63, 71, 78, 83, 86], mttd = [38, 31, 24, 17, 11, 8, 5, 4];
      body.innerHTML = '<div class="viz-mini">Incidents detected by monitoring (%)</div><div class="c1"></div><div class="viz-mini">Median time to detect (minutes)</div><div class="c2"></div>' +
        dataTable(['Quarter', '% detected by monitoring', 'Median MTTD (min)'], q.map((x, i) => [x, mon[i] + '%', mttd[i]]));
      let a, b;
      a = lineChart(body.querySelector('.c1'), { x: q, height: 140, yMax: 100, labelRoom: 70, yFmt: (v, t) => Math.round(v) + '%',
        series: [{ name: 'detected by monitoring', color: 'var(--viz-s1)', values: mon }], refs: [{ y: 80, label: 'target 80%', inside: true }],
        onHover: i => b && b.setHover(i) });
      b = lineChart(body.querySelector('.c2'), { x: q, height: 130, yMax: 40, labelRoom: 70, yFmt: (v, t) => t ? Math.round(v) : Math.round(v) + ' min',
        series: [{ name: 'MTTD', color: 'var(--viz-s1)', values: mttd, area: true }], onHover: i => a && a.setHover(i) });
    },
    'layers'(host) {
      host.className = 'viz layers';
      const L = [['Business', 'Is the business doing well?', 'Custom KPIs', 'orders/min · revenue · price vs goal'],
                 ['User experience', 'Can users actually use it?', 'Synthetic + RUM', 'external checks · journey success'],
                 ['Service', 'Is my endpoint healthy?', 'RED · Golden Signals', 'req/s · error % · p99 · saturation'],
                 ['Resources', 'Is something underneath saturated?', 'USE', 'throttling · memory vs limit · queues']];
      host.innerHTML = `<div class="lay-grid"><div class="lay-axis"><span>symptoms<br>alert here</span><span>causes<br>diagnose here</span></div><div class="lay-stack">${L.map(l => `<div class="lay"><b>${l[0]}</b><span class="lay-q">${l[1]}</span><span class="lay-m">${l[2]}</span><span class="lay-ex">${l[3]}</span></div>`).join('')}</div>
        <div class="lay-delivery"><b>Delivery</b><span>DORA + release markers</span><span class="lay-ex">"What changed?" crosses every layer</span></div></div>`;
    },
  };

  window.ObsCharts = { render(node) { const f = C[node.dataset.chart] || (window.ObsDiagrams && window.ObsDiagrams[node.dataset.chart]); if (f) f(node); else node.textContent = 'Unknown chart: ' + node.dataset.chart; } };
})();

<script>
(function(){
  const docs = JSON.parse(document.getElementById('docs').textContent);
  const content = document.getElementById('content');
  const ghslug = t => t.toLowerCase().replace(/<[^>]+>/g,'').replace(/&[a-z]+;/g,'').trim().replace(/[^\w\- ]+/g,'').replace(/ /g,'-');

  // ---------- render ----------
  docs.forEach(d => {
    const art = document.createElement('article');
    art.id = d.slug;
    if (window.marked) {
      const r = new marked.Renderer();
      r.heading = (text, level, raw) => level === 1
        ? `<h1>${text}</h1>`
        : `<h${level} id="${d.slug}--${ghslug(raw)}">${text}</h${level}>`;
      art.innerHTML = `<div class="src">${d.path}</div>` + marked.parse(d.md, {renderer: r, mangle: false, headerIds: false});
    } else {
      art.innerHTML = `<div class="src">${d.path}</div><pre class="fallback"></pre>`;
      art.querySelector('pre').textContent = d.md;
    }
    art.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tw'; t.replaceWith(w); w.appendChild(t); });
    art.querySelectorAll('pre').forEach(p => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'copy'; b.textContent = 'Copy';
      b.addEventListener('click', () => {
        const txt = p.querySelector('code') ? p.querySelector('code').innerText : p.innerText;
        navigator.clipboard.writeText(txt).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1400); })
          .catch(() => { const r = document.createRange(); r.selectNodeContents(p); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Press Ctrl+C'; });
      });
      p.appendChild(b);
    });
    content.appendChild(art);
  });

  // ---------- table of contents + search ----------
  const toc = document.getElementById('toc');
  function buildToc(filter){
    const q = (filter || '').trim().toLowerCase();
    let html = '', group = null, open = false;
    docs.forEach(d => {
      let hits = 0;
      if (q) { const m = d.md.toLowerCase().split(q).length - 1; if (!m) return; hits = m; }
      if (d.group !== group) { if (open) html += '</ul>'; html += `<div class="grp">${d.group}</div><ul>`; group = d.group; open = true; }
      html += `<li><a href="#${d.slug}" data-s="${d.slug}">${d.title.replace(/</g,'&lt;')}${hits ? `<span class="hits">${hits}</span>` : ''}</a></li>`;
    });
    if (open) html += '</ul>';
    toc.innerHTML = html || '<p class="ver" style="margin:8px">No matches</p>';
  }
  buildToc('');
  document.getElementById('search').addEventListener('input', e => buildToc(e.target.value));
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(en => {
      if (en.isIntersecting) toc.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.s === en.target.id));
    }), {rootMargin: '-10% 0px -80% 0px'});
    content.querySelectorAll('article').forEach(a => io.observe(a));
  }

  // ---------- widgets ----------
  const store = { get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(_) { return d; } },
                  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(_) {} } };
  const nextTable = el => { let n = el.nextElementSibling; while (n && !n.querySelector?.('table') && n.tagName !== 'TABLE') n = n.nextElementSibling; return n ? (n.tagName === 'TABLE' ? n : n.querySelector('table')) : null; };
  const num = id => parseFloat(document.getElementById(id).value) || 0;

  const W = {
    'viz'(el){ if (window.ObsCharts) ObsCharts.render(el); },
    'alert-type-picker'(el){
      const qs = [['each','Does every single occurrence matter on its own?',[['1','Yes'],['0','No']],'0'],
                  ['absent','Is the problem that something stops happening?',[['1','Yes'],['0','No']],'0'],
                  ['slo','Is there an SLO for this flow?',[['1','Yes'],['0','No']],'0'],
                  ['traffic','Traffic level for this segment or client',[['high','High'],['low','Low / variable']],'high']];
      const st = {}; qs.forEach(q => st[q[0]] = q[3]);
      el.className = 'tool';
      el.innerHTML = '<h4>Which alert type? Answer four questions</h4>' + qs.map(q =>
        `<div class="qrow"><span>${q[1]}</span><div class="seg" data-q="${q[0]}">${q[2].map(o => `<button type="button" data-v="${o[0]}" aria-pressed="${o[0]===q[3]}">${o[1]}</button>`).join('')}</div></div>`).join('') +
        '<div class="verdict" aria-live="polite"></div>';
      const out = el.querySelector('.verdict');
      function verdict(){
        let t, d, s;
        if (st.absent === '1') { t = 'Absence alert'; d = 'Alert when the count is zero (<code>sum(increase(x_total[15m])) == 0</code>) or the series is missing (<code>absent()</code>). Limit it to hours when traffic is expected.'; s = 'page if it is a key flow'; }
        else if (st.each === '1') { t = 'Count alert'; d = 'Every event matters: <code>increase(x_total[5m]) &gt; 0</code>. Put the count in the summary so on-call sees the impact.'; s = 'page for money or data loss, otherwise ticket'; }
        else if (st.slo === '1') { t = 'SLO burn-rate alert'; d = 'Multi-window burn rate (14.4× over 1h/5m, 6× over 6h/30m)' + (st.traffic === 'low' ? ', <b>plus a minimum-traffic guard</b> and longer windows for this segment.' : '.'); s = 'page for fast burn, ticket for slow burn'; }
        else { t = st.traffic === 'low' ? 'Ratio + minimum count' : 'Ratio (percentage)'; d = st.traffic === 'low' ? 'Error % above the threshold <b>and</b> at least N errors, so one failed request at night pages nobody. Consider defining an SLO.' : 'Error % above the threshold over 5–10m with <code>for:</code>. Keep a minimum-count guard anyway, and consider an SLO.'; s = 'page if users feel it'; }
        out.innerHTML = `<b>${t}</b><p style="margin:4px 0 0">${d}</p><p style="margin:4px 0 0;font-size:13px;color:var(--muted)">Severity: ${s}</p>`;
      }
      el.addEventListener('click', e => { const b = e.target.closest('.seg button'); if (!b) return; const seg = b.parentElement;
        seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); st[seg.dataset.q] = b.dataset.v; verdict(); });
      verdict();
    },
    'low-traffic-checker'(el){
      el.className = 'tool';
      el.innerHTML = `<h4>Low-traffic check: does this alert fire?</h4><div class="fields">
        <label for="lt-req">Requests in window<input id="lt-req" type="number" min="0" value="40"></label>
        <label for="lt-err">Errors in window<input id="lt-err" type="number" min="0" value="6"></label>
        <label for="lt-thr">Ratio threshold %<input id="lt-thr" type="number" min="0" step="0.1" value="5"></label>
        <label for="lt-min">Minimum errors<input id="lt-min" type="number" min="0" value="20"></label></div>
        <div class="outs"><div class="out"><small>Error ratio</small><strong id="lt-ratio">–</strong></div>
        <div class="out"><small>Ratio only</small><strong id="lt-a">–</strong></div>
        <div class="out"><small>Ratio + min count</small><strong id="lt-b">–</strong></div></div>`;
      const fire = '<span class="pill p-page">fires</span>', quiet = '<span class="pill p-ok">silent</span>';
      function calc(){ const r = num('lt-req'), e = Math.min(num('lt-err'), r), ratio = r ? e / r * 100 : 0;
        document.getElementById('lt-ratio').textContent = r ? ratio.toFixed(1) + '%' : '–';
        const a = r > 0 && ratio > num('lt-thr');
        document.getElementById('lt-a').innerHTML = a ? fire : quiet;
        document.getElementById('lt-b').innerHTML = (a && e > num('lt-min')) ? fire : quiet; }
      el.addEventListener('input', calc); calc();
    },
    'burn-calculator'(el){
      el.className = 'tool';
      el.innerHTML = `<h4>Burn-rate calculator</h4><div class="fields">
        <label for="br-slo">SLO target %<input id="br-slo" type="number" step="0.01" value="99.9"></label>
        <label for="br-days">SLO period (days)<input id="br-days" type="number" value="30"></label>
        <label for="br-rate">Burn rate<input id="br-rate" type="number" step="0.1" value="14.4"></label>
        <label for="br-win">Long window (hours)<input id="br-win" type="number" step="0.5" value="1"></label></div>
        <div class="outs"><div class="out"><small>Error budget</small><strong id="br-budget">–</strong></div>
        <div class="out"><small>Alert when error ratio &gt;</small><strong id="br-thr">–</strong></div>
        <div class="out"><small>Budget gone in</small><strong id="br-exh">–</strong></div>
        <div class="out"><small>Budget used in window</small><strong id="br-used">–</strong></div></div>`;
      const trim = x => x.toFixed(3).replace(/\.?0+$/, '');
      const fmtH = h => !isFinite(h) ? '–' : h >= 48 ? (h / 24).toFixed(1) + ' days' : h.toFixed(1) + ' h';
      function calc(){ const slo = num('br-slo'), days = num('br-days'), rate = num('br-rate'), win = num('br-win'), budget = Math.max(0, 100 - slo);
        document.getElementById('br-budget').textContent = trim(budget) + '%';
        document.getElementById('br-thr').textContent = trim(rate * budget) + '%';
        document.getElementById('br-exh').textContent = rate > 0 ? fmtH(days * 24 / rate) : '–';
        document.getElementById('br-used').textContent = days > 0 ? (rate * win / (days * 24) * 100).toFixed(1) + '%' : '–'; }
      el.addEventListener('input', calc); calc();
    },
    'table-filter'(el){
      const t = nextTable(el); if (!t) return;
      el.className = 'filterbar';
      el.innerHTML = '<input class="filter" id="case-filter" type="search" placeholder="Filter rows (e.g. count, page, disk)" aria-label="Filter table rows"><small></small>';
      const rows = [...t.tBodies[0].rows], info = el.querySelector('small');
      const run = () => { const q = el.querySelector('input').value.trim().toLowerCase(); let n = 0;
        rows.forEach(r => { const show = !q || r.textContent.toLowerCase().includes(q); r.hidden = !show; n += show; });
        info.textContent = `${n} / ${rows.length}`; };
      el.addEventListener('input', run); run();
    },
    'checklist'(el){
      const t = nextTable(el); if (!t) return;
      t.classList.add('chk');
      const key = 'obs-guide-checklist', saved = store.get(key, {});
      const rows = [...t.tBodies[0].rows], prog = document.createElement('div'); prog.className = 'progress'; el.appendChild(prog);
      const update = () => { const n = rows.filter(r => r.classList.contains('done')).length; prog.textContent = `${n} / ${rows.length} covered (saved in this browser only)`; };
      rows.forEach((r, i) => {
        const id = 'dod-' + (r.cells[0].textContent.trim() || i);
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = id; cb.checked = !!saved[id];
        cb.setAttribute('aria-label', 'Covered: ' + (r.cells[1] ? r.cells[1].textContent.trim() : id));
        r.classList.toggle('done', cb.checked);
        cb.addEventListener('change', () => { saved[id] = cb.checked; r.classList.toggle('done', cb.checked); store.set(key, saved); update(); });
        r.cells[0].prepend(cb);
      });
      update();
    }
  };
  content.querySelectorAll('[data-widget]').forEach(el => { const f = W[el.dataset.widget]; if (f) f(el); });

  // jump to the hash after rendering (content did not exist at load)
  if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
})();
</script>
<script>
(function () {
  const btn = document.getElementById('dl'), note = document.getElementById('dl-note'), NAME = 'observability-guide-v0.14.zip';
  let saver = null;
  function loadZip() {
    return window.JSZip ? Promise.resolve(window.JSZip) : new Promise((ok, ko) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      s.onload = () => ok(window.JSZip); s.onerror = ko; document.head.appendChild(s);
    });
  }
  async function build() {
    const Z = await loadZip(), zip = new Z(), root = zip.folder('observability-guide');
    const files = JSON.parse(document.getElementById('src').textContent);
    for (const [p, body] of Object.entries(files)) root.file(p, body);
    return zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  }
  btn.addEventListener('click', async () => {
    const label = btn.textContent; btn.disabled = true; btn.textContent = 'Preparing…';
    try {
      const blob = await build();
      if (saver) {
        await saver.save({ filename: NAME, data: blob });
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = NAME;
        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      }
      btn.textContent = label;
      if (!saver) { note.hidden = false; note.textContent = 'Nothing downloaded? Open the page in its own browser tab and try again.'; }
    } catch (e) {
      btn.textContent = label;
      if (!(e && e.code === 'declined')) { note.hidden = false; note.textContent = 'Download blocked here. Open the page in its own browser tab and try again.'; }
    } finally { btn.disabled = false; }
  });
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(d => { if (d) saver = d; }).catch(() => {});
  }
})();
</script>
