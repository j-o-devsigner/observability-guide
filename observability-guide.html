rve/digital-experience/new-rum-experience/experience-vitals) ✅ 2026-11-20\n- [OpenTelemetry JS: Browser](https://opentelemetry.io/docs/languages/js/getting-started/browser/): experimental ✅ 2026-11-20\n- [Grafana Faro](https://grafana.com/oss/faro/) (open-source alternative) ✅ 2026-11-20\n- SLO targets, synthetic location rule, Apdex target: rules of thumb ⚠️\n", "standard/08-kubernetes-cluster.md": "# 08 · Kubernetes cluster\n\n> **In 30 seconds:** \"down\" has levels (scheduled → running → ready → serving → users happy). Page on the user level,\n> use the others to find the cause. The checklist below says what to measure at each level, which OpenTelemetry\n> component produces it (templates in [collector/](../collector/)), and what Dynatrace gives natively.\n> Metric names are OTel receiver names as they arrive in Dynatrace; \"lab\" = seen in the aks-observability lab.\n\n## \"Down\" has levels\n\n| Level | Question | Signal | Example |\n|---|---|---|---|\n| 1. Exists | Is it scheduled? | Pod phase | Pod stuck in `Pending` (no capacity) |\n| 2. Running | Is the process alive? | Container state, restarts | `CrashLoopBackOff`, `OOMKilled` |\n| 3. Ready | Does Kubernetes send it traffic? | Readiness, ready endpoints | Running but readiness probe failing |\n| 4. Serving | Does it answer correctly? | RED ([04](04-endpoint-coverage.md)) | 5xx, slow responses |\n| 5. Users happy | Is the experience OK? | SLOs, synthetic checks ([10](10-slos-and-error-budgets.md)) | Budget burning |\n\n⚠️ `up == 1` only means \"Prometheus could scrape it\", not that the service works.\n\n## Coverage checklist\n\n| Level | What to measure | OTel source → metric / signal | Dynatrace native (OneAgent / ActiveGate) | Alert? |\n|---|---|---|---|---|\n| **Cluster** | Nodes ready / pressure | `k8s_cluster` → `k8s.node.condition_ready`, `…_memory_pressure`, `…_disk_pressure` (`node_conditions_to_report`) | Kubernetes app, node conditions | Yes (ticket; page if capacity at risk) |\n| | Pods that can't schedule | `k8s_cluster` → `k8s.pod.phase` = Pending + `k8sobjects` events `FailedScheduling` | Workload / pod status, events | Yes, > 10 min |\n| | Requests vs allocatable (room to scale) | `k8s_cluster` → `k8s.node.allocatable_cpu/memory`; `kubeletstats` → requests utilization | Cluster utilization views | Dashboard + capacity review |\n| **Control plane** | API server errors and latency | `prometheus` receiver on the API server metrics (self-managed clusters; AKS/EKS expose less) | Kubernetes API monitoring via ActiveGate | Ticket |\n| | DNS failures / latency | `prometheus` receiver on CoreDNS | Partial | Ticket |\n| **Node** | CPU, memory, disk, network | `kubeletstats` → `k8s.node.cpu.usage`, `k8s.node.memory.working_set`, `k8s.node.filesystem.available`, `k8s.node.network.io` (lab) | OneAgent host metrics | Predict disk full (page if \u003c 4h) |\n| **Workload** | Available vs desired replicas | `k8s_cluster` → `k8s.deployment.available`, `k8s.deployment.desired` (lab) | Workload health | Yes: 0 available = down |\n| | Rollout stuck | Deployment generation / events | Events | Ticket |\n| | HPA at max | `k8s_cluster` → `k8s.hpa.current_replicas`, `k8s.hpa.max_replicas` | Workload metrics | Ticket |\n| | Jobs failed | `k8s_cluster` → `k8s.job.failed_pods` | Events | Ticket ([06](06-workload-types.md)) |\n| **Pod / container** | Restarts | `k8s_cluster` → `k8s.container.restarts` (lab) | Container restarts anomaly | Yes, burst |\n| | OOMKilled | `k8s_cluster` resource attr `k8s.container.status.last_terminated_reason` (lab) | **OOM problem in ~1 min** (lab) | Yes |\n| | Memory vs limit, CPU vs request | `kubeletstats` → `k8s.container.memory_limit_utilization`, `k8s.container.cpu_request_utilization` (lab) | Container metrics | Dashboard; alert on OOM, not on %. |\n| | CPU throttling | Not in `kubeletstats`: scrape cAdvisor with the `prometheus` receiver (`container_cpu_cfs_throttled_periods_total`) | Container throttling | Dashboard |\n| | Image pull / crash loop | `k8sobjects` events (`BackOff`, `Failed`) (lab) | Events + problems | Yes |\n| **Storage** | Volume space | `kubeletstats` → `k8s.volume.available`, `k8s.volume.capacity` | PV metrics | Predict full |\n| **Network** | Pod network I/O, errors | `kubeletstats` → `k8s.pod.network.io`, `k8s.pod.network.errors` | Network metrics | Dashboard |\n| | Flows, drops between workloads | CNI metrics (Cilium/Hubble) via `prometheus` receiver | OneAgent network | Ticket on drops |\n| **Events** | Kubernetes events as logs | `k8sobjects` → logs (lab) | Kubernetes events | Via event rules |\n| **Applications** | RED per service, route, client, version | App OTLP (auto-instrumentation) → `http.server.request.duration` (lab) | OneAgent services (routes need key requests: `NON_KEY_REQUESTS`, lab) | SLO burn ([10](10-slos-and-error-budgets.md)) |\n| | Dependencies (DB, queue, HTTP clients) | `db.client.operation.duration`, `messaging.*`, `http.client.request.duration` (lab: names the slow DB) | Traces / service flow | Via SLO + traces |\n| | Logs with trace context | `filelog` + JSON parsing + `trace_id` (lab) | OneAgent log module | Error-rate rules |\n| **Synthetics** | Internal endpoint up | `httpcheck` → `httpcheck.status` (lab) | Synthetic HTTP monitors | Yes |\n| **Pipeline** | Collectors healthy, no data loss | Internal telemetry `otelcol_*` → Dynatrace ([16](16-collector-templates.md#self-monitoring)) | ActiveGate / OneAgent self-monitoring | Yes, tested |\n\n## What OneAgent does that OTel needs a setting for\n\n| OneAgent does automatically | OTel equivalent |\n|---|---|\n| Detects the language and injects | Annotate the namespace with the language ([15](15-opentelemetry-practices.md)) |\n| Kubernetes problems (OOM, crash loops) out of the box | Write the alerts on `k8s_cluster` data ([16](16-collector-templates.md), Dynatrace anomaly detectors) |\n| Service names and topology | `service.name` via Operator; `k8s.*` attributes for topology links |\n| Stable series across restarts (0 new series, lab) | Label allow-list in the gateway (18 new series, lab) |\n| Log buffering during outages | Persistent queue on the agent (lab: both 0 lost) |\n\n## What OTel does better (lab)\n\n| OTel | Why it matters |\n|---|---|\n| Per-route RED by default (`http.route`) | No key-request configuration |\n| DB client latency metric names the dependency | Root cause without traces |\n| Masking before data leaves the cluster | Compliance |\n| Collector failure alerts in 4–11 min vs ~24 min | Faster detection of blind spots |\n\n## Minimum viable cluster monitoring (start here)\n\n| # | Signal | Template |\n|---|---|---|\n| 1 | Node ready + pressure, pods pending | cluster.yaml |\n| 2 | Deployment available = 0 | cluster.yaml |\n| 3 | Restarts + OOMKilled reason | cluster.yaml |\n| 4 | Memory vs limit, CPU vs request | agent.yaml |\n| 5 | Kubernetes events as logs | cluster.yaml |\n| 6 | Container logs with trace context | agent.yaml |\n| 7 | App RED via auto-instrumentation | Operator `Instrumentation` |\n| 8 | Collector self-monitoring + alerts | gateway.yaml |\n| 9 | One SLO per tier-1 service | [10](10-slos-and-error-budgets.md) |\n\n## Triage order: \"the service is down\"\n\n1. **Users / SLO**: error ratio and latency. Is it really broken, and for whom?\n2. **Ready endpoints**: `0` means Kubernetes sends traffic nowhere → step 3. Not 0 → step 5.\n3. **Pods**: crash loop, OOM, image pull, not ready. `kubectl describe pod` → Events.\n4. **Scheduling / capacity**: Pending pods, node pressure, requests vs allocatable.\n5. **Dependencies**: traces, network flows, DNS errors.\n6. **Changes**: recent rollout? ([12](12-releases-and-dora.md)). Most incidents start with a change.\n\n\u003cdetails>\n\u003csummary>Open-source variant (PromQL with kube-state-metrics, node-exporter, cAdvisor)\u003c/summary>\n\n## Cluster\n\n| What | Query | Bad when |\n|---|---|---|\n| API server errors | `sum(rate(apiserver_request_total{code=~\"5..\"}[5m])) / sum(rate(apiserver_request_total[5m]))` | `> 0.01` |\n| API server p99 | `histogram_quantile(0.99, sum by (le) (rate(apiserver_request_duration_seconds_bucket{verb!~\"WATCH\\|CONNECT\"}[5m])))` | `> 1` s |\n| Nodes not Ready | `count(kube_node_info) - sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})` | `> 0` |\n| Node pressure | `kube_node_status_condition{condition=~\"MemoryPressure\\|DiskPressure\\|PIDPressure\",status=\"true\"} == 1` | any |\n| Pending pods | `sum(kube_pod_status_phase{phase=\"Pending\"})` | `> 0` for 10 min |\n| CPU requested vs allocatable | `sum(kube_pod_container_resource_requests{resource=\"cpu\"}) / sum(kube_node_status_allocatable{resource=\"cpu\"})` | `> 0.8` (no room to scale) |\n| DNS failures | `sum(rate(coredns_dns_responses_total{rcode=\"SERVFAIL\"}[5m]))` | `> 0` |\n| DNS p99 | `histogram_quantile(0.99, sum by (le) (rate(coredns_dns_request_duration_seconds_bucket[5m])))` | `> 0.1` s |\n\n## Node\n\n| What | Query | Bad when |\n|---|---|---|\n| CPU used | `1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))` | `> 0.9` sustained |\n| Memory available | `node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes` | `\u003c 0.1` |\n| Disk available | `min by (instance) (node_filesystem_avail_bytes{fstype=~\"ext4\\|xfs\"} / node_filesystem_size_bytes{fstype=~\"ext4\\|xfs\"})` | `\u003c 0.15` |\n| Disk full soon | `predict_linear(node_filesystem_avail_bytes{fstype=~\"ext4\\|xfs\"}[6h], 4*3600) \u003c 0` | any (page) |\n\n## Workload\n\n| What | Query | Bad when |\n|---|---|---|\n| Deployment completely down | `(kube_deployment_spec_replicas > 0) and (kube_deployment_status_replicas_available == 0)` | any |\n| Degraded | `kube_deployment_status_replicas_available / kube_deployment_spec_replicas \u003c 1` | for 15 min |\n| Rollout stuck | `kube_deployment_status_observed_generation != kube_deployment_metadata_generation` | for 15 min |\n| HPA maxed out | `kube_horizontalpodautoscaler_status_current_replicas >= kube_horizontalpodautoscaler_spec_max_replicas` | for 15 min |\n| DaemonSet missing pods | `kube_daemonset_status_number_unavailable > 0` | any |\n\n## Pod / container\n\n| What | Query | Bad when |\n|---|---|---|\n| Crash loop | `kube_pod_container_status_waiting_reason{reason=\"CrashLoopBackOff\"} == 1` | any |\n| Image pull failing | `kube_pod_container_status_waiting_reason{reason=~\"ImagePullBackOff\\|ErrImagePull\"} == 1` | any |\n| OOMKilled | `kube_pod_container_status_last_terminated_reason{reason=\"OOMKilled\"} == 1` | any |\n| Memory vs limit | `sum by (namespace, pod) (container_memory_working_set_bytes{container!=\"\"}) / sum by (namespace, pod) (kube_pod_container_resource_limits{resource=\"memory\"})` | `> 0.9` |\n| CPU throttling | `sum by (namespace, pod) (rate(container_cpu_cfs_throttled_periods_total[5m])) / sum by (namespace, pod) (rate(container_cpu_cfs_periods_total[5m]))` | `> 0.25` |\n| No ready endpoints | `sum by (endpointslice) (kube_endpointslice_endpoints{ready=\"true\"}) == 0` | service down even if pods exist |\n\nMost of these are **ticket or dashboard**, not page. Page when users are affected (level 5), and put these in the alert's dashboard link.\n\n\n\u003c/details>\n\n## Sources\n\n- [OTel: Important components for Kubernetes](https://opentelemetry.io/docs/platforms/kubernetes/collector/components/) 📚\n- [Dynatrace: Monitor Kubernetes clusters with the OTel Collector](https://docs.dynatrace.com/docs/ingest-from/opentelemetry/collector/use-cases/kubernetes/k8s-monitoring) ✅ 2026-11-20\n- [Dynatrace: Kubernetes Platform Monitoring](https://docs.dynatrace.com/docs/license/capabilities/container-monitoring/kubernetes-platform-monitoring) ✅ 2026-11-20\n- Receiver metric names: `k8sclusterreceiver` and `kubeletstatsreceiver` documentation in opentelemetry-collector-contrib 📚 (names marked \"lab\" were seen in the lab's Dynatrace tenant and Prometheus)\n- Lab: `~/projects/aks-observability/results/` ✅ measured\n", "standard/09-internal-services.md": "# 09 · Internal services and shared platform services\n\n> **In 30 seconds:** most services are called by other services, not by users. Measure them **from the caller's\n> side** (client spans), give them **internal SLOs stricter than the user-facing SLO** that depends on them, and treat\n> shared platform services (databases, caches, Kafka, auth, gateways) as products with an **owner, SLOs and a list of\n> consumers**. Timeouts, retry budgets and circuit breakers stop one slow dependency from taking everything down.\n\n## The dependency chain\n\n\u003cdiv data-widget=\"viz\" data-chart=\"internal-deps\">\u003c/div>\n\n| Idea | Why |\n|---|---|\n| A user-facing request is a **chain**: if checkout calls 4 dependencies in series, each at 99.9%, the best checkout can do is ~99.6% | Dependencies need **better** targets than the service that relies on them |\n| The caller sees failures the callee can't (network, DNS, TLS, timeouts, pool exhaustion) | Measure **client-side** too |\n| One slow dependency fills the caller's threads and connection pools | Cascading failure: the slow part takes down the healthy parts |\n\n## Measure from both sides\n\n| Side | Signal (OTel) | Answers |\n|---|---|---|\n| **Server** (the internal service itself) | Server spans / `http.server.request.duration`, `rpc.server.duration` | Is my service healthy? |\n| **Client** (every caller) | Client spans: `http.client.request.duration`, `db.client.operation.duration`, `messaging.*`, with `server.address` / `db.system.name` | What do my callers actually get, including network and timeouts? |\n| **Service map** | Traces → Dynatrace service flow / Smartscape | Who depends on whom; blast radius |\n\n```text\n// DQL shape: what callers of payments-api experience (client spans), by calling service\nfetch spans\n| filter span.kind == \"client\" and server.address == \"payments-api\"\n| makeTimeseries { calls = count(), failed = countIf(http.response.status_code >= 500 or isNotNull(error.type)) }, by:{ service.name }\n| fieldsAdd failure_ratio = failed[] / calls[]\n```\n\nWhen server-side looks fine but client-side doesn't, the problem is **between** them: network, DNS, connection pools, TLS, a proxy, or timeouts set too short.\n\n## Internal SLOs\n\n| Rule ⚠️ | Example |\n|---|---|\n| Internal SLO **stricter** than every user-facing SLO that depends on it | checkout 99.9% → payments-api 99.95%, orders DB 99.99% |\n| Measured where the **callers** are (client-side), plus server-side | The SLO reflects what consumers get |\n| Latency SLO per **critical operation**, not one average | `POST /authorize` \u003c 200 ms for 99% |\n| Agreed with the main consumers, written down | [SLO document](../framework/slo-document-template.md) with a \"consumers\" section |\n| No hard SLA chains between internal teams | SLOs + error budget policy, not contracts |\n\n## Shared platform services\n\nDatabases, caches, message brokers, identity/auth, API gateways, the collector pipeline itself: one team runs them, many teams depend on them.\n\n| Practice | Why |\n|---|---|\n| **Owner** (platform team) and on-call | Someone answers when it breaks |\n| **Consumers listed** (from traces / service map) | You know who to inform and the blast radius |\n| **SLOs** on availability, latency and saturation per platform service | Consumers can design for it |\n| **Saturation dashboards**: connections vs max, replication lag, memory, disk, throughput ([13](13-capacity-and-saturation.md)) | Platform services fail by running out |\n| **One template per platform service type** (Postgres, Redis, Kafka) | Same as microservices ([18](18-automation-and-scale.md)): archetype `platform-service` |\n| Announce maintenance and changes to consumers | Change flow ([20](20-ownership-and-communication.md)) |\n\n| Platform service | Key signals |\n|---|---|\n| PostgreSQL / SQL | Query latency (client-side `db.client.operation.duration`), connections vs max, replication lag, locks, disk |\n| Redis / cache | Hit ratio, latency, evictions, memory vs max, connected clients |\n| Kafka / broker | Under-replicated partitions, request latency, consumer lag per group ([06](06-workload-types.md#queues-and-async-processing)), disk |\n| Auth / identity | Token issuance latency and errors, as seen by callers |\n| API gateway | Upstream errors by backend, rate limiting, latency added by the gateway |\n\n## Protect callers from slow dependencies\n\n| Mechanism | What it does | Signal to watch |\n|---|---|---|\n| **Timeouts / deadlines** | Stop waiting; propagate one deadline through the whole request | Timeout errors by dependency (`error.type`) |\n| **Retry budget** | Limit retries (e.g. up to 3 per request, ≤ 10% extra load per client) with exponential backoff and jitter | Retry rate; retries per original request |\n| **Retry only at one layer** | The layer just above the failing one; avoid multiplying retries per layer | Calls at the bottom layer vs user requests |\n| **Circuit breaker** | Fail fast while a dependency is broken | Breaker state per dependency |\n| **Load shedding / priorities** | Under overload, drop low-priority work first | Rejected requests by priority |\n| **Bulkheads** | Separate pools per dependency so one can't exhaust all | Pool usage per dependency |\n\nThese come from the Google SRE book's chapters on overload and cascading failures: retries multiply across layers, synchronized retries create thundering herds, and the fix is budgets, jitter and deadlines.\n\n## Common mistakes\n\n| ❌ | ✅ |\n|---|---|\n| Internal service SLO equal to (or looser than) the user-facing one | Stricter, because of the chain |\n| Only server-side metrics | Client-side spans from every caller |\n| Retries at every layer, no backoff | One layer, budget, exponential backoff + jitter |\n| Shared database \"owned by everyone\" | One owner, SLOs, consumer list |\n| Timeouts longer than the caller's own deadline | Propagate deadlines; inner timeouts shorter than outer |\n\n## Sources\n\n- [Google SRE Book: Addressing cascading failures](https://sre.google/sre-book/addressing-cascading-failures/) · [Handling overload](https://sre.google/sre-book/handling-overload/) (retry budgets, deadlines, jitter, load shedding) ✅ 2026-11-20\n- [Google SRE Workbook: Managing load](https://sre.google/workbook/managing-load/) ✅ 2026-11-20\n- [OTel semconv: HTTP client](https://opentelemetry.io/docs/specs/semconv/http/http-metrics/) · [Database client](https://opentelemetry.io/docs/specs/semconv/db/database-metrics/) 📚\n- [Dynatrace: Event analysis and correlation (topology)](https://docs.dynatrace.com/docs/discover-dynatrace/platform/davis-ai/root-cause-analysis/concepts/events) ✅\n- Internal SLO margins, platform signals per service: rules of thumb ⚠️\n", "standard/10-slos-and-error-budgets.md": "# 10 · SLOs and error budgets\n\n> **In 30 seconds:** an SLO is a target for \"good events / all events\" over 28–30 days. The gap to 100% is the\n> **error budget**. Alert when the budget **burns too fast**, and agree in advance (the **error budget policy**) what\n> happens when it's gone. In Dynatrace, the SLI is a **DQL query** in the Service-Level Objectives app.\n\n## Terms\n\n| Term | Meaning | Example |\n|---|---|---|\n| **SLI** | Good events / valid events, as a % (100% = all good) | % of `/checkout` requests that return non-5xx in \u003c 500 ms |\n| **SLO** | Target for the SLI over a window | 99.9% over 28 days |\n| **Error budget** | 100% − SLO: the failure you may spend | 0.1% → 1,000 bad requests of 1,000,000 in 4 weeks |\n| **Burn rate** | How fast the budget is used (1 = exactly on budget) | 14.4 = a 30-day budget gone in ~2 days |\n| **Error budget policy** | Agreed actions when the budget is spent | Freeze releases except P0 and security fixes |\n| **SLA** | Contract with a client, usually looser than the SLO | 99.5% with service credits |\n\n## Choosing SLIs\n\n| Service type | SLI | Measured from |\n|---|---|---|\n| Request/response API | Availability (non-5xx), latency (\u003c threshold) | Server spans / request metrics, as close to the user as possible |\n| User journey | RUM or synthetic success rate | Dynatrace RUM / synthetic ([07](07-frontend-experience.md)) |\n| Queue consumer | Age of oldest message, processing success | [06](06-workload-types.md) |\n| Batch / pipeline | Freshness, success of each run | [06](06-workload-types.md) |\n| Per client (multi-tenant) | Same SLI split by `client.id`, target per contract | [04](04-endpoint-coverage.md#multiple-clients-on-one-service) |\n\nRules of thumb ⚠️: 1–2 SLIs per user journey; window 28 or 30 days; start the target from **current performance**, tighten later.\n\n## The SLI in Dynatrace (DQL)\n\n```text\n// Availability SLI for checkout from OTel server spans (shape; check field names in your tenant)\nfetch spans\n| filter service.name == \"checkout\" and span.kind == \"server\"\n| makeTimeseries { total = count(), bad = countIf(http.response.status_code >= 500) }\n| fieldsAdd sli = 100 * (1 - bad[] / total[])\n```\n\n| Step | How |\n|---|---|\n| 1. Create the SLO | Service-Level Objectives app → custom SLI in DQL (as above) or a built-in template; target 99.9, window 28 days |\n| 2. Burn rate | Dynatrace docs: burn rate = error rate / error budget over the look-back window; computed per service |\n| 3. Alert | Anomaly detection (custom alert) on the burn rate, **-1h** look-back, static threshold starting around **10–14** (Dynatrace docs) |\n| 4. As code | Monaco `slo-v2` config + template ([18](18-automation-and-scale.md)) |\n\n**Multi-window** (Google SRE Workbook): page when **both** a long and a short window burn fast, so the alert also resolves fast. In Dynatrace, build it as two conditions (two custom alerts combined in one workflow, or one query that requires both) ⚠️.\n\n| Severity | Burn rate | Long window | Short window | Budget used |\n|---|---|---|---|---|\n| Page | 14.4 | 1h | 5m | 2% |\n| Page | 6 | 6h | 30m | 5% |\n| Ticket | 1 | 3d | 6h | 10% |\n\nAfter a fix, the slower pair keeps alerting until its short window is clean (up to ~30 min for the 6h/30m pair).\n\n\u003cdetails>\n\u003csummary>Open-source variant (Prometheus)\u003c/summary>\n\n```promql\n# Availability SLI, 28d\n1 - (\n  sum(increase(http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=~\"5..\"}[28d]))\n  /\n  sum(increase(http_server_request_duration_seconds_count{service_name=\"checkout\"}[28d]))\n)\n```\n\nTested burn-rate rules with promtool unit tests: [rules/](../rules/). Generators: Sloth, Pyrra.\n\n\u003c/details>\n\n## The two documents every SLO needs\n\n| Document | Template | Signed by |\n|---|---|---|\n| **SLO document**: what is measured, target, why | [framework/slo-document-template.md](../framework/slo-document-template.md) | Service owner, SRE, business owner |\n| **Error budget policy**: what happens when it's spent | [framework/error-budget-policy-template.md](../framework/error-budget-policy-template.md) | Same + engineering manager |\n\n## How the policy connects to everything else\n\n| Budget state | Alerting | Releases | Planning |\n|---|---|---|---|\n| Healthy (> 50% left) ⚠️ | Normal burn-rate alerts | Ship normally | Feature work |\n| Burning fast | Page (14.4× / 6×) | Pause risky changes | – |\n| Exhausted (4-week window) | – | **Freeze** except P0 and security fixes (release gate: Site Reliability Guardian objective on the SLO, [12](12-releases-and-dora.md)) | Reliability work first |\n| One incident > 20% of budget | – | – | Postmortem with at least one P0 action item |\n\n\u003cdiv data-widget=\"viz\" data-chart=\"budget-burndown\">\u003c/div>\n\nThe freeze and 20% rows come from the Workbook's example policy; \"> 50%\" is a rule of thumb.\n\n## Review cadence\n\n| When | Who | Question |\n|---|---|---|\n| Monthly | Team, SRE, business owner | Budget status; is the target still right? |\n| After a big incident | Postmortem attendees | Did the budget reflect user pain? |\n| Quarterly | Leadership | Trend across services; where to invest |\n\n## Common mistakes\n\n| ❌ | ✅ |\n|---|---|\n| SLO = 100% | Leave room to change things; 100% means no releases |\n| Target picked from a wish | Start from the last 4 weeks, tighten later |\n| SLO without a policy | Nothing changes when it's missed |\n| Alert on the SLI value itself | Alert on the **burn rate** |\n\n## Sources\n\n- [Dynatrace: Service-Level Objectives](https://docs.dynatrace.com/docs/deliver/service-level-objectives) · [SLO examples](https://docs.dynatrace.com/docs/deliver/service-level-objectives/service-level-objective-examples): DQL SLI, burn rate formula, anomaly detection threshold ~10–14 on -1h ✅ 2026-11-20\n- [Dynatrace: DQL aggregation commands (makeTimeseries, countIf)](https://docs.dynatrace.com/docs/platform/grail/dynatrace-query-language/commands/aggregation-commands) ✅ 2026-11-20\n- [SRE Workbook: Implementing SLOs](https://sre.google/workbook/implementing-slos/) · [Alerting on SLOs](https://sre.google/workbook/alerting-on-slos/) · [Error budget policy](https://sre.google/workbook/error-budget-policy/) ✅ 2026-11-20\n- Multi-window construction in Dynatrace, \"> 50%\" boundary: rules of thumb ⚠️\n", "standard/11-alerting.md": "# 11 · Alerting\n\n> **In 30 seconds:** page on **symptoms users feel**, never on causes like CPU. A **percentage** says how bad, a\n> **count** says how many: good alerts check both. Prefer **SLO burn rate** over fixed thresholds. In Dynatrace,\n> Davis covers infrastructure anomalies; you add **custom alerts on DQL** and **SLO burn-rate alerts** for service\n> symptoms, and **Workflows** route them to the owning team.\n\n## Choose the alert type\n\n| Ask yourself… | Alert on… | Example |\n|---|---|---|\n| Is **every single occurrence** bad (money, security, data loss)? | **Count** (`> 0` or `> N`) | failed payment, message in DLQ, failed backup |\n| Is it a **high-volume flow** where some failures are normal? | **Percentage (ratio)** | 5xx %, dependency timeout % |\n| Is there an **SLO**? | **Burn rate** | 2% of the monthly budget burned in 1h ([10](10-slos-and-error-budgets.md)) |\n| Is traffic **low or variable** (nights, small clients)? | **Ratio AND minimum count** | error % > 5% **and** ≥ 20 errors |\n| Is the **absence** of something the problem? | **Count == 0** | no orders in 15 min, a client stopped calling |\n| Is it a **resource limit**? | **% of capacity + time to exhaustion** | disk full in \u003c 4h |\n\n\u003cdiv data-widget=\"alert-type-picker\">\u003c/div>\n\n## Who alerts on what (Dynatrace + OpenTelemetry)\n\n| Symptom family | Source | Why |\n|---|---|---|\n| Kubernetes / infrastructure anomalies (OOM, restarts, node problems) | **Davis** (built-in) | Raised an OOM problem in 1 min with no setup (lab) |\n| Service SLOs (availability, latency) | **SLO app** + burn-rate custom alert | Your targets, not a baseline |\n| Per client, per version, business counts and absence | **Custom alerts** (anomaly detectors) on DQL | Bounded segments you control |\n| Collector pipeline health | Custom alerts on collector self-monitoring metrics ([16](16-collector-templates.md#self-monitoring)) | A dead pipeline can't alert on itself |\n| Frontend | RUM health alerts / synthetic monitors ([07](07-frontend-experience.md)) | What users experience |\n\nAlert severity (`page` / `ticket`) says what the alert does now; **incident severity** (SEV1–SEV4) says how big the response is: criteria and actions in [20](20-ownership-and-communication.md#severity-levels-and-actions).\n\nRule: **each symptom has exactly one alert source**. Davis groups related events into one problem; Workflows route by team.\n\n## 1. Percentage (ratio)\n\nNormalizes against traffic, so one threshold works at 10 req/s and at 10,000 req/s. Use it for high-volume flows and for comparing segments of different sizes.\n\n```text\n// DQL shape: 5xx ratio per route for checkout (server spans)\nfetch spans\n| filter service.name == \"checkout\" and span.kind == \"server\"\n| makeTimeseries { total = count(), errors = countIf(http.response.status_code >= 500) }, by:{ http.route }\n| fieldsAdd error_ratio = errors[] / total[]\n```\n\n**Weak spot: low traffic.** 1 error out of 2 requests = 50% → a page at 3 a.m. for one request.\n\n## 2. Count\n\nEach event matters on its own (payments, DLQ, security), the event is rare by design, or you alert on absence.\n\n```text\n// DQL shape: messages that reached the dead-letter queue in the last window (from your DLQ metric or logs)\ntimeseries dlq = sum(\u003cdlq messages metric>), by:{ queue }\n```\n\n**Weak spot: high traffic.** `errors > 100` storms at peak and stays silent when 100% of a small flow fails.\n\n## 3. Ratio AND minimum count (the default service alert)\n\n```text\n// DQL shape: per client, error ratio > 5% AND more than 20 errors in the window\nfetch spans\n| filter service.name == \"checkout\" and span.kind == \"server\"\n| makeTimeseries { total = count(), errors = countIf(http.response.status_code >= 500) }, by:{ client.id }, interval:10m\n| fieldsAdd error_ratio = errors[] / total[]\n// Custom alert: condition on error_ratio, plus a second condition (or filter) on errors > 20\n```\n\n\u003cdiv data-widget=\"low-traffic-checker\">\u003c/div>\n\n| Guard | When |\n|---|---|\n| Minimum **errors** | Default: enough people were affected |\n| Minimum **traffic** | When the ratio must be statistically meaningful |\n| **Longer window** for small segments | Low-traffic clients: 1h instead of 10m |\n| **Synthetic traffic** | When real traffic is too thin to ever be meaningful |\n\n\u003cdetails>\n\u003csummary>Open-source variant (Prometheus)\u003c/summary>\n\n```promql\n(\n  sum by (client_id) (rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[10m]))\n  / sum by (client_id) (rate(http_server_request_duration_seconds_count[10m])) > 0.05\n)\nand on (client_id)\n( sum by (client_id) (increase(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[10m])) > 20 )\n```\n\nTested versions of every pattern, with promtool unit tests: [rules/](../rules/).\n\n\u003c/details>\n\n## 4. Burn rate\n\nCompare the error ratio with the error budget instead of a fixed %. Details, multi-window table and the Dynatrace SLO setup: [10](10-slos-and-error-budgets.md).\n\n\u003cdiv data-widget=\"burn-calculator\">\u003c/div>\n\n## 5. Case catalog\n\n\u003cdiv data-widget=\"table-filter\" data-column=\"2\">\u003c/div>\n\n| Case | Type | Where (Dynatrace) | Severity |\n|---|---|---|---|\n| API 5xx errors | Burn rate + min count | SLO app + custom alert | Page |\n| API latency | Share of requests under threshold (not the average) | Latency SLO | Page / Ticket |\n| One client broken, others fine | Ratio **per client** + min count | Custom alert, `by:{client.id}` | Page |\n| A client went silent | Traffic drop vs last week | Custom alert (DQL with `shift`) or Davis baseline | Ticket / Page if SLA |\n| Payments failed | Count | Custom alert on a business metric / event | Page |\n| DLQ received messages | Count | Custom alert | Ticket |\n| Batch / CronJob failed | Count or \"no success in 2 intervals\" | Custom alert ([06](06-workload-types.md)) | Ticket |\n| OOMKilled, crash loops, node pressure | Infrastructure anomaly | **Davis** | Ticket / Page by impact |\n| Disk / volume filling | Capacity + prediction | Davis / custom alert | Page if \u003c 4h |\n| Certificate expiring | Time left | Synthetic / custom alert | Ticket |\n| Collector pipeline failing | Pipeline health | Custom alert on `otelcol_*` | Page |\n| Avg order price below goal | Business ratio, long window | Custom alert on business events | Business owner |\n| No orders at all | Absence | Custom alert (business hours) | Page |\n| CPU high | **Don't alert** (cause) | Dashboard | – |\n\n## 6. Rules for every alert\n\n| # | Rule |\n|---|---|\n| 1 | **Symptoms, not causes.** Page on errors, latency, absence; CPU and memory go on dashboards |\n| 2 | **Every page is actionable and urgent**; otherwise it's a ticket or nothing |\n| 3 | **Two severities**: page (now) and ticket (working hours) |\n| 4 | **Owner, runbook, dashboard link** and the affected segment (`client.id`, `http.route`) in the message |\n| 5 | **Windows / dealerting samples** so blips don't fire (5–15 min for most symptoms) |\n| 6 | **Ratios get a minimum-count guard** |\n| 7 | **Bounded dimensions only** (`client.id`, `http.route`, region), never user IDs or raw URLs |\n| 8 | **One notification per incident**: Davis problem grouping + one Workflow per team |\n| 9 | **Test it**: inject the failure, see the problem open and close |\n| 10 | **Review regularly**: never fires or always fires → fix or delete |\n\n## 7. Cleaning up a noisy alert set\n\n| Step | How (Dynatrace) |\n|---|---|\n| 1. Measure 30 days | Problems app / DQL on problem events: count per alert definition, time to close, how many led to action |\n| 2. Classify each alert | Fires/month · % acted on · duplicate of · symptom or cause · owner |\n| 3. Decide | Table below |\n| 4. Shadow, then cut over | New alerts notify a non-paging channel for 1–2 weeks first ([transition plan](../framework/transition-plan.md)) |\n| 5. Track | Pages per shift ≤ 2, > 80–90% acted on, ~1 notification per incident |\n\n| Finding | Action |\n|---|---|\n| Fires often, nobody acts | Delete, or move to a dashboard |\n| Cause alert (CPU, memory, one pod) | Replace with a symptom / SLO alert |\n| Fires with every other alert | Rely on Davis grouping; one Workflow per team |\n| Ratio firing at night | Minimum-count guard or longer window |\n| Count firing at peak | Convert to a ratio |\n| Flapping | More dealerting samples, longer windows, multi-window burn rate |\n| Never fired in 6+ months | Test it; if it can't fire, fix it; if not needed, delete |\n| No owner / runbook | Assign, or delete |\n\nPlaybook: [noisy alerts cleanup](../playbooks/noisy-alerts-cleanup.md).\n\n## Common mistakes\n\n| ❌ | ✅ |\n|---|---|\n| `errors > 10` on a busy API | Ratio or burn rate |\n| Ratio with no guard | Ratio **and** minimum count |\n| Alert on average latency | % of requests under the threshold |\n| Only a global alert on a multi-client service | Per-client alerts |\n| Page for CPU > 80% | Dashboard |\n| The same symptom alerted by Davis **and** a custom alert | One source per symptom |\n| Alert without a runbook | Write it, or delete the alert |\n\n## Prompt for an agent (alert review)\n\n```text\nReview these alert definitions (Dynatrace custom alerts / SLO alerts, or Prometheus rules) against 10-alerting.\nFor each: name | type (ratio/count/burn/absence/capacity) | symptom or cause | problems | keep/rewrite/merge/delete | rewritten condition.\nFlag: ratios without a minimum-count guard, counts on high-volume flows, cause-based pages, missing owner/runbook,\nno dealerting window, per-pod alerts, unbounded dimensions, missing per-client or per-version split,\nsymptoms alerted twice (Davis + custom alert).\n```\n\n## Sources\n\n- [Google SRE Book: Monitoring Distributed Systems](https://sre.google/sre-book/monitoring-distributed-systems/) · [Being On-Call](https://sre.google/sre-book/being-on-call/) ✅\n- [Prometheus: Alerting practices](https://prometheus.io/docs/practices/alerting/) (symptoms, Ewaschuk's essay) ✅\n- [Dynatrace: Anomaly detection (custom alerts on DQL)](https://docs.dynatrace.com/docs/dynatrace-intelligence/anomaly-detection/anomaly-detection-configuration) · [Best practices to avoid over-alerting](https://docs.dynatrace.com/docs/dynatrace-intelligence/use-cases/avoid-overalerting) · [Event analysis and correlation](https://docs.dynatrace.com/docs/discover-dynatrace/platform/davis-ai/root-cause-analysis/concepts/events) ✅ 2026-11-20\n- [Dynatrace: Workflow event triggers](https://docs.dynatrace.com/docs/analyze-explore-automate/workflows/build/trigger/event-trigger) ✅ 2026-11-20\n- [Dynatrace: DQL aggregation commands](https://docs.dynatrace.com/docs/platform/grail/dynatrace-query-language/commands/aggregation-commands) ✅ 2026-11-20\n- Thresholds (5%, 20 errors), case catalog, cleanup steps: rules of thumb ⚠️\n", "standard/12-releases-and-dora.md": "# 12 · Releases and DORA (Delivery layer)\n\n> **In 30 seconds:** most incidents start with a change. Put the **version on every signal** (`service.version`),\n> send a **deployment event** to Dynatrace when a rollout finishes, alert when the new version is worse than the old\n> one, and let the same events produce **DORA metrics**.\n\n| Technique | Answers |\n|---|---|\n| **Version dimension** (`service.version` = image tag) | Is the new version worse than the old one? |\n| **Deployment events** (SDLC events) | Did errors start right after a deploy? |\n| **Release validation** (Site Reliability Guardian) | Should this release be promoted or rolled back? |\n| **DORA from SDLC events** | Are we shipping faster and safer over time? |\n\n## 1. Version on every signal\n\n```yaml\n# Deployment rendered by the pipeline with IMAGE_TAG\nmetadata:\n  labels:\n    app.kubernetes.io/version: \"1.42.0\"\ncontainers:\n  - image: registry.example/checkout:1.42.0\n    env:\n      - name: OTEL_RESOURCE_ATTRIBUTES\n        value: \"service.version=1.42.0\"\n```\n\nWithout touching the app, the collector's `k8sattributes` copies the pod label into `service.version` ([collector/agent.yaml](../collector/)). If OneAgent also runs, Dynatrace reads the same label as the release version when the DynaKube flag `feature.dynatrace.com/label-version-detection=true` is set.\n\n```text\n// DQL shape: error ratio per version during a rollout\nfetch spans\n| filter service.name == \"checkout\" and span.kind == \"server\"\n| makeTimeseries { total = count(), errors = countIf(http.response.status_code >= 500) }, by:{ service.version }\n| fieldsAdd error_ratio = errors[] / total[]\n```\n\n\u003cdiv data-widget=\"viz\" data-chart=\"version-split\">\u003c/div>\n\nDuring a rolling update both versions take traffic at once: if 1.42.0 shows 4% errors and 1.41.3 shows 0.2%, you have the culprit. A version label is fine for cardinality: old versions go stale after the rollout.\n\n## 2. Deployment events\n\n| Source | How |\n|---|---|\n| Pipeline step after `kubectl rollout status` | Send an SDLC **deployment** event (`event.type: deployment`, `event.status: finished`) with service, version, commit, author |\n| Argo CD | `on-deployed` notification (synced and healthy, once per revision) → webhook that sends the same event |\n| Classic API | Events API v2 with `eventType: CUSTOM_DEPLOYMENT` |\n\nMark the deploy when it **finished**, not when the pipeline started. Dynatrace shows deployments on a timeline next to versions and problems (Release Monitoring), and Davis can relate a problem to the change.\n\n## 3. Alerts that know about releases\n\n| Alert | Condition (shape) | Routing |\n|---|---|---|\n| **Release regression** | While two versions serve traffic: worst version's error ratio > 2× the best and > 1% ⚠️ | Deploying team, rollback runbook first |\n| **SLO burn right after a deploy** | Burn rate > 14.4 **and** a deployment event for the service in the last 30 min | Deploying team, label `suspect: deploy` |\n| **Release validation failed** | Site Reliability Guardian objective (SLO, error rate, latency) fails after the deployment event | Pipeline blocks promotion or triggers rollback |\n| **Error budget exhausted** | SLO budget \u003c 0 | Release gate: only fixes ship ([10](10-slos-and-error-budgets.md)) |\n\nRelease validation flow (Dynatrace docs): pipeline sends *deployment finished* → a Workflow runs the Guardian → the result comes back as a validation event the pipeline uses to promote or roll back.\n\n\u003cdetails>\n\u003csummary>Open-source variant (Prometheus + Grafana)\u003c/summary>\n\n- Version as a metric label: Prometheus `promote_resource_attributes: [service.version]`.\n- Deploy markers: Grafana annotations API from the pipeline, or an annotation query on `kube_deployment_status_observed_generation`.\n- Tested PromQL for release regression and burn-after-deploy: `ReleaseRegression`, `CheckoutBurnAfterDeploy` in [rules/](../rules/).\n- Canary analysis: Argo Rollouts `AnalysisTemplate` with a Prometheus provider.\n\n\u003c/details>\n\n## 4. DORA metrics\n\n| Metric | From which events |\n|---|---|\n| **Deployment frequency** | Deployment events per service per week |\n| **Change lead time** | Commit time → deployment event time |\n| **Change failure rate** | Deployments followed by rollback, hotfix, failed validation, or a problem linked to the deploy |\n| **Failed deployment recovery time** | Failed deployment → service restored (problem closed / rollback done) |\n| **Deployment rework rate** (added 2024) | Unplanned deployments caused by a production incident |\n\nIn 2023 DORA renamed \"mean time to restore\" to **failed deployment recovery time**: it counts only failures caused by a change. Dynatrace's pipeline observability derives DORA-style KPIs from the same SDLC events you already send; query them with DQL and show them as stat tiles.\n\n\u003cdiv data-widget=\"viz\" data-chart=\"dora-tiles\">\u003c/div>\n\nPlaybook: [DORA from pipelines](../playbooks/dora-from-pipelines.md).\n\n## Common mistakes\n\n| ❌ | ✅ |\n|---|---|\n| Version only in the image name | `service.version` on every signal |\n| Deploy marked when the pipeline starts | Mark when the rollout finished |\n| Comparing \"before vs after\" by eye | Error ratio **by version** during the rollout |\n| DORA as a target for individuals | Trends per team; DORA warns against using metrics as targets |\n\n## Sources\n\n- [OTel semconv: service.version](https://opentelemetry.io/docs/specs/semconv/resource/service/) ✅\n- [Dynatrace: Pipeline observability / SDLC events](https://docs.dynatrace.com/docs/deliver/pipeline-observability-sdlc-events) · [Ingest SDLC events](https://docs.dynatrace.com/docs/deliver/pipeline-observability-sdlc-events/sdlc-events) · [Analyze](https://docs.dynatrace.com/docs/deliver/pipeline-observability-sdlc-events/pipeline-observability-analyze) ✅ 2026-11-20\n- [Dynatrace: Version detection](https://docs.dynatrace.com/docs/deliver/release-monitoring/version-detection-strategies-latest) · [Events API v2](https://docs.dynatrace.com/docs/dynatrace-api/environment-api/events-v2/post-event) · [Release validation with Site Reliability Guardian](https://docs.dynatrace.com/docs/deliver/quality-gates) ✅ 2026-11-20\n- [Argo CD notification triggers](https://argo-cd.readthedocs.io/en/stable/operator-manual/notifications/triggers/) ✅\n- [DORA four keys](https://dora.dev/guides/dora-metrics-four-keys/) · [metrics history](https://dora.dev/insights/dora-metrics-history/) ✅\n- Regression thresholds (2×, 1%), 30-min deploy window: rules of thumb ⚠️\n", "standard/13-capacity-and-saturation.md": "# 13 · Capacity and saturation\n\n> **In 30 seconds:** capacity is **demand vs supply**. Demand is traffic and its growth; supply is what a pod, node,\n> database or queue *really* handles, found with **load tests**. Keep **headroom** for peaks and lost zones (N+2),\n> watch **saturation** (the \"S\" in USE) on every resource that can run out, right-size requests, and alert on the\n> **forecast** date when demand will cross capacity, weeks before it hurts. Not on \"CPU is high\".\n\n## Demand vs supply\n\n\u003cdiv data-widget=\"viz\" data-chart=\"capacity-forecast\">\u003c/div>\n\n| Side | What to know | How to get it |\n|---|---|---|\n| **Demand** | Peak requests/s, weekly pattern, growth per month, planned events (launches, campaigns: \"inorganic\" demand) | Request rate per service over 90+ days; product calendar |\n| **Supply** | Requests/s one pod handles within the SLO; pods per node; DB connections and IOPS; queue throughput per consumer | **Load tests** (gradual and spike), repeated after big changes |\n| **Headroom** | How much extra you keep for peaks, failures and deploys | Policy per tier (below) |\n\nGoogle's SRE guidance: an accurate organic demand forecast, inorganic demand included, and **regular load tests that map raw resources to service capacity**. Past performance is not a capacity number: re-test after the system changes.\n\n## Headroom policy (per tier ⚠️)\n\n| Tier | Rule | Means |\n|---|---|---|\n| 1 | **N+2** at forecast peak | Peak served with the two largest instances (or one zone + one instance) gone: planned + unplanned outage at once |\n| 2 | N+1 at forecast peak | One instance or zone may fail |\n| 3 | Best effort, autoscale | Batch and tools can queue |\n\nExample ⚠️: a pod handles 100 req/s within the SLO (load test); forecast peak is 1,200 req/s → N = 12; tier 1 → 14 pods minimum, spread over 3 zones.\n\n## Saturation: what can run out\n\n| Resource | Saturation signal | Source (OTel → Dynatrace) | Warning sign |\n|---|---|---|---|\n| CPU | Throttling (time a container wanted CPU but hit its limit) | cAdvisor via `prometheus` receiver; OneAgent | Throttling > 25% while latency rises |\n| Memory | Working set vs limit; OOM kills | `kubeletstats` `k8s.container.memory_limit_utilization`; `k8s_cluster` OOM reason ([08](08-kubernetes-cluster.md)) | > 90% of limit, any OOMKilled |\n| Pods per node / cluster | Pending pods; requests vs allocatable | `k8s_cluster` | Requests > 80% of allocatable |\n| Autoscaler | Current = max replicas | `k8s.hpa.current_replicas` vs `k8s.hpa.max_replicas` | At max for > 15 min |\n| Connection pools | Used vs max (DB, HTTP clients) | `db.client.connection.count` vs max (semconv, development) or app metric | > 80%, waits for a connection |\n| Thread / worker pools | Busy vs total; queued work | Runtime metrics (.NET, JVM) | Queue of work items grows |\n| Queues | Backlog, **oldest message age** | [06](06-workload-types.md#queues-and-async-processing) | Age grows while consumers are at max |\n| Disk / volumes | Free space and its trend | `kubeletstats` `k8s.volume.available` | Forecast full \u003c 2 weeks |\n| Quotas and limits | Namespace quotas, IP addresses, cloud API rate limits, license limits | Quota objects; cloud metrics; 429 responses | > 80% of quota |\n| External APIs | Rate limit headers / 429s | `http.client.request.duration` with status 429 ([06](06-workload-types.md#external-dependencies)) | 429 rate > 0 |\n\nRule: alert on **saturation that hurts users soon** (OOM, autoscaler at max with growing latency or backlog, disk full forecast); keep the rest on the capacity dashboard.\n\n## Right-sizing\n\n| Look at | Over-provisioned | Under-provisioned |\n|---|---|---|\n| CPU request vs p95 usage | Usage \u003c 30% of request most of the time ⚠️ → cost | Usage > request → noisy neighbours, throttling if limited |\n| Memory request/limit vs working set | Working set \u003c 40% of limit ⚠️ → cost | Working set near limit → OOM |\n| Replicas vs load | Many replicas idle at peak | HPA often at max |\n\nReview per service monthly; the HPA's utilization target is computed **against requests**, so wrong requests make autoscaling wrong too.\n\n## Autoscaling\n\n| Scaler | Scale on | Watch |\n|---|---|---|\n| HPA (CPU/memory) | % of **requests** | Requests must be realistic; CPU lags behind traffic |\n| HPA (custom/external metric) | Requests per pod, latency, queue length | Metric adapter must be healthy, or scaling stops |\n| KEDA | Queue lag / backlog (Kafka, RabbitMQ, SQS, …) | `lagThreshold` meaning differs by KEDA version; max replicas ≤ partitions |\n| Cluster autoscaler / node pools | Pending pods | Node provisioning time adds minutes |\n\nCapacity alerts for autoscaled services: **at max replicas for 15 min AND (latency burn or backlog growing)**. At max alone is fine; at max while users suffer is a capacity incident.\n\n## Forecasting in Dynatrace\n\nDynatrace's forecast analyzer (Davis / Dynatrace Intelligence) can run on a schedule in a **Workflow**: a DQL query feeds the generic forecast analysis, and a step raises a ticket only if the predicted value crosses the limit within the window. The docs' example forecasts disk usage weeks ahead; the same pattern works for request rate vs tested capacity, connection pools or quotas.\n\n```text\n// DQL shape: daily peak requests/s for checkout over 90 days, the input for a forecast\nfetch spans, from:-90d\n| filter service.name == \"checkout\" and span.kind == \"server\"\n| makeTimeseries peak_rps = count() / 60, interval:1m\n| summarize daily_peak = max(arrayMax(peak_rps)), by:{ day = bin(timestamp, 1d) }\n```\n\nForecasts get wider the further they look ahead; plan on the **lower** confidence bound for \"when do we run out\".\n\n## Capacity review (monthly, tier-1 services)\n\n| Service | Peak (30d) | Tested capacity | Headroom policy | Forecast date crossing headroom | Action |\n|---|---|---|---|---|---|\n| checkout | 1,050 req/s | 1,400 req/s (14 pods) | N+2 | in 9 weeks | Load test 1.43, add a node pool in 6 weeks |\n\n\u003cdiv data-widget=\"viz\" data-chart=\"capacity-tiles\">\u003c/div>\n\n## Common mistakes\n\n| ❌ | ✅ |\n|---|---|\n| Alert on CPU > 80% | Alert on users hurting (burn rate) and on forecast exhaustion |\n| Capacity = last quarter's peak | Capacity = load-tested throughput within the SLO |\n| HPA on CPU with wrong requests | Fix requests first, or scale on requests per pod |\n| One big load test before launch, never again | Repeat after big changes; compare with forecast |\n| Ignoring quotas and rate limits | They are capacity too, and fail hard |\n\n## Sources\n\n- [Google SRE Book: Production services best practices (capacity planning, N+2)](https://sre.google/sre-book/service-best-practices/) · [Introduction (demand forecasting, load testing)](https://sre.google/sre-book/introduction/) · [Software engineering in SRE (intent-based capacity planning)](https://sre.google/sre-book/software-engineering-in-sre/) · [Handling overload](https://sre.google/sre-book/handling-overload/) ✅ 2026-11-20\n- [Kubernetes: Horizontal Pod Autoscaling](https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/) (utilization against requests, behavior, tolerance) ✅ 2026-11-20\n- [KEDA: Apache Kafka scaler](https://keda.sh/docs/2.21/scalers/apache-kafka/) (`lagThreshold`) ✅ 2026-11-20\n- [Dynatrace: Forecast disk and resource utilization (Workflows)](https://docs.dynatrace.com/docs/dynatrace-intelligence/use-cases/dynatrace-intelligence-for-workflows) · [Predictive AI analysis](https://docs.dynatrace.com/docs/dynatrace-intelligence/reference/ai-models/forecast-analysis) ✅ 2026-11-20\n- Headroom per tier, right-sizing percentages, review template: rules of thumb ⚠️\n", "standard/14-dashboards.md": "# 14 · Dashboards\n\n> **In 30 seconds:** a dashboard set is a **hierarchy you click down** (overview → service → component → explore),\n> built from **one template per level**, kept as code. Inside each dashboard, the question picks the tile: one\n> number → stat tile; trend → line; distribution → heatmap; parts of a whole → segmented bar, never a pie.\n> Never show a percentage without its volume. All charts on this page use example data.\n\n## Part A · Structure\n\n### The four levels\n\n\u003cdiv data-widget=\"viz\" data-chart=\"dash-hierarchy\">\u003c/div>\n\n| Level | Question | Audience | Content | Links to |\n|---|---|---|---|---|\n| **L0 · Overview** | Which service is unhealthy right now? | On-call, leadership | One row per service: SLO status, budget left, burn rate, traffic. Worst first | L1 with `service` set |\n| **L1 · Service** | What is wrong, for whom, since which change? | On-call, service team | The service template: SLO → RED → per client → per version → saturation | L2 |\n| **L2 · Component** | Which part is the cause? | Service and platform teams | Pods/containers, database, queue, external API, collector health | L3 |\n| **L3 · Explore** | Why exactly? | Whoever is debugging | Traces, logs, profiles (Dynatrace Notebooks, Distributed Tracing, Logs) | – |\n\nRules ⚠️: L0 fits on one screen; **L1 is one template with a `service` variable** for every service; every alert links to L1 with the variables filled in.\n\n### Dashboards by audience\n\n| Audience | Dashboard | Refresh | Time range |\n|---|---|---|---|\n| Leadership / business | Business KPIs + SLO summary per product | 5–15 min | 7–30 days |\n| On-call | L0 + L1 | 30 s–1 min | 1–6 h |\n| Service team | L1 + L2 for their service | 1 min | 6 h–7 days |\n| Platform team | Cluster, collectors, ingest cost | 1 min | 1–7 days |\n| Delivery | DORA tiles + deployments ([12](12-releases-and-dora.md)) | 1 h | 30–90 days |\n\n### Naming and ownership\n\n| Convention | Example | Why |\n|---|---|---|\n| Title = `scope · level` | `checkout · Service`, `payments · Overview` | Searchable, sorts well |\n| Owner and team in the dashboard | Owner: payments | Someone answers questions |\n| Templates in Git, deployed by Monaco | `templates/dashboard-service.json` ([18](18-automation-and-scale.md)) | No hand-made copies |\n| Unused dashboards archived after 90 days ⚠️ | – | The list stays usable |\n\nMaturity (Grafana's model, applies to any tool): **low** = hand-made copies; **medium** = templates, variables, hierarchical drill-downs; **high** = dashboards as code, provisioned by CI, usage tracked.\n\n## Part B · Inside a dashboard\n\n### The question → the tile\n\n| The reader must… | Use | Avoid |\n|---|---|---|\n| Know one current value (\"are we OK?\") | **Stat tile** (value + delta + sparkline) | A one-bar chart, a gauge dial |\n| See a value against a limit | **Meter** | A pie with 2 slices |\n| Compare that ratio across services/clients | **Meter list** | A gauge per row |\n| Follow a trend | **Line** (area for one series) | Bars for long time ranges |\n| Compare two measures with different units | **Two charts stacked on one time axis** | **A second y-axis** |\n| See a distribution over time (latency) | **Heatmap**, one hue | Average line alone |\n| See states over time (alert firing, pod phase) | **State timeline** | Lines jumping 0↔1 |\n| Rank many entities | **Table**, colored cells, worst first | Pie or donut |\n| See how one whole splits | **Segmented bar** (≤ 6 parts) | Pie with tiny slices |\n| Compare before → after | **Dumbbell** | Two separate charts |\n\n### 1 · Stat tiles: the first row\n\n\u003cdiv data-widget=\"viz\" data-chart=\"kpi-tiles\">\u003c/div>\n\nVolume tile next to the percentage tiles; deltas against a **named** period; color only for state, always with an icon or word.\n\n### 2 · Two measures, one time axis\n\n\u003cdiv data-widget=\"viz\" data-chart=\"red-stack\">\u003c/div>\n\nHover one chart and the crosshair follows on both. Never put them on one chart with two y-axes: how the scales line up is arbitrary and invents correlations.\n\n### 3 · Latency: a heatmap shows what an average hides\n\n\u003cdiv data-widget=\"viz\" data-chart=\"latency-heatmap\">\u003c/div>\n\n### 4 · Ratios against a limit: meter list\n\n\u003cdiv data-widget=\"viz\" data-chart=\"client-meters\">\u003c/div>\n\n### 5 · Parts of a whole: segmented bar, not a pie\n\n\u003cdiv data-widget=\"viz\" data-chart=\"traffic-share\">\u003c/div>\n\n### 6 · States over time: state timeline\n\n\u003cdiv data-widget=\"viz\" data-chart=\"state-timeline\">\u003c/div>\n\n### The L1 service template (tile list)\n\n| Row | Tiles | Question |\n|---|---|---|\n| SLO status | Availability (28d), budget left, burn rate (1h), requests | Are we OK? |\n| RED | Requests and error % stacked on one time axis; latency distribution + p99 | What changed and when? |\n| Per client | Table: requests · errors · error % · p95, worst first | Who is affected? |\n| Per version | Error % by `service.version`; traffic share by version; deployment events overlaid | Did a release cause it? |\n| Saturation | Memory vs limit, CPU vs request, throttling, active requests | Why? |\n| Drill-down | Links to traces and logs filtered by `service.name` | Root cause |\n\nBuild it once in Dynatrace Dashboards with a DQL **`service` variable** (every tile filters `service.name == $service`), then export it with `monaco download` and keep it as the template.\n\n### Rules for every tile\n\n| Rule | Why |\n|---|---|\n| One y-axis per chart | Two scales invent correlations |\n| Units on every value (`s`, `req/s`, `%`) | Unitless numbers get misread |\n| Normalize (percent of limit, per second) | Pods and hosts differ in size |\n| Thin lines, light grid, no 3D, no gradients | The data is the only loud thing |\n| Legend for 2+ series, direct label on the one that matters | Identity never by color alone |\n| ≤ ~6 colors per chart; color follows the entity | Readable, stable across filters |\n| Status colors only for state, with icon/word; avoid red–green as the only difference | Accessibility |\n| Deployment events overlaid on time series | Connects changes to symptoms |\n\n\u003cdetails>\n\u003csummary>Open-source variant (Grafana)\u003c/summary>\n\nThe same L1 template as Grafana JSON, generated and import-tested: [dashboards/](../dashboards/) (`service-red.json`, 19 panels, variables `service`, `namespace`, `slo`, deploy annotations).\n\n\u003c/details>\n\n## Sources\n\n- [Dynatrace: Dashboards](https://docs.dynatrace.com/docs/analyze-explore-automate/dashboards-and-notebooks/dashboards-new) · [Dashboard variables](https://docs.dynatrace.com/docs/analyze-explore-automate/dashboards-and-notebooks/dashboards-new/components/dashboard-component-variable) ✅ 2026-11-20\n- [Dynatrace: Monaco](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/monaco-getting-started) ✅ 2026-11-20\n- [Grafana: Dashboard best practices / maturity levels](https://grafana.com/docs/grafana/latest/best-practices/dashboard-management-maturity-levels/) · [Visualizations](https://grafana.com/docs/grafana/latest/visualizations/panels-visualizations/visualizations/) ✅ 2026-11-20\n- Chart rules: data-visualization method used to build this page (colorblind-validated palette) ⚠️\n- Level names, audience table, archive rule: rules of thumb ⚠️\n", "standard/15-opentelemetry-practices.md": "# 15 · OpenTelemetry best practices\n\n> OpenTelemetry is the **standard way to produce and move telemetry**; the backend (here Dynatrace) is a\n> destination you can change. The value comes from consistency: the same names, the same resource identity, the same\n> pipeline for every service. These rules are what made the aks-observability lab work.\n\n## 1. Resource identity: who sent this?\n\nEvery signal from a service carries the same resource attributes. Set them once (Operator / env vars), never in code.\n\n| Attribute | Example | Set by |\n|---|---|---|\n| `service.name` | `checkout` | `OTEL_SERVICE_NAME` or Operator (defaults to the workload name) |\n| `service.namespace` | `payments` | `OTEL_RESOURCE_ATTRIBUTES` |\n| `service.version` | `1.42.0` / image tag | Pipeline → env var or pod label via `k8sattributes` ([12](12-releases-and-dora.md)) |\n| `deployment.environment.name` | `prod` | Gateway `resource` processor |\n| `k8s.cluster.name`, `k8s.cluster.uid` | `aks-prod-weu`, kube-system UID | Gateway `resource` processor |\n| `k8s.namespace.name`, `k8s.pod.name`, `k8s.deployment.name` | – | `k8sattributes` processor |\n| `team` (custom) | `payments` | Pod label → `k8sattributes` ([20](20-ownership-and-communication.md)) |\n\n## 2. Semantic conventions: standard names\n\n| Practice | Why |\n|---|---|\n| Use semconv names (`http.route`, `http.response.status_code`, `db.system.name`, `messaging.system`) | Every tool, dashboard and alert template understands them |\n| Know the stability: **HTTP stable** (since v1.23.0), **database stable** (2025), messaging and many others still in development | Stable names won't change under you |\n| During migrations use `OTEL_SEMCONV_STABILITY_OPT_IN` (`http`, `database`, or `…/dup` to emit both) | Switch dashboards and alerts before old names disappear |\n| Custom metrics: lowercase, dot-separated namespace (`checkout.orders.created`), unit in the `unit` field (UCUM: `s`, `By`, `{request}`), not in the name | Consistent with semconv; Dynatrace and Prometheus both convert cleanly |\n| Duration in seconds, as a histogram | Percentiles and averages from one instrument |\n| Bounded attribute values on metrics only ([19](19-cost-and-cardinality.md)) | IDs go on spans and logs |\n\n## 3. Instrumentation\n\n| Practice | Why |\n|---|---|\n| **Zero-code first**: OTel Operator `Instrumentation` resource + namespace annotation | New services are traced on their first deploy (lab) |\n| Opt out per pod for non-app containers (databases, brokers) | No agent where it can't help |\n| Add the SDK only for business spans and metrics (orders, payments) | Auto-instrumentation can't know business meaning |\n| **Keep experimental instrumentations off** | Lab: the .NET ADO.NET instrumentation broke trace context after every DB call |\n| One agent per process: don't run OneAgent code module **and** OTel auto-instrumentation on the same service | Duplicate spans; both use the runtime's profiler slot (.NET) |\n| Propagation: W3C `tracecontext` + `baggage` | Works across OTel, Dynatrace RUM and OneAgent |\n| Logs carry `trace_id` / `span_id` | One click from a log line to its trace |\n\n```yaml\n# OTel Operator: one Instrumentation per namespace (or cluster-wide), then annotate the namespace\napiVersion: opentelemetry.io/v1alpha1\nkind: Instrumentation\nmetadata: { name: default, namespace: shop }\nspec:\n  exporter: { endpoint: http://$(OTEL_NODE_IP):4318 }     # the agent on the same node\n  propagators: [tracecontext, baggage]\n  sampler: { type: parentbased_always_on }                # sample at the gateway (tail), not in apps\n  env:\n    - { name: OTEL_SEMCONV_STABILITY_OPT_IN, value: \"http,database\" }\n  dotnet:\n    env:\n      - { name: OTEL_DOTNET_AUTO_TRACES_ADONET_INSTRUMENTATION_ENABLED, value: \"false\" }   # lab finding\n# kubectl annotate namespace shop instrumentation.opentelemetry.io/inject-dotnet=default\n```\n\n## 4. Traces: metrics from spans and sampling\n\n### Metrics from traces\n\n| Option | Where it runs | Good for |\n|---|---|---|\n| **Span metrics connector** (OTel Collector) | Gateway, before sampling | RED per service/route/client from all spans ([04](04-endpoint-coverage.md)) |\n| **TraceQL metrics** | Query time in Tempo | Ad-hoc questions: \"error rate of spans with attribute X\" |\n\n```text\n# TraceQL metrics (Tempo): error % for checkout, and p99 by route\n100 * ({ resource.service.name = \"checkout\" && status = error } | rate())\n    / ({ resource.service.name = \"checkout\" } | rate())\n\n{ resource.service.name = \"checkout\" && span.kind = server } | quantile_over_time(duration, .99) by (span.http.route)\n```\n\n⚠️ Generate span metrics **before** sampling. Otherwise rates are undercounted. TraceQL metrics can extrapolate for sampling, but check the docs for your Tempo version.\n\n### Sampling\n\n| Type | Decision made | Pros | Cons |\n|---|---|---|---|\n| **Head sampling** (SDK, e.g. `parentbased_traceidratio`) | At the start of the trace | Cheap, simple | Can drop the one error you needed |\n| **Tail sampling** (Collector `tail_sampling` processor) | After the trace completes | Keep all errors and slow traces | All spans of a trace must reach the **same** collector (use a load-balancing exporter by trace ID); memory cost |\n\n```yaml\nprocessors:\n  tail_sampling:\n    decision_wait: 10s\n    policies:\n      - name: errors\n        type: status_code\n        status_code: { status_codes: [ERROR] }\n      - name: slow\n        type: latency\n        latency: { threshold_ms: 500 }\n      - name: baseline\n        type: probabilistic\n        probabilistic: { sampling_percentage: 10 }\n```\n\nA trace is kept if **any** policy says sample. Errors and slow requests are always kept, plus 10% of everything else ⚠️.\n\n\n## 5. Pipeline and collector\n\n| Practice | Section |\n|---|---|\n| Three tiers: agent (DaemonSet), cluster collector (1 replica), gateway (2+ replicas) | [16](16-collector-templates.md) |\n| Mask, filter, enrich, convert **in the gateway**, once | [16](16-collector-templates.md) |\n| Durable buffer at the edge (agent disk), backpressure in the middle | [16](16-collector-templates.md) |\n| Monitor the collectors themselves | [16](16-collector-templates.md#self-monitoring) |\n| Validate configs in CI (`otelcol validate`), pin versions, test after upgrades | `make check-collector` |\n\n## 6. Dynatrace-specific rules\n\n| Rule | Why |\n|---|---|\n| Metrics as **delta** (`cumulative_to_delta` in one gateway hop) | Cumulative counters are dropped |\n| ≤ 50 dimensions per data point | The whole point is dropped above it |\n| ≤ 4 MB per request, OTLP **protobuf** | Larger requests rejected; JSON rejected (lab) |\n| Token: `metrics.ingest`, `logs.ingest`, `openTelemetryTrace.ingest` (or platform token `openpipeline:*:ingest`) | Least privilege |\n| Set `k8s.*` and host resource attributes | Links OTel data to Dynatrace topology |\n| Histograms cost 10 data points each | Send them where you use them ([17](17-dynatrace-integration.md)) |\n\n## 7. Security\n\n| Practice | Source |\n|---|---|\n| Secrets via env vars / secret store, never in the config file | OTel docs |\n| Bind receivers to the pod IP, not `0.0.0.0` (default is localhost since v0.110.0) | OTel docs |\n| TLS + auth (bearer token, mTLS) on any collector reachable from outside the cluster | OTel docs |\n| Only the components you need (custom build with the Collector Builder) | OTel docs |\n| Run as non-root, minimal RBAC | OTel docs |\n| Redact in the gateway before export ([16](16-collector-templates.md)) | OTel docs + lab |\n\n## 8. Versions and upgrades\n\n| Practice | Why |\n|---|---|\n| Pin collector, Operator and agent versions | Component and metric names change (lab: `_total` dropped in 0.162; `otlphttp` → `otlp_http`) |\n| Upgrade in staging first, rerun the proofs (validate, trace continuity, alert firing) | \"Enabled\" is not \"working\" |\n| Batch processor → exporter batching | The collector project is deprecating the batch processor in favor of exporter-level batching |\n\n## Sources\n\n- [OTel: Resources](https://opentelemetry.io/docs/concepts/resources/) · [semconv: Service](https://opentelemetry.io/docs/specs/semconv/resource/service/) · [Deployment](https://opentelemetry.io/docs/specs/semconv/resource/deployment-environment/) ✅\n- [OTel: HTTP semantic conventions](https://opentelemetry.io/docs/specs/semconv/http/) · [declared stable](https://opentelemetry.io/blog/2023/http-conventions-declared-stable/) · [Database spans](https://opentelemetry.io/docs/specs/semconv/db/database-spans/) ✅ 2026-11-20\n- [OTel: Metrics semantic conventions (naming, units)](https://opentelemetry.io/docs/specs/semconv/general/metrics/) 📚\n- [OTel Operator](https://opentelemetry.io/docs/platforms/kubernetes/operator/) 📚\n- [OTel: Collector configuration best practices](https://opentelemetry.io/docs/security/config-best-practices/) · [hosting best practices](https://opentelemetry.io/docs/security/hosting-best-practices/) ✅ 2026-11-20\n- [OTel: Deprecating the batch processor](https://opentelemetry.io/blog/2026/collector-batching-migration/) ✅ 2026-11-20\n- Dynatrace rules: see [17](17-dynatrace-integration.md) sources ✅; lab findings ✅ measured\n", "standard/16-collector-templates.md": "# 16 · Collector templates and pipelines\n\n> Three tiers, each with one job. The templates in [collector/](../collector/) export to **Dynatrace**; adding a\n> second backend is one more exporter in the gateway. All templates pass `otelcol validate` with collector 0.162.0\n> and are derived from the aks-observability lab, where their behavior was tested.\n\n## The three tiers\n\n\u003cdiv data-widget=\"viz\" data-chart=\"collector-tiers\">\u003c/div>\n\n| Tier | Runs as | Reads | Job | State | Template |\n|---|---|---|---|---|---|\n| **Agent** | DaemonSet (every node) | Container logs, kubelet stats, OTLP from local pods | Collect, add pod metadata, parse logs, **buffer on disk** | Persistent queue + log checkpoints | [collector/agent.yaml](../collector/) |\n| **Cluster collector** | Deployment, **1 replica** | Kubernetes API (objects, events), synthetic checks | Cluster state, restarts, OOM reason, events | None | [collector/cluster.yaml](../collector/) |\n| **Gateway** | Deployment, 2+ replicas, PDB | OTLP from agents and cluster collector | Identity, masking, label allow-list, filtering, delta, export | Memory queue that **blocks** when full | [collector/gateway.yaml](../collector/) |\n\nWhy three: the agent must run on every node; the cluster collector must run **once** (it duplicates data otherwise); the gateway applies every rule once and is the only thing that knows the backend.\n\n## Base pipelines\n\n| Tier | Pipeline | Receivers | Processors (in order) | Exporter |\n|---|---|---|---|---|\n| Agent | metrics | `otlp`, `kubeletstats` | `memory_limiter`, `k8sattributes` | gateway (persistent queue) |\n| Agent | logs | `otlp`, `filelog` | `memory_limiter`, `k8sattributes`, `transform/parse_json_logs` | gateway |\n| Agent | traces | `otlp` | `memory_limiter`, `k8sattributes` | gateway |\n| Cluster | metrics | `k8s_cluster`, `httpcheck` | `memory_limiter` | gateway |\n| Cluster | logs | `k8sobjects` (events) | `memory_limiter` | gateway |\n| Gateway | metrics | `otlp` | `memory_limiter`, `resource/cluster`, `transform/metric_labels`, `cumulative_to_delta` | Dynatrace |\n| Gateway | logs | `otlp` | `memory_limiter`, `transform/redact`, `resource/cluster` | Dynatrace |\n| Gateway | traces | `otlp` | `memory_limiter`, `filter/drop_health_checks`, `transform/redact`, `resource/cluster` | Dynatrace |\n\nProcessor order rule: `memory_limiter` first; filters before expensive transforms; identity and conversion last.\n\n## Settings that matter (all measured in the lab)\n\n| Setting | Where | Effect measured |\n|---|---|---|\n| Persistent `sending_queue` on `file_storage` + `storeCheckpoints` | Agent | Log loss in a 10-min backend outage: **83% → 0%** (also 0% when the agent was killed mid-outage) |\n| `retry_on_failure.max_elapsed_time: 0` | Agent, gateway | Default gives up after 5 min = data loss |\n| Byte batches 1–3 MB | Agent, gateway | Stays under Dynatrace's 4 MB request limit during catch-up |\n| `block_on_overflow: true` | Gateway | Backpressure: agents keep data on disk instead of the gateway dropping it |\n| `transform/metric_labels` allow-list | Gateway | Labels 50 → 28; series churn on container restart 470 → 18 |\n| `transform/redact` | Gateway | No usernames, tokens, emails in Dynatrace (40,892 leaked spans before) |\n| `filter/drop_health_checks` | Gateway | Probe spans removed (1 per probe per pod, forever) |\n\n## Self-monitoring\n\nThe pipeline can fail silently: if the collector dies, its own alerts die with it. Send the collectors' internal metrics to Dynatrace (the gateway template already does) and alert on them there.\n\n```yaml\nservice:\n  telemetry:\n    metrics:\n      level: detailed            # required by Dynatrace's collector self-monitoring dashboards\n      readers:\n        - periodic:\n            exporter:\n              otlp:\n                protocol: http/protobuf\n                endpoint: ${env:DT_ENDPOINT}/v1/metrics\n                temporality_preference: delta\n```\n\n| Alert | Signal (internal metric) | Condition ⚠️ | Severity |\n|---|---|---|---|\n| Receiver refusing data | `otelcol_receiver_refused_*` | > 0 for 2 min | critical |\n| Exporter dropping data (queue full) | `otelcol_exporter_enqueue_failed_*` | > 0 for 1 min | critical |\n| Exporter send failing | `otelcol_exporter_send_failed_*` | > 0 for 5 min | warning |\n| Queue filling | `otelcol_exporter_queue_size / otelcol_exporter_queue_capacity` | > 0.8 for 5 min (OTel docs: scale out at 60–70%) | warning |\n| Exporter stuck | sent = 0 while received > 0 | 10 min | critical |\n| Collector tier missing | no self-monitoring data from a tier | 3 min | critical |\n| Node sends nothing | node without `k8s.node.*` metrics | 5 min | critical |\n\nIn Dynatrace, create these as custom alerts (anomaly detectors) on a DQL query, for example:\n\n```text\ntimeseries failed = sum(otelcol_exporter_send_failed_log_records), by:{service.instance.id, exporter}\n```\n\nCheck the exact metric keys in your tenant first: collector versions differ in naming (lab: 0.162 dropped the `_total` suffix, and rules written for `_total` matched nothing). In the lab, these alerts fired 4–11 min after a real fault; Dynatrace's built-in \"monitoring not available\" problem took ~24 min. **Test each alert by breaking something** (stop a collector, block the backend).\n\n## Adapting the templates\n\n| Change | Where |\n|---|---|\n| Endpoint and token | Gateway env `DT_ENDPOINT`, `DT_API_TOKEN` (direct SaaS, or the in-cluster ActiveGate) |\n| Cluster identity | Gateway env `K8S_CLUSTER_NAME`, `K8S_CLUSTER_UID`, `DEPLOY_ENV` |\n| Which labels Dynatrace gets | `transform/metric_labels` regex (only stable attributes you filter by) |\n| What gets masked | `transform/redact` (the lab repo has the full rule set and a test) |\n| Internal synthetic checks | `httpcheck` targets in the cluster collector |\n| A second backend | Add an exporter to the gateway pipelines ([collector/gateway-fanout.yaml](../collector/)) |\n| Deploy | OTel Collector Helm chart (`mode: daemonset` / `deployment`), the OTel Operator `OpenTelemetryCollector` CR, or Dynatrace's collector distribution |\n\n## Anti-patterns\n\n| ❌ | ✅ |\n|---|---|\n| Apps export straight to Dynatrace | Apps → agent → gateway: one place for masking, identity and backend changes |\n| `k8s_cluster` in the DaemonSet | One cluster collector (DaemonSet = duplicate data per node) |\n| Tail sampling or `cumulative_to_delta` behind a round-robin load balancer | Same trace / series must reach the same gateway replica |\n| Memory-only queues at the edge | Persistent queue on the agent |\n| No self-monitoring | Internal metrics → Dynatrace + alerts, tested |\n| Contrib image with every component in production | Pinned version; ideally a custom build with only the components you use |\n\n## Sources\n\n- [OTel: Deployment patterns](https://opentelemetry.io/docs/collector/deploy/) · [Agent-to-gateway](https://opentelemetry.io/docs/collector/deploy/other/agent-to-gateway/) · [Gateway](https://opentelemetry.io/docs/collector/deploy/gateway/): tiers, tail sampling on gateways, single writer, k8s_cluster duplicates ✅ 2026-11-20\n- [OTel: Internal telemetry](https://opentelemetry.io/docs/collector/internal-telemetry/) · [Scaling](https://opentelemetry.io/docs/collector/scaling/) · [Resiliency](https://opentelemetry.io/docs/collector/resiliency/): queue metrics, 60–70% scaling guidance ✅ 2026-11-20\n- [OTel: Collector anti-patterns](https://opentelemetry.io/blog/2024/otel-collector-anti-patterns/) 📚\n- [Dynatrace: Collector self-monitoring](https://docs.dynatrace.com/docs/ingest-from/opentelemetry/collector/self-monitoring): level detailed, OTLP periodic reader, delta ✅ 2026-11-20\n- [Dynatrace: Monitor Kubernetes with the OTel Collector](https://docs.dynatrace.com/docs/ingest-from/opentelemetry/collector/use-cases/kubernetes/k8s-monitoring): k8s_cluster + kubeletstats + events, hostmetrics overlap ✅ 2026-11-20\n- [Dynatrace: Anomaly detection configuration](https://docs.dynatrace.com/docs/dynatrace-intelligence/anomaly-detection/anomaly-detection-configuration) · [via API](https://docs.dynatrace.com/docs/dynatrace-intelligence/anomaly-detection/set-up-anomaly-detectors-via-api): DQL static-threshold custom alerts ✅ 2026-11-20\n- Lab: `~/projects/aks-observability` (otel-*-values.yaml, otel-collector-rules.yaml, results/log-loss.md, cardinality.md, pipeline-faults.md) ✅ measured\n", "standard/17-dynatrace-integration.md": "# 17 · Dynatrace platform: OneAgent, ActiveGate and OpenTelemetry\n\n> **In 30 seconds:** OpenTelemetry **collects** (one pipeline, standard names, masking and filtering in your gateway);\n> Dynatrace **stores, analyzes and alerts** (Grail, Davis, SLOs, Workflows). Keep OneAgent where its automatic depth is\n> worth the price; send everything else through the OTel collectors to Dynatrace, where **you decide what is sent and\n> paid for**. Lab results quoted here come from the aks-observability comparison (two identical clusters, 2026-10).\n\n## The architecture\n\n\u003cdiv data-widget=\"viz\" data-chart=\"dt-architecture\">\u003c/div>\n\n| Component | Role | Where it runs |\n|---|---|---|\n| **OTel agent** (DaemonSet) | Container logs, kubelet stats, OTLP from local pods; disk buffer | Every node ([16](16-collector-templates.md)) |\n| **OTel cluster collector** | Kubernetes state, events, internal synthetic checks | 1 replica |\n| **OTel gateway** | Identity, masking, label allow-list, filtering, delta, **export to Dynatrace** | 2+ replicas |\n| **ActiveGate** (in-cluster, via Dynatrace Operator) | Kubernetes API monitoring; routes OneAgent traffic; optional OTLP endpoint inside the cluster | DynaKube |\n| **OneAgent code module** (optional) | Automatic deep traces and code-level detail for selected tier-1 services | Injected by the Operator |\n| **Dynatrace** | Grail (metrics, logs, traces, events), Davis problems, SLOs, dashboards, Workflows | SaaS |\n\nThe gateway exports straight to the tenant (`https://\u003ctenant>.live.dynatrace.com/api/v2/otlp`, as in the lab) or to the in-cluster ActiveGate. A **second backend** (e.g. an open-source stack) is one more exporter in the gateway: [collector/gateway-fanout.yaml](../collector/).\n\n## OneAgent path vs OpenTelemetry path\n\n\u003cdiv data-widget=\"viz\" data-chart=\"dt-paths\">\u003c/div>\n\n| | OneAgent | OpenTelemetry → Dynatrace |\n|---|---|---|\n| What you get | Automatic deep traces, code-level hotspots, Smartscape topology, Davis root cause | Exactly what your instrumentation and collectors send (standard names, any language) |\n| Effort | Almost none (Operator + annotations) | Instrumentation (Operator), collector config, enrichment |\n| Control of volume | Low (adaptive traffic management) | **High**: filter, drop labels, sample, mask in the gateway |\n| Billing driver (DPS) | Full-Stack: memory GiB-hours (trace and metric allowance included) | Metrics per data point; traces and logs per GiB; **no Kubernetes pod-hours** without a Dynatrace agent |\n| Portability | Dynatrace only | Same data can go to any backend |\n| Best for | Tier-1 services where code-level detail pays off | Everything else; the default |\n\n## Decide per workload\n\n| Workload | Recommendation | Why |\n|---|---|---|\n| Tier-1, customer-facing, hard to debug | OTel auto-instrumentation (default) **or** OneAgent code module if you need code-level hotspots | Depth where incidents cost money |\n| Tier-2 / internal services | OTel auto-instrumentation → gateway → Dynatrace | Cheaper, portable, same names everywhere |\n| Batch / cron jobs | OTel metrics (last success, duration) | Short-lived pods; agents add little |\n| Cluster and nodes | OTel `k8s_cluster` + `kubeletstats` ([08](08-kubernetes-cluster.md)) + ActiveGate Kubernetes monitoring | Coverage with OTel; Kubernetes app experience from the ActiveGate |\n| Prometheus exporters (DB, queue, ingress) | Scrape with the **OTel Collector** and send to Dynatrace | Dynatrace recommends it over ActiveGate scraping at scale (limits: 1,000 exporter pods, 1,000 metrics per pod) |\n| Logs | **One** collector per log stream: OTel `filelog` **or** the OneAgent log module | Two collectors = double cost and duplicates |\n| Never | OneAgent code module **and** OTel auto-instrumentation on the same service | Duplicate spans; shared runtime profiler slot (.NET) |\n\n## Rules for sending OpenTelemetry to Dynatrace\n\nTemplates that apply all of these: [collector/gateway.yaml](../collector/) ([16](16-collector-templates.md)).\n\n| Rule | Detail | Source |\n|---|---|---|\n| Delta temporality | `cumulative_to_delta` in one gateway hop; each s
