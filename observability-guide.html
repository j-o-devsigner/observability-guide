26-11-20 |\n| [Grafana Annotations HTTP API](https://grafana.com/docs/grafana/latest/developers/http_api/annotations/) | `POST /api/annotations` with `tags`, `text` (required), epoch ms | ✅ 2026-11-20 |\n| [Argo CD notifications: triggers](https://argo-cd.readthedocs.io/en/stable/operator-manual/notifications/triggers/) · [catalog](https://argo-cd.readthedocs.io/en/stable/operator-manual/notifications/catalog/) | `on-deployed` = synced and healthy, once per revision | ✅ 2026-11-20 |\n| [Argo Rollouts analysis](https://argo-rollouts.readthedocs.io/en/stable/features/analysis/) · [Prometheus provider](https://argo-rollouts.readthedocs.io/en/stable/analysis/prometheus/) | `AnalysisTemplate`, `successCondition`, `failureLimit` | ✅ 2026-11-20 |\n| [Martin Fowler, *Strangler Fig Application*](https://martinfowler.com/bliki/StranglerFigApplication.html) | Incremental migration, old and new in parallel | 📚 |\n\n## Incidents and ownership\n\n| Source | Supports | Status |\n|---|---|---|\n| [Google SRE Book, *Managing Incidents*](https://sre.google/sre-book/managing-incidents/) | Incident roles (IC, ops, comms) | 📚 |\n| [Google SRE Book, *Postmortem Culture*](https://sre.google/sre-book/postmortem-culture/) | Blameless postmortems | 📚 |\n| [PagerDuty Incident Response](https://response.pagerduty.com/) | Roles, process | 📚 |\n| [Google SRE Workbook, *Engagement Model*](https://sre.google/workbook/engagement-model/) | Production Readiness Review before GA | ✅ 2026-11-20 |\n| [DORA: Generative organizational culture](https://dora.dev/capabilities/generative-organizational-culture/) | Westrum survey; high-trust culture predicts delivery and organizational performance | ✅ 2026-11-20 |\n| [DORA: Monitoring and observability](https://dora.dev/capabilities/monitoring-and-observability/) | Avoid a single person/team owning monitoring; track changes to monitoring config | ✅ 2026-11-20 |\n| [Backstage software catalog](https://backstage.io/docs/features/software-catalog/) | Machine-readable ownership | 📚 |\n| RACI split, ritual cadences, maturity levels, transition phase lengths | – | ⚠️ |\n\n## Dynatrace\n\n| Source | Supports | Status |\n|---|---|---|\n| [Version detection methods](https://docs.dynatrace.com/docs/deliver/release-monitoring/version-detection-strategies-latest) · [Build label propagation](https://docs.dynatrace.com/docs/ingest-from/setup-on-k8s/guides/metadata-automation/build-label-propagation) | `app.kubernetes.io/version` → `DT_RELEASE_VERSION` (pod labels only), enabled with DynaKube feature flag `feature.dynatrace.com/label-version-detection=true` | ✅ 2026-11-20 |\n| [Events API v2: POST an event](https://docs.dynatrace.com/docs/dynatrace-api/environment-api/events-v2/post-event) | `eventType: CUSTOM_DEPLOYMENT` | ✅ 2026-11-20 |\n| [Site Reliability Guardian](https://docs.dynatrace.com/docs/deliver/site-reliability-guardian) · [release validation](https://docs.dynatrace.com/docs/deliver/quality-gates) | Release validation with objectives (DQL), \"Four golden signals\" template, triggered by SDLC events | ✅ 2026-11-20 |\n| [Event analysis and correlation](https://docs.dynatrace.com/docs/discover-dynatrace/platform/davis-ai/root-cause-analysis/concepts/events) | Davis merges events with the same root cause into one problem, using topology (not time alone) | ✅ 2026-11-20 |\n", "collector/README.md": "# Collector configs\n\n> OpenTelemetry Collector base templates, validated with the pinned collector image (`make check-collector`).\n> Derived from the aks-observability lab, where their behavior was tested. Guide: [16](../standard/16-collector-templates.md).\n\n| File | Tier | What |\n|---|---|---|\n| [`agent.yaml`](agent.yaml) | DaemonSet | Container logs (`filelog`), kubelet stats, OTLP from local pods; JSON log parsing; persistent disk queue |\n| [`cluster.yaml`](cluster.yaml) | Deployment, 1 replica | `k8s_cluster` (state, restarts, OOM reason), `k8sobjects` (events), `httpcheck` (internal synthetics) |\n| [`gateway.yaml`](gateway.yaml) | Deployment, 2+ | Identity, redaction, label allow-list, health-check filter, delta, export to **Dynatrace**, self-monitoring to Dynatrace |\n| [`gateway-fanout.yaml`](gateway-fanout.yaml) | Deployment | Variant: same stream to Dynatrace **and** an open-source stack (Mimir/Loki/Tempo) |\n| [`check.sh`](check.sh) | – | `otelcol validate` on every file (dummy env + dummy service account in `testdata/`) |\n\n## Status\n\n| Check | Result |\n|---|---|\n| `validate` with `otel/opentelemetry-collector-contrib:0.162.0` (all four files) | ✅ 2026-11-20 |\n| Behavior (log loss, churn, masking, self-monitoring alerts) | ✅ measured in the lab with the original Helm values these templates come from |\n\n## Adapt\n\n| Setting | File |\n|---|---|\n| `DT_ENDPOINT`, `DT_API_TOKEN` (SaaS or in-cluster ActiveGate) | gateway |\n| `K8S_CLUSTER_NAME`, `K8S_CLUSTER_UID`, `DEPLOY_ENV` | gateway |\n| Gateway service address `otel-gateway.observability.svc` | agent, cluster |\n| Label allow-list, redaction rules | gateway |\n| `httpcheck` targets | cluster |\n| Tail sampling / `cumulative_to_delta`: same trace or series must reach the same gateway replica | gateway |\n", "collector/agent.yaml": "# TIER 1 · AGENT (DaemonSet, one per node)\n# Reads what only the node can see (container logs, kubelet stats) and receives OTLP from pods on the node.\n# Sends everything to the gateway. Keeps a DURABLE buffer on the node's disk (the only stateful tier).\n# Based on the aks-observability lab agent (tested: 0 log lines lost in a 10-min backend outage, also with a restart).\n# Needs: env K8S_NODE_NAME (downward API spec.nodeName), hostPath /var/log/pods (read-only) and /var/lib/otelcol (rw),\n#        RBAC for nodes/stats + nodes/proxy, pods, namespaces, replicasets.\n# Validated with otel/opentelemetry-collector-contrib:0.162.0 (`make check-collector`).\n\nextensions:\n  file_storage:\n    directory: /var/lib/otelcol        # log read positions + persistent export queue survive agent restarts\n    create_directory: true\n  health_check:\n    endpoint: ${env:MY_POD_IP}:13133\n\nreceivers:\n  otlp:\n    protocols:\n      grpc:\n        endpoint: ${env:MY_POD_IP}:4317   # pods send to the agent on their node (hostPort / node IP)\n      http:\n        endpoint: ${env:MY_POD_IP}:4318\n\n  filelog:\n    include: [/var/log/pods/*/*/*.log]\n    exclude: [/var/log/pods/*/otel-agent*/*.log]  # never collect your own logs in a loop\n    start_at: end\n    include_file_path: true\n    storage: file_storage\n    operators:\n      - type: container                            # parses containerd/docker format, adds k8s.pod/namespace/container\n        id: container-parser\n\n  kubeletstats:\n    collection_interval: 30s\n    auth_type: serviceAccount\n    endpoint: https://${env:K8S_NODE_NAME}:10250\n    insecure_skip_verify: true                     # many kubelets use self-signed serving certs; prefer a CA if you have one\n    metric_groups: [node, pod, container, volume]\n    metrics:                                       # off by default; \"memory vs limit\" and \"CPU vs request\" directly\n      k8s.container.cpu_limit_utilization: { enabled: true }\n      k8s.container.cpu_request_utilization: { enabled: true }\n      k8s.container.memory_limit_utilization: { enabled: true }\n      k8s.container.memory_request_utilization: { enabled: true }\n  # hostmetrics is NOT used: Dynatrace notes it duplicates kubeletstats node metrics. Add it only for non-k8s hosts.\n\nprocessors:\n  memory_limiter:\n    check_interval: 1s\n    limit_percentage: 80\n    spike_limit_percentage: 25\n\n  k8sattributes:\n    filter:\n      node_from_env_var: K8S_NODE_NAME             # only watch pods of this node (scales to big clusters)\n    extract:\n      metadata: [k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.deployment.name, k8s.node.name, k8s.container.name]\n      labels:\n        - { tag_name: service.version, key: app.kubernetes.io/version, from: pod }\n        - { tag_name: team, key: team, from: pod }\n\n  # JSON log lines -> attributes, level -> severity, trace context -> trace_id/span_id (from the lab, generic keys)\n  transform/parse_json_logs:\n    error_mode: ignore\n    log_statements:\n      - context: log\n        conditions:\n          - IsString(body) and IsMatch(body, \"^\\\\s*\\\\{\")\n        statements:\n          - merge_maps(attributes, ParseJSON(body), \"insert\")\n          - set(severity_text, attributes[\"level\"]) where attributes[\"level\"] != nil\n          - set(severity_text, attributes[\"severity\"]) where severity_text == \"\" and attributes[\"severity\"] != nil\n          - set(severity_text, ConvertCase(severity_text, \"upper\")) where severity_text != \"\"\n          - set(body, attributes[\"msg\"]) where attributes[\"msg\"] != nil\n          - set(body, attributes[\"message\"]) where attributes[\"message\"] != nil\n          - set(trace_id.string, attributes[\"trace_id\"]) where attributes[\"trace_id\"] != nil\n          - set(span_id.string, attributes[\"span_id\"]) where attributes[\"span_id\"] != nil\n          - delete_matching_keys(attributes, \"^(msg|message|time|ts)$\")\n      - context: log\n        statements:\n          - set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == \"DEBUG\"\n          - set(severity_number, SEVERITY_NUMBER_INFO) where IsMatch(severity_text, \"^(INFO|INFORMATION)$\")\n          - set(severity_number, SEVERITY_NUMBER_WARN) where IsMatch(severity_text, \"^(WARN|WARNING)$\")\n          - set(severity_number, SEVERITY_NUMBER_ERROR) where IsMatch(severity_text, \"^(ERROR|ERR)$\")\n          - set(severity_number, SEVERITY_NUMBER_FATAL) where IsMatch(severity_text, \"^(CRITICAL|FATAL|PANIC)$\")\n\nexporters:\n  otlp_grpc/gateway:\n    endpoint: otel-gateway.observability.svc:4317\n    tls: { insecure: true }                        # in-cluster hop; use TLS if your policy requires it\n    sending_queue:                                 # persistent: survives agent restarts and long outages (lab: 0 lost)\n      enabled: true\n      storage: file_storage\n      sizer: bytes\n      queue_size: 536870912                        # 512 MiB of disk per node\n      num_consumers: 2                             # paced replay after an outage\n      batch: { flush_timeout: 5s, sizer: bytes, min_size: 1048576, max_size: 3145728 }   # \u003c 4 MB requests\n    retry_on_failure:\n      enabled: true\n      max_elapsed_time: 0                          # never give up on retryable errors (default 5 min = data loss)\n      max_interval: 30s\n\nservice:\n  extensions: [file_storage, health_check]\n  telemetry:\n    metrics:\n      level: detailed\n  pipelines:\n    metrics:\n      receivers: [otlp, kubeletstats]\n      processors: [memory_limiter, k8sattributes]\n      exporters: [otlp_grpc/gateway]\n    logs:\n      receivers: [otlp, filelog]\n      processors: [memory_limiter, k8sattributes, transform/parse_json_logs]\n      exporters: [otlp_grpc/gateway]\n    traces:\n      receivers: [otlp]\n      processors: [memory_limiter, k8sattributes]\n      exporters: [otlp_grpc/gateway]\n", "collector/check.sh": "#!/usr/bin/env bash\n# Validate every collector/*.yaml with the pinned collector image (no cluster needed).\n# Dummy env values and a dummy service-account folder (testdata/, validate-only cert) let receivers that read\n# in-pod files (kubeletstats with serviceAccount auth) build their config.\nset -euo pipefail\nIMAGE=\"${1:-otel/opentelemetry-collector-contrib:0.162.0}\"\nDIR=\"$(cd \"$(dirname \"$0\")\" && pwd)\"\nrc=0\nfor f in \"$DIR\"/*.yaml; do\n  name=\"$(basename \"$f\")\"\n  if docker run --rm \\\n      -e MY_POD_IP=127.0.0.1 -e K8S_NODE_NAME=node1 -e DT_TENANT=example -e DT_API_TOKEN=dummy \\\n      -e DT_ENDPOINT=https://example.live.dynatrace.com/api/v2/otlp \\\n      -e K8S_CLUSTER_NAME=example -e K8S_CLUSTER_UID=example -e DEPLOY_ENV=prod \\\n      -v \"$DIR\":/c:ro -v \"$DIR/testdata/serviceaccount\":/var/run/secrets/kubernetes.io/serviceaccount:ro \\\n      \"$IMAGE\" validate --config=\"/c/$name\"; then\n    echo \"OK   $name\"\n  else\n    echo \"FAIL $name\"; rc=1\n  fi\ndone\nexit $rc\n", "collector/cluster.yaml": "# TIER 2 · CLUSTER COLLECTOR (Deployment, exactly 1 replica)\n# Watches the Kubernetes API: object state (deployments, pods, nodes, jobs, HPAs), container restarts and the\n# OOMKilled reason, Kubernetes events as logs, and internal synthetic checks. One replica only: k8s_cluster and\n# k8sobjects produce duplicates when run more than once (OTel docs).\n# Based on the aks-observability lab cluster collector. Validated with otel/opentelemetry-collector-contrib:0.162.0.\n# Needs RBAC: get/list/watch on nodes, namespaces, pods, events, deployments, replicasets, statefulsets, daemonsets,\n#             jobs, cronjobs, horizontalpodautoscalers, resourcequotas.\n\nreceivers:\n  k8s_cluster:\n    collection_interval: 30s\n    node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]\n    allocatable_types_to_report: [cpu, memory]\n    resource_attributes:\n      k8s.container.status.last_terminated_reason: { enabled: true }   # OOMKilled, Error... (lab: detect OOM by reason)\n\n  k8sobjects:\n    objects:\n      - name: events\n        mode: watch\n        group: events.k8s.io                         # scheduling failures, image pulls, OOM, back-off, rollouts\n\n  httpcheck:                                       # internal synthetic checks; identify the traffic so it can be filtered\n    collection_interval: 30s\n    targets:\n      - endpoint: http://checkout.shop.svc:8080/healthz\n        method: GET\n        headers: { User-Agent: otel-httpcheck }\n\nprocessors:\n  memory_limiter:\n    check_interval: 1s\n    limit_percentage: 80\n    spike_limit_percentage: 25\n\nexporters:\n  otlp_grpc/gateway:\n    endpoint: otel-gateway.observability.svc:4317\n    tls: { insecure: true }\n    sending_queue: { enabled: true, queue_size: 5000 }\n    retry_on_failure: { enabled: true, max_elapsed_time: 0 }\n\nservice:\n  telemetry:\n    metrics:\n      level: detailed\n  pipelines:\n    metrics:\n      receivers: [k8s_cluster, httpcheck]\n      processors: [memory_limiter]\n      exporters: [otlp_grpc/gateway]\n    logs:\n      receivers: [k8sobjects]\n      processors: [memory_limiter]\n      exporters: [otlp_grpc/gateway]\n", "collector/gateway-fanout.yaml": "# OTel gateway that fans out to the open-source stack AND Dynatrace (standard/15).\n# Validated with otel/opentelemetry-collector-contrib:0.162.0 (`make check-collector`).\n# Component names follow collector >= 0.16x (otlp_http, cumulative_to_delta); older docs use otlphttp / cumulativetodelta.\n# Adapt: endpoints, the label allow-list, the Dynatrace filter, and sampling percentages.\n\nreceivers:\n  otlp:\n    protocols:\n      grpc: { endpoint: 0.0.0.0:4317 }\n      http: { endpoint: 0.0.0.0:4318 }\n\nprocessors:\n  memory_limiter:\n    check_interval: 1s\n    limit_percentage: 80\n    spike_limit_percentage: 20\n\n  k8sattributes:\n    extract:\n      metadata: [k8s.namespace.name, k8s.deployment.name, k8s.pod.name, k8s.node.name]\n      labels:\n        - tag_name: service.version\n          key: app.kubernetes.io/version\n          from: pod\n        - tag_name: team\n          key: team\n          from: pod\n\n  # Dynatrace: max 50 dimensions per data point (whole point dropped above it) -> keep only what you query\n  transform/metric_labels:\n    error_mode: ignore\n    metric_statements:\n      - context: datapoint\n        statements:\n          - keep_matching_keys(attributes, \"^(http\\\\.route|http\\\\.request\\\\.method|http\\\\.response\\\\.status_code|client\\\\.id|service\\\\.version|error\\\\.type)$\")\n\n  # Cost control for Dynatrace only: histograms count as 10 data points each; keep them in Prometheus\n  filter/dynatrace_metrics:\n    error_mode: ignore\n    metrics:\n      metric:\n        - 'type == METRIC_DATA_TYPE_HISTOGRAM'\n        - 'IsMatch(name, \"^(go_|process_|otelcol_).*\")'\n\n  # Dynatrace ingests delta temporality only. Correct only if each series always reaches the same gateway instance.\n  cumulative_to_delta:\n    max_staleness: 10m\n\n  tail_sampling:\n    decision_wait: 10s\n    policies:\n      - name: errors\n        type: status_code\n        status_code: { status_codes: [ERROR] }\n      - name: slow\n        type: latency\n        latency: { threshold_ms: 500 }\n      - name: baseline\n        type: probabilistic\n        probabilistic: { sampling_percentage: 10 }\n\n  batch:\n    send_batch_size: 2048\n    send_batch_max_size: 4096   # keep requests well under Dynatrace's 4 MB limit (lab: cap in bytes where supported)\n    timeout: 5s\n\nexporters:\n  # Option 1 (used in the lab): straight to the SaaS tenant\n  otlp_http/dynatrace:\n    endpoint: https://${env:DT_TENANT}.live.dynatrace.com/api/v2/otlp\n    headers:\n      Authorization: \"Api-Token ${env:DT_API_TOKEN}\"\n    sending_queue: { enabled: true, queue_size: 5000 }\n    retry_on_failure: { enabled: true, max_elapsed_time: 0s }\n  # Option 2: through the in-cluster ActiveGate (traffic stays in the cluster until the ActiveGate)\n  # otlp_http/dynatrace:\n  #   endpoint: https://\u003cdynakube>-activegate.dynatrace/e/${env:DT_ENV_ID}/api/v2/otlp\n\n  prometheusremotewrite/mimir:\n    endpoint: http://mimir-nginx.monitoring/api/v1/push\n  otlp_http/loki:\n    endpoint: http://loki-gateway.monitoring/otlp\n  otlp/tempo:\n    endpoint: tempo.monitoring:4317\n    tls: { insecure: true }\n\nservice:\n  pipelines:\n    metrics/oss:\n      receivers: [otlp]\n      processors: [memory_limiter, k8sattributes, transform/metric_labels, batch]\n      exporters: [prometheusremotewrite/mimir]\n    metrics/dynatrace:\n      receivers: [otlp]\n      processors: [memory_limiter, k8sattributes, transform/metric_labels, filter/dynatrace_metrics, cumulative_to_delta, batch]\n      exporters: [otlp_http/dynatrace]\n    traces:\n      receivers: [otlp]\n      processors: [memory_limiter, k8sattributes, tail_sampling, batch]\n      exporters: [otlp/tempo, otlp_http/dynatrace]\n    logs:\n      receivers: [otlp]\n      processors: [memory_limiter, k8sattributes, batch]\n      exporters: [otlp_http/loki, otlp_http/dynatrace]\n", "collector/gateway.yaml": "# TIER 3 · GATEWAY (Deployment, 2+ replicas, PodDisruptionBudget minAvailable 1)\n# Every rule is applied ONCE here: cluster identity, masking, label allow-list, health-check filtering,\n# delta conversion, and the export to Dynatrace. Apps and agents stay simple; change backends only here.\n# Stateless: the durable buffer is on the agents; a full queue BLOCKS (backpressure) instead of dropping.\n# Based on the aks-observability lab gateway (tested: masking, churn, log loss). Validated with\n# otel/opentelemetry-collector-contrib:0.162.0 (`make check-collector`).\n# Needs env: DT_ENDPOINT (https://\u003ctenant>.live.dynatrace.com/api/v2/otlp or the ActiveGate URL), DT_API_TOKEN\n#            (scopes: metrics.ingest, logs.ingest, openTelemetryTrace.ingest), K8S_CLUSTER_NAME, K8S_CLUSTER_UID\n#            (uid of the kube-system namespace), DEPLOY_ENV.\n# A second backend (e.g. an open-source stack) = one more exporter in the pipelines: see gateway-fanout.yaml.\n\nreceivers:\n  otlp:\n    protocols:\n      grpc:\n        endpoint: ${env:MY_POD_IP}:4317\n      http:\n        endpoint: ${env:MY_POD_IP}:4318\n\nprocessors:\n  memory_limiter:\n    check_interval: 1s\n    limit_percentage: 80\n    spike_limit_percentage: 25\n\n  # Cluster identity on every signal (same k8s.cluster.uid convention OTel and Dynatrace use)\n  resource/cluster:\n    attributes:\n      - { key: k8s.cluster.name, value: \"${env:K8S_CLUSTER_NAME}\", action: upsert }\n      - { key: k8s.cluster.uid, value: \"${env:K8S_CLUSTER_UID}\", action: upsert }\n      - { key: deployment.environment.name, value: \"${env:DEPLOY_ENV}\", action: upsert }\n\n  # Health checks and synthetic probes: no diagnostic value as spans, real cost. Only childless server spans.\n  filter/drop_health_checks:\n    error_mode: ignore\n    traces:\n      span:\n        - kind == SPAN_KIND_SERVER and IsMatch(attributes[\"http.route\"], \"^/(healthz|readyz|livez|health|ready|live)$\")\n        - kind == SPAN_KIND_SERVER and IsMatch(attributes[\"user_agent.original\"], \"^(kube-probe/|otel-httpcheck)\")\n\n  # Mask before data leaves the cluster (lab: Dynatrace stored 40,892 DB spans with a username before this).\n  # Short version of the lab rules; the lab repo has the full set and an end-to-end test (make test-redaction).\n  transform/redact:\n    error_mode: ignore\n    trace_statements:\n      - context: span\n        statements:\n          - replace_pattern(attributes[\"db.query.text\"], \"'(?:[^']|'')*'\", \"?\")\n          - replace_pattern(attributes[\"url.full\"], \"([?&][^=&#]+)=[^&#]*\", \"$${1}=REDACTED\")\n          - delete_matching_keys(attributes, \"(?i)^(http\\\\.(request|response)\\\\.header\\\\.)?(authorization|cookie|set[-_]cookie|x[-_]api[-_]key)$\")\n          - replace_all_patterns(attributes, \"value\", \"(?i)\\\\b((?:user(?:name| ?id)?|uid|password|pwd|secret|api[_-]?key|access[_-]?token)\\\\s*[=:]\\\\s*)[^\\\\s,;&\\\"$][^\\\\s,;&\\\"]*\", \"$${1}REDACTED\")\n          - replace_all_patterns(attributes, \"value\", \"(?i)\\\\b(bearer|basic)\\\\s+[A-Za-z0-9._~+/=-]+\", \"$${1} REDACTED\")\n          - replace_all_patterns(attributes, \"value\", \"eyJ[A-Za-z0-9_-]+\\\\.[A-Za-z0-9_-]+\\\\.[A-Za-z0-9_-]*\", \"REDACTED_JWT\")\n          - replace_all_patterns(attributes, \"value\", \"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\\\.[A-Za-z]{2,}\", \"REDACTED_EMAIL\")\n    log_statements:\n      - context: log\n        statements:\n          - replace_pattern(body, \"(?i)\\\\b((?:password|pwd|secret|api[_-]?key|access[_-]?token)\\\\s*[=:]\\\\s*)[^\\\\s,;&\\\"$][^\\\\s,;&\\\"]*\", \"$${1}REDACTED\") where IsString(body)\n          - replace_pattern(body, \"(?i)\\\\b(bearer|basic)\\\\s+[A-Za-z0-9._~+/=-]+\", \"$${1} REDACTED\") where IsString(body)\n          - replace_pattern(body, \"eyJ[A-Za-z0-9_-]+\\\\.[A-Za-z0-9_-]+\\\\.[A-Za-z0-9_-]*\", \"REDACTED_JWT\") where IsString(body)\n          - replace_pattern(body, \"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\\\.[A-Za-z]{2,}\", \"REDACTED_EMAIL\") where IsString(body)\n\n  # Metric labels: allow-list of STABLE resource attributes (lab: 50 -> 28 labels, restart churn 470 -> 18 series).\n  # Dynatrace drops a whole data point above 50 dimensions. Never remove a k8s.*.name (it identifies the series).\n  transform/metric_labels:\n    error_mode: ignore\n    metric_statements:\n      - context: resource\n        statements:\n          - keep_matching_keys(attributes, \"^(service\\\\.(name|namespace|version|instance\\\\.id)|deployment\\\\.environment\\\\.name|cloud\\\\.(region|availability_zone)|host\\\\.name|team|k8s\\\\.[a-z_.]+\\\\.name|k8s\\\\.(cluster|pod)\\\\.uid|k8s\\\\.container\\\\.status\\\\.last_terminated_reason)$\")\n      - context: datapoint\n        statements:\n          - delete_key(attributes, \"network.peer.address\")\n          - delete_key(attributes, \"network.peer.port\")\n\n  # Dynatrace ingests delta only. Stateful: each series must always reach the same gateway replica\n  # (fine when each agent keeps one gRPC connection to one gateway, as in the lab).\n  cumulative_to_delta:\n    max_staleness: 10m\n\nexporters:\n  otlp_http/dynatrace:\n    endpoint: ${env:DT_ENDPOINT}\n    headers:\n      Authorization: \"Api-Token ${env:DT_API_TOKEN}\"\n    sending_queue:\n      enabled: true\n      sizer: bytes\n      queue_size: 67108864                         # 64 MiB in memory; the durable buffer is on the agents\n      block_on_overflow: true                      # backpressure instead of dropping (lab: 83% -> 0% loss)\n      num_consumers: 4\n      batch: { flush_timeout: 5s, sizer: bytes, min_size: 1048576, max_size: 3145728 }   # Dynatrace limit: 4 MB\n    retry_on_failure:\n      enabled: true\n      max_elapsed_time: 0\n      max_interval: 30s\n\nservice:\n  telemetry:\n    metrics:\n      level: detailed                              # Dynatrace's collector self-monitoring dashboards need \"detailed\"\n      readers:\n        - periodic:                                # self-monitoring straight to Dynatrace (delta, OTLP/HTTP protobuf)\n            interval: 60000\n            exporter:\n              otlp:\n                protocol: http/protobuf\n                endpoint: ${env:DT_ENDPOINT}/v1/metrics\n                temporality_preference: delta\n                headers:\n                  - name: Authorization\n                    value: \"Api-Token ${env:DT_API_TOKEN}\"\n  pipelines:\n    metrics:\n      receivers: [otlp]\n      processors: [memory_limiter, resource/cluster, transform/metric_labels, cumulative_to_delta]\n      exporters: [otlp_http/dynatrace]\n    logs:\n      receivers: [otlp]\n      processors: [memory_limiter, transform/redact, resource/cluster]\n      exporters: [otlp_http/dynatrace]\n    traces:\n      receivers: [otlp]\n      processors: [memory_limiter, filter/drop_health_checks, transform/redact, resource/cluster]\n      exporters: [otlp_http/dynatrace]\n", "collector/testdata/serviceaccount/ca.crt": "-----BEGIN CERTIFICATE-----\nMIIDETCCAfmgAwIBAgIUa/2y6JtWViYdzZJomgBP6EcEy5cwDQYJKoZIhvcNAQEL\nBQAwGDEWMBQGA1UEAwwNdmFsaWRhdGUtb25seTAeFw0yNjExMjAxODIwMjhaFw0z\nNjExMTcxODIwMjhaMBgxFjAUBgNVBAMMDXZhbGlkYXRlLW9ubHkwggEiMA0GCSqG\nSIb3DQEBAQUAA4IBDwAwggEKAoIBAQCzFs4BWhEcEq+MXBWoeKlk80IADx+N2q+c\nEiBZfEP6Qy18DqAPzAw9Tp1DGluGjqfdvlXnYwdtpe797nzQd9yYr8YqTwvyHcn0\ntf6TMCuQw/4cunvuTORSFxDkbILis3b7LFGhZChJO14od7mzB0AXoz4QZxX7BCPW\n4/naYoeJ/kaoJQJLb1olW6z3UxRYlDn3fNVway46Ii5KhOL//vwqYDZAV0r3fdvs\nXWs96Xl4Zjphep/drVsDS9bf/zJxGvKf8TaIa5/42oLyZcRy6Q464l9u1BPOWixt\nX89697GuMDEitpaYItMiebXu3xdDnLLXsUkXeqDh/Y3xIYjmYWu1AgMBAAGjUzBR\nMB0GA1UdDgQWBBR8cjF6tihyw+EM/LxurAEhRekWaTAfBgNVHSMEGDAWgBR8cjF6\ntihyw+EM/LxurAEhRekWaTAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA\nA4IBAQCF5PjBswSjvgeMayEVFSNLVjb0IOAIxIVGqIr43OUCR8GCElfyGp/lxaP+\n9aZFTauHb99jNNG78/samPeI0IAadEYOYl1/bpNYsO4zSgZgJd9uJZWqsK5OeJ9G\nuUtRIRGD+TqrbT0QeEQFVXf2jmXJteEBgVtlguDifuBihhN94mSQGbYkC1uh6LJk\nfnf1uB8ZmM3HTTVe6E4EQom0zhPMHEjLq7zkEDcSJD6eZ+kJdC4zHUgxy08PRHtl\nvMEMLQelOMoTV+aOpNMGYsdWi/tPRTFKBky++tDRMCQi0F8uxHZHlBALJhfYDSsm\nbPHZtGGSPKp1bl8ExQaLfqL+7W4n\n-----END CERTIFICATE-----\n", "collector/testdata/serviceaccount/namespace": "default\n", "collector/testdata/serviceaccount/token": "dummy-token-for-validate\n", "dashboards/README.md": "# Dashboards as code\n\n> **Open-source variant.** The L1 service template from [standard/14](../standard/14-dashboards.md) as importable Grafana JSON. With Dynatrace, build the same tiles in Dynatrace Dashboards and keep the export as the template ([18](../standard/18-automation-and-scale.md)).\n\n| File | What |\n|---|---|\n| [`service-red.json`](service-red.json) | Service dashboard: SLO status → RED → per client → per version → saturation, with deploy annotations |\n| [`generate.py`](generate.py) | Generates the JSON. Edit this, not the JSON |\n| [`check.sh`](check.sh) | Imports every dashboard into a throwaway Grafana and fails if one is rejected |\n\n## Layout of `service-red`\n\n| Row | Panels | Question |\n|---|---|---|\n| SLO status | Availability 28d, budget left, burn rate 1h, req/s | Are we OK? |\n| RED overview | Requests and error % as two stacked panels on the same time axis (no second y-axis); latency heatmap; p50/p95/p99 | What changed? |\n| Per client | Table: req/s, errors (1h), error % (colored), p95, sorted by error % | Who is affected? |\n| Per version | Error % by version; traffic share by version (stacked %) | Did a release cause it? |\n| Saturation | CPU throttling, memory vs limit, active requests | Why? |\n\nVariables: `datasource`, `namespace`, `service`, `slo`. Annotations: Grafana annotations tagged `deploy` (from the pipeline or Argo CD) and rollouts derived from kube-state-metrics.\n\n## Use it\n\n```bash\npython3 -I dashboards/generate.py     # regenerate after editing\nmake check-dashboards                 # import test (Docker, grafana/grafana:11.6.0)\n```\n\nImport in Grafana: **Dashboards → New → Import → upload `service-red.json`**, or provision it from a ConfigMap with the Grafana sidecar.\n\n## Status\n\n| Check | Result |\n|---|---|\n| Imports into Grafana 11.6.0 (18 panels stored) | ✅ 2026-11-20 |\n\nRequirements: metrics named per OTel semconv (`http_server_request_duration_seconds_*`), with `service_name`, `service_version` and `client_id` labels ([12](../standard/12-releases-and-dora.md#1-version-on-every-signal)), plus kube-state-metrics and cAdvisor.\n", "dashboards/check.sh": "#!/usr/bin/env bash\n# Import every dashboards/*.json into a throwaway Grafana and fail if any is rejected.\nset -euo pipefail\nIMAGE=\"${1:-grafana/grafana:11.6.0}\"\nDIR=\"$(cd \"$(dirname \"$0\")\" && pwd)\"\n\ncid=$(docker run -d --rm -p 127.0.0.1::3000 -e GF_SECURITY_ADMIN_PASSWORD=check \"$IMAGE\")\ntrap 'docker stop \"$cid\" >/dev/null' EXIT\nport=$(docker port \"$cid\" 3000/tcp | head -1 | sed 's/.*://')\nurl=\"http://127.0.0.1:${port}\"\n\nfor _ in $(seq 1 60); do\n  curl -sf \"$url/api/health\" >/dev/null && break\n  sleep 1\ndone\n\n# A Prometheus data source (no server needed) so variables and queries resolve\ncurl -sf -u admin:check -H 'Content-Type: application/json' \"$url/api/datasources\" \\\n  -d '{\"name\":\"Prometheus\",\"type\":\"prometheus\",\"url\":\"http://prometheus:9090\",\"access\":\"proxy\",\"isDefault\":true}' >/dev/null\n\nrc=0\nfor f in \"$DIR\"/*.json; do\n  body=$(python3 -I -c 'import json,sys; print(json.dumps({\"dashboard\": json.load(open(sys.argv[1])), \"overwrite\": True}))' \"$f\")\n  resp=$(curl -s -u admin:check -H 'Content-Type: application/json' \"$url/api/dashboards/db\" -d \"$body\")\n  if echo \"$resp\" | grep -q '\"status\":\"success\"'; then\n    uid=$(echo \"$resp\" | python3 -I -c 'import json,sys; print(json.load(sys.stdin)[\"uid\"])')\n    panels=$(curl -s -u admin:check \"$url/api/dashboards/uid/$uid\" | python3 -I -c 'import json,sys; print(len(json.load(sys.stdin)[\"dashboard\"][\"panels\"]))')\n    echo \"OK   $(basename \"$f\") → uid=$uid, $panels panels stored\"\n  else\n    echo \"FAIL $(basename \"$f\"): $resp\"; rc=1\n  fi\ndone\nexit $rc\n", "dashboards/generate.py": "\"\"\"Generate dashboards/service-red.json: the service dashboard layout from standard/14.\n\nRun: python3 -I dashboards/generate.py\nRows go from symptom (top) to cause (bottom): SLO → RED → per client → per version → saturation.\n\"\"\"\nimport json\nfrom pathlib import Path\n\nDS = {\"type\": \"prometheus\", \"uid\": \"${datasource}\"}\nM = \"http_server_request_duration_seconds\"\nSEL = 'service_name=~\"$service\"'\nERR = 'http_response_status_code=~\"5..\"'\n\n_id = 0\ndef nid():\n    global _id\n    _id += 1\n    return _id\n\ndef target(expr, legend=\"\", ref=\"A\", fmt=None, instant=False):\n    t = {\"datasource\": DS, \"expr\": expr, \"legendFormat\": legend, \"refId\": ref}\n    if fmt:\n        t[\"format\"] = fmt\n    if instant:\n        t[\"instant\"] = True\n        t[\"range\"] = False\n    return t\n\ndef row(title, y):\n    return {\"type\": \"row\", \"title\": title, \"id\": nid(), \"collapsed\": False,\n            \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": y}, \"panels\": []}\n\ndef stat(title, expr, x, y, w=6, unit=\"percentunit\", decimals=3, thresholds=None, desc=\"\"):\n    return {\"type\": \"stat\", \"title\": title, \"id\": nid(), \"datasource\": DS, \"description\": desc,\n            \"gridPos\": {\"h\": 5, \"w\": w, \"x\": x, \"y\": y},\n            \"targets\": [target(expr, instant=True)],\n            \"fieldConfig\": {\"defaults\": {\"unit\": unit, \"decimals\": decimals,\n                \"thresholds\": {\"mode\": \"absolute\", \"steps\": thresholds or [\n                    {\"color\": \"red\", \"value\": None}, {\"color\": \"green\", \"value\": 0}]}},\n                \"overrides\": []},\n            \"options\": {\"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": False},\n                        \"colorMode\": \"value\", \"graphMode\": \"none\", \"textMode\": \"auto\"}}\n\ndef ts(title, targets, x, y, w=12, h=8, unit=\"short\", overrides=None, stack=False, desc=\"\"):\n    custom = {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 10, \"showPoints\": \"never\"}\n    if stack:\n        custom[\"stacking\"] = {\"mode\": \"percent\", \"group\": \"A\"}\n        custom[\"fillOpacity\"] = 60\n    return {\"type\": \"timeseries\", \"title\": title, \"id\": nid(), \"datasource\": DS, \"description\": desc,\n            \"gridPos\": {\"h\": h, \"w\": w, \"x\": x, \"y\": y}, \"targets\": targets,\n            \"fieldConfig\": {\"defaults\": {\"unit\": unit, \"custom\": custom}, \"overrides\": overrides or []},\n            \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"calcs\": [\"lastNotNull\", \"max\"]},\n                        \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}}\n\npanels = []\ny = 0\n\n# Row 1: SLO status\npanels.append(row(\"SLO status: are we OK?\", y)); y += 1\navail = (f'1 - (sum(increase({M}_count{{{SEL},{ERR}}}[28d])) '\n         f'/ sum(increase({M}_count{{{SEL}}}[28d])))')\npanels += [\n    stat(\"Availability (28d)\", avail, 0, y, thresholds=[\n        {\"color\": \"red\", \"value\": None}, {\"color\": \"green\", \"value\": 0.999}],\n        desc=\"Share of non-5xx requests over 28 days. Green threshold = 99.9%: change it if your SLO differs (thresholds cannot read variables).\"),\n    stat(\"Error budget left (28d)\", f\"1 - ((1 - ({avail})) / (1 - $slo))\", 6, y, decimals=1, thresholds=[\n        {\"color\": \"red\", \"value\": None}, {\"color\": \"orange\", \"value\": 0.25}, {\"color\": \"green\", \"value\": 0.5}],\n        desc=\"1 = untouched, 0 = spent. Below 0 means the SLO is missed.\"),\n    stat(\"Burn rate (1h)\", f'(sum(rate({M}_count{{{SEL},{ERR}}}[1h])) / sum(rate({M}_count{{{SEL}}}[1h]))) / (1 - $slo)',\n         12, y, unit=\"none\", decimals=1, thresholds=[\n        {\"color\": \"green\", \"value\": None}, {\"color\": \"orange\", \"value\": 6}, {\"color\": \"red\", \"value\": 14.4}],\n        desc=\"1 = spending exactly the budget. 14.4 over 1h pages (SRE Workbook).\"),\n    stat(\"Requests (5m)\", f'sum(rate({M}_count{{{SEL}}}[5m]))', 18, y, unit=\"reqps\", decimals=1, thresholds=[\n        {\"color\": \"text\", \"value\": None}], desc=\"Volume next to the percentages: 50% errors means nothing without it.\"),\n]\ny += 5\n\n# Row 2: RED\npanels.append(row(\"RED overview\", y)); y += 1\npanels.append(ts(\"Requests\", [\n    target(f'sum(rate({M}_count{{{SEL}}}[$__rate_interval]))', \"req/s\", \"A\"),\n], 0, y, h=6, unit=\"reqps\", desc=\"Volume. Stacked above error % on the same time axis: one y-axis per chart.\"))\npanels.append(ts(\"Error ratio\", [\n    target(f'sum(rate({M}_count{{{SEL},{ERR}}}[$__rate_interval])) / sum(rate({M}_count{{{SEL}}}[$__rate_interval]))', \"error %\", \"A\"),\n], 0, y + 6, h=6, unit=\"percentunit\", overrides=[], desc=\"If errors rise with traffic, think capacity. If errors rise alone, think change or dependency.\"))\npanels.append({\"type\": \"heatmap\", \"title\": \"Latency distribution (+ p99 below)\", \"id\": nid(), \"datasource\": DS,\n    \"gridPos\": {\"h\": 12, \"w\": 12, \"x\": 12, \"y\": y},\n    \"targets\": [target(f'sum by (le) (rate({M}_bucket{{{SEL}}}[$__rate_interval]))', \"{{le}}\", fmt=\"heatmap\")],\n    \"options\": {\"calculate\": False, \"yAxis\": {\"unit\": \"s\"}, \"cellGap\": 1,\n                \"color\": {\"mode\": \"scheme\", \"scheme\": \"Oranges\", \"steps\": 64}},\n    \"description\": \"Averages hide tail latency. Look for a second band appearing.\"})\ny += 12\npanels.append(ts(\"Latency p50 / p95 / p99\", [\n    target(f'histogram_quantile({q}, sum by (le) (rate({M}_bucket{{{SEL}}}[$__rate_interval])))', f\"p{int(q*100)}\", r)\n    for q, r in [(0.5, \"A\"), (0.95, \"B\"), (0.99, \"C\")]\n], 0, y, w=24, h=7, unit=\"s\"))\ny += 7\n\n# Row 3: per client\npanels.append(row(\"Per client: who is affected?\", y)); y += 1\nby = \"client_id\"\npanels.append({\"type\": \"table\", \"title\": \"Clients\", \"id\": nid(), \"datasource\": DS,\n    \"gridPos\": {\"h\": 8, \"w\": 24, \"x\": 0, \"y\": y},\n    \"targets\": [\n        target(f'sum by ({by}) (rate({M}_count{{{SEL}}}[5m]))', \"\", \"A\", \"table\", True),\n        target(f'sum by ({by}) (increase({M}_count{{{SEL},{ERR}}}[1h]))', \"\", \"B\", \"table\", True),\n        target(f'sum by ({by}) (rate({M}_count{{{SEL},{ERR}}}[5m])) / sum by ({by}) (rate({M}_count{{{SEL}}}[5m]))', \"\", \"C\", \"table\", True),\n        target(f'histogram_quantile(0.95, sum by ({by}, le) (rate({M}_bucket{{{SEL}}}[5m])))', \"\", \"D\", \"table\", True),\n    ],\n    \"transformations\": [\n        {\"id\": \"merge\", \"options\": {}},\n        {\"id\": \"organize\", \"options\": {\"excludeByName\": {\"Time\": True},\n            \"renameByName\": {\"client_id\": \"Client\", \"Value #A\": \"req/s\", \"Value #B\": \"errors (1h)\",\n                             \"Value #C\": \"error %\", \"Value #D\": \"p95\"}}},\n        {\"id\": \"sortBy\", \"options\": {\"sort\": [{\"field\": \"error %\", \"desc\": True}]}},\n    ],\n    \"fieldConfig\": {\"defaults\": {}, \"overrides\": [\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"error %\"}, \"properties\": [\n            {\"id\": \"unit\", \"value\": \"percentunit\"}, {\"id\": \"custom.cellOptions\", \"value\": {\"type\": \"color-background\"}},\n            {\"id\": \"thresholds\", \"value\": {\"mode\": \"absolute\", \"steps\": [\n                {\"color\": \"green\", \"value\": None}, {\"color\": \"orange\", \"value\": 0.01}, {\"color\": \"red\", \"value\": 0.05}]}}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"p95\"}, \"properties\": [{\"id\": \"unit\", \"value\": \"s\"}]},\n        {\"matcher\": {\"id\": \"byName\", \"options\": \"req/s\"}, \"properties\": [{\"id\": \"unit\", \"value\": \"reqps\"}]},\n    ]},\n    \"description\": \"A table, not a pie chart: the small client that is 100% broken must be visible.\"})\ny += 8\n\n# Row 4: per version\npanels.append(row(\"Per version: did a release cause it?\", y)); y += 1\npanels.append(ts(\"Error % by version\", [\n    target(f'sum by (service_version) (rate({M}_count{{{SEL},{ERR}}}[$__rate_interval])) '\n           f'/ sum by (service_version) (rate({M}_count{{{SEL}}}[$__rate_interval]))', \"{{service_version}}\")\n], 0, y, unit=\"percentunit\", desc=\"During a rolling update both versions take traffic: compare the lines.\"))\npanels.append(ts(\"Traffic share by version\", [\n    target(f'sum by (service_version) (rate({M}_count{{{SEL}}}[$__rate_interval]))', \"{{service_version}}\")\n], 12, y, unit=\"percentunit\", stack=True, desc=\"Is the rollout progressing, stuck, or rolled back?\"))\ny += 8\n\n# Row 5: saturation (USE)\npanels.append(row(\"Saturation (USE): why?\", y)); y += 1\npod = 'namespace=~\"$namespace\", pod=~\"$service.*\"'\npanels += [\n    ts(\"CPU throttling\", [target(\n        f'sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{{{pod}}}[$__rate_interval])) '\n        f'/ sum by (pod) (rate(container_cpu_cfs_periods_total{{{pod}}}[$__rate_interval]))', \"{{pod}}\")],\n       0, y, w=8, unit=\"percentunit\"),\n    ts(\"Memory vs limit\", [target(\n        f'sum by (pod) (container_memory_working_set_bytes{{{pod}, container!=\"\"}}) '\n        f'/ sum by (pod) (kube_pod_container_resource_limits{{{pod}, resource=\"memory\"}})', \"{{pod}}\")],\n       8, y, w=8, unit=\"percentunit\"),\n    ts(\"Active requests\", [target(f'sum(http_server_active_requests{{{SEL}}})', \"active\")],\n       16, y, w=8, unit=\"short\"),\n]\ny += 8\n\ndashboard = {\n    \"uid\": \"service-red\",\n    \"title\": \"Service RED (Observability Guide)\",\n    \"description\": \"Symptom to cause: SLO, RED, per client, per version, saturation. Layout from standard/14.\",\n    \"tags\": [\"observability-guide\", \"red\", \"slo\"],\n    \"timezone\": \"browser\",\n    \"schemaVersion\": 39,\n    \"version\": 1,\n    \"refresh\": \"1m\",\n    \"time\": {\"from\": \"now-6h\", \"to\": \"now\"},\n    \"editable\": True,\n    \"graphTooltip\": 1,\n    \"links\": [],\n    \"annotations\": {\"list\": [\n        {\"builtIn\": 1, \"datasource\": {\"type\": \"grafana\", \"uid\": \"-- Grafana --\"}, \"enable\": True, \"hide\": True,\n         \"iconColor\": \"rgba(0, 211, 255, 1)\", \"name\": \"Annotations & Alerts\", \"type\": \"dashboard\"},\n        {\"name\": \"Deploys (pipeline / Argo CD)\", \"enable\": True, \"iconColor\": \"blue\",\n         \"datasource\": {\"type\": \"grafana\", \"uid\": \"-- Grafana --\"},\n         \"target\": {\"type\": \"tags\", \"tags\": [\"deploy\"], \"matchAny\": False, \"limit\": 100}},\n        {\"name\": \"Rollouts (kube-state-metrics)\", \"enable\": True, \"iconColor\": \"purple\", \"datasource\": DS,\n         \"expr\": 'changes(kube_deployment_status_observed_generation{namespace=~\"$namespace\", deployment=~\"$service\"}[2m]) > 0',\n         \"step\": \"1m\", \"titleFormat\": \"rollout {{deployment}}\", \"useValueForTime\": False},\n    ]},\n    \"templating\": {\"list\": [\n        {\"name\": \"datasource\", \"label\": \"Data source\", \"type\": \"datasource\", \"query\": \"prometheus\",\n         \"current\": {}, \"hide\": 0, \"refresh\": 1},\n        {\"name\": \"namespace\", \"label\": \"Namespace\", \"type\": \"query\", \"datasource\": DS,\n         \"query\": {\"query\": \"label_values(kube_pod_info, namespace)\", \"refId\": \"ns\"},\n         \"definition\": \"label_values(kube_pod_info, namespace)\", \"refresh\": 2, \"includeAll\": True,\n         \"multi\": False, \"current\": {}, \"allValue\": \".*\"},\n        {\"name\": \"service\", \"label\": \"Service\", \"type\": \"query\", \ ": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"During a rolling update both versions take traffic: compare the lines.\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 36\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (service_version) (rate(http_server_request_duration_seconds_count{service_name=~\\\"$service\\\",http_response_status_code=~\\\"5..\\\"}[$__rate_interval])) / sum by (service_version) (rate(http_server_request_duration_seconds_count{service_name=~\\\"$service\\\"}[$__rate_interval]))\",\n          \"legendFormat\": \"{{service_version}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 10,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Traffic share by version\",\n      \"id\": 15,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Is the rollout progressing, stuck, or rolled back?\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 36\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (service_version) (rate(http_server_request_duration_seconds_count{service_name=~\\\"$service\\\"}[$__rate_interval]))\",\n          \"legendFormat\": \"{{service_version}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 60,\n            \"showPoints\": \"never\",\n            \"stacking\": {\n              \"mode\": \"percent\",\n              \"group\": \"A\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Saturation (USE): why?\",\n      \"id\": 16,\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 44\n      },\n      \"panels\": []\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"CPU throttling\",\n      \"id\": 17,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 8,\n        \"x\": 0,\n        \"y\": 45\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=~\\\"$namespace\\\", pod=~\\\"$service.*\\\"}[$__rate_interval])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=~\\\"$namespace\\\", pod=~\\\"$service.*\\\"}[$__rate_interval]))\",\n          \"legendFormat\": \"{{pod}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 10,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Memory vs limit\",\n      \"id\": 18,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 8,\n        \"x\": 8,\n        \"y\": 45\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (pod) (container_memory_working_set_bytes{namespace=~\\\"$namespace\\\", pod=~\\\"$service.*\\\", container!=\\\"\\\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=~\\\"$namespace\\\", pod=~\\\"$service.*\\\", resource=\\\"memory\\\"})\",\n          \"legendFormat\": \"{{pod}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 10,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Active requests\",\n      \"id\": 19,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 8,\n        \"x\": 16,\n        \"y\": 45\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum(http_server_active_requests{service_name=~\\\"$service\\\"})\",\n          \"legendFormat\": \"active\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 10,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    }\n  ]\n}\n", "dynatrace/README.md": "# Dynatrace as code (Monaco)\n\n> **In 30 seconds:** SRE owns the **templates** (the baseline). Each service owns one short **`observability.yaml`**.\n> `generate.py` turns every service file into Monaco configs (SLOs, custom alerts) and one routing workflow per team;\n> one shared L1 dashboard serves all services through its `$service` variable. CI runs a dry run on every PR and\n> `monaco deploy` on merge. Guide: [18](../standard/18-automation-and-scale.md).\n\n## Layout\n\n```text\ndynatrace/\n├── manifest.yaml              ← environments + projects; URLs and credentials from CI secrets\n├── services-src/              ← one observability.yaml per service (in real life: in each service repo)\n│   ├── checkout.yaml          ← archetype: api\n│   ├── orders-worker.yaml     ← archetype: queue-consumer\n│   └── nightly-billing.yaml   ← archetype: batch\n├── templates/                 ← the baseline, owned by SRE (\"one side\")\n│   ├── slo-availability.json · slo-latency.json · slo-queue-age.json\n│   ├── alert-burn-rate.json · alert-client-ratio.json · alert-dlq.json · alert-batch-overdue.json\n│   └── workflow-route-team.json\n├── shared/                    ← deployed once\n│   ├── config.yaml            ← document (kind: dashboard, private: false)\n│   └── dashboard-service.json ← L1 dashboard with a $service variable\n├── projects/                  ← GENERATED by generate.py, never edited by hand\n│   ├── services/\u003cservice>/config.yaml\n│   └── teams/\u003cteam>/config.yaml\n├── generate.py                ← service files → Monaco configs\n└── check.py                   ← offline check: templates exist, parameters provided, rendered JSON valid\n```\n\n## What each archetype gets\n\n| Archetype | Configs generated | Monaco type |\n|---|---|---|\n| `api` | Availability SLO, latency SLO (if `latency_ms`), fast-burn alert, per-client error-ratio alert (if `per_client`) | `slo-v2`, `settings` (`builtin:davis.anomaly-detectors`) |\n| `queue-consumer` | Oldest-message-age SLO, DLQ count alert, backlog-growing-at-max-consumers alert (if `max_consumers`) | `slo-v2`, `settings` |\n| `batch` | \"No successful run in 2 intervals\" alert | `settings` |\n| `platform-service` | Internal SLO from callers' client spans (`server.address`), one saturation alert per listed resource (e.g. connections) | `slo-v2`, `settings` |\n| every team | Workflow: problems with `team = \u003cteam>` → the team's on-call channel | `automation` (`workflow`) |\n| everyone | One L1 service dashboard | `document` (`dashboard`) |\n\nAlerts set `team` and `runbook` on the event they raise, so the team's Workflow can route them and the page carries the runbook.\n\n## Pipeline\n\n| Step | Command | When |\n|---|---|---|\n| Generate | `python3 dynatrace/generate.py` | PR and merge (fails if a service file misses `service`, `team`, `tier`, `archetype` or `runbook`) |\n| Offline check | `python3 dynatrace/check.py` | PR |\n| Dry run against the tenant | `monaco deploy dynatrace/manifest.yaml --dry-run` | PR |\n| Deploy | `monaco deploy dynatrace/manifest.yaml` | Merge to main |\n| Remove a retired service | Delete its service file and run `monaco delete` with a delete file listing its config IDs | When a service is decommissioned |\n\nCredentials (CI secrets): `DT_ENV_URL`, `DT_API_TOKEN` (settings), `DT_OAUTH_CLIENT_ID` / `DT_OAUTH_CLIENT_SECRET` (SLOs, documents, workflows), with only the scopes those configs need.\n\n## Rules\n\n| Rule | Why |\n|---|---|\n| **Config IDs include the service or team name** | Monaco identifies objects by ID; a shared ID would make each service overwrite the last |\n| **Bootstrap templates with `monaco download`**: build one SLO, alert, dashboard and workflow in the UI for a pilot service, download, then replace values with `{{ .param }}` | The JSON schema is the tenant's, not a guess; the templates here are shapes to show the idea |\n| Keep templates simple: parameters only, no logic | Monaco docs advise it; logic belongs in `generate.py` |\n| Escape workflow expressions as `{{ \"{{\" }} … {{ \"}}\" }}` | Workflows use `{{ }}` too; Monaco would try to fill them |\n| Documents created by Monaco are private unless `private: false` | Otherwise only the deploying identity sees the dashboard |\n| Nobody edits generated objects in the UI | The next deploy overwrites them; change the template or the service file |\n| Thresholds are tier defaults in `generate.py`; a service can override them in its file | One place for defaults, explicit exceptions |\n\n## Status\n\n| Check | Result |\n|---|---|\n| `generate.py` on the four example services | 10 service configs + 3 team workflows |\n| `check.py` (parameters, rendered JSON, unique IDs) | ✅ 14 configs valid |\n| `monaco deploy --dry-run` | Run it in your CI against your tenant |\n\n## Sources\n\n- [Monaco: configuration YAML](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/configuration/yaml-configuration-saas) · [type fields (settings, automation, document, slo-v2)](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/configuration/yaml-configuration-saas-type-fields) · [projects and manifest](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/configuration/projects) · [CLI commands (deploy, download, delete)](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/reference/commands-saas) · [Go templating](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/guides/configuration-as-code-advanced-use-case) ✅ 2026-11-20\n- [Dynatrace: anomaly detectors via API (StaticThresholdAnomalyDetectionAnalyzer)](https://docs.dynatrace.com/docs/dynatrace-intelligence/anomaly-detection/set-up-anomaly-detectors-via-api) · [Workflow event triggers](https://docs.dynatrace.com/docs/analyze-explore-automate/workflows/build/trigger/event-trigger) · [SLOs](https://docs.dynatrace.com/docs/deliver/service-level-objectives) ✅ 2026-11-20\n- Template JSON bodies: illustrative shapes ⚠️ (export real ones with `monaco download`)\n", "dynatrace/check.py": "\"\"\"Offline check of the Monaco project (no tenant, no Monaco binary needed).\n\n    python3 dynatrace/check.py\n\nFor every generated config: the template file exists, every {{ .param }} it uses is provided, and the rendered result\nis valid JSON. The real gate before deploying is still `monaco deploy manifest.yaml --dry-run` in CI.\n\"\"\"\nfrom pathlib import Path\nimport json\nimport re\nimport sys\nimport yaml\n\nHERE = Path(__file__).resolve().parent\nPARAM = re.compile(r\"\\{\\{\\s*\\.(\\w+)\\s*\\}\\}\")\nESCAPE = re.compile(r'\\{\\{\\s*\"(\\{\\{|\\}\\})\"\\s*\\}\\}')     # {{ \"{{\" }} → literal {{ (workflow expressions)\n\n\ndef render(text, params):\n    def sub(m):\n        if m.group(1) not in params:\n            raise KeyError(m.group(1))\n        return str(params[m.group(1)])\n    return ESCAPE.sub(lambda m: m.group(1), PARAM.sub(sub, text))\n\n\ndef main():\n    files = sorted((HERE / \"projects\").rglob(\"config.yaml\")) + [HERE / \"shared\" / \"config.yaml\"]\n    ok = bad = 0\n    ids = set()\n    for f in files:\n        for c in yaml.safe_load(f.read_text())[\"configs\"]:\n            if c[\"id\"] in ids:\n                print(f\"FAIL {c['id']}: duplicate id (would overwrite another object)\"); bad += 1; continue\n            ids.add(c[\"id\"])\n            tpl = (f.parent / c[\"config\"][\"template\"]).resolve()\n            try:\n                json.loads(render(tpl.read_text(), c[\"config\"].get(\"parameters\", {})))\n                ok += 1\n            except FileNotFoundError:\n                print(f\"FAIL {c['id']}: template {tpl} not found\"); bad += 1\n            except KeyError as e:\n                print(f\"FAIL {c['id']}: parameter {e} used in {tpl.name} but not provided\"); bad += 1\n            except json.JSONDecodeError as e:\n                print(f\"FAIL {c['id']}: rendered {tpl.name} is not valid JSON ({e})\"); bad += 1\n    print(f\"{ok} configs rendered to valid JSON, {bad} failed\")\n    sys.exit(1 if bad else 0)\n\n\nif __name__ == \"__main__\":\n    main()\n", "dynatrace/generate.py": "\"\"\"Render Monaco configs from each service's observability.yaml (standard/16).\n\n    python3 dynatrace/generate.py            # writes dynatrace/projects/{services,teams}/...\n\nOne config per service and per team. Config IDs include the service/team name: Monaco identifies objects by ID, so\nreusing one ID for many services would make every deploy overwrite the previous service. The archetype decides which\ntemplates a service gets; the service file only supplies values. Never edit the generated files by hand.\n\"\"\"\nfrom pathlib import Path\nimport copy\nimport shutil\nimport yaml\n\nHERE = Path(__file__).resolve().parent\nSRC, OUT = HERE / \"services-src\", HERE / \"projects\"\nTPL = \"../../../templates\"          # from projects/\u003cgroup>/\u003cname>/config.yaml\n\nANOMALY = {\"settings\": {\"schema\": \"builtin:davis.anomaly-detectors\", \"scope\": \"environment\"}}\nWORKFLOW = {\"automation\": {\"resource\": \"workflow\"}}\n\n# Defaults by tier (standard/16): thresholds are rules of thumb, override them in the service file.\nTIER = {1: {\"burn_threshold\": 14.4}, 2: {\"burn_threshold\": 14.4}, 3: {}}\n\n\ndef cfg(cid, ctype, name, template, **params):\n    return {\"id\": cid, \"type\": copy.deepcopy(ctype), \"config\": {\"name\": name, \"template\": f\"{TPL}/{template}\", \"parameters\": params}}\n\n\ndef api(s, base):\n    out, slo = [], s[\"slo\"]\n    out.append(cfg(f\"{s['service']}-slo-availability\", \"slo-v2\", f\"{s['service']} · availability\",\n                   \"slo-availability.json\", **base, target=slo[\"availability\"]))\n    if \"latency_ms\" in slo:\n        out.append(cfg(f\"{s['service']}-slo-latency\", \"slo-v2\", f\"{s['service']} · latency\",\n                       \"slo-latency.json\", **base, latency_ms=slo[\"latency_ms\"], target=slo.get(\"latency_target\", 99)))\n    out.append(cfg(f\"{s['service']}-alert-burn-rate\", ANOMALY, f\"{s['service']} · SLO fast burn\", \"alert-burn-rate.json\",\n                   **base, target=slo[\"availability\"], threshold=s.get(\"burn_threshold\", TIER[s[\"tier\"]].get(\"burn_threshold\", 14.4))))\n    if s.get(\"per_client\"):\n        out.append(cfg(f\"{s['service']}-alert-client-ratio\", ANOMALY, f\"{s['service']} · error ratio per client\",\n                       \"alert-client-ratio.json\", **base, ratio_pct=s.get(\"client_ratio_pct\", 5), min_errors=s.get(\"client_min_errors\", 20)))\n    return out\n\n\ndef queue_consumer(s, base):\n    out = [cfg(f\"{s['service']}-slo-queue-age\", \"slo-v2\", f\"{s['service']} · oldest message age\", \"slo-queue-age.json\",\n               **base, max_age_s=s[\"slo\"][\"oldest_message_age_s\"])]\n    if s.get(\"dlq_alert\", True):\n        out.append(cfg(f\"{s['service']}-alert-dlq\", ANOMALY, f\"{s['service']} · DLQ\", \"alert-dlq.json\", **base))\n    if \"max_consumers\" in s:                  # autoscaled: at max AND backlog growing = capacity problem (standard/13)\n        out.append(cfg(f\"{s['service']}-alert-backlog-at-max\", ANOMALY, f\"{s['service']} · backlog at max consumers\",\n                       \"alert-backlog-at-max.json\", **base, max_consumers=s[\"max_consumers\"]))\n    return out\n\n\ndef batch(s, base):\n    return [cfg(f\"{s['service']}-alert-batch-overdue\", ANOMALY, f\"{s['service']} · batch overdue\", \"alert-batch-overdue.json\",\n                **base, max_gap_h=2 * s[\"schedule_hours\"])]\n\n\ndef platform_service(s, base):\n    \"\"\"Shared platform service (DB, cache, broker): internal SLO from callers' client spans + saturation (standard/09).\"\"\"\n    out = [cfg(f\"{s['service']}-slo-callers\", \"slo-v2\", f\"{s['service']} · availability seen by callers\",\n               \"slo-internal-client.json\", **base, address=s[\"address\"], target=s[\"slo\"][\"availability\"],\n               consumers=\", \".join(s.get(\"consumers\", [])))]\n    for sat in s.get(\"saturation\", []):\n        out.append(cfg(f\"{s['service']}-alert-saturation-{sat['resource']}\", ANOMALY, f\"{s['service']} · {sat['resource']} saturation\",\n                       \"alert-saturation.json\", **base, resource=sat[\"resource\"], threshold=sat[\"threshold\"]))\n    return out\n\n\nARCHETYPES = {\"api\": api, \"queue-consumer\": queue_consumer, \"batch\": batch, \"platform-service\": platform_service}\nREQUIRED = [\"service\", \"team\", \"tier\", \"archetype\", \"runbook\"]\n\n\ndef main():\n    if OUT.exists():\n        shutil.rmtree(OUT)                    # generated output only; services-src and templates are untouched\n    teams = {}\n    for f in sorted(SRC.glob(\"*.yaml\")):\n        s = yaml.safe_load(f.read_text())\n        missing = [k for k in REQUIRED if k not in s]\n        if missing:                           # the definition of done, enforced in CI\n            raise SystemExit(f\"{f.name}: missing {missing}\")\n        if s[\"archetype\"] not in ARCHETYPES:\n            raise SystemExit(f\"{f.name}: unknown archetype {s['archetype']!r} (use {sorted(ARCHETYPES)})\")\n        base = {\"service\": s[\"service\"], \"team\": s[\"team\"], \"runbook\": s[\"runbook\"]}\n        configs = ARCHETYPES[s[\"archetype\"]](s, base)\n        d = OUT / \"services\" / s[\"service\"]\n        d.mkdir(parents=True)\n        (d / \"config.yaml\").write_text(\"# GENERATED by dynatrace/generate.py from services-src/\" + f.name + \"\\n\" +\n                                       yaml.safe_dump({\"configs\": configs}, sort_keys=False, allow_unicode=True))\n        teams.setdefault(s[\"team\"], []).append(s[\"service\"])\n        print(f\"{s['service']:\u003c16} {s['archetype']:\u003c15} {len(configs)} configs\")\n    for team, services in teams.items():\n        d = OUT / \"teams\" / team\n        d.mkdir(parents=True)\n        wf = cfg(f\"{team}-workflow-route\", WORKFLOW, f\"Route problems · {team}\", \"workflow-route-team.json\",\n                 team=team, channel=f\"#oncall-{team}\")\n        (d / \"config.yaml\").write_text(f\"# GENERATED: routing for {team} ({', '.join(services)})\\n\" +\n                                       yaml.safe_dump({\"configs\": [wf]}, sort_keys=False, allow_unicode=True))\n        print(f\"team {team:\u003c11} workflow ({len(services)} services)\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "dynatrace/manifest.yaml": "# Monaco deployment manifest: which projects go to which Dynatrace environments.\n# Tokens and URLs come from environment variables (CI secrets), never from this file.\nmanifestVersion: 1.0\n\nprojects:\n  - name: shared                 # one L1 dashboard with a $service variable, deployed once\n    path: shared\n  - name: teams                  # one routing workflow per team (generated)\n    type: grouping\n    path: projects/teams\n  - name: services               # SLOs and custom alerts per service (generated)\n    type: grouping\n    path: projects/services\n\nenvironmentGroups:\n  - name: default\n    environments:\n      - name: prod\n        url:\n          type: environment\n          value: DT_ENV_URL          # e.g. https://\u003cenv-id>.apps.dynatrace.com\n        auth:\n          token:\n            name: DT_API_TOKEN       # settings (custom alerts)\n          oAuth:                     # platform APIs: SLOs (slo-v2), documents, workflows\n            clientId:\n              name: DT_OAUTH_CLIENT_ID\n            clientSecret:\n              name: DT_OAUTH_CLIENT_SECRET\n", "dynatrace/projects/services/checkout/config.yaml": "# GENERATED by dynatrace/generate.py from services-src/checkout.yaml\nconfigs:\n- id: checkout-slo-availability\n  type: slo-v2\n  config:\n    name: checkout · availability\n    template: ../../../templates/slo-availability.json\n    parameters:\n      service: checkout\n      team: payments\n      runbook: https://wiki.example/runbooks/checkout\n      target: 99.9\n- id: checkout-slo-latency\n  type: slo-v2\n  config:\n    name: checkout · latency\n    template: ../../../templates/slo-latency.json\n    parameters:\n      service: checkout\n      team: payments\n      runbook: https://wiki.example/runbooks/checkout\n      latency_ms: 500\n      target: 99\n- id: checkout-alert-burn-rate\n  type:\n    settings:\n      schema: builtin:davis.anomaly-detectors\n      scope: environment\n  config:\n    name: checkout · SLO fast burn\n    template: ../../../templates/alert-burn-rate.json\n    parameters:\n      service: checkout\n      team: payments\n      runbook: https://wiki.example/runbooks/checkout\n      target: 99.9\n      threshold: 14.4\n- id: checkout-alert-client-ratio\n  type:\n    settings:\n      schema: builtin:davis.anomaly-detectors\n      scope: environment\n  config:\n    name: checkout · error ratio per client\n    template: ../../../templates/alert-client-ratio.json\n    parameters:\n      service: checkout\n      team: payments\n      runbook: https://wiki.example/runbooks/checkout\n      ratio_pct: 5\n      min_errors: 20\n", "dynatrace/projects/services/nightly-billing/config.yaml": "# GENERATED by dynatrace/generate.py from services-src/nightly-billing.yaml\nconfigs:\n- id: nightly-billing-alert-batch-overdue\n  type:\n    settings:\n      schema: builtin:davis.anomaly-detectors\n      scope: environment\n  config:\n    name: nightly-billing · batch overdue\n    template: ../../../templates/alert-batch-overdue.json\n    parameters:\n      service: nightly-billing\n      team: finance-platform\n      runbook: https://wiki.example/runbooks/nightly-billing\n      max_gap_h: 48\n", "dynatrace/projects/services/orders-db/config.yaml": "# GENERATED by dynatrace/generate.py from services-src/orders-db.yaml\nconfigs:\n- id: orders-db-slo-callers\n  type: slo-v2\n  config:\n    name: orders-db · availability seen by callers\n    template: ../../../templates/slo-internal-client.json\n    parameters:\n      service: orders-db\n      team: platform-data\n      runbook: https://wiki.example/runbooks/orders-db\n      address: orders-db.data.svc\n      target: 99.99\n      consumers: checkout, orders-worker\n- id: orders-db-alert-saturation-connections\n  type:\n    settings:\n      schema: builtin:davis.anomaly-detectors\n      scope: environment\n  config:\n    name: orders-db · connections saturation\n    template: ../../../templates/alert-saturation.json\n    parameters:\n      service: orders-db\n      team: platform-data\n      runbook: https://wiki.example/runbooks/orders-db\n      resource: connections\n      threshold: 80\n", "dynatrace/projects/services/orders-worker/config.yaml": "# GENERATED by dynatrace/generate.py from services-src/orders-worker.yaml\nconfigs:\n- id: orders-worker-slo-queue-age\n  type: slo-v2\n  config:\n    name: orders-worker · oldest message age\n    template: ../../../templates/slo-queue-age.json\n    parameters:\n      service: orders-worker\n      team: payments\n      runbook: https://wiki.example/runbooks/orders-worker\n      max_age_s: 60\n- id: orders-worker-alert-dlq\n  type:\n    settings:\n      schema: builtin:davis.anomaly-detectors\n      scope: environment\n  config:\n    name: orders-worker · DLQ\n    template: ../../../templates/alert-dlq.json\n    parameters:\n      service: orders-worker\n      team: payments\n      runbook: https://wiki.example/runbooks/orders-worker\n- id: orders-worker-alert-backlog-at-max\n  type:\n    settings:\n      schema: builtin:davis.anomaly-detectors\n      scope: environment\n  config:\n    name: orders-worker · backlog at max consumers\n    template: ../../../templates/alert-backlog-at-max.json\n    parameters:\n      service: orders-worker\n      team: payments\n      runbook: https://wiki.example/runbooks/orders-worker\n      max_consumers: 6\n", "dynatrace/projects/teams/finance-platform/config.yaml": "# GENERATED: routing for finance-platform (nightly-billing)\nconfigs:\n- id: finance-platform-workflow-route\n  type:\n    automation:\n      resource: workflow\n  config:\n    name: Route problems · finance-platform\n    template: ../../../templates/workflow-route-team.json\n    parameters:\n      team: finance-platform\n      channel: '#oncall-finance-platform'\n", "dynatrace/projects/teams/payments/config.yaml": "# GENERATED: routing for payments (checkout, orders-worker)\nconfigs:\n- id: payments-workflow-route\n  type:\n    automation:\n      resource: workflow\n  config:\n    name: Route problems · payments\n    template: ../../../templates/workflow-route-team.json\n    parameters:\n      team: payments\n      channel: '#oncall-payments'\n", "dynatrace/projects/teams/platform-data/config.yaml": "# GENERATED: routing for platform-data (orders-db)\nconfigs:\n- id: platform-data-workflow-route\n  type:\n    automation:\n      resource: workflow\n  config:\n    name: Route problems · platform-data\n    template: ../../../templates/workflow-route-team.json\n    parameters:\n      team: platform-data\n      channel: '#oncall-platform-data'\n", "dynatrace/services-src/checkout.yaml": "# observability.yaml of the checkout service (lives in the service repo; copied here as an example)\nservice: checkout\nteam: payments\ntier: 1\narchetype: api\nslo:\n  availability: 99.9        # % non-5xx server spans, 28 days\n  latency_ms: 500\n  latency_target: 99        # % of requests under latency_ms\nper_client: true\nrunbook: https://wiki.example/runbooks/checkout\n", "dynatrace/services-src/nightly-billing.yaml": "service: nightly-billing\nteam: finance-platform\ntier: 3\narchetype: batch\nschedule_hours: 24          # alert when there was no successful run in 2 intervals\nrunbook: https://wiki.example/runbooks/nightly-billing\n", "dynatrace/services-src/orders-db.yaml": "# A shared platform service (owned by the platform team), measured from its callers\nservice: orders-db\nteam: platform-data\ntier: 1\narchetype: platform-service\naddress: orders-db.data.svc     # server.address that callers' client spans carry\nconsumers: [checkout, orders-worker]\nslo:\n  availability: 99.99            # stricter than every user-facing SLO that depends on it\nsaturation:\n  - { resource: connections, threshold: 80 }\nrunbook: https://wiki.example/runbooks/orders-db\n", "dynatrace/services-src/orders-worker.yaml": "service: orders-worker\nteam: payments\ntier: 2\narchetype: queue-consumer\nslo:\n  oldest_message_age_s: 60  # oldest message younger than this, 99% of the time\ndlq_alert: true\nrunbook: https://wiki.example/runbooks/orders-worker\nmax_consumers: 6                # KEDA maxReplicaCount (≤ partitions)\n", "dynatrace/shared/config.yaml": "# The ONE L1 service dashboard (variable $service). Deployed once; every service uses it.\nconfigs:\n  - id: dashboard-service-l1\n    type:\n      document:\n        kind: dashboard\n        private: false        # Monaco-created documents are private by default\n    config:\n      name: Service (L1)\n      template: dashboard-service.json\n", "dynatrace/shared/dashboard-service.json": "{\n  \"version\": 1,\n  \"variables\": [\n    {\n      \"key\": \"service\",\n      \"type\": \"query\",\n      \"visible\": true,\n      \"editable\": true,\n      \"multiple\": false,\n      \"input\": \"fetch spans, from:-24h\\n| filter span.kind == \\\"server\\\"\\n| summarize count(), by:{ service.name }\\n| fields service.name\"\n    }\n  ],\n  \"tiles\": {\n    \"1\": { \"type\": \"markdown\", \"title\": \"\", \"content\": \"## $service · Service (L1)\\nSLO → RED → per client → per version → saturation. Template owned by SRE (Monaco).\" },\n    \"2\": { \"type\": \"data\", \"title\": \"Requests\", \"query\": \"fetch spans\\n| filter service.name == $service and span.kind == \\\"server\\\"\\n| makeTimeseries requests = count()\", \"visualization\": \"lineChart\" },\n    \"3\": { \"type\": \"data\", \"title\": \"Error ratio\", \"query\": \"fetch spans\\n| filter service.name == $service and span.kind == \\\"server\\\"\\n| makeTimeseries { total = count(), errors = countIf(http.response.status_code >= 500) }\\n| fieldsAdd error_ratio = errors[] / total[]\\n| fields timeframe, interval, error_ratio\", \"visualization\": \"lineChart\" },\n    \"4\": { \"type\": \"data\", \"title\": \"Per client\", \"query\": \"fetch spans\\n| filter service.name == $service and span.kind == \\\"server\\\"\\n| summarize requests = count(), errors = countIf(http.response.status_code >= 500), by:{ client.id }\\n| fieldsAdd error_pct = 100 * errors / requests\\n| sort error_pct desc\", \"visualization\": \"table\" },\n    \"5\": { \"type\": \"data\", \"title\": \"Error ratio by version\", \"query\": \"fetch spans\\n| filter service.name == $service and span.kind == \\\"server\\\"\\n| makeTimeseries { total = count(), errors = countIf(http.response.status_code >= 500) }, by:{ service.version }\\n| fieldsAdd error_ratio = errors[] / total[]\\n| fields timeframe, interval, service.version, error_ratio\", \"visualization\": \"lineChart\" }\n  },\n  \"layouts\": {\n    \"1\": { \"x\": 0, \"y\": 0, \"w\": 24, \"h\": 2 },\n    \"2\": { \"x\": 0, \"y\": 2, \"w\": 12, \"h\": 6 },\n    \"3\": { \"x\": 12, \"y\": 2, \"w\": 12, \"h\": 6 },\n    \"4\": { \"x\": 0, \"y\": 8, \"w\": 12, \"h\": 7 },\n    \"5\": { \"x\": 12, \"y\": 8, \"w\": 12, \"h\": 7 }\n  }\n}\n", "dynatrace/templates/alert-backlog-at-max.json": "{\n  \"enabled\": true,\n  \"title\": \"{{ .service }} · backlog growing at max consumers\",\n  \"description\": \"Consumers are at the autoscaler maximum ({{ .max_consumers }}) and the backlog keeps growing: a capacity problem. Runbook: {{ .runbook }}\",\n  \"source\": \"monaco\",\n  \"analyzer\": {\n    \"name\": \"dt.statistics.ui.anomaly_detection.StaticThresholdAnomalyDetectionAnalyzer\",\n    \"input\": [\n      {\n        \"key\": \"query\",\n        \"value\": \"timeseries { backlog = max(\u003cqueue backlog metric>), consumers = max(k8s.hpa.current_replicas) }, filter:{ service.name == \\\"{{ .service }}\\\" }, interval:5m\\n| fieldsAdd growing_at_max = iCollectArray(if(consumers[] >= {{ .max_consumers }} and backlog[] > backlog[-1], 1, else: 0))\\n| fields timeframe, interval, growing_at_max\"\n      },\n      {\n        \"key\": \"threshold\",\n        \"value\": \"0\"\n      },\n      {\n        \"key\": \"alertCondition\",\n        \"value\": \"ABOVE\"\n      },\n      {\n        \"key\": \"violatingSamples\",\n        \"value\": \"3\"\n      },\n      {\n        \"key\": \"slidingWindow\",\n        \"value\": \"3\"\n      },\n      {\n        \"key\": \"dealertingSamples\",\n        \"value\": \"2\"\n      }\n    ]\n  },\n  \"eventTemplate\": {\n    \"properties\": [\n      {\n        \"key\": \"event.type\",\n        \"value\": \"ERROR_EVENT\"\n      },\n      {\n        \"key\": \"event.name\",\n        \"value\": \"{{ .service }}: backlog grows while consumers are at max\"\n      },\n      {\n        \"key\": \"team\",\n        \"value\": \"{{ .team }}\"\n      },\n      {\n        \"key\": \"runbook\",\n        \"value\": \"{{ .runbook }}\"\n      }\n    ]\n  }\n}", "dynatrace/templates/alert-batch-overdue.json": "{\n  \"enabled\": true,\n  \"title\": \"{{ .service }} · no successful run in 2 intervals\",\n  \"description\": \"Batch job has not succeeded for {{ .max_gap_h }} h (2 × schedule). Runbook: {{ .runbook }}\",\n  \"source\": \"monaco\",\n  \"analyzer\": {\n    \"name\": \"dt.statistics.ui.anomaly_detection.StaticThresholdAnomalyDetectionAnalyzer\",\n    \"input\": [\n      {\n        \"key\": \"query\",\n        \"value\": \"timeseries last_success = max(\u003cjob last success timestamp metric>), filter:{ service.name == \\\"{{ .service }}\\\" }, interval:15m\\n| fieldsAdd hours_since = iCollectArray((unixSecondsFromTimestamp(now()) - last_success[]) / 3600)\\n| fields timeframe, interval, hours_since\"\n      },\n      {\n        \"key\": \"threshold\",\n        \"value\": \"{{ .max_gap_h }}\"\n      },\n      {\n        \"key\": \"alertCondition\",\n        \"value\": \"ABOVE\"\n      },\n      {\n        \"key\": \"violatingSamples\",\n        \"value\": \"1\"\n      },\n      {\n        \"key\": \"slidingWindow\",\n        \"value\": \"1\"\n      },\n      {\n        \"key\": \"dealertingSamples\",\n        \"value\": \"2\"\n      }\n    ]\n  },\n  \"eventTemplate\": {\n    \"properties\": [\n      {\n        \"key\": \"event.type\",\n        \"value\": \"ERROR_EVENT\"\n      },\n      {\n        \"key\": \"event.name\",\n        \"value\": \"{{ .service }}: batch job is overdue\"\n      },\n      {\n        \"key\": \"team\",\n        \"value\": \"{{ .team }}\"\n      },\n      {\n        \"key\": \"runbook\",\n        \"value\": \"{{ .runbook }}\"\n      }\n    ]\n  }\n}", "dynatrace/templates/alert-burn-rate.json": "{\n  \"enabled\": true,\n  \"title\": \"{{ .service }} · SLO fast burn\",\n  \"description\": \"Burn rate above {{ .threshold }} over the last hour (SLO {{ .target }}%). Runbook: {{ .runbook }}\",\n  \"source\": \"monaco\",\n  \"analyzer\": {\n    \"name\": \"dt.statistics.ui.anomaly_detection.StaticThresholdAnomalyDetectionAnalyzer\",\n    \"input\": [\n      { \"key\": \"query\", \"value\": \"fetch spans, from:-1h\\n| filter service.name == \\\"{{ .service }}\\\" and span.kind == \\\"server\\\"\\n| makeTimeseries { total = count(), bad = countIf(http.response.status_code >= 500) }, interval:5m\\n| fieldsAdd burn_rate = (bad[] / total[]) / (1 - {{ .target }} / 100)\\n| fields timeframe, interval, burn_rate\" },\n      { \"key\": \"threshold\", \"value\": \"{{ .threshold }}\" },\n      { \"key\": \"alertCondition\", \"value\": \"ABOVE\" },\n      { \"key\": \"violatingSamples\", \"value\": \"3\" },\n      { \"key\": \"slidingWindow\", \"value\": \"5\" },\n      { \"key\": \"dealertingSamples\", \"value\": \"5\" }\n    ]\n  },\n  \"eventTemplate\": {\n    \"properties\": [\n      { \"key\": \"event.type\", \"value\": \"ERROR_EVENT\" },\n      { \"key\": \"event.name\", \"value\": \"{{ .service }} is burning its error budget\" },\n      { \"key\": \"team\", \"value\": \"{{ .team }}\" },\n      { \"key\": \"runbook\", \"value\": \"{{ .runbook }}\" }\n    ]\n  }\n}\n", "dynatrace/templates/alert-client-ratio.json": "
