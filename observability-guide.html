dard/00-start-here.md` | Decision tree: situation → section |\n| 1 Foundations | `standard/01-layers.md` | Locate the layer of a problem, pick the method |\n| | `standard/02-maturity-model.md` | Score a setup 0–4 per dimension (incl. culture) |\n| | `standard/03-definition-of-done.md` | Checklist / PRR: is a service well monitored? |\n| 2 Signals | `standard/04-endpoint-coverage.md` | Required signals and attributes, business metrics, multiple clients |\n| | `standard/05-logging-standard.md` | Log record structure, required fields, naming, severity, masking layers, retention buckets, log alerts |\n| | `standard/06-workload-types.md` | Queues, batch jobs, external dependencies |\n| | `standard/07-frontend-experience.md` | RUM, Core Web Vitals, synthetics |\n| | `standard/08-kubernetes-cluster.md` | Cluster coverage checklist (OTel source + Dynatrace native), triage order |\n| | `standard/09-internal-services.md` | Internal SLOs, caller-side measurement, shared platform services, timeouts/retry budgets |\n| 3 Reliability | `standard/10-slos-and-error-budgets.md` | SLIs in DQL, burn rate, multi-window, error budget policy |\n| | `standard/11-alerting.md` | Percentage vs count, guards, one alert source per symptom, case catalog, cleanup |\n| | `standard/12-releases-and-dora.md` | `service.version`, deployment events, release validation, DORA |\n| | `standard/13-capacity-and-saturation.md` | Demand vs supply, N+2 headroom, saturation, right-sizing, autoscaling, forecasts |\n| 4 Dashboards | `standard/14-dashboards.md` | L0–L3 hierarchy, L1 template with `service` variable, tile rules |\n| 5 Platform | `standard/15-opentelemetry-practices.md` | Resource identity, semconv, instrumentation, metrics from spans, sampling, security |\n| | `standard/16-collector-templates.md` | Agent / cluster / gateway pipelines, resilience, self-monitoring |\n| | `standard/17-dynatrace-integration.md` | OneAgent vs OTel path, per-workload decision, ingest rules, DPS cost |\n| | `standard/18-automation-and-scale.md` | Service file, tier defaults, **microservice templates (baseline + archetype + parameters)**, Monaco, Workflows |\n| | `standard/19-cost-and-cardinality.md` | Cardinality budget, reducing series, retention |\n| 6 People | `standard/20-ownership-and-communication.md` | RACI, **incident severity SEV1–4 (criteria + actions)**, routing by team, incident/change flows, rituals |\n| | `standard/21-incident-response-and-on-call.md` | Incident loop, runbook standard, postmortems, on-call practice |\n| | `standard/22-resilience.md` | RPO/RTO, restore tests, DR, chaos engineering / game days, progressive delivery |\n| | `standard/23-measuring-effectiveness.md` | Observability KPIs (detection, response, alert quality, coverage, cost), incident fields, toil, impact log |\n| | `framework/` | Transition plan, SLO document, error budget policy, runbook, postmortem and game day templates |\n| | `playbooks/*.md` | Known use cases (check `Status`) |\n| | `examples/case-study.md` | One story through every section (good model for answers) |\n| Reference | `collector/` | Validated collector templates (agent, cluster, gateway → Dynatrace) |\n| | `dynatrace/` | Monaco project: baseline templates, generator from `observability.yaml`, team workflows, shared dashboard |\n| | `rules/`, `dashboards/` | Open-source variants (tested PromQL, Grafana JSON) |\n| | `GLOSSARY.md`, `REFERENCES.md` | Definitions; official docs behind each claim |\n\n## Mode 1 · Triage a problem\n\n1. **Restate** the symptom: who is affected, what they see, since when. Ask at most 2 questions if critical info is missing.\n2. **Locate the layer** (`01`). Always ask: *did something change?* (`12`: deployment events, `service.version`). For dependencies measure from the caller (`09`); for growth check capacity (`13`).\n3. **Match a playbook** in `playbooks/`; say so if it is a draft.\n4. **Check coverage** against `03` and, for clusters, `08`. List the gaps that block diagnosis.\n5. **Propose** DQL queries, custom alerts / SLO changes and dashboard tiles following `10`, `11`, `14`. Mark DQL as a shape to adapt (field names depend on the tenant).\n6. **Name owners and communication** (`20`).\n\nOutput:\n\n```markdown\n| Symptom | Layer | Method | Matching playbook |\n|---|---|---|---|\n\n**Gaps** (definition of done #): …\n**Investigate now** (DQL / where to look in Dynatrace): …\n**Proposed alerts** (type · condition · severity · why): …\n**Dashboard changes**: …\n**Owner / who to inform**: …\n**How to validate**: …\n**Sources used**: standard/…§…\n```\n\n## Mode 2 · Review alert definitions\n\nFor each alert (Dynatrace custom alert, SLO alert, Davis setting, or Prometheus rule): name | type (ratio/count/burn/absence/capacity) |\nsymptom or cause | problems | keep/rewrite/merge/delete | rewritten condition.\nFlag: ratios without a minimum-count guard, counts on high-volume flows, cause-based pages, missing owner/runbook, no dealerting\nwindow, per-pod alerts, unbounded dimensions, missing per-client / per-version split, the same symptom alerted twice (Davis + custom alert).\n\n## Mode 3 · Plan a transition or a rollout at scale\n\n1. Score the current setup with `02` (current vs target).\n2. If an existing setup must change, build the plan from `framework/transition-plan.md` (shadow, cutover, RACI, communication).\n3. For many services, design onboarding with `18`: service file, archetype, tier defaults, templates, Monaco pipeline.\n\n## Rules\n\n- Symptoms over causes; never propose paging on CPU/memory alone.\n- Bounded dimensions only; never user IDs, order IDs or raw URLs as metric dimensions.\n- Base recommendations on official documentation (`REFERENCES.md` or the doc you checked); mark anything else as a rule of thumb.\n- Thresholds in the guide are starting points; say they must be tuned to real traffic.\n- Don't invent company-specific facts (team names, SLAs); ask or leave placeholders.\n- If the guide doesn't cover the case, say so and suggest a new playbook from `playbooks/_template.md`.\n"}, {"group": "Reference", "path": "GLOSSARY.md", "slug": "glossary", "title": "Glossary", "md": "# Glossary\n\n| Term | Meaning | See |\n|---|---|---|\n| **Absence alert** | Fires when something stops happening (count is 0, or the series is missing) | [11](#standard-11-alerting) |\n| **Alert precision / recall** | Precision: pages that needed action ÷ all pages. Recall: incidents preceded by an alert ÷ incidents | [23](#standard-23-measuring-effectiveness) |\n| **Annotation (deploy marker)** | A vertical line on a graph marking an event, like a deploy | [12](#standard-12-releases-and-dora) |\n| **Backlog / Little's law** | Messages waiting in a queue; in steady state backlog = arrival rate × wait time, so wait ≈ backlog / processing rate | [06](#standard-06-workload-types--queues-and-async-processing) |\n| **Burn rate** | How fast the error budget is used. 1 = exactly on budget; 14.4 = a 30-day budget gone in ~2 days | [11](#standard-11-alerting), [10](#standard-10-slos-and-error-budgets) |\n| **Canary** | Sending a small share of traffic to a new version and comparing it with the old one | [12](#standard-12-releases-and-dora) |\n| **Cardinality** | Number of unique time series, driven by label value combinations | [19](#standard-19-cost-and-cardinality) |\n| **Change failure rate** | Share of deployments that cause a failure needing remediation (DORA) | [12](#standard-12-releases-and-dora) |\n| **Chaos engineering / game day** | Injecting real failures on purpose, with a steady-state hypothesis and a small blast radius, to prove resilience and alerts | [22](#standard-22-resilience) |\n| **Client-side measurement** | Measuring a dependency from the caller's spans (includes network, timeouts, pools) | [09](#standard-09-internal-services) |\n| **Consumer lag** | Messages waiting to be processed by a consumer group | [06](#standard-06-workload-types) |\n| **Counter** | A metric that only goes up (requests total). Use `rate()` / `increase()` on it | – |\n| **Deployment frequency** | How often a team deploys to production (DORA) | [12](#standard-12-releases-and-dora) |\n| **DORA metrics** | Delivery performance: deployment frequency, change lead time, change failure rate, failed deployment recovery time, deployment rework rate | [12](#standard-12-releases-and-dora) |\n| **Error budget policy** | Agreed actions when the budget is spent (freeze, reliability work) | [10](#standard-10-slos-and-error-budgets) |\n| **Error budget** | 1 − SLO: the failure you're allowed. 99.9% → 0.1% | [10](#standard-10-slos-and-error-budgets) |\n| **Event name** | Stable name of a log event type (`checkout.payment_failed`) for search and alerts | [05](#standard-05-logging-standard) |\n| **Exemplar** | A trace ID attached to a metric sample, to jump from a graph to a trace | [15](#standard-15-opentelemetry-practices) |\n| **Failed deployment recovery time** | Time to recover from a deployment that needs immediate intervention (DORA; replaced MTTR in 2023) | [12](#standard-12-releases-and-dora) |\n| **Feature flag** | Switch to turn code paths on or off at runtime; OpenFeature is a vendor-neutral API for them | [22](#standard-22-resilience) |\n| **Golden data** | Test records with known expected results, used to check a data pipeline's correctness | [06](#standard-06-workload-types--data-pipelines-freshness-coverage-correctness) |\n| **Golden Signals** | Latency, traffic, errors, saturation (Google SRE) | [01](#standard-01-layers) |\n| **Grail bucket** | Dynatrace storage unit with its own retention, used to keep log classes apart | [05](#standard-05-logging-standard) |\n| **Head / tail sampling** | Keeping a share of traces, decided at the start (head) or after the trace ends (tail) | [15](#standard-15-opentelemetry-practices) |\n| **Headroom / N+2** | Spare capacity so peak traffic is served with two instances (or a zone + an instance) gone | [13](#standard-13-capacity-and-saturation) |\n| **Histogram** | Metric that counts observations into buckets; gives percentiles and averages | [04](#standard-04-endpoint-coverage) |\n| **Incident Commander (IC)** | The person coordinating an incident, not fixing it | [20](#standard-20-ownership-and-communication) |\n| **Incident severity (SEV1–SEV4)** | How big the impact is and how big the response must be: Critical, Major, Minor, Low | [20](#standard-20-ownership-and-communication--severity-levels-and-actions) |\n| **Inhibition** | Alertmanager muting dependent alerts while a bigger one fires | [11](#standard-11-alerting) |\n| **Internal SLO** | SLO for a service called by other services; stricter than the user-facing SLOs that depend on it | [09](#standard-09-internal-services) |\n| **KEDA** | Kubernetes event-driven autoscaler: scales consumers on queue lag/length | [13](#standard-13-capacity-and-saturation) |\n| **Lead time for changes** | Time from commit to running in production (DORA) | [12](#standard-12-releases-and-dora) |\n| **Load test** | Controlled traffic to find the throughput a component handles within its SLO (its real capacity) | [13](#standard-13-capacity-and-saturation) |\n| **Masking / redaction** | Removing or hiding secrets and personal data from telemetry, in layers (code, logger, gateway, OpenPipeline) | [05](#standard-05-logging-standard) |\n| **Minimum-count guard** | Extra condition (`and errors > N`) so a ratio doesn't fire on tiny traffic | [11](#standard-11-alerting) |\n| **MTTA / MTTD / MTTR** | Mean time to acknowledge / detect / repair-recover-resolve (always say which R) | [23](#standard-23-measuring-effectiveness) |\n| **Multi-window alert** | Burn-rate alert that checks a long and a short window together | [11](#standard-11-alerting) |\n| **Page vs ticket** | Page = wake someone up now; ticket = fix during working hours | [11](#standard-11-alerting) |\n| **Postmortem (blameless)** | Written review of an incident focused on systems, not people | [20](#standard-20-ownership-and-communication) |\n| **PRR (Production Readiness Review)** | Checklist review before a service goes live or gets on-call | [03](#standard-03-definition-of-done) |\n| **Pseudonymization** | Replacing an identifier with a salted hash so it can be correlated without revealing who it is | [05](#standard-05-logging-standard) |\n| **RACI** | Responsible, Accountable, Consulted, Informed: who does what | [20](#standard-20-ownership-and-communication) |\n| **Recording rule** | Pre-computed query saved as a new series, for speed and reuse | [rules/](#rules-readme) |\n| **RED** | Rate, Errors, Duration: for request-driven services | [01](#standard-01-layers) |\n| **Resource attribute** | OTel attribute describing the source (service, version, pod), shared by all its signals | [04](#standard-04-endpoint-coverage) |\n| **Retry budget** | Cap on retries (per request and as % of load) with backoff + jitter, to avoid retry storms | [09](#standard-09-internal-services) |\n| **Right-sizing** | Matching requests/limits to real usage: less cost, fewer OOMs and throttling | [13](#standard-13-capacity-and-saturation) |\n| **RPO / RTO** | Recovery point objective (max data loss, in time) / recovery time objective (max time to restore) | [22](#standard-22-resilience) |\n| **Runbook** | Step-by-step response guide linked from an alert | [20](#standard-20-ownership-and-communication) |\n| **Saturation** | How full a resource is (queue depth, pool usage, throttling) | [01](#standard-01-layers) |\n| **Service tier** | How important a service is (1–3); decides SLOs, alert defaults and part of incident severity | [18](#standard-18-automation-and-scale) |\n| **Severity number** | OTel log level as a number: TRACE 1–4, DEBUG 5–8, INFO 9–12, WARN 13–16, ERROR 17–20, FATAL 21–24 | [05](#standard-05-logging-standard) |\n| **Shadow mode** | New alerts route to a non-paging receiver while being compared with the old ones | [transition plan](#framework-transition-plan) |\n| **SLA** | Contract with a client, usually looser than the SLO, often with penalties | [10](#standard-10-slos-and-error-budgets) |\n| **SLI** | Service level indicator: good events / valid events | [10](#standard-10-slos-and-error-budgets) |\n| **SLO** | Service level objective: target for an SLI over a window | [10](#standard-10-slos-and-error-budgets) |\n| **Span metrics** | RED metrics generated from traces | [15](#standard-15-opentelemetry-practices) |\n| **Symptom vs cause** | What users feel (errors) vs why it happens (CPU). Page on symptoms | [01](#standard-01-layers) |\n| **Toil** | Manual, repetitive, automatable operational work | – |\n| **USE** | Utilization, Saturation, Errors: for resources | [01](#standard-01-layers) |\n| **Westrum culture** | Pathological / bureaucratic / generative organization types; DORA uses it to measure culture | [02](#standard-02-maturity-model) |\n| **Wheel of Misfortune** | Role-play of a past incident to train on-call engineers and test runbooks | [21](#standard-21-incident-response-and-on-call) |\n"}, {"group": "Reference", "path": "REFERENCES.md", "slug": "references", "title": "References", "md": "# References\n\n> Official documentation and primary sources behind the standard. Rule: every recommendation should point here\n> (or to an official doc) and say if it's a **rule of thumb** instead.\n> Status: ✅ checked against the official page on the date shown · 📚 primary source, cited from the book/essay · ⚠️ rule of thumb (this guide)\n\n## Alerting and SLOs\n\n| Source | Supports | Status |\n|---|---|---|\n| [Google SRE Workbook, *Alerting on SLOs*](https://sre.google/workbook/alerting-on-slos/) | Burn rate; multi-window (short window = 1/12 of long); recommended **14.4× 1h/5m page, 6× 6h/30m page, 1× 3d/6h ticket** | ✅ 2026-11-20 |\n| [Google SRE Book, *Monitoring Distributed Systems*](https://sre.google/sre-book/monitoring-distributed-systems/) | Four Golden Signals, symptoms vs causes | 📚 |\n| [Google SRE Book, *Being On-Call*](https://sre.google/sre-book/being-on-call/ , *Strangler Fig Application*](https://martinfowler.com/bliki/StranglerFigApplication.html) | Incremental migration, old and new in parallel | 📚 |\n\n## Incidents and ownership\n\n| Source | Supports | Status |\n|---|---|---|\n| [Google SRE Book, *Managing Incidents*](https://sre.google/sre-book/managing-incidents/) | Incident roles (IC, ops, comms) | 📚 |\n| [Google SRE Book, *Postmortem Culture*](https://sre.google/sre-book/postmortem-culture/) | Blameless postmortems | 📚 |\n| [PagerDuty Incident Response](https://response.pagerduty.com/) | Roles, process | 📚 |\n| [Google SRE Workbook, *Engagement Model*](https://sre.google/workbook/engagement-model/) | Production Readiness Review before GA | ✅ 2026-11-20 |\n| [DORA: Generative organizational culture](https://dora.dev/capabilities/generative-organizational-culture/) | Westrum survey; high-trust culture predicts delivery and organizational performance | ✅ 2026-11-20 |\n| [DORA: Monitoring and observability](https://dora.dev/capabilities/monitoring-and-observability/) | Avoid a single person/team owning monitoring; track changes to monitoring config | ✅ 2026-11-20 |\n| [Backstage software catalog](https://backstage.io/docs/features/software-catalog/) | Machine-readable ownership | 📚 |\n| RACI split, ritual cadences, maturity levels, transition phase lengths | – | ⚠️ |\n\n## Dynatrace\n\n| Source | Supports | Status |\n|---|---|---|\n| [Version detection methods](https://docs.dynatrace.com/docs/deliver/release-monitoring/version-detection-strategies-latest) · [Build label propagation](https://docs.dynatrace.com/docs/ingest-from/setup-on-k8s/guides/metadata-automation/build-label-propagation) | `app.kubernetes.io/version` → `DT_RELEASE_VERSION` (pod labels only), enabled with DynaKube feature flag `feature.dynatrace.com/label-version-detection=true` | ✅ 2026-11-20 |\n| [Events API v2: POST an event](https://docs.dynatrace.com/docs/dynatrace-api/environment-api/events-v2/post-event) | `eventType: CUSTOM_DEPLOYMENT` | ✅ 2026-11-20 |\n| [Site Reliability Guardian](https://docs.dynatrace.com/docs/deliver/site-reliability-guardian) · [release validation](https://docs.dynatrace.com/docs/deliver/quality-gates) | Release validation with objectives (DQL), \"Four golden signals\" template, triggered by SDLC events | ✅ 2026-11-20 |\n| [Event analysis and correlation](https://docs.dynatrace.com/docs/discover-dynatrace/platform/davis-ai/root-cause-analysis/concepts/events) | Davis merges events with the same root cause into one problem, using topology (not time alone) | ✅ 2026-11-20 |\n"}, {"group": "Open-source variants", "path": "rules/README.md", "slug": "rules-readme", "title": "Rules: tested alert and recording rules", "md": "# Rules: tested alert and recording rules\n\n> **Open-source variant (Prometheus).** Copy-paste-safe versions of the patterns in the standard; with Dynatrace the same patterns become SLOs and custom alerts ([10](#standard-10-slos-and-error-budgets), [11](#standard-11-alerting)). Every rule here has a unit test that runs with\n> [`promtool test rules`](https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/).\n\n| File | Patterns | Standard |\n|---|---|---|\n| <span class=\"repo-path\">rules/checkout-slo.rules.yml<\/span> | SLI recording rules (5m → 3d), multi-window multi-burn-rate page + ticket, low-traffic guard | [11 §4](#standard-11-alerting), [10](#standard-10-slos-and-error-budgets) |\n| <span class=\"repo-path\">rules/patterns.rules.yml<\/span> | Per-client ratio + min count, DLQ count, absence, release regression by version, burn after deploy | [11](#standard-11-alerting), [12](#standard-12-releases-and-dora) |\n| <span class=\"repo-path\">rules/tests<\/span> | Unit tests with synthetic series | – |\n\n## Run the tests\n\n```bash\nmake test        # from the repo root (uses the prom/prometheus:v3.5.0 image, no local install needed)\n```\n\n## What the tests prove\n\n| Test | Scenario | Expected |\n|---|---|---|\n| fast burn pages | 100 req/s, 2% errors | Page fires (2% > 14.4 × 0.1%) |\n| slow burn does not page | 0.5% errors | No page (ticket territory) |\n| page resolves once both short windows are clean | Errors stop at minute 80 | Still firing at 70m; resolved at 115m. **The 6h/30m pair keeps paging for up to 30 min after the fix** |\n| per-client ratio with minimum-count guard | Big client fine, small client 100% failing, tiny client 1 error out of 3 | Only `small` fires; `tiny` stays silent thanks to the guard |\n| count alert fires on a single DLQ message | One message | Fires |\n| absence alert when orders stop | Orders flat for 30 min | Silent at 15m, fires at 45m |\n| release regression between two versions | 1.41.3 at 0.2%, 1.42.0 at 4% | Fires with `suspect: deploy` |\n| single version is not a regression | Only 1.42.0, 4% errors | Silent (the SLO alert covers it) |\n| burn after deploy | Generation 7 → 8 at minute 60, then errors | Silent before, fires at 75m |\n\n## Adapting to your metrics\n\n- Metric and label names follow OTel semantic conventions translated by Prometheus (`http_server_request_duration_seconds_count`, `http_response_status_code`, `service_name`). If your instrumentation differs, change the selectors **and** the test series.\n- `service_name` / `service_version` as labels require promoting resource attributes ([12](#standard-12-releases-and-dora--1-version-on-every-signal)).\n- For many services, generate SLO rules with [Sloth](https://sloth.dev/) or [Pyrra](https://github.com/pyrra-dev/pyrra) instead of copying `checkout-slo.rules.yml`.\n- Thresholds (5%, 20 errors, 0.5 req/s, 1%) are rules of thumb ⚠️.\n"}, {"group": "Open-source variants", "path": "dashboards/README.md", "slug": "dashboards-readme", "title": "Dashboards as code", "md": "# Dashboards as code\n\n> **Open-source variant.** The L1 service template from [standard/14](#standard-14-dashboards) as importable Grafana JSON. With Dynatrace, build the same tiles in Dynatrace Dashboards and keep the export as the template ([18](#standard-18-automation-and-scale)).\n\n| File | What |\n|---|---|\n| <span class=\"repo-path\">dashboards/service-red.json<\/span> | Service dashboard: SLO status → RED → per client → per version → saturation, with deploy annotations |\n| <span class=\"repo-path\">dashboards/generate.py<\/span> | Generates the JSON. Edit this, not the JSON |\n| <span class=\"repo-path\">dashboards/check.sh<\/span> | Imports every dashboard into a throwaway Grafana and fails if one is rejected |\n\n## Layout of `service-red`\n\n| Row | Panels | Question |\n|---|---|---|\n| SLO status | Availability 28d, budget left, burn rate 1h, req/s | Are we OK? |\n| RED overview | Requests and error % as two stacked panels on the same time axis (no second y-axis); latency heatmap; p50/p95/p99 | What changed? |\n| Per client | Table: req/s, errors (1h), error % (colored), p95, sorted by error % | Who is affected? |\n| Per version | Error % by version; traffic share by version (stacked %) | Did a release cause it? |\n| Saturation | CPU throttling, memory vs limit, active requests | Why? |\n\nVariables: `datasource`, `namespace`, `service`, `slo`. Annotations: Grafana annotations tagged `deploy` (from the pipeline or Argo CD) and rollouts derived from kube-state-metrics.\n\n## Use it\n\n```bash\npython3 -I dashboards/generate.py     # regenerate after editing\nmake check-dashboards                 # import test (Docker, grafana/grafana:11.6.0)\n```\n\nImport in Grafana: **Dashboards → New → Import → upload `service-red.json`**, or provision it from a ConfigMap with the Grafana sidecar.\n\n## Status\n\n| Check | Result |\n|---|---|\n| Imports into Grafana 11.6.0 (18 panels stored) | ✅ 2026-11-20 |\n\nRequirements: metrics named per OTel semconv (`http_server_request_duration_seconds_*`), with `service_name`, `service_version` and `client_id` labels ([12](#standard-12-releases-and-dora--1-version-on-every-signal)), plus kube-state-metrics and cAdvisor.\n"}, {"group": "Reference", "path": "CHANGELOG", "slug": "changelog", "title": "Changelog", "md": "# Changelog\n\n\n| Version | Date | Change |\n|---|---|---|\n| v0.14 | 2026-11-20 | 21 incident response and on-call (incident loop, runbooks, postmortems, on-call practice, Wheel of Misfortune); 22 resilience (RPO/RTO, restore tests, DR drills, chaos engineering and game days, progressive delivery with flags and canaries); 23 measuring effectiveness (scorecard, incident fields, toil, cases with lab numbers, personal impact log); data pipeline SLOs in 06; runbook, postmortem and game day templates; charts and incident-loop diagram |\n| v0.13 | 2026-11-20 | Incident severity in 20: tier vs alert severity vs SEV, SEV1–4 criteria, actions per level (notification, ack time, roles, update cadence, client comms, freeze, postmortem), rules, Dynatrace mapping (standardized event severity 1–5, Workflow routing); severity matrix |\n| v0.12 | 2026-11-20 | 05 became the **logging standard** (OTel log data model, required fields, naming rules, severity levels, what never to log, five masking layers incl. Dynatrace OpenPipeline, collection, Grail buckets and retention, correlation, log alerts, checklist); trace content (metrics from spans, sampling) moved to 15 |\n| v0.11 | 2026-11-20 | 09 internal and platform services (caller-side measurement, internal SLOs, platform ownership, timeouts/retry budgets); 13 capacity and saturation (demand vs load-tested supply, N+2 headroom, saturation table, right-sizing, HPA/KEDA, Dynatrace forecasts, capacity review); queues expanded in 06 (Little's law, oldest age as SLI, partition skew, retries, autoscaling on lag); charts for capacity forecast and queue flow; dependency-chain diagram; Monaco archetype `platform-service` and backlog-at-max alert; sections renumbered 00–20 |\n| v0.10 | 2026-11-20 | Dynatrace as code with Monaco: `dynatrace/` project (templates for SLOs, custom alerts, team workflows; one shared L1 dashboard; generator from observability.yaml per archetype; offline check); section 16 Monaco-only |\n| v0.9 | 2026-11-20 | Restructured into six parts (sections 00–18); Dynatrace-first rewrite of SLOs, alerting, releases/DORA, dashboards, Dynatrace platform and the case study (open-source variants collapsed); merged dashboards (visualization + structure) and Kubernetes (platform + measurement); microservice templates (baseline + archetype + parameters) in 16; \"In 30 seconds\" summaries; diagrams updated to a Dynatrace-only setup |\n| v0.8 | 2026-11-20 | Automation and scale; challenge template removed |\n| v0.7 | 2026-11-20 | Dynatrace as default backend; frontend; OpenTelemetry practices; collector templates; cluster measurement; roadmap |\n| v0.6 | 2026-11-20 | Dashboard structure; Dynatrace integration; validated fan-out collector config; architecture diagrams |\n| v0.5 | 2026-11-20 | Visualization standard; live example charts; dual-axis removed; playbooks drafted |\n| v0.4 | 2026-11-20 | Web page generated from Markdown; tested rules; dashboard as code; start-here; case study; logs & traces, workload types, Kubernetes, cost; glossary |\n| v0.3 | 2026-11-20 | SLOs and error budgets; SLO document and error budget policy templates |\n| v0.2.1 | 2026-11-20 | Checked against official docs; REFERENCES.md |\n| v0.2 | 2026-11-20 | Repo structure; Delivery layer; ownership; maturity model; transition plan; AGENTS.md |\n| v0.1 | 2026-11-19 | First version (web) |\n"}]</script>
<script id="src" type="application/json">{".gitignore": "__pycache__/\n*.pyc\n.DS_Store\n", "AGENTS.md": "# AGENTS.md: how to use the Observability Guide\n\nYou are helping an SRE with observability. The stack is **OpenTelemetry for collection and Dynatrace as the backend**\n(ActiveGate, some OneAgent). This repository is the **standard**: base every recommendation on it, cite the file and\nsection, and explain *why*. Default to Dynatrace concepts (DQL, SLO app, custom alerts, Davis problems, Workflows,\nDynatrace dashboards; configuration as code with **Monaco only**); use Prometheus/PromQL only when asked (open-source variants are in collapsed boxes).\n\n## Map (six parts)\n\n| Part | Path | Use it for |\n|---|---|---|\n| Start | `standard/00-start-here.md` | Decision tree: situation → section |\n| 1 Foundations | `standard/01-layers.md` | Locate the layer of a problem, pick the method |\n| | `standard/02-maturity-model.md` | Score a setup 0–4 per dimension (incl. culture) |\n| | `standard/03-definition-of-done.md` | Checklist / PRR: is a service well monitored? |\n| 2 Signals | `standard/04-endpoint-coverage.md` | Required signals and attributes, business metrics, multiple clients |\n| | `standard/05-logging-standard.md` | Log record structure, required fields, naming, severity, masking layers, retention buckets, log alerts |\n| | `standard/06-workload-types.md` | Queues, batch jobs, external dependencies |\n| | `standard/07-frontend-experience.md` | RUM, Core Web Vitals, synthetics |\n| | `standard/08-kubernetes-cluster.md` | Cluster coverage checklist (OTel source + Dynatrace native), triage order |\n| | `standard/09-internal-services.md` | Internal SLOs, caller-side measurement, shared platform services, timeouts/retry budgets |\n| 3 Reliability | `standard/10-slos-and-error-budgets.md` | SLIs in DQL, burn rate, multi-window, error budget policy |\n| | `standard/11-alerting.md` | Percentage vs count, guards, one alert source per symptom, case catalog, cleanup |\n| | `standard/12-releases-and-dora.md` | `service.version`, deployment events, release validation, DORA |\n| | `standard/13-capacity-and-saturation.md` | Demand vs supply, N+2 headroom, saturation, right-sizing, autoscaling, forecasts |\n| 4 Dashboards | `standard/14-dashboards.md` | L0–L3 hierarchy, L1 template with `service` variable, tile rules |\n| 5 Platform | `standard/15-opentelemetry-practices.md` | Resource identity, semconv, instrumentation, metrics from spans, sampling, security |\n| | `standard/16-collector-templates.md` | Agent / cluster / gateway pipelines, resilience, self-monitoring |\n| | `standard/17-dynatrace-integration.md` | OneAgent vs OTel path, per-workload decision, ingest rules, DPS cost |\n| | `standard/18-automation-and-scale.md` | Service file, tier defaults, **microservice templates (baseline + archetype + parameters)**, Monaco, Workflows |\n| | `standard/19-cost-and-cardinality.md` | Cardinality budget, reducing series, retention |\n| 6 People | `standard/20-ownership-and-communication.md` | RACI, **incident severity SEV1–4 (criteria + actions)**, routing by team, incident/change flows, rituals |\n| | `standard/21-incident-response-and-on-call.md` | Incident loop, runbook standard, postmortems, on-call practice |\n| | `standard/22-resilience.md` | RPO/RTO, restore tests, DR, chaos engineering / game days, progressive delivery |\n| | `standard/23-measuring-effectiveness.md` | Observability KPIs (detection, response, alert quality, coverage, cost), incident fields, toil, impact log |\n| | `framework/` | Transition plan, SLO document, error budget policy, runbook, postmortem and game day templates |\n| | `playbooks/*.md` | Known use cases (check `Status`) |\n| | `examples/case-study.md` | One story through every section (good model for answers) |\n| Reference | `collector/` | Validated collector templates (agent, cluster, gateway → Dynatrace) |\n| | `dynatrace/` | Monaco project: baseline templates, generator from `observability.yaml`, team workflows, shared dashboard |\n| | `rules/`, `dashboards/` | Open-source variants (tested PromQL, Grafana JSON) |\n| | `GLOSSARY.md`, `REFERENCES.md` | Definitions; official docs behind each claim |\n\n## Mode 1 · Triage a problem\n\n1. **Restate** the symptom: who is affected, what they see, since when. Ask at most 2 questions if critical info is missing.\n2. **Locate the layer** (`01`). Always ask: *did something change?* (`12`: deployment events, `service.version`). For dependencies measure from the caller (`09`); for growth check capacity (`13`).\n3. **Match a playbook** in `playbooks/`; say so if it is a draft.\n4. **Check coverage** against `03` and, for clusters, `08`. List the gaps that block diagnosis.\n5. **Propose** DQL queries, custom alerts / SLO changes and dashboard tiles following `10`, `11`, `14`. Mark DQL as a shape to adapt (field names depend on the tenant).\n6. **Name owners and communication** (`20`).\n\nOutput:\n\n```markdown\n| Symptom | Layer | Method | Matching playbook |\n|---|---|---|---|\n\n**Gaps** (definition of done #): …\n**Investigate now** (DQL / where to look in Dynatrace): …\n**Proposed alerts** (type · condition · severity · why): …\n**Dashboard changes**: …\n**Owner / who to inform**: …\n**How to validate**: …\n**Sources used**: standard/…§…\n```\n\n## Mode 2 · Review alert definitions\n\nFor each alert (Dynatrace custom alert, SLO alert, Davis setting, or Prometheus rule): name | type (ratio/count/burn/absence/capacity) |\nsymptom or cause | problems | keep/rewrite/merge/delete | rewritten condition.\nFlag: ratios without a minimum-count guard, counts on high-volume flows, cause-based pages, missing owner/runbook, no dealerting\nwindow, per-pod alerts, unbounded dimensions, missing per-client / per-version split, the same symptom alerted twice (Davis + custom alert).\n\n## Mode 3 · Plan a transition or a rollout at scale\n\n1. Score the current setup with `02` (current vs target).\n2. If an existing setup must change, build the plan from `framework/transition-plan.md` (shadow, cutover, RACI, communication).\n3. For many services, design onboarding with `18`: service file, archetype, tier defaults, templates, Monaco pipeline.\n\n## Rules\n\n- Symptoms over causes; never propose paging on CPU/memory alone.\n- Bounded dimensions only; never user IDs, order IDs or raw URLs as metric dimensions.\n- Base recommendations on official documentation (`REFERENCES.md` or the doc you checked); mark anything else as a rule of thumb.\n- Thresholds in the guide are starting points; say they must be tuned to real traffic.\n- Don't invent company-specific facts (team names, SLAs); ask or leave placeholders.\n- If the guide doesn't cover the case, say so and suggest a new playbook from `playbooks/_template.md`.\n", "GLOSSARY.md": "# Glossary\n\n| Term | Meaning | See |\n|---|---|---|\n| **Absence alert** | Fires when something stops happening (count is 0, or the series is missing) | [11](standard/11-alerting.md) |\n| **Alert precision / recall** | Precision: pages that needed action ÷ all pages. Recall: incidents preceded by an alert ÷ incidents | [23](standard/23-measuring-effectiveness.md) |\n| **Annotation (deploy marker)** | A vertical line on a graph marking an event, like a deploy | [12](standard/12-releases-and-dora.md) |\n| **Backlog / Little's law** | Messages waiting in a queue; in steady state backlog = arrival rate × wait time, so wait ≈ backlog / processing rate | [06](standard/06-workload-types.md#queues-and-async-processing) |\n| **Burn rate** | How fast the error budget is used. 1 = exactly on budget; 14.4 = a 30-day budget gone in ~2 days | [11](standard/11-alerting.md), [10](standard/10-slos-and-error-budgets.md) |\n| **Canary** | Sending a small share of traffic to a new version and comparing it with the old one | [12](standard/12-releases-and-dora.md) |\n| **Cardinality** | Number of unique time series, driven by label value combinations | [19](standard/19-cost-and-cardinality.md) |\n| **Change failure rate** | Share of deployments that cause a failure needing remediation (DORA) | [12](standard/12-releases-and-dora.md) |\n| **Chaos engineering / game day** | Injecting real failures on purpose, with a steady-state hypothesis and a small blast radius, to prove resilience and alerts | [22](standard/22-resilience.md) |\n| **Client-side measurement** | Measuring a dependency from the caller's spans (includes network, timeouts, pools) | [09](standard/09-internal-services.md) |\n| **Consumer lag** | Messages waiting to be processed by a consumer group | [06](standard/06-workload-types.md) |\n| **Counter** | A metric that only goes up (requests total). Use `rate()` / `increase()` on it | – |\n| **Deployment frequency** | How often a team deploys to production (DORA) | [12](standard/12-releases-and-dora.md) |\n| **DORA metrics** | Delivery performance: deployment frequency, change lead time, change failure rate, failed deployment recovery time, deployment rework rate | [12](standard/12-releases-and-dora.md) |\n| **Error budget policy** | Agreed actions when the budget is spent (freeze, reliability work) | [10](standard/10-slos-and-error-budgets.md) |\n| **Error budget** | 1 − SLO: the failure you're allowed. 99.9% → 0.1% | [10](standard/10-slos-and-error-budgets.md) |\n| **Event name** | Stable name of a log event type (`checkout.payment_failed`) for search and alerts | [05](standard/05-logging-standard.md) |\n| **Exemplar** | A trace ID attached to a metric sample, to jump from a graph to a trace | [15](standard/15-opentelemetry-practices.md) |\n| **Failed deployment recovery time** | Time to recover from a deployment that needs immediate intervention (DORA; replaced MTTR in 2023) | [12](standard/12-releases-and-dora.md) |\n| **Feature flag** | Switch to turn code paths on or off at runtime; OpenFeature is a vendor-neutral API for them | [22](standard/22-resilience.md) |\n| **Golden data** | Test records with known expected results, used to check a data pipeline's correctness | [06](standard/06-workload-types.md#data-pipelines-freshness-coverage-correctness) |\n| **Golden Signals** | Latency, traffic, errors, saturation (Google SRE) | [01](standard/01-layers.md) |\n| **Grail bucket** | Dynatrace storage unit with its own retention, used to keep log classes apart | [05](standard/05-logging-standard.md) |\n| **Head / tail sampling** | Keeping a share of traces, decided at the start (head) or after the trace ends (tail) | [15](standard/15-opentelemetry-practices.md) |\n| **Headroom / N+2** | Spare capacity so peak traffic is served with two instances (or a zone + an instance) gone | [13](standard/13-capacity-and-saturation.md) |\n| **Histogram** | Metric that counts observations into buckets; gives percentiles and averages | [04](standard/04-endpoint-coverage.md) |\n| **Incident Commander (IC)** | The person coordinating an incident, not fixing it | [20](standard/20-ownership-and-communication.md) |\n| **Incident severity (SEV1–SEV4)** | How big the impact is and how big the response must be: Critical, Major, Minor, Low | [20](standard/20-ownership-and-communication.md#severity-levels-and-actions) |\n| **Inhibition** | Alertmanager muting dependent alerts while a bigger one fires | [11](standard/11-alerting.md) |\n| **Internal SLO** | SLO for a service called by other services; stricter than the user-facing SLOs that depend on it | [09](standard/09-internal-services.md) |\n| **KEDA** | Kubernetes event-driven autoscaler: scales consumers on queue lag/length | [13](standard/13-capacity-and-saturation.md) |\n| **Lead time for changes** | Time from commit to running in production (DORA) | [12](standard/12-releases-and-dora.md) |\n| **Load test** | Controlled traffic to find the throughput a component handles within its SLO (its real capacity) | [13](standard/13-capacity-and-saturation.md) |\n| **Masking / redaction** | Removing or hiding secrets and personal data from telemetry, in layers (code, logger, gateway, OpenPipeline) | [05](standard/05-logging-standard.md) |\n| **Minimum-count guard** | Extra condition (`and errors > N`) so a ratio doesn't fire on tiny traffic | [11](standard/11-alerting.md) |\n| **MTTA / MTTD / MTTR** | Mean time to acknowledge / detect / repair-recover-resolve (always say which R) | [23](standard/23-measuring-effectiveness.md) |\n| **Multi-window alert** | Burn-rate alert that checks a long and a short window together | [11](standard/11-alerting.md) |\n| **Page vs ticket** | Page = wake someone up now; ticket = fix during working hours | [11](standard/11-alerting.md) |\n| **Postmortem (blameless)** | Written review of an incident focused on systems, not people | [20](standard/20-ownership-and-communication.md) |\n| **PRR (Production Readiness Review)** | Checklist review before a service goes live or gets on-call | [03](standard/03-definition-of-done.md) |\n| **Pseudonymization** | Replacing an identifier with a salted hash so it can be correlated without revealing who it is | [05](standard/05-logging-standard.md) |\n| **RACI** | Responsible, Accountable, Consulted, Informed: who does what | [20](standard/20-ownership-and-communication.md) |\n| **Recording rule** | Pre-computed query saved as a new series, for speed and reuse | [rules/](rules/) |\n| **RED** | Rate, Errors, Duration: for request-driven services | [01](standard/01-layers.md) |\n| **Resource attribute** | OTel attribute describing the source (service, version, pod), shared by all its signals | [04](standard/04-endpoint-coverage.md) |\n| **Retry budget** | Cap on retries (per request and as % of load) with backoff + jitter, to avoid retry storms | [09](standard/09-internal-services.md) |\n| **Right-sizing** | Matching requests/limits to real usage: less cost, fewer OOMs and throttling | [13](standard/13-capacity-and-saturation.md) |\n| **RPO / RTO** | Recovery point objective (max data loss, in time) / recovery time objective (max time to restore) | [22](standard/22-resilience.md) |\n| **Runbook** | Step-by-step response guide linked from an alert | [20](standard/20-ownership-and-communication.md) |\n| **Saturation** | How full a resource is (queue depth, pool usage, throttling) | [01](standard/01-layers.md) |\n| **Service tier** | How important a service is (1–3); decides SLOs, alert defaults and part of incident severity | [18](standard/18-automation-and-scale.md) |\n| **Severity number** | OTel log level as a number: TRACE 1–4, DEBUG 5–8, INFO 9–12, WARN 13–16, ERROR 17–20, FATAL 21–24 | [05](standard/05-logging-standard.md) |\n| **Shadow mode** | New alerts route to a non-paging receiver while being compared with the old ones | [transition plan](framework/transition-plan.md) |\n| **SLA** | Contract with a client, usually looser than the SLO, often with penalties | [10](standard/10-slos-and-error-budgets.md) |\n| **SLI** | Service level indicator: good events / valid events | [10](standard/10-slos-and-error-budgets.md) |\n| **SLO** | Service level objective: target for an SLI over a window | [10](standard/10-slos-and-error-budgets.md) |\n| **Span metrics** | RED metrics generated from traces | [15](standard/15-opentelemetry-practices.md) |\n| **Symptom vs cause** | What users feel (errors) vs why it happens (CPU). Page on symptoms | [01](standard/01-layers.md) |\n| **Toil** | Manual, repetitive, automatable operational work | – |\n| **USE** | Utilization, Saturation, Errors: for resources | [01](standard/01-layers.md) |\n| **Westrum culture** | Pathological / bureaucratic / generative organization types; DORA uses it to measure culture | [02](standard/02-maturity-model.md) |\n| **Wheel of Misfortune** | Role-play of a past incident to train on-call engineers and test runbooks | [21](standard/21-incident-response-and-on-call.md) |\n", "Makefile": "PROM_IMAGE    ?= prom/prometheus:v3.5.0\nGRAFANA_IMAGE ?= grafana/grafana:11.6.0\n\n.PHONY: all test check-rules check-dashboards check-collector dynatrace site\nCOLLECTOR_IMAGE ?= otel/opentelemetry-collector-contrib:0.162.0\n\nall: dynatrace check-collector site test check-dashboards\n\n## Lint and unit-test the Prometheus rules\ntest: check-rules\n\tdocker run --rm -v \"$(CURDIR)/rules\":/rules -w /rules/tests --entrypoint promtool $(PROM_IMAGE) \\\n\t\ttest rules $(notdir $(wildcard rules/tests/*.test.yml))\n\ncheck-rules:\n\tdocker run --rm -v \"$(CURDIR)/rules\":/rules --entrypoint promtool $(PROM_IMAGE) \\\n\t\tcheck rules $(addprefix /rules/,$(notdir $(wildcard rules/*.rules.yml)))\n\n## Import every dashboard into a throwaway Grafana to check it is accepted\ncheck-dashboards:\n\t./dashboards/check.sh $(GRAFANA_IMAGE)\n\n## Validate the example collector configs\ncheck-collector:\n\t./collector/check.sh $(COLLECTOR_IMAGE)\n\n## Generate the Monaco configs from services-src/ and check them offline\ndynatrace:\n\tpython3 -I dynatrace/generate.py\n\tpython3 -I dynatrace/check.py\n\n## Generate observability-guide.html from the Markdown files\nsite:\n\tpython3 -I site/build.py\n", "README.md": "# Observability Guide\n\nA living standard for observability with **OpenTelemetry (collection) and Dynatrace (backend)**: what to measure,\nhow to alert, how to connect incidents to releases, how to template it for many microservices, who owns what, and\nhow to move an existing setup to something better. Written for people **and** for AI agents ([AGENTS.md](AGENTS.md)).\nEvery claim links to official docs or is marked as a rule of thumb ([REFERENCES.md](REFERENCES.md)).\nOpen-source variants (Prometheus, Grafana) appear in collapsed boxes where useful.\n\n**New here?** Start with [standard/00-start-here.md](standard/00-start-here.md), then read the [case study](examples/case-study.md).\n\n## The standard, in six parts\n\n| Part | # | Section | Question it answers |\n|---|---|---|---|\n| **1 · Foundations** | 00 | [Start here](standard/00-start-here.md) | Where do I go for my situation? |\n| | 01 | [Layers and methods](standard/01-layers.md) | Where does this problem live? RED, USE, Golden Signals or DORA? |\n| | 02 | [Maturity model](standard/02-maturity-model.md) | How good is our observability (and culture) today? |\n| | 03 | [Definition of done](standard/03-definition-of-done.md) | Is this service well monitored? (PRR checklist) |\n| **2 · Signals** | 04 | [Endpoint coverage](standard/04-endpoint-coverage.md) | What must every endpoint emit? How to handle many clients? |\n| | 05 | [Logging standard](standard/05-logging-standard.md) | Log structure, field names, levels, masking layers, collection, retention, log alerts |\n| | 06 | [Queues, batch, external APIs](standard/06-workload-types.md) | Queue model (Little's law, oldest age), batch jobs, third-party APIs |\n| | 07 | [Frontend experience](standard/07-frontend-experience.md) | What did real users experience? |\n| | 08 | [Kubernetes cluster](standard/08-kubernetes-cluster.md) | What to measure in a cluster, from which OTel component, and what Dynatrace adds |\n| | 09 | [Internal and platform services](standard/09-internal-services.md) | Internal SLOs, measuring from the caller, shared DB / cache / broker, timeouts and retries |\n| **3 · Reliability** | 10 | [SLOs and error budgets](standard/10-slos-and-error-budgets.md) | What do we promise, and what happens when we miss it? |\n| | 11 | [Alerting](standard/11-alerting.md) | Percentage or count? Burn rate? Who alerts on what? Noise cleanup |\n| | 12 | [Releases and DORA](standard/12-releases-and-dora.md) | Which version caused it? Deployment events, release validation, DORA |\n| | 13 | [Capacity and saturation](standard/13-capacity-and-saturation.md) | Demand vs tested capacity, headroom (N+2), saturation, right-sizing, autoscaling, forecasts |\n| **4 · Dashboards** | 14 | [Dashboards](standard/14-dashboards.md) | Hierarchy, one template per level, which tile for which question |\n| **5 · Platform** | 15 | [OpenTelemetry practices](standard/15-opentelemetry-practices.md) | Resource identity, semconv, instrumentation, sampling, security |\n| | 16 | [Collector templates](standard/16-collector-templates.md) | Agent / cluster / gateway pipelines, resilience, self-monitoring |\n| | 17 | [Dynatrace platform](standard/17-dynatrace-integration.md) | OneAgent vs OpenTelemetry, ingest rules, cost drivers |\n| | 18 | [Automation and scale](standard/18-automation-and-scale.md) | One template for every microservice; onboarding with Monaco |\n| | 19 | [Cost and cardinality](standard/19-cost-and-cardinality.md) | Why is it expensive, and how to control it? |\n| **6 · People & process** | 20 | [Ownership and communication](standard/20-ownership-and-communication.md) | Who is responsible? Incident severity SEV1–4 and actions; how information flows |\n| | 21 | [Incident response and on-call](standard/21-incident-response-and-on-call.md) | Runbooks, postmortems, on-call practice, Wheel of Misfortune |\n| | 22 | [Resilience](standard/22-resilience.md) | RPO/RTO, restore tests, DR drills, chaos engineering, progressive delivery |\n| | 23 | [Measuring effectiveness](standard/23-measuring-effectiveness.md) | Is the observability working? KPIs, incident fields, toil, cases, your impact log |\n| | – | [Transition plan](framework/transition-plan.md) · [SLO document](framework/slo-document-template.md) · [Error budget policy](framework/error-budget-policy-template.md) · [Runbook](framework/runbook-template.md) · [Postmortem](framework/postmortem-template.md) · [Game day](framework/game-day-template.md) | Templates |\n| | – | [Case study](examples/case-study.md) | Everything connected in one story |\n\n## Repository\n\n| Folder | What's inside |\n|---|---|\n| [`standard/`](standard/) | The rules, sections 00–23 |\n| [`framework/`](framework/) | Transition plan, SLO document, error budget policy |\n| [`playbooks/`](playbooks/) | One use case per file, same template, with status |\n| [`examples/`](examples/) | Case study |\n| [`collector/`](collector/) | OTel Collector templates (agent, cluster, gateway → Dynatrace), validated |\n| [`dynatrace/`](dynatrace/) | **Dynatrace as code (Monaco)**: baseline templates, shared dashboard, team workflows, generator from `observability.yaml` |\n| [`rules/`](rules/) · [`dashboards/`](dashboards/) | Open-source variants: tested PromQL rules, Grafana JSON |\n| [`site/`](site/) | Builds `observability-guide.html` from the Markdown |\n| [`posts/`](posts/) | Blog posts in my own words |\n| [`GLOSSARY.md`](GLOSSARY.md) · [`REFERENCES.md`](REFERENCES.md) | Terms · official docs with verification status |\n\n## Playbooks\n\n| Playbook | Layer | Status |\n|---|---|---|\n| [Errors went up after a release](playbooks/release-regression.md) | Delivery → Service | draft |\n| [Multi-client endpoint](playbooks/multi-client-endpoint.md) | Service | draft |\n| [DORA from pipelines](playbooks/dora-from-pipelines.md) | Delivery | draft |\n| [Noisy alerts cleanup](playbooks/noisy-alerts-cleanup.md) | Process | draft |\n\n## Roadmap\n\n| Topic | Why | Status |\n|---|---|---|\n| One section per view on the web page (prev/next, links per section) | Easier to read and share | next |\n| Test prompts for the work agent (10 problems + expected answers) | Check the agent follows the guide | next |\n| CI/CD pipeline observability | Delivery is a layer | idea |\n| Profiling (OTel profiles signal, alpha) | Code-level cause without OneAgent | watch |\n\n## Commands\n\n```bash\nmake dynatrace         # generate Monaco configs from dynatrace/services-src and check them offline\nmake site              # rebuild observability-guide.html from the Markdown\nmake check-collector   # otelcol validate on collector/*.yaml\nmake test              # open-source variant: promtool lint + unit tests for rules/\nmake check-dashboards  # open-source variant: import dashboards/ into a throwaway Grafana\n```\n\n## How to use it with an agent\n\n> \"Read AGENTS.md in the observability guide. Problem: client B says checkout is slow since yesterday, but our dashboard looks fine.\"\n\n## Get a copy\n\n- **Repository (public):** \u003chttps://github.com/j-o-devsigner/observability-guide>. Clone it, or use **Code → Download ZIP** with no login.\n- **Web guide:** open the artifact link and use **Download source (.zip)** in the sidebar. You get every file (Markdown, Monaco project, collector configs, templates); no account or Git needed.\n- **Rebuild the page offline:** `make site` (Python 3 only) regenerates `observability-guide.html`, a single file you can open in any browser.\n\n## Changelog\n\n| Version | Date | Change |\n|---|---|---|\n| v0.14 | 2026-11-20 | 21 incident response and on-call (incident loop, runbooks, postmortems, on-call practice, Wheel of Misfortune); 22 resilience (RPO/RTO, restore tests, DR drills, chaos engineering and game days, progressive delivery with flags and canaries); 23 measuring effectiveness (scorecard, incident fields, toil, cases with lab numbers, personal impact log); data pipeline SLOs in 06; runbook, postmortem and game day templates; charts and incident-loop diagram |\n| v0.13 | 2026-11-20 | Incident severity in 20: tier vs alert severity vs SEV, SEV1–4 criteria, actions per level (notification, ack time, roles, update cadence, client comms, freeze, postmortem), rules, Dynatrace mapping (standardized event severity 1–5, Workflow routing); severity matrix |\n| v0.12 | 2026-11-20 | 05 became the **logging standard** (OTel log data model, required fields, naming rules, severity levels, what never to log, five masking layers incl. Dynatrace OpenPipeline, collection, Grail buckets and retention, correlation, log alerts, checklist); trace content (metrics from spans, sampling) moved to 15 |\n| v0.11 | 2026-11-20 | 09 internal and platform services (caller-side measurement, internal SLOs, platform ownership, timeouts/retry budgets); 13 capacity and saturation (demand vs load-tested supply, N+2 headroom, saturation table, right-sizing, HPA/KEDA, Dynatrace forecasts, capacity review); queues expanded in 06 (Little's law, oldest age as SLI, partition skew, retries, autoscaling on lag); charts for capacity forecast and queue flow; dependency-chain diagram; Monaco archetype `platform-service` and backlog-at-max alert; sections renumbered 00–20 |\n| v0.10 | 2026-11-20 | Dynatrace as code with Monaco: `dynatrace/` project (templates for SLOs, custom alerts, team workflows; one shared L1 dashboard; generator from observability.yaml per archetype; offline check); section 16 Monaco-only |\n| v0.9 | 2026-11-20 | Restructured into six parts (sections 00–18); Dynatrace-first rewrite of SLOs, alerting, releases/DORA, dashboards, Dynatrace platform and the case study (open-source variants collapsed); merged dashboards (visualization + structure) and Kubernetes (platform + measurement); microservice templates (baseline + archetype + parameters) in 16; \"In 30 seconds\" summaries; diagrams updated to a Dynatrace-only setup |\n| v0.8 | 2026-11-20 | Automation and scale; challenge template removed |\n| v0.7 | 2026-11-20 | Dynatrace as default backend; frontend; OpenTelemetry practices; collector templates; cluster measurement; roadmap |\n| v0.6 | 2026-11-20 | Dashboard structure; Dynatrace integration; validated fan-out collector config; architecture diagrams |\n| v0.5 | 2026-11-20 | Visualization standard; live example charts; dual-axis removed; playbooks drafted |\n| v0.4 | 2026-11-20 | Web page generated from Markdown; tested rules; dashboard as code; start-here; case study; logs & traces, workload types, Kubernetes, cost; glossary |\n| v0.3 | 2026-11-20 | SLOs and error budgets; SLO document and error budget policy templates |\n| v0.2.1 | 2026-11-20 | Checked against official docs; REFERENCES.md |\n| v0.2 | 2026-11-20 | Repo structure; Delivery layer; ownership; maturity model; transition plan; AGENTS.md |\n| v0.1 | 2026-11-19 | First version (web) |\n", "REFERENCES.md": "# References\n\n> Official documentation and primary sources behind the standard. Rule: every recommendation should point here\n> (or to an official doc) and say if it's a **rule of thumb** instead.\n> Status: ✅ checked against the official page on the date shown · 📚 primary source, cited from the book/essay · ⚠️ rule of thumb (this guide)\n\n## Alerting and SLOs\n\n| Source | Supports | Status |\n|---|---|---|\n| [Google SRE Workbook, *Alerting on SLOs*](https://sre.google/workbook/alerting-on-slos/) | Burn rate; multi-window (short window = 1/12 of long); recommended **14.4× 1h/5m page, 6× 6h/30m page, 1× 3d/6h ticket** | ✅ 2026-11-20 |\n| [Google SRE Book, *Monitoring Distributed Systems*](https://sre.google/sre-book/monitoring-distributed-systems/) | Four Golden Signals, symptoms vs causes | 📚 |\n| [Google SRE Book, *Being On-Call*](https://sre.google/sre-book/being-on-call/) | Max **2 incidents per 12h shift** (~6h of work per incident); median pages per shift likely zero | ✅ 2026-11-20 |\n| [Google SRE Workbook, *On-Call*](https://sre.google/workbook/on-call/) | One incident = one problem, however many alerts | ✅ 2026-11-20 |\n| [Google SRE Workbook, *Implementing SLOs*](https://sre.google/workbook/implementing-slos/) | SLIs, targets, budget math (99.9% of 1M = 1,000 errors) | ✅ 2026-11-20 |\n| [Google SRE Workbook, *Example Error Budget Policy*](https://sre.google/workbook/error-budget-policy/) | Freeze except P0/security after 4-week budget spent; exemptions; incident > 20% of budget → postmortem with P0 item | ✅ 2026-11-20 |\n| [Google SRE Workbook, *Example SLO Document*](https://sre.google/workbook/slo-document/) | SLO document structure | 📚 |\n| [Prometheus, *Alerting* practices](https://prometheus.io/docs/practices/alerting/) | Alert on symptoms, keep it simple; recommends Ewaschuk's essay | ✅ 2026-11-20 |\n| Rob Ewaschuk, *My Philosophy on Alerting* ([copy](https://docs.google.com/document/d/199PqyG3UsyXlwieHaqbGiWVa8eMWi8zzAn0YfcApr8Q/mobilebasic)) | Pages must be urgent, important, actionable, real; symptoms over causes | ✅ 2026-11-20 |\n| [Prometheus Alertmanager configuration](https://prometheus.io/docs/alerting/latest/configuration/) | Routing tree, grouping, inhibition | 📚 |\n| Thresholds 5% / 20 errors / 0.1 req/s, case catalog, cleanup steps | – | ⚠️ |\n| Extra burn-rate row 3× 1d/2h | Common in tools like [Sloth](https://sloth.dev/) / [Pyrra](https://github.com/pyrra-dev/pyrra), **not** in the Workbook table | ⚠️ |\n\n## Methods\n\n| Source | Supports | Status |\n|---|---|---|\n| [Brendan Gregg, *The USE Method*](https://www.brendangregg.com/usemethod.html) | Utilization, Saturation, Errors for resources | 📚 |\n| [Grafana, *The RED Method*](https://grafana.com/blog/2018/08/02/the-red-method-how-to-instrument-your-services/) (Tom Wilkie) | Rate, Errors, Duration for services | 📚 |\n\n## OpenTelemetry and Prometheus\n\n| Source | Supports | Status |\n|---|---|---|\n| [OTel semconv: Service](https://opentelemetry.io/docs/specs/semconv/resource/service/) | `service.version` (stable, recommended; format free, e.g. `2.0.0`, `a01dbef8a`) | ✅ 2026-11-20 |\n| [OTel semconv: Deployment](https://opentelemetry.io/docs/specs/semconv/resource/deployment-environment/) | `deployment.environment.name` (stable; replaces deprecated `deployment.environment`) | ✅ 2026-11-20 |\n| [OTel Resources concept](https://opentelemetry.io/docs/concepts/resources/) | Setting attributes via `OTEL_RESOURCE_ATTRIBUTES` | ✅ 2026-11-20 |\n| [OTel semconv: HTTP metrics](https://opentelemetry.io/docs/specs/semconv/http/http-metrics/) | `http.server.request.duration`, `http.route` | 📚 |\n| [OTel semconv: CI/CD](https://opentelemetry.io/docs/specs/semconv/cicd/) | `cicd.pipeline.*` attributes, `cicd.pipeline.run.duration` (release candidate) | ✅ 2026-11-20 |\n| [Collector `k8sattributes` processor](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/k8sattributesprocessor) | `extract.labels` with `tag_name`, `key`, `from: pod` | ✅ 2026-11-20 |\n| [Collector span metrics connector](https://github.com/open-telemetry/opentelemetry-collector-
