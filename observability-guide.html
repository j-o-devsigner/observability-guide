{\n  \"enabled\": true,\n  \"title\": \"{{ .service }} · error ratio per client\",\n  \"description\": \"A client has > {{ .ratio_pct }}% errors and at least {{ .min_errors }} errors in 10 min. Runbook: {{ .runbook }}\",\n  \"source\": \"monaco\",\n  \"analyzer\": {\n    \"name\": \"dt.statistics.ui.anomaly_detection.StaticThresholdAnomalyDetectionAnalyzer\",\n    \"input\": [\n      { \"key\": \"query\", \"value\": \"fetch spans, from:-1h\\n| filter service.name == \\\"{{ .service }}\\\" and span.kind == \\\"server\\\"\\n| makeTimeseries { total = count(), errors = countIf(http.response.status_code >= 500) }, by:{ client.id }, interval:10m\\n| fieldsAdd guarded_ratio = iCollectArray(if(errors[] >= {{ .min_errors }}, 100 * errors[] / total[], else: 0))\\n| fields timeframe, interval, client.id, guarded_ratio\" },\n      { \"key\": \"threshold\", \"value\": \"{{ .ratio_pct }}\" },\n      { \"key\": \"alertCondition\", \"value\": \"ABOVE\" },\n      { \"key\": \"violatingSamples\", \"value\": \"1\" },\n      { \"key\": \"slidingWindow\", \"value\": \"3\" },\n      { \"key\": \"dealertingSamples\", \"value\": \"3\" }\n    ]\n  },\n  \"eventTemplate\": {\n    \"properties\": [\n      { \"key\": \"event.type\", \"value\": \"ERROR_EVENT\" },\n      { \"key\": \"event.name\", \"value\": \"{{ .service }}: a client sees too many errors\" },\n      { \"key\": \"team\", \"value\": \"{{ .team }}\" },\n      { \"key\": \"runbook\", \"value\": \"{{ .runbook }}\" }\n    ]\n  }\n}\n", "dynatrace/templates/alert-dlq.json": "{\n  \"enabled\": true,\n  \"title\": \"{{ .service }} · messages in the dead-letter queue\",\n  \"description\": \"Count alert: every message in the DLQ is a failed promise. Runbook: {{ .runbook }}\",\n  \"source\": \"monaco\",\n  \"analyzer\": {\n    \"name\": \"dt.statistics.ui.anomaly_detection.StaticThresholdAnomalyDetectionAnalyzer\",\n    \"input\": [\n      {\n        \"key\": \"query\",\n        \"value\": \"timeseries dlq = sum(\u003cdlq messages metric>), filter:{ service.name == \\\"{{ .service }}\\\" }, interval:5m\"\n      },\n      {\n        \"key\": \"threshold\",\n        \"value\": \"0\"\n      },\n      {\n        \"key\": \"alertCondition\",\n        \"value\": \"ABOVE\"\n      },\n      {\n        \"key\": \"violatingSamples\",\n        \"value\": \"1\"\n      },\n      {\n        \"key\": \"slidingWindow\",\n        \"value\": \"1\"\n      },\n      {\n        \"key\": \"dealertingSamples\",\n        \"value\": \"3\"\n      }\n    ]\n  },\n  \"eventTemplate\": {\n    \"properties\": [\n      {\n        \"key\": \"event.type\",\n        \"value\": \"ERROR_EVENT\"\n      },\n      {\n        \"key\": \"event.name\",\n        \"value\": \"{{ .service }}: messages landed in the DLQ\"\n      },\n      {\n        \"key\": \"team\",\n        \"value\": \"{{ .team }}\"\n      },\n      {\n        \"key\": \"runbook\",\n        \"value\": \"{{ .runbook }}\"\n      }\n    ]\n  }\n}", "dynatrace/templates/alert-saturation.json": "{\n  \"enabled\": true,\n  \"title\": \"{{ .service }} · saturation of {{ .resource }}\",\n  \"description\": \"{{ .resource }} above {{ .threshold }}% of its limit for 10 min. Owner: {{ .team }}. Runbook: {{ .runbook }}\",\n  \"source\": \"monaco\",\n  \"analyzer\": {\n    \"name\": \"dt.statistics.ui.anomaly_detection.StaticThresholdAnomalyDetectionAnalyzer\",\n    \"input\": [\n      {\n        \"key\": \"query\",\n        \"value\": \"timeseries used = max(\u003c{{ .resource }} used metric>), limit = max(\u003c{{ .resource }} limit metric>), filter:{ service.name == \\\"{{ .service }}\\\" }, interval:1m\\n| fieldsAdd pct = 100 * used[] / limit[]\\n| fields timeframe, interval, pct\"\n      },\n      {\n        \"key\": \"threshold\",\n        \"value\": \"{{ .threshold }}\"\n      },\n      {\n        \"key\": \"alertCondition\",\n        \"value\": \"ABOVE\"\n      },\n      {\n        \"key\": \"violatingSamples\",\n        \"value\": \"8\"\n      },\n      {\n        \"key\": \"slidingWindow\",\n        \"value\": \"10\"\n      },\n      {\n        \"key\": \"dealertingSamples\",\n        \"value\": \"5\"\n      }\n    ]\n  },\n  \"eventTemplate\": {\n    \"properties\": [\n      {\n        \"key\": \"event.type\",\n        \"value\": \"ERROR_EVENT\"\n      },\n      {\n        \"key\": \"event.name\",\n        \"value\": \"{{ .service }}: {{ .resource }} close to its limit\"\n      },\n      {\n        \"key\": \"team\",\n        \"value\": \"{{ .team }}\"\n      },\n      {\n        \"key\": \"runbook\",\n        \"value\": \"{{ .runbook }}\"\n      }\n    ]\n  }\n}", "dynatrace/templates/slo-availability.json": "{\n  \"name\": \"{{ .service }} · availability\",\n  \"description\": \"Share of non-5xx server spans. Owner: {{ .team }}. Generated from observability.yaml; do not edit in the UI.\",\n  \"customSli\": {\n    \"indicator\": \"fetch spans\\n| filter service.name == \\\"{{ .service }}\\\" and span.kind == \\\"server\\\"\\n| makeTimeseries { total = count(), bad = countIf(http.response.status_code >= 500) }\\n| fieldsAdd sli = 100 * (1 - bad[] / total[])\"\n  },\n  \"criteria\": [\n    { \"timeframeFrom\": \"now-28d\", \"timeframeTo\": \"now\", \"target\": {{ .target }} }\n  ],\n  \"tags\": [\"team:{{ .team }}\", \"service:{{ .service }}\", \"generated:monaco\"]\n}\n", "dynatrace/templates/slo-internal-client.json": "{\n  \"name\": \"{{ .service }} · availability as seen by callers\",\n  \"description\": \"Internal SLO measured from client spans of every caller. Owner: {{ .team }}. Consumers: {{ .consumers }}.\",\n  \"customSli\": {\n    \"indicator\": \"fetch spans\\n| filter span.kind == \\\"client\\\" and server.address == \\\"{{ .address }}\\\"\\n| makeTimeseries { calls = count(), failed = countIf(isNotNull(error.type)) }\\n| fieldsAdd sli = 100 * (1 - failed[] / calls[])\"\n  },\n  \"criteria\": [\n    {\n      \"timeframeFrom\": \"now-28d\",\n      \"timeframeTo\": \"now\",\n      \"target\": {{ .target }}\n    }\n  ],\n  \"tags\": [\n    \"team:{{ .team }}\",\n    \"service:{{ .service }}\",\n    \"platform-service\",\n    \"generated:monaco\"\n  ]\n}\n", "dynatrace/templates/slo-latency.json": "{\n  \"name\": \"{{ .service }} · latency \u003c {{ .latency_ms }} ms\",\n  \"description\": \"Share of server spans faster than {{ .latency_ms }} ms. Owner: {{ .team }}.\",\n  \"customSli\": {\n    \"indicator\": \"fetch spans\\n| filter service.name == \\\"{{ .service }}\\\" and span.kind == \\\"server\\\"\\n| makeTimeseries { total = count(), fast = countIf(duration \u003c {{ .latency_ms }}ms) }\\n| fieldsAdd sli = 100 * fast[] / total[]\"\n  },\n  \"criteria\": [\n    { \"timeframeFrom\": \"now-28d\", \"timeframeTo\": \"now\", \"target\": {{ .target }} }\n  ],\n  \"tags\": [\"team:{{ .team }}\", \"service:{{ .service }}\", \"generated:monaco\"]\n}\n", "dynatrace/templates/slo-queue-age.json": "{\n  \"name\": \"{{ .service }} · oldest message \u003c {{ .max_age_s }} s\",\n  \"description\": \"Share of time the oldest waiting message is younger than {{ .max_age_s }} s. Owner: {{ .team }}.\",\n  \"customSli\": {\n    \"indicator\": \"timeseries age = max(\u003coldest-message-age metric>), filter:{ service.name == \\\"{{ .service }}\\\" }\\n| fieldsAdd sli = 100 * iCollectArray(if(age[] \u003c {{ .max_age_s }}, 1, else: 0))\"\n  },\n  \"criteria\": [\n    { \"timeframeFrom\": \"now-28d\", \"timeframeTo\": \"now\", \"target\": 99 }\n  ],\n  \"tags\": [\"team:{{ .team }}\", \"service:{{ .service }}\", \"generated:monaco\"]\n}\n", "dynatrace/templates/workflow-route-team.json": "{\n  \"title\": \"Route problems · {{ .team }}\",\n  \"description\": \"Pages the {{ .team }} on-call for problems whose events carry team={{ .team }}. Generated; do not edit in the UI.\",\n  \"isPrivate\": false,\n  \"trigger\": {\n    \"eventTrigger\": {\n      \"isActive\": true,\n      \"triggerConfiguration\": {\n        \"type\": \"davis-problem\",\n        \"value\": {\n          \"onProblemClose\": false,\n          \"categories\": { \"error\": true, \"slowdown\": true, \"resource\": true, \"availability\": true, \"custom\": true },\n          \"customFilter\": \"team == \\\"{{ .team }}\\\"\"\n        }\n      }\n    }\n  },\n  \"tasks\": {\n    \"notify_oncall\": {\n      \"name\": \"notify_oncall\",\n      \"description\": \"Send the problem to the team's on-call channel\",\n      \"action\": \"dynatrace.slack:slack-send-message\",\n      \"input\": {\n        \"channel\": \"{{ .channel }}\",\n        \"message\": \"{{ \"{{\" }} event()['display_id'] {{ \"}}\" }} · {{ \"{{\" }} event()['event.name'] {{ \"}}\" }}\"\n      }\n    }\n  }\n}\n", "examples/case-study.md": "# Case study: one endpoint, three clients, one bad release\n\n> A **fictional** but realistic story that walks through the whole guide on the real stack:\n> **OpenTelemetry → Dynatrace**. Names and numbers are invented; each step links to the section it applies.\n\n## The setup\n\n| Item | Value |\n|---|---|\n| Service | `checkout` (Go), endpoint `POST /api/checkout`, archetype: HTTP API |\n| Team | `payments`, 5 engineers, one on-call per week |\n| Clients | **Northwind** (70% of traffic), **Contoso** (25%), **Fabrikam** (5%, contract with 99.95% SLA) |\n| Traffic | ~100 req/s at peak, ~5 req/s at night, ~60 req/s on average (~145M requests per 28 days) |\n| Stack | OTel auto-instrumentation, agent / cluster / gateway collectors, Dynatrace backend, ActiveGate for Kubernetes |\n| Before | 38 alerts (mostly CPU, memory, pod restarts), ~9 pages per week, nobody trusts them |\n\n\u003cdiv data-widget=\"viz\" data-chart=\"traffic-share\">\u003c/div>\n\n## Step 1 · Assess ([02](../standard/02-maturity-model.md), [transition plan](../framework/transition-plan.md) phase 0)\n\n| Dimension | Score | Evidence |\n|---|---|---|\n| Instrumentation | 2 | OTel auto-instrumentation, RED from spans |\n| Context | 1 | No `service.version`, no `client.id` |\n| Alerting | 1 | 38 cause alerts, 12% of pages acted on |\n| Delivery | 0 | Deployments invisible in Dynatrace |\n| Ownership | 1 | Every problem goes to one shared channel |\n\nTarget: level 3 for Context, Alerting and Delivery within one quarter.\n\n## Step 2 · Locate the layers ([01](../standard/01-layers.md))\n\n| Layer | What matters here |\n|---|---|\n| Business | Checkouts per minute; Fabrikam's contract |\n| Service | RED for `POST /api/checkout`, **per client** |\n| Delivery | Which version is serving |\n| Resources | DB connection pool, memory vs limit (diagnosis only) |\n\n## Step 3 · Add context ([04](../standard/04-endpoint-coverage.md), [12](../standard/12-releases-and-dora.md), [16](../standard/16-collector-templates.md))\n\n- Middleware sets `client.id` from the API key on spans (3 values: bounded).\n- The pipeline sets the pod label `app.kubernetes.io/version`; the collectors' `k8sattributes` turns it into `service.version`.\n- The gateway's label allow-list keeps `client.id` and `service.version`, so they reach Dynatrace on every signal.\n- After `kubectl rollout status`, the pipeline sends a **deployment SDLC event** to Dynatrace.\n\n## Step 4 · SLOs and the policy ([10](../standard/10-slos-and-error-budgets.md))\n\n| SLO (Dynatrace SLO app, DQL SLI) | Target | Budget (28d) |\n|---|---|---|\n| Availability, all clients | 99.9% | ~145,000 bad requests |\n| Availability, Fabrikam | 99.95% | ~3,600 bad requests (Fabrikam ≈ 7.25M requests) |\n| Latency \u003c 500 ms | 99% | – |\n\nThe SLO document and error budget policy are signed by the team lead, SRE and Fabrikam's account manager. All of it is generated from `observability.yaml` by the onboarding pipeline ([18](../standard/18-automation-and-scale.md)).\n\n## Step 5 · Replace the alerts ([11](../standard/11-alerting.md))\n\n| Old (removed after a shadow period) | New |\n|---|---|\n| CPU > 80%, memory > 85%, pod restarted (×12 variants) | Dashboard only; Davis keeps OOM / crash-loop problems |\n| `errors > 100` | SLO burn-rate custom alert (fast and slow burn) |\n| – | Per-client error ratio > 5% **and** > 20 errors (custom alert, `by:{client.id}`) |\n| – | Release regression: error ratio by `service.version` |\n| – | No checkouts in 15 min (business hours) |\n| One shared channel | A Workflow routes problems with `team = payments` to the payments on-call |\n\nNew alerts ran in **shadow mode** (non-paging channel) for two weeks: they caught both real incidents; the old set added 17 false pages.\n\n## Step 6 · The incident\n\n| Time | Event | Where it shows |\n|---|---|---|\n| 14:02 | Pipeline deploys `checkout 1.42.0` (rolling update) and sends a deployment event | Deployment marker on the L1 dashboard |\n| 14:05 | Fabrikam's requests hit a new code path that fails for their currency | Per-client table: Fabrikam error % turns red |\n| 14:07 | Total error ratio only 0.4% (Fabrikam is 5% of traffic): below the fast-burn threshold | The old `errors > 100` would also have stayed silent |\n| 14:09 | **Release regression** alert: 1.42.0 at 4.1% vs 1.41.3 at 0.2% | Davis opens a problem, related to the deployment |\n| 14:11 | **Fabrikam error-ratio** alert: 8%, ~240 errors in 10 min | Grouped into the **same problem** |\n| 14:12 | The Workflow pages the payments on-call; the link opens L1 with `service = checkout` | Per-version and per-client rows show the split |\n| 14:14 | Rollback (`kubectl rollout undo`); rollback event sent | Second marker on the dashboard |\n| 14:19 | Error ratio back to baseline; alerts close; problem resolved | – |\n| 14:30 | Budget check: overall ~4,000 errors ≈ 3% of the 28-day budget; Fabrikam ~400 ≈ 11% of its budget | SLO app |\n\n\u003cdiv data-widget=\"viz\" data-chart=\"incident-timeline\">\u003c/div>\n\n**Time to detect: 4 min after the first errors. Time to restore: 14 min.** Comms posted an update to Fabrikam at 14:20 ([20](../standard/20-ownership-and-communication.md)).\n\n\u003cdiv data-widget=\"viz\" data-chart=\"state-timeline\">\u003c/div>\n\n## Step 7 · After the incident ([20](../standard/20-ownership-and-communication.md), [10](../standard/10-slos-and-error-budgets.md))\n\n| Output | Content |\n|---|---|\n| Postmortem | Blameless; cause: currency edge case not covered by tests; release validation didn't include Fabrikam traffic |\n| Action items | Contract test for all client currencies (P1); Site Reliability Guardian objective **per client** after each deployment (P1) |\n| Policy check | Fabrikam budget used 11%: under the 20% rule, so no mandatory P0; the team made the fixes P1 anyway |\n| DORA | 1 failed deployment; recovery time 14 min (from the deployment and rollback events) |\n| Guide update | `playbooks/release-regression.md` status → *validated in production*; note in 11 about per-client release validation |\n\n## Step 8 · Results after one quarter\n\n\u003cdiv data-widget=\"viz\" data-chart=\"case-results\">\u003c/div>\n\n| KPI | Before | After |\n|---|---|---|\n| Alerts | 38 | 9 |\n| Pages per week | ~9 | ~1 |\n| % pages acted on | 12% | 90% |\n| Time to detect (median) | 40 min (client reported) | 4 min |\n| Maturity: Context / Alerting / Delivery | 1 / 1 / 0 | 3 / 3 / 2 |\n\n## What this case shows\n\n| Lesson | Section |\n|---|---|\n| The global total hid a broken client | [04](../standard/04-endpoint-coverage.md#multiple-clients-on-one-service) |\n| `service.version` turned \"something is wrong\" into \"1.42.0 is wrong\" | [12](../standard/12-releases-and-dora.md) |\n| The minimum-count guard kept nights quiet; the per-client ratio caught the small client | [11](../standard/11-alerting.md) |\n| Davis grouped two alerts into one problem; a Workflow sent one page to the right team | [11](../standard/11-alerting.md), [17](../standard/17-dynatrace-integration.md) |\n| The policy turned a budget number into a decision | [10](../standard/10-slos-and-error-budgets.md) |\n| Shadow mode made it safe to delete 29 alerts | [transition plan](../framework/transition-plan.md) |\n| One service file generated SLOs, alerts and routing | [18](../standard/18-automation-and-scale.md) |\n", "framework/error-budget-policy-template.md": "# Error budget policy template\n\n> Adapted from the [SRE Workbook's example error budget policy](https://sre.google/workbook/error-budget-policy/).\n> The policy is **not a punishment**. It's an agreement made in advance, so a spent budget leads to a decision\n> instead of an argument. Values marked ⚠️ are suggestions to adjust.\n\n| Field | Value |\n|---|---|\n| Applies to | services / SLO documents |\n| Owners | service owner · SRE · engineering manager |\n| Approved on | YYYY-MM-DD |\n| Review | yearly or after a policy escalation |\n\n## 1. Goals and non-goals\n\n| Goals | Non-goals |\n|---|---|\n| Protect users from repeated SLO misses | Punish teams for missing SLOs |\n| Give a clear signal to balance reliability and features | Stop all change (halting releases is a last resort) |\n\n## 2. While the service is within its SLO\n\nReleases and feature work continue normally.\n\n## 3. When the budget is exhausted (over the last 4 weeks)\n\n- All changes and releases stop **except P0 issues and security fixes**, until the service is back within its SLO.\n- The team prioritizes reliability work.\n\nReliability work is **mandatory** when the overrun was caused by:\n\n| Cause | Example |\n|---|---|\n| The team's own code bug or procedural error | Bad config pushed without canary |\n| A hard dependency found in a postmortem that could be softened | No timeout or fallback to a downstream |\n| Errors that were miscategorized and hid budget spend | 5xx counted as success |\n\n## 4. Exemptions (feature work may continue)\n\n| Cause | Why exempt |\n|---|---|\n| Company-wide network or infrastructure problem | Not within the team's control |\n| Another team's service (which has frozen its own releases) | The owner is already acting |\n| Out-of-scope traffic (load tests, penetration tests) | Not real users |\n\n## 5. Outage policy\n\n| Trigger | Required action |\n|---|---|\n| A single incident uses **> 20%** of the 4-week budget | Postmortem with at least one **P0 action item** |\n| A class of outage uses > 20% of the quarter's budget | A P0 item in next quarter's plan |\n\n## 6. Escalation\n\nIf the owners disagree about the budget calculation or the actions, escalate to [role, e.g. head of engineering] ⚠️.\n\n## 7. Communication\n\n| Event | Who is told | Channel |\n|---|---|---|\n| Budget below 50% ⚠️ | Team | Team channel (automatic) |\n| Budget exhausted, freeze starts | Team, manager, dependent teams | Channel + email |\n| Freeze ends | Same | Channel |\n\n## 8. Signatures\n\n| Role | Name | Date |\n|---|---|---|\n| Service owner | | |\n| SRE | | |\n| Engineering manager | | |\n", "framework/game-day-template.md": "# Game day template (chaos experiment or restore test)\n\n> Prove that alerts, runbooks, failover and restores work, before an incident proves they don't.\n> Guide: [22](../standard/22-resilience.md).\n\n| Field | Value |\n|---|---|\n| Name · date · environment | e.g. \"orders-db replica loss\" · 2026-12-03 · staging → prod (one zone) |\n| Owner · participants · observer | |\n| Abort rule | Stop if checkout SLO burns > 6× or a customer reports impact |\n| Kill switch | How to stop the injection immediately |\n\n## Steady state (measurable)\n\ncheckout SLI ≥ 99.9% · p95 \u003c 300 ms · orders queue age \u003c 60 s\n\n## Hypothesis\n\n\"If \u003cfailure>, then \u003csteady state holds> and \u003calert X fires in \u003c N min>, and the runbook leads to recovery within RTO.\"\n\n## Injection\n\nWhat exactly is broken, how, for how long (tool / command).\n\n## Results\n\n| Expectation | Result | Pass? |\n|---|---|---|\n| Steady state held | | |\n| Alert fired within N min | | |\n| Runbook was enough | | |\n| Recovery within RTO (restore tests: data within RPO) | measured duration | |\n\n## Gaps and actions\n\n| Gap | Action | Owner | Due |\n|---|---|---|---|\n\n## Next game day\n\nDate and scenario.\n", "framework/postmortem-template.md": "# Postmortem template (blameless)\n\n> Required for SEV1/SEV2, an incident using > 20% of the error budget, or a repeat incident.\n> Describe systems and decisions, not people's mistakes. Guide: [21](../standard/21-incident-response-and-on-call.md#postmortems).\n\n| Field | Value |\n|---|---|\n| Title | e.g. \"checkout errors for Fabrikam after release 1.42.0\" |\n| Date · severity · services | 2026-11-20 · SEV2 · checkout |\n| Authors · reviewers | |\n| Status | draft / reviewed / actions closed |\n\n## Summary\n\nThree sentences: what happened, impact, how it was fixed.\n\n## Impact\n\n| Measure | Value |\n|---|---|\n| Users / clients affected | |\n| Duration of impact | impact start → mitigated |\n| Error budget used | % of the 28-day budget (per SLO, per client SLO) |\n| SLA / financial impact | |\n\n## Timeline (from data)\n\n| Time (UTC) | Event | Source |\n|---|---|---|\n| 14:02 | Deployment 1.42.0 | Deployment event |\n| 14:05 | Impact starts | SLI / per-client error ratio |\n| 14:09 | First alert | Problem / custom alert |\n| 14:10 | Acknowledged | On-call tool |\n| 14:14 | Mitigated (rollback) | Deployment event |\n| 14:19 | Resolved | Problem closed |\n\n**Detection:** detected by alert / customer / employee? Time to detect, acknowledge, mitigate, resolve ([23](../standard/23-measuring-effectiveness.md)).\n\n## Contributing factors\n\nSeveral, not one \"root cause\". For each: why did the system allow it?\n\n## What went well · what went badly · where we got lucky\n\n## Action items\n\n| Action | Type (prevent / detect / mitigate / process) | Owner | Priority | Due | Ticket |\n|---|---|---|---|---|---|\n\n## Updates to the standard\n\nRunbook, alert, dashboard, playbook status, guide section changed because of this incident.\n", "framework/runbook-template.md": "# Runbook template\n\n> One runbook per paging alert, linked from the alert (`runbook` property). Written for someone tired at 3 a.m. who\n> doesn't know this service. Guide: [21](../standard/21-incident-response-and-on-call.md#runbooks).\n\n| Field | Value |\n|---|---|\n| Alert | e.g. `checkout · SLO fast burn` |\n| Service · tier · owner | checkout · 1 · payments |\n| Last reviewed | YYYY-MM-DD (update it every time the alert fires) |\n\n## What this alert means\n\nOne or two sentences in user terms: who is affected and what they see. The SLO or threshold behind it.\n\n## Impact: how bad is it?\n\n- L1 dashboard (link with `service` filled in): error ratio, per client, per version.\n- Rough severity guide: all clients → SEV1/2; one client → check SLA ([20](../standard/20-ownership-and-communication.md#severity-levels-and-actions)).\n\n## First checks (5 minutes)\n\n1. **Recent change?** Deployment events in the last 60 min (L1 \"per version\" row).\n2. **One client or all?** Per-client table.\n3. **Dependencies?** Client-side errors to DB / payments-api / auth (traces, service flow).\n4. **Saturation?** Pods at memory limit, HPA at max, connection pool full.\n5. **Platform?** Open Davis problems on the cluster or the database.\n\n## Mitigations (most reversible first)\n\n| If | Do | Command / button |\n|---|---|---|\n| New version is worse | Roll back | `kubectl rollout undo deploy/checkout -n shop` |\n| HPA at max, latency rising | Scale out | `kubectl scale deploy/checkout -n shop --replicas=\u003cn>` |\n| New feature suspected | Turn the flag off | Flag `new-pricing` → off |\n| Dependency down | Fail over / shed load | link to the dependency's runbook |\n\n## Escalation\n\n| When | Whom |\n|---|---|\n| Not mitigated in 15 min, or SEV1/2 | Incident Commander (page) |\n| Dependency at fault | Owning team's on-call (from the service catalog) |\n\n## Verify\n\nWhich tile must turn green, and for how long, before you call it resolved.\n\n## Background\n\nArchitecture notes, known issues, links to past postmortems for this alert.\n", "framework/slo-document-template.md": "# SLO document template\n\n> One per service (or per critical user journey). Keep it to one page. Based on the structure of the\n> [SRE Workbook's example SLO document](https://sre.google/workbook/slo-document/).\n\n| Field | Value |\n|---|---|\n| Service | |\n| Owner (team) | |\n| Status | draft / approved |\n| Approved by | service owner · SRE · business owner |\n| Approved on | YYYY-MM-DD |\n| Next review | YYYY-MM-DD (monthly or quarterly) |\n| Error budget policy | link to [error-budget-policy](error-budget-policy-template.md) copy |\n\n## 1. Service overview\n\nWhat the service does, who uses it (internal teams, clients A/B/C), and which user journeys depend on it.\n\n## 2. SLIs and SLOs\n\n| Journey | SLI type | SLI definition (good / valid) | Measured at | SLO | Window |\n|---|---|---|---|---|---|\n| Checkout | Availability | non-5xx responses / all requests to `/api/checkout` | gateway | 99.9% | 28d |\n| Checkout | Latency | requests \u003c 500 ms / all requests | gateway | 99% | 28d |\n\nPer-client targets (if multi-tenant):\n\n| Client | Contract | SLO |\n|---|---|---|\n| | | |\n\n## 3. Rationale\n\nWhy these SLIs and targets: current performance over the last 4 weeks, what users notice, what the SLA promises.\n\n## 4. Error budget\n\n| SLO | Budget (28d) | Approx. in requests or minutes |\n|---|---|---|\n| 99.9% | 0.1% | e.g. 1,000 bad requests per 1,000,000 |\n\n## 5. Alerting\n\nBurn-rate alerts per [standard/03](../standard/11-alerting.md) (links to the rule files and dashboard).\n\n## 6. Clarifications and caveats\n\nWhat does **not** count: load tests, known bad clients, planned maintenance, 4xx caused by callers, etc.\n\n## 7. Change log\n\n| Date | Change | Why |\n|---|---|---|\n", "framework/transition-plan.md": "# Transition plan: from an existing observability setup to the standard\n\n> You almost never start from zero. There are already dashboards, alerts, maybe two tools, and people used to them.\n> Principles: **assess before changing · pilot one service · run old and new in parallel · delete only after proof · communicate every step.**\n\n## Phases at a glance\n\n| Phase | Duration (typical) | Goal | Exit criteria |\n|---|---|---|---|\n| 0 · Assess | 1–2 weeks | Know what exists and what hurts | Inventory + maturity score + pilot chosen |\n| 1 · Foundations | 2–3 weeks | Conventions everyone will reuse | Labels, routing, templates merged |\n| 2 · Pilot | 3–4 weeks | Prove the standard on 1 service | Pilot meets definition of done + before/after numbers |\n| 3 · Rollout | waves of 2–4 weeks | Bring other services over | Each wave meets definition of done |\n| 4 · Decommission | per wave | Remove old alerts/dashboards/tools | No old rule left without reason |\n| 5 · Operate | ongoing | Keep it healthy | Rituals running, KPIs trending right |\n\nDurations are rough guides for a mid-size team (10–30 services). Adjust.\n\n---\n\n## Phase 0 · Assess\n\n| Task | How | Output |\n|---|---|---|\n| Inventory services | Service catalog, `kubectl get deploy -A`, APM service list | List with owner, criticality (tier 1/2/3) |\n| Inventory alerts | Export alert definitions; problems per alert in 30d (Problems app / DQL), % actioned | Alert table ([11 §7](../standard/11-alerting.md#7-cleaning-up-a-noisy-alert-set)) |\n| Inventory dashboards | Grafana API: last viewed, owner | Keep / merge / delete list |\n| Pain interviews | 30 min with on-call, team leads, a business owner | Top 5 pains in their words |\n| Maturity score | [02-maturity-model.md](../standard/02-maturity-model.md) | Current vs target per dimension |\n| Choose pilot | Tier 1, a motivated team, real pain, not the most complex | Pilot service + sponsor |\n\n## Phase 1 · Foundations (decide once, reuse everywhere)\n\n| Decision | Standard |\n|---|---|\n| Naming & semantic conventions | OTel semconv; `http.route`, no raw URLs |\n| Required resource attributes | `service.name`, `service.version`, `team`, `deployment.environment.name` ([04](../standard/04-endpoint-coverage.md)) |\n| Severity scheme | `page` / `ticket` only |\n| Alert routing | Alertmanager tree by `team` → `severity` ([20](../standard/20-ownership-and-communication.md)) |\n| Templates | SLO rules (Sloth/Pyrra), service dashboard with `$service/$client/$version`, runbook template |\n| Deploy markers | Pipeline or Argo CD → annotations ([12](../standard/12-releases-and-dora.md)) |\n| CI checks | `promtool check rules` + lint: `team`, `severity`, `runbook_url` required |\n\n## Phase 2 · Pilot\n\n1. Baseline numbers **before** changing: pages/week, % actioned, MTTD, alerts count.\n2. Define SLOs with the team + business owner.\n3. Add the new alerts in **shadow mode** (non-paging receiver) next to the old ones.\n4. After 1–2 weeks compare: did the new alerts catch every real incident? Fewer false positives?\n5. Switch paging to the new alerts; keep the old ones in shadow for one more cycle.\n6. Inject failures (bad image tag, dependency down) to validate ([03 #12](../standard/03-definition-of-done.md)).\n7. Write the playbook and a short internal post with the before/after.\n\n## Phase 3 · Rollout in waves\n\n| Wave | Services | Why this order |\n|---|---|---|\n| 1 | Remaining tier 1 | Biggest value, same pattern as the pilot |\n| 2 | Tier 2 | Reuse templates, less hand-holding |\n| 3 | Tier 3 / batch / internal | Mostly count and absence alerts |\n\nEach wave: service team does the work (R), SRE reviews (C), same shadow → cutover → validate steps.\n\n## Phase 4 · Decommission\n\n| Rule | Why |\n|---|---|\n| Delete an old alert only after its replacement caught a real or injected failure | Never create a blind spot |\n| Archive, don't destroy, dashboards for 30 days | Someone may still need one |\n| Tool migration (e.g. two APMs): dual-ship telemetry via the OTel Collector during the overlap | Compare data before switching off |\n\n## Phase 5 · Operate\n\n| KPI | Target |\n|---|---|\n| Pages per on-call shift | ≤ 2 |\n| % pages actioned | > 80–90% |\n| Services meeting definition of done | rising to 100% of tier 1 |\n| MTTD / time to restore | trending down |\n| Change failure rate | trending down |\n\n## Communication plan for the transition\n\n| When | Audience | Message | Channel |\n|---|---|---|---|\n| Kick-off | All engineering + managers | Why we change, what changes for them, timeline | All-hands / email |\n| Each phase start/end | Affected teams | What happens this phase, what they need to do | Team channel |\n| Before cutover | On-call of the service | Which alerts change, new runbooks, how to report problems | Handover + channel |\n| Monthly | Leadership | Progress, KPIs before/after, risks | Short report |\n| After each wave | Everyone | Wins with numbers (\"pages −60%\") | Internal post |\n\n## RACI for the transition\n\n| Activity | SRE / Observability | Platform | Service teams | Eng. managers |\n|---|---|---|---|---|\n| Plan and standard | **A/R** | C | C | I |\n| Foundations (collector, routing, templates) | A | **R** | I | I |\n| Service migration | C | C | **A/R** | I |\n| Prioritization and time allocation | C | C | C | **A/R** |\n| Decommission | A | R | R | I |\n\n## Sources\n\n- Google SRE Workbook, ch. 2 *Implementing SLOs*, ch. 5 *Alerting on SLOs*\n- Strangler fig pattern (Martin Fowler): replace incrementally, run in parallel\n- OTel Collector docs: multiple exporters for dual shipping\n\n> Official links and verification status: [REFERENCES.md](../REFERENCES.md)\n", "playbooks/_template.md": "# Playbook: [name]\n\n> One use case, same structure every time, so a person or an agent can match a problem to it.\n> Status: `skeleton` | `draft` | `validated in lab` | `validated in production`\n\n| Field | Value |\n|---|---|\n| Problem | One sentence, as the symptom someone reports |\n| Layer(s) | Business / UX / Service / Resources / Delivery |\n| Method | RED / USE / Golden / KPI / DORA |\n| Status | |\n| Last validated | YYYY-MM-DD, where (lab name / env) |\n\n## When to use it\n\nSymptoms and phrases that point to this playbook.\n\n## Signals needed\n\n| Signal | Name / attribute | Exists? |\n|---|---|---|\n| Metric | | |\n| Trace | | |\n| Log | | |\n\n## Queries\n\n```promql\n```\n\n## Alerts\n\n```yaml\n```\n\n## Dashboard\n\nPanels to add and where (row from [standard/14](../standard/14-dashboards.md)).\n\n## Validation\n\nHow to break it on purpose and what you should see.\n\n## Owners and communication\n\nWho acts, who gets told.\n\n## Dynatrace equivalent\n\n## Sources\n", "playbooks/dora-from-pipelines.md": "# Playbook: DORA metrics from pipelines\n\n| Field | Value |\n|---|---|\n| Problem | \"We don't know how often or how safely we ship\" |\n| Layer(s) | Delivery |\n| Method | DORA metrics from pipeline and incident events, see [standard/04](../standard/12-releases-and-dora.md#4-dora-metrics) |\n| Status | draft (not yet validated in a lab) |\n| Last validated | – |\n\n## When to use it\n\n- Leadership asks \"are we getting faster or safer?\"\n- You want to prove that observability work (deploy markers, regression alerts) reduced change failures.\n- You're starting the portfolio phases on CI/CD and want before/after numbers.\n\n## The five metrics and their events\n\n| Metric | Event needed | Where it comes from |\n|---|---|---|\n| Deployment frequency | \"deploy succeeded\" per service | Pipeline step after `kubectl rollout status` or Argo CD `on-deployed` |\n| Change lead time | Commit time of each change in the deploy | Git (`git log` between previous and current deployed SHA) |\n| Change failure rate | Deploy marked failed: rollback, hotfix, or incident with `suspect: deploy` | Rollback step, incident tool, alert labels |\n| Failed deployment recovery time | Failed deploy → service restored | Incident open/resolve, or rollback finished |\n| Deployment rework rate | Unplanned deploys caused by an incident | Deploys tagged `hotfix` / linked to an incident |\n\n## Option A · Prometheus (simple, approximate ⚠️)\n\nThe pipeline pushes one gauge per service at the end of each deploy. Use the Pushgateway only because a deploy is a **service-level batch job** (the one valid use the Prometheus docs allow).\n\n```bash\n# Last step of the deploy job\ncat \u003c\u003cEOF | curl -s --data-binary @- \"$PUSHGATEWAY/metrics/job/deploy/service/checkout\"\ndeploy_last_timestamp_seconds $(date +%s)\ndeploy_last_lead_time_seconds $LEAD_TIME_SECONDS\nEOF\n\n# Rollback / hotfix step: push only the failure timestamp (POST replaces only metrics with the same name)\necho \"deploy_last_failed_timestamp_seconds $(date +%s)\" \\\n  | curl -s --data-binary @- \"$PUSHGATEWAY/metrics/job/deploy/service/checkout\"\n```\n\n```promql\n# Deployment frequency: deploys in the last 7 days (each push changes the timestamp)\nchanges(deploy_last_timestamp_seconds{service=\"checkout\"}[7d])\n\n# Failed deploys in the last 30 days (each rollback pushes a new timestamp)\nchanges(deploy_last_failed_timestamp_seconds{service=\"checkout\"}[30d])\n\n# Change failure rate (30 days)\nchanges(deploy_last_failed_timestamp_seconds{service=\"checkout\"}[30d])\n/\nchanges(deploy_last_timestamp_seconds{service=\"checkout\"}[30d])\n```\n\n`changes()` counts value changes, so each push with a new timestamp counts as one event. A gauge that only flips between 0 and 1 would count hours in the failed state, not failures.\n\nLimits: medians of lead time and recovery time are awkward in Prometheus because a gauge repeats its last value at every scrape. Use option B for those.\n\n## Option B · Event store (accurate)\n\n| Tool | How |\n|---|---|\n| Apache DevLake | Collects from GitHub/GitLab/Jenkins/Jira/PagerDuty and ships DORA dashboards for Grafana |\n| Grafana annotations as events | The pipeline posts annotations tagged `deploy`, `rollback`, `hotfix`; query them via the annotations API for counts |\n| OTel CI/CD semantic conventions | Pipeline runs as spans/metrics (`cicd.pipeline.run.duration`); still release candidate |\n\n## Dashboard\n\nStat tiles with a sparkline per metric, compared with the previous period ([14](../standard/14-dashboards.md#1--stat-tiles-the-first-row)). Change failure rate and recovery time are \"down is good\".\n\n## Validation\n\n1. Deploy 5 times in a lab (kind + OTel Demo service); make one deploy fail and roll back.\n2. Expect: frequency = 5, failures = 1, change failure rate = 20%, recovery time = rollback duration.\n3. Compare with the pipeline history by hand.\n\n## Owners and communication\n\n| Who | Action |\n|---|---|\n| Team | Reviews DORA monthly with the SLO review |\n| Engineering manager | Uses trends, never individual comparisons ⚠️ (DORA warns against using metrics as targets for teams) |\n\n## Dynatrace equivalent\n\nDeployment events (`CUSTOM_DEPLOYMENT` or SDLC events) and release validation with Site Reliability Guardian; DORA dashboards from SDLC events. *(📚 verify.)*\n\n## Sources\n\n- [DORA four keys](https://dora.dev/guides/dora-metrics-four-keys/) · [metrics history](https://dora.dev/insights/dora-metrics-history/) ✅\n- [Prometheus: When to use the Pushgateway](https://prometheus.io/docs/practices/pushing/) ✅\n- [OTel semconv: CI/CD](https://opentelemetry.io/docs/specs/semconv/cicd/) ✅\n- [Apache DevLake](https://devlake.apache.org/) 📚\n", "playbooks/multi-client-endpoint.md": "# Playbook: Multi-client endpoint\n\n| Field | Value |\n|---|---|\n| Problem | \"One client complains but the global dashboard looks fine\" |\n| Layer(s) | Service (per client) |\n| Method | RED by `client.id` + minimum-count guard, see [standard/04](../standard/04-endpoint-coverage.md#multiple-clients-on-one-service) |\n| Status | draft (alert tested with promtool; not yet validated in a lab) |\n| Last validated | 2026-11-20, `rules/tests/patterns.test.yml` |\n\n## When to use it\n\n- A client reports errors or slowness, and the total error rate and latency look normal.\n- A service has clients of very different sizes (one is 70% of traffic, another 5%).\n- Contracts (SLAs) differ per client.\n\n## Signals needed\n\n| Signal | Name / attribute | Exists? |\n|---|---|---|\n| Metric | `http_server_request_duration_seconds_*` with a `client_id` label (bounded: tens of values) | |\n| Trace | `client.id` span attribute | |\n| Log | `client_id` field | |\n| Source of the ID | Middleware from API key / JWT, or span metrics connector dimension at the gateway | |\n\n## Queries\n\n```text\n// Dynatrace (DQL shape): error ratio and volume per client from server spans\nfetch spans\n| filter service.name == \"checkout\" and span.kind == \"server\"\n| makeTimeseries { total = count(), errors = countIf(http.response.status_code >= 500) }, by:{ client.id }\n| fieldsAdd error_ratio = errors[] / total[]\n```\n\nOpen-source variant (PromQL):\n\n\n```promql\n# Error ratio per client (compare with the total)\nsum by (client_id) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=~\"5..\"}[5m]))\n/\nsum by (client_id) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[5m]))\n\n# Share of traffic per client (is the broken one small?)\nsum by (client_id) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[5m]))\n/ ignoring (client_id) group_left\nsum(rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[5m]))\n\n# p95 per client\nhistogram_quantile(0.95, sum by (client_id, le) (rate(http_server_request_duration_seconds_bucket{service_name=\"checkout\"}[5m])))\n\n# Did a client go silent? (traffic now vs same time last week)\nsum by (client_id) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[30m]))\n\u003c 0.2 * sum by (client_id) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[30m] offset 1w))\n```\n\n## Alerts\n\n| Alert | Rule | Status |\n|---|---|---|\n| Client error ratio high | `ClientErrorRatioHigh` in [rules/patterns.rules.yml](../rules/) (ratio > 5% **and** > 20 errors in 10m, `for: 5m`) | ✅ tested |\n| Client went silent | Query above, `for: 15m`, ticket (page if the client has an SLA) | ⚠️ not tested |\n| Per-client SLO | Copy the burn-rate rules with `by (service_name, client_id)` and the client's target | ⚠️ not tested |\n\n## Dashboard\n\n| Row | Panel |\n|---|---|\n| Per client | Table: req/s · errors (1h) · error % (colored) · p95, sorted by error % ([dashboards/service-red.json](../dashboards/)) |\n| Per client | Meter list of error budget left per client ([14](../standard/14-dashboards.md)) |\n| Overview | Traffic share per client as a segmented bar, not a pie |\n\n## Validation\n\n1. Generate traffic for three clients with very different volumes (k6 scenarios with different API keys).\n2. Inject errors for the smallest client only (feature flag or fault injection by header).\n3. Expect: total error rate stays below the global alert; `ClientErrorRatioHigh{client_id=\"small\"}` fires; the table shows it on top.\n4. Lower the small client's traffic to 1 request per minute with 1 error: the guard keeps the alert silent.\n\n## Owners and communication\n\n| Who | Action |\n|---|---|\n| Service team on-call | Investigates, mitigates |\n| Account manager / client contact | Informed when an SLA client is affected (comms flow in [20](../standard/20-ownership-and-communication.md)) |\n\n## In Dynatrace\n\nWith OpenTelemetry, `client.id` arrives as a span/metric attribute: split by it in DQL, build a custom alert per client (ratio + minimum count) and per-client SLOs for SLA clients. With OneAgent only: request attributes + calculated metrics split by that attribute.\n\n## Sources\n\n- [Span metrics connector: dimensions](https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/connector/spanmetricsconnector/README.md) ✅\n- [Prometheus: Unit testing for rules](https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/) ✅\n", "playbooks/noisy-alerts-cleanup.md": "# Playbook: Noisy alerts cleanup\n\n| Field | Value |\n|---|---|\n| Problem | \"On-call gets too many alerts and ignores most of them\" |\n| Layer(s) | All (process) |\n| Method | Inventory → classify → delete / tune / group → measure, see [standard/11 §7](../standard/11-alerting.md#7-cleaning-up-a-noisy-alert-set) |\n| Status | draft |\n| Last validated | – |\n\n## When to use it\n\n- More than ~2 pages per on-call shift (Google SRE limit).\n- People mute channels or acknowledge without reading.\n- The same incident produces many notifications.\n\n## Step 1 · Inventory (last 30 days)\n\n```promql\n# Times each alert started firing\nsort_desc(sum by (alertname) (changes(ALERTS{alertstate=\"firing\"}[30d])))\n\n# Alerts firing right now and for how long they have been active\nALERTS{alertstate=\"firing\"}\n```\n\nExport notifications from Alertmanager or the incident tool and build this table:\n\n| Alert | Fires / month | % acted on | Symptom or cause | Duplicate of | Owner | Runbook |\n|---|---|---|---|---|---|---|\n| | | | | | | |\n\n## Step 2 · Decide per alert\n\n| Finding | Action | Pattern |\n|---|---|---|\n| Fires often, nobody acts | Delete, or move to a dashboard | – |\n| Cause alert (CPU, memory, one pod) | Replace with a symptom / SLO alert | [rules/checkout-slo.rules.yml](../rules/) |\n| Ratio firing at night | Add a minimum-count guard | `ClientErrorRatioHigh` in [rules/patterns.rules.yml](../rules/) |\n| Count firing at peak | Convert to a ratio | [11 §1](../standard/11-alerting.md) |\n| Flapping | More dealerting samples, longer windows, multi-window burn rate | [10](../standard/10-slos-and-error-budgets.md) |\n| Many alerts per incident | Davis problem grouping + one Workflow per team (Alertmanager `group_by` / inhibition in the open-source variant) | below |\n| No owner or runbook | Assign, or delete | [20](../standard/20-ownership-and-communication.md) |\n\n```yaml\n# Alertmanager: one notification per service incident; silence pod alerts while the service page fires\nroute:\n  group_by: [alertname, service_name, client_id]\n  group_wait: 30s\n  group_interval: 5m\n  repeat_interval: 4h\ninhibit_rules:\n  - source_matchers: [severity=\"page\"]\n    target_matchers: [severity=\"ticket\"]\n    equal: [service_name]\n```\n\n## Step 3 · Shadow, then cut over\n\nNew and changed alerts go to a non-paging receiver for 1–2 weeks. Compare: did they catch every real incident? How many false positives did the old ones produce? Then switch paging ([transition plan](../framework/transition-plan.md)).\n\n## Step 4 · Measure\n\n| KPI | Target |\n|---|---|\n| Pages per on-call shift | ≤ 2 |\n| % of pages acted on | > 80–90% ⚠️ |\n| Notifications per incident | ≈ 1 |\n| Alerts with owner + runbook | 100% |\n\nShow the trend as stat tiles with sparklines in the monthly review ([14](../standard/14-dashboards.md)).\n\n## Validation\n\nRe-run the inventory query after 30 days and compare with step 1. The case study went from 38 alerts and ~9 pages per week to 9 alerts and ~1 page per week ([examples/case-study.md](../examples/case-study.md)).\n\n## Owners and communication\n\n| Who | Action |\n|---|---|\n| SRE | Facilitates the review, owns the standard |\n| Service teams | Decide on their alerts (they are accountable) |\n| On-call | Brings the noisy-alert list to each handover |\n\n## Dynatrace equivalent\n\nDavis groups related events into one problem automatically; alerting profiles filter which problems notify whom. *(📚 verify.)*\n\n## Sources\n\n- [Google SRE Book, *Being On-Call*](https://sre.google/sre-book/being-on-call/) ✅\n- [Prometheus Alertmanager configuration](https://prometheus.io/docs/alerting/latest/configuration/): `group_by`, `inhibit_rules` 📚\n- [Prometheus alerting practices](https://prometheus.io/docs/practices/alerting/) ✅\n", "playbooks/release-regression.md": "# Playbook: Errors went up after a release\n\n| Field | Value |\n|---|---|\n| Problem | \"Error rate jumped. Was it the deploy? Which version?\" |\n| Layer(s) | Delivery → Service |\n| Method | RED split by `service.version` + deploy markers |\n| Status | draft (not yet validated in lab) |\n| Last validated | – |\n\n## When to use it\n\n- Error rate or latency changed and a deploy happened in the last ~1h.\n- During a rolling update or canary (two versions serve traffic at once).\n- Someone asks \"should we roll back?\".\n\n## Signals needed\n\n| Signal | Name / attribute | Exists? |\n|---|---|---|\n| Metric | `http_server_request_duration_seconds_*` with `service_version` label | |\n| Metric | `kube_deployment_status_observed_generation` (kube-state-metrics) | |\n| Event | Grafana annotation `deploy` with `version:\u003ctag>` | |\n| Trace | `service.version` resource attribute | |\n| Log | `service.version` field | |\n\n## Queries\n\n```text\n// Dynatrace (DQL shape): error ratio per version during the rollout\nfetch spans\n| filter service.name == \"checkout\" and span.kind == \"server\"\n| makeTimeseries { total = count(), errors = countIf(http.response.status_code >= 500) }, by:{ service.version }\n| fieldsAdd error_ratio = errors[] / total[]\n```\n\nOpen-source variant (PromQL):\n\n\n```promql\n# Error ratio per version (compare old vs new during rollout)\nsum by (service_version) (rate(http_server_request_duration_seconds_count{service_name=\"$service\", http_response_status_code=~\"5..\"}[5m]))\n/\nsum by (service_version) (rate(http_server_request_duration_seconds_count{service_name=\"$service\"}[5m]))\n\n# Traffic share per version (is the rollout progressing?)\nsum by (service_version) (rate(http_server_request_duration_seconds_count{service_name=\"$service\"}[5m]))\n\n# Latency p99 per version\nhistogram_quantile(0.99, sum by (service_version, le) (rate(http_server_request_duration_seconds_bucket{service_name=\"$service\"}[5m])))\n```\n\n## Alerts\n\n- Regression of one version vs the other: [standard/12 §3](../standard/12-releases-and-dora.md#3-alerts-that-know-about-releases)\n- SLO burn + recent deploy → `suspect: deploy`: [standard/12 §3](../standard/12-releases-and-dora.md#3-alerts-that-know-about-releases)\n\n## Dashboard\n\n| Row | Panel |\n|---|---|\n| RED overview | Deployment events overlaid on every time series |\n| Delivery | Error % by `service_version` (one line per version), traffic share by version (stacked), p99 by version |\n| Table | version · first seen · req/s · error % · p99 |\n\n## Validation (lab)\n\n1. Deploy version A (healthy). Generate load (k6 / OTel Demo load generator).\n2. Deploy version B with an injected bug (e.g. env var `FAIL_RATE=0.2`) using a rolling update with `maxSurge: 1`.\n3. Expect: annotation at deploy time; two lines on \"error % by version\"; B ≫ A; alert with `suspect: deploy` routed to the owning team.\n4. Roll back: `kubectl rollout undo deploy/\u003cname>`; the alert resolves; record time to detect and time to restore.\n\n## Owners and communication\n\n| Who | Action |\n|---|---|\n| Deploying team (on-call) | Decide rollback; post in deploy channel |\n| SRE | Help if the cause isn't the release |\n| Comms (if client-facing) | Status update per incident flow ([standard/20](../standard/20-ownership-and-communication.md)) |\n\n## In Dynatrace\n\nVersion from `service.version` (OTel) or the pod label; deployment SDLC events from the pipeline; Davis relates the problem to the deployment; Site Reliability Guardian validates the release and can gate a rollback ([12](../standard/12-releases-and-dora.md)).\n\n## Sources\n\n- OTel semconv `service.version`; Kubernetes recommended labels\n- Grafana annotations; Argo Rollouts analysis\n- DORA: change failure rate\n", "posts/README.md": "# Posts\n\nBlog posts in my own words. One post per playbook or lab, linking to it.\n\n| Date | Title | Playbook |\n|---|---|---|\n", "rules/README.md": "# Rules: tested alert and recording rules\n\n> **Open-source variant (Prometheus).** Copy-paste-safe versions of the patterns in the standard; with Dynatrace the same patterns become SLOs and custom alerts ([10](../standard/10-slos-and-error-budgets.md), [11](../standard/11-alerting.md)). Every rule here has a unit test that runs with\n> [`promtool test rules`](https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/).\n\n| File | Patterns | Standard |\n|---|---|---|\n| [`checkout-slo.rules.yml`](checkout-slo.rules.yml) | SLI recording rules (5m → 3d), multi-window multi-burn-rate page + ticket, low-traffic guard | [11 §4](../standard/11-alerting.md), [10](../standard/10-slos-and-error-budgets.md) |\n| [`patterns.rules.yml`](patterns.rules.yml) | Per-client ratio + min count, DLQ count, absence, release regression by version, burn after deploy | [11](../standard/11-alerting.md), [12](../standard/12-releases-and-dora.md) |\n| [`tests/`](tests/) | Unit tests with synthetic series | – |\n\n## Run the tests\n\n```bash\nmake test        # from the repo root (uses the prom/prometheus:v3.5.0 image, no local install needed)\n```\n\n## What the tests prove\n\n| Test | Scenario | Expected |\n|---|---|---|\n| fast burn pages | 100 req/s, 2% errors | Page fires (2% > 14.4 × 0.1%) |\n| slow burn does not page | 0.5% errors | No page (ticket territory) |\n| page resolves once both short windows are clean | Errors stop at minute 80 | Still firing at 70m; resolved at 115m. **The 6h/30m pair keeps paging for up to 30 min after the fix** |\n| per-client ratio with minimum-count guard | Big client fine, small client 100% failing, tiny client 1 error out of 3 | Only `small` fires; `tiny` stays silent thanks to the guard |\n| count alert fires on a single DLQ message | One message | Fires |\n| absence alert when orders stop | Orders flat for 30 min | Silent at 15m, fires at 45m |\n| release regression between two versions | 1.41.3 at 0.2%, 1.42.0 at 4% | Fires with `suspect: deploy` |\n| single version is not a regression | Only 1.42.0, 4% errors | Silent (the SLO alert covers it) |\n| burn after deploy | Generation 7 → 8 at minute 60, then errors | Silent before, fires at 75m |\n\n## Adapting to your metrics\n\n- Metric and label names follow OTel semantic conventions translated by Prometheus (`http_server_request_duration_seconds_count`, `http_response_status_code`, `service_name`). If your instrumentation differs, change the selectors **and** the test series.\n- `service_name` / `service_version` as labels require promoting resource attributes ([12](../standard/12-releases-and-dora.md#1-version-on-every-signal)).\n- For many services, generate SLO rules with [Sloth](https://sloth.dev/) or [Pyrra](https://github.com/pyrra-dev/pyrra) instead of copying `checkout-slo.rules.yml`.\n- Thresholds (5%, 20 errors, 0.5 req/s, 1%) are rules of thumb ⚠️.\n", "rules/checkout-slo.rules.yml": "# SLO recording rules + multi-window, multi-burn-rate alerts for one service (checkout).\n# SLO: 99.9% availability (non-5xx) → error budget 0.001.\n# Burn rates and windows: Google SRE Workbook, \"Alerting on SLOs\" (14.4x 1h/5m, 6x 6h/30m page; 1x 3d/6h ticket).\n# Tested: rules/tests/checkout-slo.test.yml (promtool test rules)\ngroups:\n  - name: checkout-sli\n    interval: 30s\n    rules:\n      - record: slo:sli_error:ratio_rate5m\n        expr: |\n          sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=~\"5..\"}[5m]))\n          /\n          sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[5m]))\n      - record: slo:sli_error:ratio_rate30m\n        expr: |\n          sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=~\"5..\"}[30m]))\n          /\n          sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[30m]))\n      - record: slo:sli_error:ratio_rate1h\n        expr: |\n          sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=~\"5..\"}[1h]))\n          /\n          sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[1h]))\n      - record: slo:sli_error:ratio_rate6h\n        expr: |\n          sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=~\"5..\"}[6h]))\n          /\n          sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[6h]))\n      - record: slo:sli_error:ratio_rate3d\n        expr: |\n          sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=~\"5..\"}[3d]))\n          /\n          sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[3d]))\n      - record: slo:requests:rate1h\n        expr: sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[1h]))\n\n  - name: checkout-slo-alerts\n    rules:\n      - alert: CheckoutErrorBudgetBurnPage\n        expr: |\n          (\n            (slo:sli_error:ratio_rate1h > (14.4 * 0.001) and slo:sli_error:ratio_rate5m > (14.4 * 0.001))\n            or\n            (slo:sli_error:ratio_rate6h > (6 * 0.001) and slo:sli_error:ratio_rate30m > (6 * 0.001))\n          )\n          and on (service_name) slo:requests:rate1h > 0.1\n        for: 2m\n        labels:\n          severity: page\n          team: checkout\n        annotations:\n          summary: \"checkout is burning its error budget fast\"\n          description: \"1h error ratio {{ $value | humanizePercentage }} (SLO 99.9%).\"\n          runbook_url: https://wiki.example/runbooks/checkout-errors\n          dashboard_url: https://grafana.example/d/service-red?var-service=checkout\n\n      - alert: CheckoutErrorBudgetBurnTicket\n        expr: |\n          slo:sli_error:ratio_rate3d > (1 * 0.001)\n          and slo:sli_error:ratio_rate6h > (1 * 0.001)\n        for: 1h\n        labels:\n          severity: ticket\n          team: checkout\n        annotations:\n          summary: \"checkout is slowly burning its error budget\"\n          runbook_url: https://wiki.example/runbooks/checkout-errors\n", "rules/patterns.rules.yml": "# Alert patterns from standard/11 (percentage vs count) and standard/12 (releases). Open-source variant.\n# Tested: rules/tests/patterns.test.yml (promtool test rules)\ngroups:\n  - name: per-version\n    rules:\n      # Error ratio per version, only for versions with real traffic (>= 0.5 req/s over 10m)\n      - record: version:error_ratio:rate10m\n        expr: |\n          (\n            sum by (service_name, service_version) (rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[10m]))\n            /\n            sum by (service_name, service_version) (rate(http_server_request_duration_seconds_count[10m]))\n          )\n          and\n          sum by (service_name, service_version) (rate(http_server_request_duration_seconds_count[10m])) >= 0.5\n\n  - name: patterns\n    rules:\n      # Ratio + minimum count, per client (standard/11 §3)\n      - alert: ClientErrorRatioHigh\n        expr: |\n          (\n            sum by (service_name, client_id) (rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[10m]))\n            /\n            sum by (service_name, client_id) (rate(http_server_request_duration_seconds_count[10m]))\n            > 0.05\n          )\n          and on (service_name, client_id)\n          (\n            sum by (service_name, client_id) (increase(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[10m]))\n            > 20\n          )\n        for: 5m\n        labels:\n          severity: page\n        annotations:\n          summary: \"{{ $labels.service_name }}: client {{ $labels.client_id }} error ratio {{ $value | humanizePercentage }}\"\n          runbook_url: https://wiki.example/runbooks/client-errors\n\n      # Count: every occurrence matters (standard/11 §2)\n      - alert: DeadLetterQueueReceivedMessages\n        expr: sum by (queue) (increase(messaging_dlq_messages_total[10m])) > 0\n        labels:\n          severity: ticket\n        annotations:\n          summary: \"Messages landed in DLQ {{ $labels.queue }}\"\n          runbook_url: https://wiki.example/runbooks/dlq\n\n      # Absence: a business flow went silent (standard/11 §2)\n      - alert: NoOrdersReceived\n        expr: sum(increase(orders_total[15m])) == 0\n        for: 5m\n        labels:\n          severity: page\n        annotations:\n          summary: \"No orders in the last 15 minutes\"\n          runbook_url: https://wiki.example/runbooks/no-orders\n\n      # Release regression: while 2+ versions serve traffic, worst is 2x the best and above 1% (standard/12 §3)\n      - alert: ReleaseRegression\n        expr: |\n          (\n            max by (service_name) (version:error_ratio:rate10m)\n            > 2 * min by (service_name) (version:error_ratio:rate10m)\n          )\n          and on (service_name) count by (service_name) (version:error_ratio:rate10m) > 1\n          and on (service_name) max by (service_name) (version:error_ratio:rate10m) > 0.01\n        for: 2m\n        labels:\n          severity: page\n          suspect: deploy\n        annotations:\n          summary: \"{{ $labels.service_name }}: one version has a much higher error ratio than the other\"\n          runbook_url: https://wiki.example/runbooks/rollback\n\n      # SLO burn + deploy in the last 30 min (standard/12 §3)\n      - alert: CheckoutBurnAfterDeploy\n        expr: |\n          slo:sli_error:ratio_rate1h{service_name=\"checkout\"} > (14.4 * 0.001)\n          and on (service_name)\n          max by (service_name) (\n            label_replace(\n              changes(kube_deployment_status_observed_generation{deployment=\"checkout\"}[30m]),\n              \"service_name\", \"$1\", \"deployment\", \"(.*)\"\n            )\n          ) > 0\n        labels:\n          severity: page\n          suspect: deploy\n          team: checkout\n        annotations:\n          summary: \"checkout burning error budget, deploy in the last 30 min: consider rollback\"\n          runbook_url: https://wiki.example/runbooks/rollback-checkout\n", "rules/tests/checkout-slo.test.yml": "rule_files:\n  - ../checkout-slo.rules.yml\n\nevaluation_interval: 30s\n\ntests:\n  # 100 req/s, 2% errors (above 14.4 x 0.1% = 1.44%) → page fires\n  - name: fast burn pages\n    interval: 1m\n    input_series:\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=\"200\"}'\n        values: '0+5880x120'\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=\"500\"}'\n        values: '0+120x120'\n    promql_expr_test:\n      - expr: slo:sli_error:ratio_rate1h\n        eval_time: 90m\n        exp_samples:\n          - labels: 'slo:sli_error:ratio_rate1h{service_name=\"checkout\"}'\n            value: 0.02\n    alert_rule_test:\n      - eval_time: 90m\n        alertname: CheckoutErrorBudgetBurnPage\n        exp_alerts:\n          - exp_labels:\n              service_name: checkout\n              severity: page\n              team: checkout\n            exp_annotations:\n              summary: \"checkout is burning its error budget fast\"\n              description: \"1h error ratio 2% (SLO 99.9%).\"\n              runbook_url: https://wiki.example/runbooks/checkout-errors\n              dashboard_url: https://grafana.example/d/service-red?var-service=checkout\n\n  # 0.5% errors: above budget (ticket territory) but far from fast burn → no page\n  - name: slow burn does not page\n    interval: 1m\n    input_series:\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=\"200\"}'\n        values: '0+5970x120'\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=\"500\"}'\n        values: '0+30x120'\n    alert_rule_test:\n      - eval_time: 90m\n        alertname: CheckoutErrorBudgetBurnPage\n        exp_alerts: []\n\n  # Errors stop at minute 80. The 1h/5m pair resolves within ~5 min, but the 6h/30m pair keeps\n  # firing until its 30m short window is clean (~minute 110). Lesson: after a fix, expect up to\n  # 30 min of page before it resolves; the short windows are what make it resolve at all.\n  - name: page resolves once both short windows are clean\n    interval: 1m\n    input_series:\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=\"200\"}'\n        values: '0+5880x80 470400+6000x40'\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=\"500\"}'\n        values: '0+120x80 9600+0x40'\n    alert_rule_test:\n      - eval_time: 70m\n        alertname: CheckoutErrorBudgetBurnPage\n        exp_alerts:\n          - exp_labels:\n              service_name: checkout\n              severity: page\n              team: checkout\n            exp_annotations:\n              summary: \"checkout is burning its error budget fast\"\n              description: \"1h error ratio 2% (SLO 99.9%).\"\n              runbook_url: https://wiki.example/runbooks/checkout-errors\n              dashboard_url: https://grafana.example/d/service-red?var-service=checkout\n      - eval_time: 115m\n        alertname: CheckoutErrorBudgetBurnPage\n        exp_alerts: []\n", "rules/tests/patterns.test.yml": "rule_files:\n  - ../patterns.rules.yml\n  - ../checkout-slo.rules.yml\n\nevaluation_interval: 30s\n\ntests:\n  # Client \"big\": 50 req/s, no errors. Client \"small\": 1 req/s, all failing.\n  # Client \"tiny\": 3 requests per 10 min, 1 error (33%) but only 1 error → guard keeps it silent.\n  - name: per-client ratio with minimum-count guard\n    interval: 1m\n    input_series:\n      - series: 'http_server_request_duration_seconds_count{service_name=\"api\", client_id=\"big\", http_response_status_code=\"200\"}'\n        values: '0+3000x30'\n      - series: 'http_server_request_duration_seconds_count{service_name=\"api\", client_id=\"small\", http_response_status_code=\"500\"}'\n        values: '0+60x30'\n      - series: 'http_server_request_duration_seconds_count{service_name=\"api\", client_id=\"tiny\", http_response_status_code=\"200\"}'\n        values: '0+0.2x30'\n      - series: 'http_server_request_duration_seconds_count{service_name=\"api\", client_id=\"tiny\", http_response_status_code=\"500\"}'\n        values: '0+0.1x30'\n    alert_rule_test:\n      - eval_time: 20m\n        alertname: ClientErrorRatioHigh\n        exp_alerts:\n          - exp_labels:\n              service_name: api\n              client_id: small\n              severity: page\n            exp_annotations:\n              summary: \"api: client small error ratio 100%\"\n              runbook_url: https://wiki.example/runbooks/client-errors\n\n  - name: count alert fires on a single DLQ message\n    interval: 1m\n    input_series:\n      - series: 'messaging_dlq_messages_total{queue=\"payments\"}'\n        values: '0 0 0 0 1 1 1 1'\n    alert_rule_test:\n      - eval_time: 6m\n        alertname: DeadLetterQueueReceivedMessages\n        exp_alerts:\n          - exp_labels:\n              queue: payments\n              severity: ticket\n            exp_annotations:\n              summary: \"Messages landed in DLQ payments\"\n              runbook_url: https://wiki.example/runbooks/dlq\n\n  - name: absence alert when orders stop\n    interval: 1m\n    input_series:\n      - series: 'orders_total'\n        values: '0+10x20 200+0x30'\n    alert_rule_test:\n      - eval_time: 15m\n        alertname: NoOrdersReceived\n        exp_alerts: []\n      - eval_time: 45m\n        alertname: NoOrdersReceived\n        exp_alerts:\n          - exp_labels:\n              severity: page\n            exp_annotations:\n              summary: \"No orders in the last 15 minutes\"\n              runbook_url: https://wiki.example/runbooks/no-orders\n\n  # Rolling update: 1.41.3 at 0.2% errors, 1.42.0 at 4% errors → regression\n  - name: release regression between two versions\n    interval: 1m\n    input_series:\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", service_version=\"1.41.3\", http_response_status_code=\"200\"}'\n        values: '0+598.8x30'\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", service_version=\"1.41.3\", http_response_status_code=\"500\"}'\n        values: '0+1.2x30'\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", service_version=\"1.42.0\", http_response_status_code=\"200\"}'\n        values: '0+576x30'\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", service_version=\"1.42.0\", http_response_status_code=\"500\"}'\n        values: '0+24x30'\n    alert_rule_test:\n      - eval_time: 20m\n        alertname: ReleaseRegression\n        exp_alerts:\n          - exp_labels:\n              service_name: checkout\n              severity: page\n              suspect: deploy\n            exp_annotations:\n              summary: \"checkout: one version has a much higher error ratio than the other\"\n              runbook_url: https://wiki.example/runbooks/rollback\n\n  # Only one version running with high errors → not a *release* regression (the SLO alert covers it)\n  - name: single version is not a regression\n    interval: 1m\n    input_series:\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", service_version=\"1.42.0\", http_response_status_code=\"200\"}'\n        values: '0+576x30'\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", service_version=\"1.42.0\", http_response_status_code=\"500\"}'\n        values: '0+24x30'\n    alert_rule_test:\n      - eval_time: 20m\n        alertname: ReleaseRegression\n        exp_alerts: []\n\n  # Deploy at minute 60 (generation 7 → 8), errors start → burn + recent deploy\n  - name: burn after deploy\n    interval: 1m\n    input_series:\n      - series: 'kube_deployment_status_observed_generation{deployment=\"checkout\", namespace=\"prod\"}'\n        values: '7x60 8x40'\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=\"200\"}'\n        values: '0+6000x60 360000+5000x40'\n      - series: 'http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=\"500\"}'\n        values: '0+0x60 0+1000x40'\n    alert_rule_test:\n      - eval_time: 55m\n        alertname: CheckoutBurnAfterDeploy\n        exp_alerts: []\n      - eval_time: 75m\n        alertname: CheckoutBurnAfterDeploy\n        exp_alerts:\n          - exp_labels:\n              service_name: checkout\n              severity: page\n              suspect: deploy\n              team: checkout\n            exp_annotations:\n              summary: \"checkout burning error budget, deploy in the last 30 min: consider rollback\"\n              runbook_url: https://wiki.example/runbooks/rollback-checkout\n", "site/build.py": "\"\"\"Build observability-guide.html from the Markdown files (single source of truth).\n\nRun from the repo root:  python3 -I site/build.py   (or: make site)\nThe output is a single HTML file: Markdown is embedded as JSON and rendered in the browser with marked.\nDo not edit observability-guide.html by hand.\n\"\"\"\nimport json\nimport posixpath\nimport re\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nOUT = ROOT / \"observability-guide.html\"\nTEMPLATE = ROOT / \"site\" / \"template.html\"\n\n# (group, path). Playbooks with \"Status | skeleton\" are skipped automatically.\nORDER = [\n    (\"1 · Foundations\", \"standard/00-start-here.md\"),\n    (\"1 · Foundations\", \"standard/01-layers.md\"),\n    (\"1 · Foundations\", \"standard/02-maturity-model.md\"),\n    (\"1 · Foundations\", \"standard/03-definition-of-done.md\"),\n    (\"2 · Signals\", \"standard/04-endpoint-coverage.md\"),\n    (\"2 · Signals\", \"standard/05-logging-standard.md\"),\n    (\"2 · Signals\", \"standard/06-workload-types.md\"),\n    (\"2 · Signals\", \"standard/07-frontend-experience.md\"),\n    (\"2 · Signals\", \"standard/08-kubernetes-cluster.md\"),\n    (\"2 · Signals\", \"standard/09-internal-services.md\"),\n    (\"3 · Reliability\", \"standard/10-slos-and-error-budgets.md\"),\n    (\"3 · Reliability\", \"standard/11-alerting.md\"),\n    (\"3 · Reliability\", \"standard/12-releases-and-dora.md\"),\n    (\"3 · Reliability\", \"standard/13-capacity-and-saturation.md\"),\n    (\"4 · Dashboards\", \"standard/14-dashboards.md\"),\n    (\"5 · Platform\", \"standard/15-opentelemetry-practices.md\"),\n    (\"5 · Platform\", \"standard/16-collector-templates.md\"),\n    (\"5 · Platform\", \"standard/17-dynatrace-integration.md\"),\n    (\"5 · Platform\", \"standard/18-automation-and-scale.md\"),\n    (\"5 · Platform\", \"standard/19-cost-and-cardinality.md\"),\n    (\"6 · People & process\", \"standard/20-ownership-and-communication.md\"),\n    (\"6 · People & process\", \"standard/21-incident-response-and-on-call.md\"),\n    (\"6 · People & process\", \"standard/22-resilience.md\"),\n    (\"6 · People & process\", \"standard/23-measuring-effectiveness.md\"),\n    (\"6 · People & process\", \"framework/transition-plan.md\"),\n    (\"6 · People & process\", \"framework/slo-document-template.md\"),\n    (\"6 · People & process\", \"framework/error-budget-policy-template.md\"),\n    (\"6 · People & process\", \"framework/runbook-template.md\"),\n    (\"6 · People & process\", \"framework/postmortem-template.md\"),\n    (\"6 · People & process\", \"framework/game-day-template.md\"),\n    (\"6 · People & process\", \"examples/case-study.md\"),\n    (\"Playbooks\", \"playbooks/release-regression.md\"),\n    (\"Playbooks\", \"playbooks/multi-client-endpoint.md\"),\n    (\"Playbooks\", \"playbooks/dora-from-pipelines.md\"),\n    (\"Playbooks\", \"playbooks/noisy-alerts-cleanup.md\"),\n    (\"Reference\", \"collector/README.md\"),\n    (\"Reference\", \"dynatrace/README.md\"),\n    (\"Reference\", \"AGENTS.md\"),\n    (\"Reference\", \"GLOSSARY.md\"),\n    (\"Reference\", \"REFERENCES.md\"),\n    (\"Open-source variants\", \"rules/README.md\"),\n    (\"Open-source variants\", \"dashboards/README.md\"),\n]\nFOLDER_INDEX = {\"rules\": \"rules/README.md\", \"dashboards\": \"dashboards/README.md\", \"collector\": \"collector/README.md\", \"dynatrace\": \"dynatrace/README.md\"}\n\n\ndef slug(path: str) -> str:\n    return re.sub(r\"[^a-z0-9]+\", \"-\", path.lower().removesuffix(\".md\")).strip(\"-\")\n\n\ndef title_of(md: str, path: str) -> str:\n    m = re.search(r\"^# (.+)$\", md, re.M)\n    return m.group(1).strip() if m else path\n\n\ndef rewrite_links(md: str, path: str, included: set) -> str:\n    base = posixpath.dirname(path)\n\n    def repl(m):\n        text, target = m.group(1), m.group(2)\n        if re.match(r\"^(https?:|mailto:)\", target):\n            return m.group(0)\n        file_part, _, frag = target.partition(\"#\")\n        if not file_part:  # same-document anchor\n            return f\"[{text}](#{slug(path)}--{frag})\"\n        resolved = posixpath.normpath(posixpath.join(base, file_part)).rstrip(\"/\")\n        if resolved in FOLDER_INDEX:\n            resolved = FOLDER_INDEX[resolved]\n        if resolved in included:\n            anchor = f\"{slug(resolved)}--{frag}\" if frag else slug(resolved)\n            return f\"[{text}](#{anchor})\"\n        # A repo file that is not a page (rule file, JSON, test): show it as a path, not a dead link\n        if text.strip(\"`\").rstrip(\"/\") in (resolved, posixpath.basename(resolved), file_part.rstrip(\"/\")):\n            return f\"\u003cspan class=\\\"repo-path\\\">{resolved}\u003c/span>\"\n        return f\"{text} \u003cspan class=\\\"repo-path\\\">{resolved}\u003c/span>\"\n\n    return re.sub(r\"(?\u003c!!)\\[([^\\]]+)\\]\\(([^)\\s]+)\\)\", repl, md)\n\n\ndef main():\n    docs = []\n    for group, path in ORDER:\n        md = (ROOT / path).read_text()\n        if path.startswith(\"playbooks/\") and re.search(r\"^\\| Status \\| skeleton\", md, re.M):\n            continue\n        docs.append({\"group\": group, \"path\": path, \"slug\": slug(path), \"title\": title_of(md, path), \"md\": md})\n    included = {d[\"path\"] for d in docs}\n    for d in docs:\n        d[\"md\"] = rewrite_links(d[\"md\"], d[\"path\"], included)\n\n    readme = (ROOT / \"README.md\").read_text()\n    changelog = readme[readme.index(\"## Changelog\"):]\n    version = re.search(r\"^\\| (v[\\d.]+) \\| (\\d{4}-\\d{2}-\\d{2}) \\|\", changelog, re.M)\n    docs.append({\"group\": \"Reference\", \"path\": \"CHANGELOG\", \"slug\": \"changelog\", \"title\": \"Changelog\",\n                 \"md\": \"# Changelog\\n\\n\" + changelog.split(\"\\n\", 1)[1]})\n\n    payload = json.dumps(docs, ensure_ascii=False).replace(\"\u003c/\", \"\u003c\\\\/\")\n    # Whole repo as text, so the page can offer \"Download source (.zip)\".\n    skip = {OUT.name, \".git\", \"__pycache__\", \"node_modules\"}\n    src = {f.relative_to(ROOT).as_posix(): f.read_text()\n           for f in sorted(ROOT.rglob(\"*\"))\n           if f.is_file() and not (set(f.relative_to(ROOT).parts) & skip) and f.suffix != \".pyc\"}\n    src_payload = json.dumps(src, ensure_ascii=False).replace(\"\u003c\", \"\\\\u003c\")\n    # Placeholders first, payloads last: the embedded sources contain the placeholder strings too.\n    html = (TEMPLATE.read_text()\n            .replace(\"__VERSION__\", f\"{version.group(1)} · {version.group(2)}\")\n            .replace(\"__ZIPNAME__\", f\"observability-guide-{version.group(1)}.zip\")\n            .replace(\"/*__DIAGRAMS__*/\", (ROOT / \"site\" / \"diagrams.js\").read_text())\n            .replace(\"/*__CHARTS__*/\", (ROOT / \"site\" / \"charts.js\").read_text()))\n    html = html.replace(\"/*__DOCS__*/[]\", payload, 1).replace(\"/*__SRC__*/{}\", src_payload, 1)\n    OUT.write_text(html)\n    print(f\"built {OUT.name}: {len(docs)} pages, {len(html) // 1024} KB, {version.group(1)}, {len(src)} source files\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "site/charts.js": "/* Charts for the Observability Guide page. Inlined by site/build.py.\n   Method: one y-axis per chart, thin marks (2px lines, \u003c=24px bars), hairline solid grid, legend for 2+ series\n   plus selective direct labels, text in ink tokens (never series color), status colors only for state and always\n   with an icon/word, hover tooltip on every chart, \"Show data\" table view. All data here is EXAMPLE data. */\n(function () {\n  const NS = 'http://www.w3.org/2000/svg';\n  const esc = s => String(s).replace(/[&\u003c>\"]/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n\n  // ---------- deterministic example data ----------\n  let seed = 7;\n  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };\n  const range = n => Array.from({ length: n }, (_, i) => i);\n  const hhmm = mins => `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;\n\n  // 12:00 → 18:00 every 5 min; deploy 14:02, rollback 14:14, recovered 14:19\n  const T = range(73).map(i => 720 + i * 5);\n  const reqs = T.map(t => +(78 + 22 * Math.sin((t - 720) / 360 * Math.PI) + (rnd() - 0.5) * 6).toFixed(1));\n  const errs = T.map(t => {\n    const base = 0.25 + (rnd() - 0.5) * 0.12;\n    if (t >= 845 && t \u003c= 855) return +(base + (t === 845 ? 1.6 : t === 850 ? 2.6 : 2.2)).toFixed(2);\n    if (t === 860) return +(base + 0.6).toFixed(2);\n    return +base.toFixed(2);\n  });\n\n  // ---------- tooltip ----------\n  const tip = document.createElement('div');\n  tip.className = 'viz-tip'; tip.hidden = true; tip.setAttribute('role', 'status');\n  document.body.appendChild(tip);\n  function showTip(html, cx, cy) {\n    tip.innerHTML = html; tip.hidden = false;\n    const r = tip.getBoundingClientRect();\n    let x = cx + 14, y = cy + 14;\n    if (x + r.width > innerWidth - 8) x = cx - r.width - 14;\n    if (y + r.height > innerHeight - 8) y = cy - r.height - 14;\n    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';\n  }\n  const hideTip = () => { tip.hidden = true; };\n\n  // ---------- helpers ----------\n  const el = (tag, attrs = {}, parent) => {\n    const n = document.createElementNS(NS, tag);\n    for (const k in attrs) n.setAttribute(k, attrs[k]);\n    if (parent) parent.appendChild(n);\n    return n;\n  };\n  const html = (tag, cls, inner) => { const n = document.createElement(tag); if (cls) n.className = cls; if (inner != null) n.innerHTML = inner; return n; };\n  function dataTable(cols, rows) {\n    return `\u003cdetails class=\"viz-data\">\u003csummary>Show data\u003c/summary>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>${cols.map(c => `\u003cth>${esc(c)}\u003c/th>`).join('')}\u003c/tr>\u003c/thead>\u003ctbody>${rows.map(r => `\u003ctr>${r.map(v => `\u003ctd>${esc(v)}\u003c/td>`).join('')}\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>`;\n  }\n  function card(host, title, sub) {\n    host.className = 'viz';\n    host.innerHTML = `\u003cdiv class=\"viz-head\">\u003cdiv class=\"viz-title\">${esc(title)}\u003c/div>${sub ? `\u003cdiv class=\"viz-sub\">${esc(sub)}\u003c/div>` : ''}\u003c/div>\u003cdiv class=\"viz-body\">\u003c/div>\u003cdiv class=\"viz-foot\">\u003cspan class=\"viz-example\">Example data\u003c/span>\u003c/div>`;\n    return host.querySelector('.viz-body');\n  }\n  function legend(items) {\n    return `\u003cdiv class=\"viz-legend\">${items.map(i => `\u003cspan>\u003ci class=\"key ${i.kind || 'line'}\" style=\"--c:${i.color}\">\u003c/i>${esc(i.name)}\u003c/span>`).join('')}\u003c/div>`;\n  }\n  function responsive(node, draw)
