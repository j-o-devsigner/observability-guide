 {\n    let last = 0;\n    const run = () => { const w = Math.round(node.clientWidth); if (w && Math.abs(w - last) > 4) { last = w; draw(w); } };\n    if ('ResizeObserver' in window) new ResizeObserver(run).observe(node);\n    run();\n  }\n  const niceMax = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return ([1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(s => n \u003c= s)) * p; };\n\n  // ---------- line chart (one y-axis) ----------\n  function lineChart(host, cfg) {\n    const H = cfg.height || 170;\n    const api = { setHover: () => {}, clear: () => {} };\n    responsive(host, W => {\n      host.innerHTML = '';\n      const m = { l: 46, r: cfg.labelRoom ?? 92, t: 10, b: 22 };\n      const n = cfg.x.length, iw = W - m.l - m.r, ih = H - m.t - m.b;\n      const all = cfg.series.flatMap(s => s.values.filter(v => v != null));\n      const yMax = cfg.yMax || niceMax(Math.max(...all) * 1.1);\n      const X = i => m.l + (n === 1 ? 0 : i * iw / (n - 1));\n      const Y = v => m.t + (1 - v / yMax) * ih;\n      const svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': cfg.aria || cfg.series.map(s => s.name).join(', ') }, host);\n      // bands (alert zones) behind everything\n      (cfg.bands || []).forEach(b => {\n        el('rect', { x: m.l, width: iw, y: Y(Math.min(b.to, yMax)), height: Y(b.from) - Y(Math.min(b.to, yMax)), fill: 'var(--viz-band)', class: 'band' }, svg);\n        const t = el('text', { x: m.l + 6, y: Y(Math.min(b.to, yMax)) + 13, class: 'viz-note' }, svg); t.textContent = b.label;\n      });\n      // grid + y ticks\n      const ticks = cfg.yTicks || 4;\n      for (let k = 0; k \u003c= ticks; k++) {\n        const v = yMax * k / ticks, y = Y(v);\n        el('line', { x1: m.l, x2: m.l + iw, y1: y, y2: y, class: k === 0 ? 'viz-axis' : 'viz-grid' }, svg);\n        const t = el('text', { x: m.l - 6, y: y + 4, 'text-anchor': 'end', class: 'viz-tick' }, svg); t.textContent = cfg.yFmt(v, true);\n      }\n      // x labels\n      const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 70))));\n      for (let i = 0; i \u003c n; i += every) { const t = el('text', { x: X(i), y: H - 6, 'text-anchor': 'middle', class: 'viz-tick' }, svg); t.textContent = cfg.x[i]; }\n      // reference lines\n      (cfg.refs || []).forEach(r => {\n        el('line', { x1: m.l, x2: m.l + iw, y1: Y(r.y), y2: Y(r.y), class: 'viz-ref' }, svg);\n        const t = r.inside\n          ? el('text', { x: m.l + 6, y: Y(r.y) - 5, class: 'viz-note' }, svg)\n          : el('text', { x: m.l + iw + 6, y: Y(r.y) + 4, class: 'viz-note' }, svg);\n        t.textContent = r.label;\n      });\n      // markers (deploy, rollback)\n      (cfg.markers || []).forEach(mk => {\n        el('line', { x1: X(mk.i), x2: X(mk.i), y1: m.t, y2: m.t + ih, class: 'viz-marker' }, svg);\n        const left = mk.anchor === 'end';\n        const t = el('text', { x: X(mk.i) + (left ? -4 : 4), y: m.t + 10, 'text-anchor': left ? 'end' : 'start', class: 'viz-note' }, svg); t.textContent = mk.label;\n      });\n      // series\n      cfg.series.forEach(s => {\n        let d = '', a = '', pen = false, first = -1, lastI = -1;\n        s.values.forEach((v, i) => {\n          if (v == null) { if (pen && s.area) a += `L${X(lastI)},${Y(0)}Z`; pen = false; return; }\n          if (!pen) { d += `M${X(i)},${Y(v)}`; if (s.area) a += `M${X(i)},${Y(0)}L${X(i)},${Y(v)}`; first = first \u003c 0 ? i : first; }\n          else { d += `L${X(i)},${Y(v)}`; if (s.area) a += `L${X(i)},${Y(v)}`; }\n          pen = true; lastI = i;\n        });\n        if (pen && s.area) a += `L${X(lastI)},${Y(0)}Z`;\n        if (s.area) el('path', { d: a, fill: s.color, 'fill-opacity': 0.1, stroke: 'none' }, svg);\n        el('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-dasharray': s.dash ? '6 4' : 'none' }, svg);\n        if (lastI >= 0 && cfg.endDots !== false) {\n          el('circle', { cx: X(lastI), cy: Y(s.values[lastI]), r: 4, fill: s.color, stroke: 'var(--viz-surface)', 'stroke-width': 2 }, svg);\n          if (cfg.labelRoom !== 0 && s.label !== false) {\n            const t = el('text', { x: X(lastI) + 8, y: Y(s.values[lastI]) + (s.dy || 4), class: 'viz-label' }, svg);\n            t.textContent = s.endLabel || (cfg.series.length === 1 ? cfg.yFmt(s.values[lastI]) : `${s.name} ${cfg.yFmt(s.values[lastI])}`);\n          }\n        }\n      });\n      // hover layer\n      const cross = el('g', { class: 'viz-cross', visibility: 'hidden' }, svg);\n      const vline = el('line', { y1: m.t, y2: m.t + ih }, cross);\n      const dots = cfg.series.map(s => el('circle', { r: 4, fill: s.color, stroke: 'var(--viz-surface)', 'stroke-width': 2 }, cross));\n      const hit = el('rect', { x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent' }, svg);\n      const setHover = (i, cx, cy, withTip) => {\n        if (i == null) { cross.setAttribute('visibility', 'hidden'); return; }\n        cross.setAttribute('visibility', 'visible');\n        vline.setAttribute('x1', X(i)); vline.setAttribute('x2', X(i));\n        cfg.series.forEach((s, k) => { const v = s.values[i]; dots[k].setAttribute('visibility', v == null ? 'hidden' : 'visible'); if (v != null) { dots[k].setAttribute('cx', X(i)); dots[k].setAttribute('cy', Y(v)); } });\n        if (withTip) showTip(`\u003cb>${esc(cfg.x[i])}\u003c/b>` + cfg.series.map(s => `\u003cdiv>\u003ci class=\"key line\" style=\"--c:${s.color}\">\u003c/i>${esc(s.name)} \u003cb>${s.values[i] == null ? '–' : esc(cfg.yFmt(s.values[i]))}\u003c/b>\u003c/div>`).join(''), cx, cy);\n      };\n      api.setHover = setHover;\n      const idx = e => { const r = svg.getBoundingClientRect(); return Math.max(0, Math.min(n - 1, Math.round((e.clientX - r.left - m.l) / iw * (n - 1)))); };\n      hit.addEventListener('pointermove', e => { const i = idx(e); setHover(i, e.clientX, e.clientY, true); cfg.onHover && cfg.onHover(i); });\n      hit.addEventListener('pointerleave', () => { setHover(null); hideTip(); cfg.onHover && cfg.onHover(null); });\n    });\n    return api;\n  }\n\n  // ---------- stat tiles ----------\n  function sparkline(values) {\n    const w = 120, h = 30, mx = Math.max(...values), mn = Math.min(...values), n = values.length;\n    const X = i => i * (w - 6) / (n - 1) + 1, Y = v => h - 4 - (v - mn) / (mx - mn || 1) * (h - 8);\n    const d = values.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');\n    return `\u003csvg class=\"spark\" width=\"${w}\" height=\"${h}\" viewBox=\"0 0 ${w} ${h}\" aria-hidden=\"true\">\u003cpath d=\"${d}\" fill=\"none\" stroke=\"var(--viz-deemph)\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/>\u003ccircle cx=\"${X(n - 1)}\" cy=\"${Y(values[n - 1])}\" r=\"3.5\" fill=\"var(--viz-s1)\" stroke=\"var(--viz-surface)\" stroke-width=\"1.5\"/>\u003c/svg>`;\n  }\n  function tiles(host, title, sub, items) {\n    const body = card(host, title, sub);\n    body.innerHTML = `\u003cdiv class=\"tiles\"${items.length === 6 ? ' style=\"grid-template-columns:repeat(auto-fit,minmax(230px,1fr))\"' : ''}>${items.map(t => `\u003cdiv class=\"tile\">\n      \u003cdiv class=\"tile-label\">${esc(t.label)}\u003c/div>\n      \u003cdiv class=\"tile-value\">${esc(t.value)}${t.unit ? `\u003cspan class=\"tile-unit\">${esc(t.unit)}\u003c/span>` : ''}\u003c/div>\n      ${t.meter != null ? `\u003cdiv class=\"meter\" role=\"img\" aria-label=\"${esc(t.label)} ${t.meter}%\">\u003cspan style=\"width:${t.meter}%;background:var(--viz-${t.meterStatus || 's1'})\">\u003c/span>\u003c/div>` : ''}\n      ${t.delta ? `\u003cdiv class=\"tile-delta ${t.good ? 'up-good' : 'down-bad'}\" title=\"${t.good ? 'Better' : 'Worse'}\">${t.dir === 'down' ? '▼' : '▲'} ${esc(t.delta)} \u003cspan class=\"sr\">(${t.good ? 'better' : 'worse'})\u003c/span>\u003c/div>` : ''}\n      ${t.note ? `\u003cdiv class=\"tile-note\">${esc(t.note)}\u003c/div>` : ''}\n      ${t.spark ? sp sing rate\u003c/div>\u003cdiv class=\"c2\">\u003c/div>';\n      const mins = range(61); let backlog = 0; const arr = [], proc = [], back = [];\n      mins.forEach(m => {\n        const a = Math.round((m >= 15 && m \u003c= 35 ? 680 : 400) + (rnd() - 0.5) * 30);\n        const p = Math.min(500, a + backlog / 60);\n        backlog = Math.max(0, backlog + (a - p) * 60);\n        arr.push(a); proc.push(Math.round(p)); back.push(Math.round(backlog));\n      });\n      body.insertAdjacentHTML('beforeend', dataTable(['Minute', 'Arrival msg/s', 'Processing msg/s', 'Backlog', 'Wait (s)'],\n        mins.filter(m => m % 3 === 0).map(m => [m, arr[m], proc[m], back[m], Math.round(back[m] / Math.max(proc[m], 1))])));\n      const x = mins.map(m => `${m} min`), markers = [{ i: 15, label: 'burst', anchor: 'end' }, { i: 35, label: 'burst ends' }];\n      let a, b;\n      a = lineChart(body.querySelector('.c1'), { x, height: 150, yMax: 800, labelRoom: 120, markers,\n        yFmt: (v, t) => t ? Math.round(v) : Math.round(v) + ' msg/s',\n        series: [{ name: 'Arrival', color: 'var(--viz-s1)', values: arr, dy: 16 }, { name: 'Processing', color: 'var(--viz-s2)', values: proc, dy: -6 }],\n        onHover: i => b && b.setHover(i) });\n      b = lineChart(body.querySelector('.c2'), { x, height: 140, labelRoom: 120, markers, yMax: 250000, yTicks: 5,\n        yFmt: (v, t) => t ? (v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v)) : Math.round(v).toLocaleString() + ' msgs',\n        series: [{ name: 'Backlog', color: 'var(--viz-s1)', values: back, area: true }],\n        onHover: i => a && a.setHover(i) });\n    },\n    'severity-matrix'(host) {\n      const body = card(host, 'Incident severity = service tier × user impact', 'Starting point; when unsure, pick the higher level');\n      const cols = ['Most users down, data loss or security', 'Many users, or one SLA client', 'Some users, workaround exists', 'No user impact yet'];\n      const rows = [['Tier 1', [1, 2, 3, 4]], ['Tier 2', "${x + 12}\" y=\"${y + 21}\" class=\"dg-t\">${esc(title)}\u003c/text>` +\n        sub.map((s, i) => `\u003ctext x=\"${x + 12}\" y=\"${y + 38 + i * 15}\" class=\"dg-s\">${esc(s)}\u003c/text>`).join('') + '\u003c/g>';\n    }\n    function arrow(d, kind, label, lx, ly, opts = {}) {\n      return `\u003cpath d=\"${d}\" style=\"fill:none;stroke:${COL[kind]};stroke-width:1.75${opts.dash ? ';stroke-dasharray:5 4' : ''}\" marker-end=\"url(#${id}-${kind})\"/>` +\n        (label ? text(lx, ly, label, opts.anchor || 'middle') : '');\n    }\n    function text(x, y, s, anchor = 'start', cls = 'dg-l') {\n      return `\u003ctext x=\"${x}\" y=\"${y}\" text-anchor=\"${anchor}\" class=\"${cls}\">${esc(s)}\u003c/text>`;\n    }\n    function pill(x, y, s, kind) {\n      const w = s.length * 6.3 + 20;\n      return `\u003cg>\u003crect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"22\" rx=\"11\" style=\"fill:var(--viz-surface);stroke:${COL[kind] || 'var(--line)'};stroke-width:1\"/>\u003ctext x=\"${x + 10}\" y=\"${y + 15}\" class=\"dg-p\">${esc(s)}\u003c/text>\u003c/g>`;\n    }\n    host.className = 'viz diagram';\n    host.innerHTML = `\u003cfigure>\u003cdiv class=\"viz-title\">${esc(title)}\u003c/div>\u003cdiv class=\"dg-scroll\">\u003csvg viewBox=\"0 0 ${W} ${H}\" role=\"img\" aria-label=\"${esc(caption)}\" style=\"min-width:${minW}px\">${defs}${draw(g)}\u003c/svg>\u003c/div>\u003cfigcaption>${esc(caption)}\u003c/figcaption>\u003c/figure>`;\n  }\n\n  function legend(g, y) {\n    const items = [['dt', 'to Dynatrace'], ['os', 'to the open-source stack'], ['n', 'into the pipeline']];\n    return items.map(([k, s], i) => { const x = 24 + i * 190; return `\u003cline x1=\"${x}\" y1=\"${y}\" x2=\"${x + 28}\" y2=\"${y}\" style=\"stroke:${COL[k]};stroke-width:1.75\"/>` + g.text(x + 36, y + 4, s); }).join('') +\n      `\u003cline x1=\"${24 + 3 * 190}\" y1=\"${y}\" x2=\"${24 + 3 * 190 + 28}\" y2=\"${y}\" style=\"stroke:var(--muted);stroke-width:1.75;stroke-dasharray:5 4\"/>` + g.text(24 + 3 * 19 t-ok{background:var(--viz-track)} .st-pending{background:var(--viz-warn);color:#0b0b0b} .st-firing{background:var(--viz-critical);color:#fff}\n.stl-axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}\n.itl{padding:6px 4px 0}\n.itl-track{position:relative;height:28px;border-bottom:1px solid var(--viz-axis);margin:0 8px}\n.itl-impact{position:absolute;top:8px;height:12px;border-radius:4px;background:var(--viz-band);outline:1px solid color-mix(in srgb,var(--viz-critical) 35%,transparent)}\n.itl-ev{position:absolute;top:8px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--viz-surface)}\n.ev-deploy{background:var(--viz-s1)} .ev-impact{background:var(--viz-s2)} .ev-alert{background:var(--viz-critical)} .ev-action{background:var(--muted)} .ev-ok{background:var(--viz-good)}\n.itl-axis{position:relative;height:18px;margin:2px 8px 6px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}\n.itl-axis span{position:absolute;transform:translateX(-50%)}\n.itl-list{list-style:none;padding:0;margin:4px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px;font-size:13px}\n.itl-list i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}\n.layers{padding:14px}\n.lay-grid{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(130px,170px);gap:10px}\n.lay-axis{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-right:2px solid var(--line);padding-right:8px;text-align:right}\n.lay-stack{display:flex;flex-direction:column;gap:6px;min-width:0}\n.lay{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg)}\n.lay b{font-family:var(--f-display);font-stretch:88%;font-size:15px}\n.lay-q{color:var(--muted);font-size:13.5px}\n.lay-m{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:99px;white-space:nowrap}\n.lay-ex{grid-column:2/4;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}\n.lay-delivery{border:1px dashed var(--accent);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;justify-content:center;font-size:13px;background:var(--accent-soft)}\n.lay-delivery b{font-family:var(--f-display);font-stretch:88%;font-size:15px}\n.lay-delivery .lay-ex{grid-column:auto}\n@media (max-width:640px){\n  .lay-grid{grid-template-columns:minmax(0,1fr)} .lay-axis{display:none}\n  .lay{grid-template-columns:minmax(0,1fr) auto} .lay-q{grid-column:1/3;grid-row:2} .lay-ex{grid-column:1/3}\n  .mrow{grid-template-columns:80px minmax(0,1fr) 40px} .mrow .status{grid-column:2/4}\n  .stl-row{grid-template-columns:minmax(0,1fr)} \n}\n.diagram figure{margin:0}\n.dg-scroll{overflow-x:auto;margin:8px 0 6px}\n.dg-scroll svg{display:block;width:100%;height:auto}\n.diagram figcaption{font-size:13px;color:var(--muted);max-width:75ch}\n.dg-frame{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:6 5}\n.dg-t{fill:var(--fg);font:600 13px var(--f-body)}\n.dg-s{fill:var(--muted);font:11.5px var(--f-body)}\n.dg-l{fill:var(--fg);font:11.5px var(--f-body);paint-order:stroke;stroke:var(--viz-surface);stroke-width:4px;stroke-linejoin:round}\n.dg-h{fill:var(--fg);font:700 14px var(--f-display);font-stretch:88%}\n.dg-k{fill:var(--accent);font:600 11.5px var(--f-mono)}\n.dg-p{fill:var(--fg);font:11.5px var(--f-body)}\n.fallback{white-space:pre-wrap}\n@media (max-width:880px){\n  .shell{grid-template-columns:minmax(0,1fr);gap:18px}\n  nav.toc{position:static;max-height:none;border-bottom:1px solid var(--line);padding-bottom:12px}\n  .toc ul{flex-direction:row;flex-wrap:wrap;gap:4px}\n  .toc a{border:1px solid var(--line);padding:3px 8px}\n}\n.dl{display:block;box-sizing:border-box;text-decoration:none;text-align:left;margin:10px 0 0;padding:6px 10px;font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;cursor:pointer}\na.dl{margin-top:10px}\nbutton.dl{margin-top:6px}\n.dl:hover{border-color:var(--accent)}\n.dl:disabled{opacity:.6;cursor:progress}\n.dl[hidden]{display:none}\n.dl-note{display:block;margin-top:6px;font-size:12px;color:var(--muted)}\n.dl-note[hidden]{display:none}\n@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}\n\u003c/style>\n\n\u003cdiv class=\"shell\">\n  \u003cnav class=\"toc\" aria-label=\"Contents\">\n    \u003cp class=\"brand\">Observability Guide\u003c/p>\n    \u003cspan class=\"ver\">__VERSION__\u003c/span>\n    \u003ca class=\"dl\" href=\"https://github.com/j-o-devsigner/observability-guide\" target=\"_blank\" rel=\"noopener\">GitHub repository ↗\u003c/a>\n    \u003cbutton class=\"dl\" id=\"dl\" type=\"button\">Download source (.zip)\u003c/button>\n    \u003cspan class=\"dl-note\" id=\"dl-note\" hidden>\u003c/span>\n    \u003cinput class=\"search\" id=\"search\" type=\"search\" placeholder=\"Search the guide…\" aria-label=\"Search the guide\">\n    \u003cdiv id=\"toc\">\u003c/div>\n  \u003c/nav>\n  \u003cmain id=\"content\">\u003c/main>\n\u003c/div>\n\n\u003cscript id=\"docs\" type=\"application/json\">/*__DOCS__*/[]\u003c/script>\n\u003cscript id=\"src\" type=\"application/json\">/*__SRC__*/{}\u003c/script>\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js\">\u003c/script>\n\u003cscript>\n/*__DIAGRAMS__*/\n\u003c/script>\n\u003cscript>\n/*__CHARTS__*/\n\u003c/script>\n\u003cscript>\n(function(){\n  const docs = JSON.parse(document.getElementById('docs').textContent);\n  const content = document.getElementById('content');\n  const ghslug = t => t.toLowerCase().replace(/\u003c[^>]+>/g,'').replace(/&[a-z]+;/g,'').trim().replace(/[^\\w\\- ]+/g,'').replace(/ /g,'-');\n\n  // ---------- render ----------\n  docs.forEach(d => {\n    const art = document.createElement('article');\n    art.id = d.slug;\n    if (window.marked) {\n      const r = new marked.Renderer();\n      r.heading = (text, level, raw) => level === 1\n        ? `\u003ch1>${text}\u003c/h1>`\n        : `\u003ch${level} id=\"${d.slug}--${ghslug(raw)}\">${text}\u003c/h${level}>`;\n      art.innerHTML = `\u003cdiv class=\"src\">${d.path}\u003c/div>` + marked.parse(d.md, {renderer: r, mangle: false, headerIds: false});\n    } else {\n      art.innerHTML = `\u003cdiv class=\"src\">${d.path}\u003c/div>\u003cpre class=\"fallback\">\u003c/pre>`;\n      art.querySelector('pre').textContent = d.md;\n    }\n    art.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tw'; t.replaceWith(w); w.appendChild(t); });\n    art.querySelectorAll('pre').forEach(p => {\n      const b = document.createElement('button'); b.type = 'button'; b.className = 'copy'; b.textContent = 'Copy';\n      b.addEventListener('click', () => {\n        const txt = p.querySelector('code') ? p.querySelector('code').innerText : p.innerText;\n        navigator.clipboard.writeText(txt).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1400); })\n          .catch(() => { const r = document.createRange(); r.selectNodeContents(p); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Press Ctrl+C'; });\n      });\n      p.appendChild(b);\n    });\n    content.appendChild(art);\n  });\n\n  // ---------- table of contents + search ----------\n  const toc = document.getElementById('toc');\n  function buildToc(filter){\n    const q = (filter || '').trim().toLowerCase();\n    let html = '', group = null, open = false;\n    docs.forEach(d => {\n      let hits = 0;\n      if (q) { const m = d.md.toLowerCase().split(q).length - 1; if (!m) return; hits = m; }\n      if (d.group !== group) { if (open) html += '\u003c/ul>'; html += `\u003cdiv class=\"grp\">${d.group}\u003c/div>\u003cul>`; group = d.group; open = true; }\n      html += `\u003cli>\u003ca href=\"#${d.slug}\" data-s=\"${d.slug}\">${d.title.replace(/\u003c/g,'&lt;')}${hits ? `\u003cspan class=\"hits\">${hits}\u003c/span>` : ''}\u003c/a>\u003c/li>`;\n    });\n    if (open) html += '\u003c/ul>';\n    toc.innerHTML = html || '\u003cp class=\"ver\" style=\"margin:8px\">No matches\u003c/p>';\n  }\n  buildToc('');\n  document.getElementById('search').addEventListener('input', e => buildToc(e.target.value));\n  if ('IntersectionObserver' in window) {\n    const io = new IntersectionObserver(es => es.forEach(en => {\n      if (en.isIntersecting) toc.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.s === en.target.id));\n    }), {rootMargin: '-10% 0px -80% 0px'});\n    content.querySelectorAll('article').forEach(a => io.observe(a));\n  }\n\n  // ---------- widgets ----------\n  const store = { get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(_) { return d; } },\n                  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(_) {} } };\n  const nextTable = el => { let n = el.nextElementSibling; while (n && !n.querySelector?.('table') && n.tagName !== 'TABLE') n = n.nextElementSibling; return n ? (n.tagName === 'TABLE' ? n : n.querySelector('table')) : null; };\n  const num = id => parseFloat(document.getElementById(id).value) || 0;\n\n  const W = {\n    'viz'(el){ if (window.ObsCharts) ObsCharts.render(el); },\n    'alert-type-picker'(el){\n      const qs = [['each','Does every single occurrence matter on its own?',[['1','Yes'],['0','No']],'0'],\n                  ['absent','Is the problem that something stops happening?',[['1','Yes'],['0','No']],'0'],\n                  ['slo','Is there an SLO for this flow?',[['1','Yes'],['0','No']],'0'],\n                  ['traffic','Traffic level for this segment or client',[['high','High'],['low','Low / variable']],'high']];\n      const st = {}; qs.forEach(q => st[q[0]] = q[3]);\n      el.className = 'tool';\n      el.innerHTML = '\u003ch4>Which alert type? Answer four questions\u003c/h4>' + qs.map(q =>\n        `\u003cdiv class=\"qrow\">\u003cspan>${q[1]}\u003c/span>\u003cdiv class=\"seg\" data-q=\"${q[0]}\">${q[2].map(o => `\u003cbutton type=\"button\" data-v=\"${o[0]}\" aria-pressed=\"${o[0]===q[3]}\">${o[1]}\u003c/button>`).join('')}\u003c/div>\u003c/div>`).join('') +\n        '\u003cdiv class=\"verdict\" aria-live=\"polite\">\u003c/div>';\n      const out = el.querySelector('.verdict');\n      function verdict(){\n        let t, d, s;\n        if (st.absent === '1') { t = 'Absence alert'; d = 'Alert when the count is zero (\u003ccode>sum(increase(x_total[15m])) == 0\u003c/code>) or the series is missing (\u003ccode>absent()\u003c/code>). Limit it to hours when traffic is expected.'; s = 'page if it is a key flow'; }\n        else if (st.each === '1') { t = 'Count alert'; d = 'Every event matters: \u003ccode>increase(x_total[5m]) &gt; 0\u003c/code>. Put the count in the summary so on-call sees the impact.'; s = 'page for money or data loss, otherwise ticket'; }\n        else if (st.slo === '1') { t = 'SLO burn-rate alert'; d = 'Multi-window burn rate (14.4× over 1h/5m, 6× over 6h/30m)' + (st.traffic === 'low' ? ', \u003cb>plus a minimum-traffic guard\u003c/b> and longer windows for this segment.' : '.'); s = 'page for fast burn, ticket for slow burn'; }\n        else { t = st.traffic === 'low' ? 'Ratio + minimum count' : 'Ratio (percentage)'; d = st.traffic === 'low' ? 'Error % above the threshold \u003cb>and\u003c/b> at least N errors, so one failed request at night pages nobody. Consider defining an SLO.' : 'Error % above the threshold over 5–10m with \u003ccode>for:\u003c/code>. Keep a minimum-count guard anyway, and consider an SLO.'; s = 'page if users feel it'; }\n        out.innerHTML = `\u003cb>${t}\u003c/b>\u003cp style=\"margin:4px 0 0\">${d}\u003c/p>\u003cp style=\"margin:4px 0 0;font-size:13px;color:var(--muted)\">Severity: ${s}\u003c/p>`;\n      }\n      el.addEventListener('click', e => { const b = e.target.closest('.seg button'); if (!b) return; const seg = b.parentElement;\n        seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); st[seg.dataset.q] = b.dataset.v; verdict(); });\n      verdict();\n    },\n    'low-traffic-checker'(el){\n      el.className = 'tool';\n      el.innerHTML = `\u003ch4>Low-traffic check: does this alert fire?\u003c/h4>\u003cdiv class=\"fields\">\n        \u003clabel for=\"lt-req\">Requests in window\u003cinput id=\"lt-req\" type=\"number\" min=\"0\" value=\"40\">\u003c/label>\n        \u003clabel for=\"lt-err\">Errors in window\u003cinput id=\"lt-err\" type=\"number\" min=\"0\" value=\"6\">\u003c/label>\n        \u003clabel for=\"lt-thr\">Ratio threshold %\u003cinput id=\"lt-thr\" type=\"number\" min=\"0\" step=\"0.1\" value=\"5\">\u003c/label>\n        \u003clabel for=\"lt-min\">Minimum errors\u003cinput id=\"lt-min\" type=\"number\" min=\"0\" value=\"20\">\u003c/label>\u003c/div>\n        \u003cdiv class=\"outs\">\u003cdiv class=\"out\">\u003csmall>Error ratio\u003c/small>\u003cstrong id=\"lt-ratio\">–\u003c/strong>\u003c/div>\n        \u003cdiv class=\"out\">\u003csmall>Ratio only\u003c/small>\u003cstrong id=\"lt-a\">–\u003c/strong>\u003c/div>\n        \u003cdiv class=\"out\">\u003csmall>Ratio + min count\u003c/small>\u003cstrong id=\"lt-b\">–\u003c/strong>\u003c/div>\u003c/div>`;\n      const fire = '\u003cspan class=\"pill p-page\">fires\u003c/span>', quiet = '\u003cspan class=\"pill p-ok\">silent\u003c/span>';\n      function calc(){ const r = num('lt-req'), e = Math.min(num('lt-err'), r), ratio = r ? e / r * 100 : 0;\n        document.getElementById('lt-ratio').textContent = r ? ratio.toFixed(1) + '%' : '–';\n        const a = r > 0 && ratio > num('lt-thr');\n        document.getElementById('lt-a').innerHTML = a ? fire : quiet;\n        document.getElementById('lt-b').innerHTML = (a && e > num('lt-min')) ? fire : quiet; }\n      el.addEventListener('input', calc); calc();\n    },\n    'burn-calculator'(el){\n      el.className = 'tool';\n      el.innerHTML = `\u003ch4>Burn-rate calculator\u003c/h4>\u003cdiv class=\"fields\">\n        \u003clabel for=\"br-slo\">SLO target %\u003cinput id=\"br-slo\" type=\"number\" step=\"0.01\" value=\"99.9\">\u003c/label>\n        \u003clabel for=\"br-days\">SLO period (days)\u003cinput id=\"br-days\" type=\"number\" value=\"30\">\u003c/label>\n        \u003clabel for=\"br-rate\">Burn rate\u003cinput id=\"br-rate\" type=\"number\" step=\"0.1\" value=\"14.4\">\u003c/label>\n        \u003clabel for=\"br-win\">Long window (hours)\u003cinput id=\"br-win\" type=\"number\" step=\"0.5\" value=\"1\">\u003c/label>\u003c/div>\n        \u003cdiv class=\"outs\">\u003cdiv class=\"out\">\u003csmall>Error budget\u003c/small>\u003cstrong id=\"br-budget\">–\u003c/strong>\u003c/div>\n        \u003cdiv class=\"out\">\u003csmall>Alert when error ratio &gt;\u003c/small>\u003cstrong id=\"br-thr\">–\u003c/strong>\u003c/div>\n        \u003cdiv class=\"out\">\u003csmall>Budget gone in\u003c/small>\u003cstrong id=\"br-exh\">–\u003c/strong>\u003c/div>\n        \u003cdiv class=\"out\">\u003csmall>Budget used in window\u003c/small>\u003cstrong id=\"br-used\">–\u003c/strong>\u003c/div>\u003c/div>`;\n      const trim = x => x.toFixed(3).replace(/\\.?0+$/, '');\n      const fmtH = h => !isFinite(h) ? '–' : h >= 48 ? (h / 24).toFixed(1) + ' days' : h.toFixed(1) + ' h';\n      function calc(){ const slo = num('br-slo'), days = num('br-days'), rate = num('br-rate'), win = num('br-win'), budget = Math.max(0, 100 - slo);\n        document.getElementById('br-budget').textContent = trim(budget) + '%';\n        document.getElementById('br-thr').textContent = trim(rate * budget) + '%';\n        document.getElementById('br-exh').textContent = rate > 0 ? fmtH(days * 24 / rate) : '–';\n        document.getElementById('br-used').textContent = days > 0 ? (rate * win / (days * 24) * 100).toFixed(1) + '%' : '–'; }\n      el.addEventListener('input', calc); calc();\n    },\n    'table-filter'(el){\n      const t = nextTable(el); if (!t) return;\n      el.className = 'filterbar';\n      el.innerHTML = '\u003cinput class=\"filter\" id=\"case-filter\" type=\"search\" placeholder=\"Filter rows (e.g. count, page, disk)\" aria-label=\"Filter table rows\">\u003csmall>\u003c/small>';\n      const rows = [...t.tBodies[0].rows], info = el.querySelector('small');\n      const run = () => { const q = el.querySelector('input').value.trim().toLowerCase(); let n = 0;\n        rows.forEach(r => { const show = !q || r.textContent.toLowerCase().includes(q); r.hidden = !show; n += show; });\n        info.textContent = `${n} / ${rows.length}`; };\n      el.addEventListener('input', run); run();\n    },\n    'checklist'(el){\n      const t = nextTable(el); if (!t) return;\n      t.classList.add('chk');\n      const key = 'obs-guide-checklist', saved = store.get(key, {});\n      const rows = [...t.tBodies[0].rows], prog = document.createElement('div'); prog.className = 'progress'; el.appendChild(prog);\n      const update = () => { const n = rows.filter(r => r.classList.contains('done')).length; prog.textContent = `${n} / ${rows.length} covered (saved in this browser only)`; };\n      rows.forEach((r, i) => {\n        const id = 'dod-' + (r.cells[0].textContent.trim() || i);\n        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = id; cb.checked = !!saved[id];\n        cb.setAttribute('aria-label', 'Covered: ' + (r.cells[1] ? r.cells[1].textContent.trim() : id));\n        r.classList.toggle('done', cb.checked);\n        cb.addEventListener('change', () => { saved[id] = cb.checked; r.classList.toggle('done', cb.checked); store.set(key, saved); update(); });\n        r.cells[0].prepend(cb);\n      });\n      update();\n    }\n  };\n  content.querySelectorAll('[data-widget]').forEach(el => { const f = W[el.dataset.widget]; if (f) f(el); });\n\n  // jump to the hash after rendering (content did not exist at load)\n  if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }\n})();\n\u003c/script>\n\u003cscript>\n(function () {\n  const btn = document.getElementById('dl'), note = document.getElementById('dl-note'), NAME = '__ZIPNAME__';\n  let saver = null;\n  function loadZip() {\n    return window.JSZip ? Promise.resolve(window.JSZip) : new Promise((ok, ko) => {\n      const s = document.createElement('script');\n      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';\n      s.onload = () => ok(window.JSZip); s.onerror = ko; document.head.appendChild(s);\n    });\n  }\n  async function build() {\n    const Z = await loadZip(), zip = new Z(), root = zip.folder('observability-guide');\n    const files = JSON.parse(document.getElementById('src').textContent);\n    for (const [p, body] of Object.entries(files)) root.file(p, body);\n    return zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });\n  }\n  btn.addEventListener('click', async () => {\n    const label = btn.textContent; btn.disabled = true; btn.textContent = 'Preparing…';\n    try {\n      const blob = await build();\n      if (saver) {\n        await saver.save({ filename: NAME, data: blob });\n      } else {\n        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = NAME;\n        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);\n      }\n      btn.textContent = label;\n      if (!saver) { note.hidden = false; note.textContent = 'Nothing downloaded? Open the page in its own browser tab and try again.'; }\n    } catch (e) {\n      btn.textContent = label;\n      if (!(e && e.code === 'declined')) { note.hidden = false; note.textContent = 'Download blocked here. Open the page in its own browser tab and try again.'; }\n    } finally { btn.disabled = false; }\n  });\n  if (window.claude && typeof window.claude.use === 'function') {\n    window.claude.use('downloads').then(d => { if (d) saver = d; }).catch(() => {});\n  }\n})();\n\u003c/script>\n", "standard/00-start-here.md": "# 00 · Start here\n\n> **In 30 seconds:** this guide is a standard for observability with **OpenTelemetry (collection) and Dynatrace\n> (backend)**. It has six parts. Pick your situation below, read that section, and use the rest as reference.\n> Open-source variants (Prometheus, Grafana) appear in collapsed boxes where useful.\n\n## The six parts\n\n| Part | Sections | Answers |\n|---|---|---|\n| **1. Foundations** | [01 Layers](01-layers.md) · [02 Maturity](02-maturity-model.md) · [03 Definition of done](03-definition-of-done.md) | Where does a problem live? How good are we? When is a service \"monitored\"? |\n| **2. Signals** | [04 Endpoints](04-endpoint-coverage.md) · [05 Logging](05-logging-standard.md) · [06 Queues, batch, external](06-workload-types.md) · [07 Frontend](07-frontend-experience.md) · [08 Kubernetes](08-kubernetes-cluster.md) · [09 Internal & platform services](09-internal-services.md) | What must each kind of component emit? |\n| **3. Reliability** | [10 SLOs](10-slos-and-error-budgets.md) · [11 Alerting](11-alerting.md) · [12 Releases & DORA](12-releases-and-dora.md) · [13 Capacity](13-capacity-and-saturation.md) | What do we promise, when do we page, which change broke it, will it fit next quarter? |\n| **4. Dashboards** | [14 Dashboards](14-dashboards.md) | How do we show it? |\n| **5. Platform** | [15 OTel practices](15-opentelemetry-practices.md) · [16 Collectors](16-collector-templates.md) · [17 Dynatrace](17-dynatrace-integration.md) · [18 Automation](18-automation-and-scale.md) · [19 Cost](19-cost-and-cardinality.md) | How is the pipeline built, run, scaled and paid for? |\n| **6. People & process** | [20 Ownership & severity](20-ownership-and-communication.md) · [21 Incidents & on-call](21-incident-response-and-on-call.md) · [22 Resilience](22-resilience.md) · [23 Measuring effectiveness](23-measuring-effectiveness.md) · [transition plan](../framework/transition-plan.md) · playbooks · [case study](../examples/case-study.md) | Who does what, how we respond and learn, how we prove it works |\n\n## I have a problem right now\n\n```text\nWhat do you see?\n├─ Users or clients complain ─────────────► 01 locate the layer → 04 per client → playbooks/multi-client-endpoint\n├─ Errors or latency went up ─────────────► Did something change? → 12 releases → playbooks/release-regression\n├─ It's slow and the service looks fine ──► 09 measure from the caller → dependencies, pools, timeouts\n├─ A queue is late ───────────────────────► 06 queue model (arrival vs processing, oldest age) → 13 capacity\n├─ An alert fired and I don't trust it ───► 11 (percentage vs count, guards, one source per symptom)\n├─ Pods / nodes look bad ─────────────────► 08 Kubernetes → then check users (10 SLO): are they affected?\n├─ We'll run out soon (traffic growing) ──► 13 capacity: load test, headroom, forecast\n├─ Telemetry is missing ──────────────────► 16 collector self-monitoring\n├─ An incident is happening ──────────────► 20 severity → 21 runbook, roles, comms\n└─ Business number looks wrong ───────────► 04 business metrics → 01 business layer\n```\n\n## I want to build or improve something\n\n| Goal | Read | Then use |\n|---|---|---|\n| Monitor a new service | [18](18-automation-and-scale.md) (service file + archetype), [03](03-definition-of-done.md) | `observability.yaml` |\n| Measure microservices with one template | [18 · microservices](18-automation-and-scale.md#measuring-microservices-with-templates) | Baseline + archetype + parameters |\n| Define SLOs and a policy | [10](10-slos-and-error-budgets.md) | [SLO document](../framework/slo-document-template.md), [error budget policy](../framework/error-budget-policy-template.md) |\n| Reduce alert noise | [11 §7](11-alerting.md#7-cleaning-up-a-noisy-alert-set) | [playbook](../playbooks/noisy-alerts-cleanup.md) |\n| Plan capacity, right-size, autoscale | [13](13-capacity-and-saturation.md) | Monthly capacity review |\n| Write a runbook / a postmortem | [21](21-incident-response-and-on-call.md) | [runbook](../framework/runbook-template.md), [postmortem](../framework/postmortem-template.md) templates |\n| Test backups, failover and alerts on purpose | [22](22-resilience.md) | [game day template](../framework/game-day-template.md) |\n| Prove the observability works; measure my impact | [23](23-measuring-effectiveness.md) | Scorecard + impact log |\n| Measure internal and shared platform services | [09](09-internal-services.md) | Archetype `platform-service` in [dynatrace/](../dynatrace/) |\n| Connect incidents to releases, track DORA | [12](12-releases-and-dora.md) | [playbook](../playbooks/dora-from-pipelines.md) |\n| Build dashboards | [14](14-dashboards.md) | One L1 template with a `service` variable |\n| Deploy collectors | [16](16-collector-templates.md) | [collector/](../collector/) |\n| Decide OneAgent vs OpenTelemetry, control cost | [17](17-dynatrace-integration.md), [19](19-cost-and-cardinality.md) | – |\n| Change an existing setup | [02](02-maturity-model.md) | [transition plan](../framework/transition-plan.md) |\n\n## The ten ideas behind the whole guide\n\n| # | Idea | Section |\n|---|---|---|\n| 1 | Find the **layer** first: Business, UX, Service, Resources, Delivery | 01 |\n| 2 | Every signal carries **service, version, team, environment** (and client when it matters) | 04, 15 |\n| 3 | **Page on symptoms**, diagnose with causes; a **percentage** says how bad, a **count** says how many | 11 |\n| 4 | **SLO + burn rate** beats fixed thresholds, and needs an **error budget policy** | 10 |\n| 5 | **Most incidents start with a change**: version on every signal, deployment events | 12 |\n| 6 | **Measure dependencies from the caller**; internal SLOs are stricter than the ones that depend on them | 09 |\n| 7 | **Capacity is demand vs load-tested supply**; alert on the forecast, not on CPU | 13 |\n| 8 | **One template, many services**: baseline + archetype + parameters, as code with Monaco | 18 |\n| 9 | **OpenTelemetry collects, Dynatrace analyzes**; the gateway is your control point | 16, 17 |\n| 10 | **No alert without an owner** and a runbook; every claim links to official docs or is marked as a rule of thumb | 20, [REFERENCES](../REFERENCES.md) |\n\nWords you don't know: [GLOSSARY](../GLOSSARY.md).\n", "standard/01-layers.md": "# 01 · Layers and methods\n\n> Every observability question lives in a **layer**. Find the layer first, then pick the method.\n> **Alert on the top layers** (symptoms). **Diagnose with the lower layers** (causes).\n> **Delivery** runs alongside all of them: changes are the most common cause of incidents.\n\n## The five layers\n\n| Layer | Question it answers | Method | Example signals | Alert? |\n|---|---|---|---|---|\n| **Business** | Is the business doing well? | Custom KPIs | orders/min, revenue, avg price vs goal, conversion | Yes, to the business owner (ticket/chat) |\n| **User experience** | Can users actually use it? | Synthetic checks + RUM | external uptime, journey success, Apdex, Core Web Vitals | Yes (page if a key journey fails) |\n| **Service / endpoint** | Is my endpoint healthy? | **RED** / **Golden Signals** | req/s, error %, p95/p99 latency, saturation | Yes, SLO burn rate (page) |\n| **Resources** | Is something underneath saturated? | **USE** | CPU throttling, memory vs limit, pool/queue depth, disk | Rarely (only on predicted exhaustion) |\n| **Delivery** (cross-cutting) | Did a change cause this? How fast and safe do we ship? | **DORA** + release markers | deploys, `service.version`, lead time, change failure rate, time to restore | Yes, regression after a deploy (see [12](12-releases-and-dora.md)) |\n\n\u003cdiv data-widget=\"viz\" data-chart=\"layers\">\u003c/div>\n\n## Methods\n\n| Method | Signals | Apply to | Source |\n|---|---|---|---|\n| **RED** | Rate, Errors, Duration | Request-driven things: endpoints, services, gRPC methods | Tom Wilkie, *The RED Method* |\n| **USE** | Utilization, Saturation, Errors | Resources: nodes, pods, connection/thread pools, queues, disks | Brendan Gregg, *The USE Method* |\n| **Golden Signals** | Latency, Traffic, Errors, Saturation | Per-service view (RED + Saturation) | Google SRE Book, ch. 6 |\n| **DORA** | Deployment frequency, Lead time for changes, Change failure rate, Failed deployment recovery time | The delivery process | DORA / *Accelerate* (Forsgren, Humble, Kim) |\n\n## How to use this file to locate a problem\n\n| The symptom sounds like… | Start at layer | Then check |\n|---|---|---|\n| \"Sales dropped\", \"price below goal\" | Business | User experience → Service |\n| \"Users can't log in / checkout\" | User experience | Service (which route?) → Resources |\n| \"Errors / latency went up\" | Service | **Delivery** (was there a deploy?) → Resources |\n| \"Pods restarting\", \"node pressure\" | Resources | Service (are users affected? if not, it's not urgent) |\n| \"It broke after the release\" | Delivery | Service by `service.version` |\n| \"Client X complains, dashboard looks fine\" | Service, **per client** | See [04 · multi-client](04-endpoint-coverage.md#multiple-clients-on-one-service) |\n\n> Official links and verification status: [REFERENCES.md](../REFERENCES.md)\n", "standard/02-maturity-model.md": "# 02 · Maturity model: what good observability looks like\n\n> Score each dimension 0–4 for the current setup, decide the target, and the gap becomes the plan\n> ([framework/transition-plan.md](../framework/transition-plan.md)). Don't aim for 4 everywhere: aim for what the business needs.\n\n## Levels\n\n| Level | Name | In one sentence |\n|---|---|---|\n| 0 | **Blind** | We learn about problems from users |\n| 1 | **Reactive** | We have metrics and many alerts, mostly on causes (CPU, pods) |\n| 2 | **Service-aware** | RED per service, SLOs, symptom alerts with owners and runbooks |\n| 3 | **Correlated** | Metrics ↔ traces ↔ logs linked; releases, clients and owners on every signal |\n| 4 | **Proactive** | SLOs drive decisions; deploys are gated by telemetry; business KPIs watched |\n\n## Scorecard by dimension\n\n| Dimension | 1 · Reactive | 2 · Service-aware | 3 · Correlated | 4 · Proactive |\n|---|---|---|---|---|\n| **Instrumentation** | Infra metrics, some app logs | RED via OTel / semconv on key services | Traces end to end, exemplars, structured logs with `trace_id` | Business events instrumented; auto-instrumentation by default |\n| **Context** | Host / pod labels | `service.name`, env | + `service.version`, `team`, `client.id` | Service catalog drives labels |\n| **Alerting** | Thresholds on causes, many duplicates | SLO burn rate, 2 severities, runbooks | Per-client / per-version, grouped, deploy-aware | Few pages, > 90% actionable, reviewed |\n| **Dashboards** | One per person, no standard | Template per service (RED + SLO) | Drill-down to traces/logs, deploy annotations | Business + technical in one view |\n| **Ownership** | \"Whoever knows\" | Team label on alerts | Routing by team, catalog | Owners review SLOs monthly with business |\n| **Delivery** | Deploys invisible | Deploy annotations | Version dimension, regression alerts | Canary analysis, budget-based freezes, DORA tracked |\n| **Process** | No postmortems | Postmortems for big incidents | Action items tracked, alert reviews | Learnings feed the standard; game days |\n| **Cost / governance** | Unknown | Retention set per signal | Cardinality budgets, sampling | Cost per team visible |\n| **Culture** (Westrum) | Pathological: messengers blamed, information hoarded | Bureaucratic: information follows the rules and channels | Generative leaning: blameless postmortems, failures lead to inquiry | Generative: high cooperation, information flows to who needs it |\n\n### Measuring culture\n\nDORA measures culture with Westrum's survey: people rate statements such as *\"information is actively sought\"*, *\"failures are treated as opportunities to improve\"*, *\"new ideas are welcomed\"* on a 1–7 scale, and the scores are averaged. DORA's research found that a high-trust culture where information flows freely predicts software delivery and organizational performance. Run it anonymously, once per quarter ⚠️.\n\n## How to score fast (per dimension)\n\n| Question | If no → level ≤ |\n|---|---|\n| Can you tell users are failing before they tell you? | 0 |\n| Does every page have an owner and a runbook? | 1 |\n| Is there an SLO for the top 3 user journeys? | 1 |\n| Can you go metric → trace → log for one request in ≤ 3 clicks? | 2 |\n| Can you split errors by version and by client? | 2 |\n| Does a bad deploy get detected (or rolled back) automatically? | 3 |\n\n## Showing the result\n\nA dumbbell per dimension shows where the team moved, and how far it still is from the target:\n\n\u003cdiv data-widget=\"viz\" data-chart=\"maturity-dumbbell\">\u003c/div>\n\n## Output format\n\n```markdown\n| Dimension | Current | Target | Gap (one line) |\n|---|---|---|---|\n| Alerting | 1 | 3 | 240 cause alerts, no SLOs, no grouping |\n```\n\n## Sources\n\n- Google SRE Book & Workbook (SLOs, alerting, postmortems)\n- CNCF TAG Observability, *Observability Whitepaper*\n- DORA research: monitoring & observability capability (dora.dev)\n- *Observability Engineering* (Majors, Fong-Jones, Miranda)\n- [DORA: Generative organizational culture](https://dora.dev/capabilities/generative-organizational-culture/) ✅ 2026-11-20\n\n*(The level names and the scorecard are this guide's own synthesis, not an official model.)*\n\n> Official links and verification status: [REFERENCES.md](../REFERENCES.md)\n", "standard/03-definition-of-done.md": "# 03 · Definition of done: is this endpoint/service monitored?\n\n> Use this table as the **Production Readiness Review (PRR)** checklist before a service goes live or joins on-call\n> ([SRE Workbook, Engagement Model](https://sre.google/workbook/engagement-model/)).\n>\n> A service is well monitored when you can **break it on purpose** and the system tells you\n> **what broke, for whom, which change caused it, and who owns it**, before a client does.\n\n\u003cdiv data-widget=\"checklist\">\u003c/div>\n\n| # | Check | Layer | Standard |\n|---|---|---|---|\n| 1 | RED metrics by `http.route` (histogram, not summary) | Service | [04](04-endpoint-coverage.md) |\n| 2 | Resource attributes: `service.name`, `service.version`, `team`, env | All | [04](04-endpoint-coverage.md) |\n| 3 | SLO document approved (availability + latency) and an error budget policy agreed | Service | [10](10-slos-and-error-budgets.md) |\n| 4 | Burn-rate alerts, per client if multi-tenant, with min-count guard | Service | [11](11-alerting.md) |\n| 5 | Every alert has `team`, `severity`, `runbook_url`, `dashboard_url` | Process | [20](20-ownership-and-communication.md) |\n| 6 | Traces end to end, dependencies as child spans | Traces | [04](04-endpoint-coverage.md) |\n| 7 | Structured logs with `trace_id`: metric → trace → log in ≤ 3 clicks | Logs | [04](04-endpoint-coverage.md) |\n| 8 | Saturation of the resources behind it covered (USE) | Resources | [01](01-layers.md), [08](08-kubernetes-cluster.md) |\n| 9 | Deploy markers on the dashboard + errors splittable by version | Delivery | [12](12-releases-and-dora.md) |\n| 10 | Synthetic check from outside the cluster | UX | [01](01-layers.md) |\n| 11 | At least one business KPI with an owner | Business | [04](04-endpoint-coverage.md) |\n| 12 | **Tested**: failure injected (bad version, killed dependency, latency), the alert fired, the dashboard showed it, the trace found the cause | Validation | – |\n\n> Official links and verification status: [REFERENCES.md](../REFERENCES.md)\n", "standard/04-endpoint-coverage.md": "# 04 · Endpoint coverage (metrics, traces, logs)\n\n> What every endpoint must emit. Based on the OpenTelemetry HTTP semantic conventions,\n> so names are the same in every language.\n\n## Required signals\n\n| Signal | Job | Required |\n|---|---|---|\n| **Metrics** | Detect | `http.server.request.duration` histogram with `http.route`, `http.request.method`, `http.response.status_code`. Saturation: `http.server.active_requests`, pool/queue metrics |\n| **Traces** | Locate | One server span per request; child spans for DB, cache, downstream calls. Tail sampling: keep 100% of errors and slow requests + a small share of the rest. Exemplars on the histogram |\n| **Logs** | Explain | Structured JSON with `trace_id`, `span_id`. Errors and business events, not every 200 OK |\n\n## Required resource attributes (on every signal)\n\n| Attribute | Example | Why |\n|---|---|---|\n| `service.name` | `checkout` | Groups everything by service |\n| `service.version` | `1.42.0` or image tag / git SHA | **Release correlation**, see [12](12-releases-and-dora.md) |\n| `service.namespace` / `team` | `payments` | **Ownership and alert routing**, see [20](20-ownership-and-communication.md) |\n| `deployment.environment.name` | `prod` | Keep test traffic out of prod SLOs |\n| `k8s.*` (via k8sattributes processor) | `k8s.pod.name`, `k8s.deployment.name` | Link to Resources layer |\n\n⚠️ Use `http.route` (`/orders/{id}`), never the raw URL. Never put `user.id` or `order.id` on metrics.\n\n## Business metrics\n\nInfrastructure can't know business rules: the app emits them (or you derive them from span attributes).\n\n\u003cdetails>\n\u003csummary>Open-source variant (PromQL)\u003c/summary>\n\n```promql\n# Average order price over 1h below a goal of 50\nsum(rate(order_value_sum[1h])) / sum(rate(order_value_count[1h])) \u003c 50\n```\n\n\u003c/details>\n\n| Practice | Why |\n|---|---|\n| Histograms for amounts | count + sum (average) + percentiles from one metric |\n| Long windows, compare with last week | Business numbers are noisy minute by minute |\n| Route to a business owner | Usually not a reason to page on-call |\n| Bounded labels only (`client.id`, `category`) | IDs belong in traces/logs |\n\n## Multiple clients on one service\n\n**If you only alert on the total, the big client hides the small ones.** Client C = 2% of traffic, 100% failing → global error rate 2% → nothing fires.\n\n1. Put `client.id` on spans and metrics (middleware from API key/JWT), or derive RED metrics at the gateway:\n\n```yaml\n# Component renamed to span_metrics; the old name spanmetrics still works but is deprecated (README, 2026-11)\nconnectors:\n  spanmetrics:\n    dimensions:\n      - name: http.route\n      - name: client.id\n```\n\n2. Alert on ratios **per client**, with a minimum-count guard ([11 §3](11-alerting.md)).\n3. Policy per client:\n\n| Situation | Approach |\n|---|---|\n| Different contracts | SLO target per client (Gold 99.95%, Standard 99.5%) |\n| Low-traffic client | Longer windows, min-count guard, or synthetic traffic |\n| Client stopped calling | Traffic drop vs last week (`offset 1w`) |\n| Global view | Keep a total SLO for capacity and the platform team |\n", "standard/05-logging-standard.md": "# 05 · Logging standard\n\n> **In 30 seconds:** logs **explain** what metrics detect and traces locate. Every log line is **structured** (one\n> JSON object per line), follows the **OpenTelemetry log data model** (timestamp, severity, body, attributes, resource,\n> trace context), uses **standard field names**, carries **`trace_id` / `span_id`**, and never contains secrets or\n> unmasked personal data. Mask in **layers** (don't log it → logger → collector gateway → Dynatrace OpenPipeline),\n> collect **once** per stream, and give each class of logs the **retention** it needs.\n\n## The log record (OpenTelemetry data model)\n\n| Field | Meaning | Who sets it |\n|---|---|---|\n| `Timestamp` | When the event happened (UTC, ns precision) | Logger |\n| `ObservedTimestamp` | When the collector saw it | Collector |\n| `SeverityText` / `SeverityNumber` | Level as text and as a number (1–24) | Logger / agent parsing |\n| `Body` | The human-readable message | Logger |\n| `Attributes` | Structured fields of **this event** (route, status, client, error) | Logger / code |\n| `Resource` | **Who** sent it: `service.name`, `service.version`, `k8s.*`, env | OTel SDK / collector (`k8sattributes`, gateway), **not** the app code |\n| `TraceId` / `SpanId` | Link to the trace and span | Logger with OTel context / agent parsing |\n| `EventName` | Stable name of the event type (e.g. `order.payment_failed`) | Code (for events you will search or alert on) |\n\n## One line, before and after\n\n```text\n❌ 2026-11-20 14:05:12 ERROR Payment failed for john@example.com card 4111111111111111 order 98123 after 3 retries\n```\n\n```json\n{\n  \"timestamp\": \"2026-11-20T14:05:12.418Z\",\n  \"level\": \"ERROR\",\n  \"message\": \"Payment authorization failed\",\n  \"event.name\": \"checkout.payment_failed\",\n  \"trace_id\": \"4bf92f3577b34da6a3ce929d0e0e4736\",\n  \"span_id\": \"00f067aa0ba902b7\",\n  \"http.route\": \"/api/checkout\",\n  \"client.id\": \"fabrikam\",\n  \"payment.provider\": \"acme-pay\",\n  \"checkout.order_id\": \"98123\",\n  \"checkout.retry_count\": 3,\n  \"error.type\": \"PROVIDER_TIMEOUT\",\n  \"exception.type\": \"System.TimeoutException\",\n  \"exception.message\": \"Provider did not answer within 2000 ms\"\n}\n```\n\nThe second line is searchable (`event.name`, `error.type`), joinable (`trace_id`), groupable (`client.id`), and contains no email or card number. Service, version, pod and cluster are **not** in it: the collectors add them as resource attributes.\n\n## Required and recommended fields\n\n| Field | Level | Rule |\n|---|---|---|\n| `timestamp` | Required | ISO 8601, **UTC**, millisecond precision or better |\n| `level` (→ severity) | Required | One of the levels below |\n| `message` (→ body) | Required | Short, constant wording; variable data goes in attributes |\n| `trace_id`, `span_id` | Required when in a request | Hex, from the OTel context (W3C) |\n| `event.name` | Recommended for business, security and error events | `\u003cdomain>.\u003cevent>` lowercase, e.g. `checkout.payment_failed` |\n| `error.type` | Required on errors | Stable, low-cardinality class (`PROVIDER_TIMEOUT`, `ValidationError`) |\n| `exception.type`, `exception.message`, `exception.stacktrace` | On exceptions | OTel semconv; the stack trace belongs to ERROR/FATAL, not WARN |\n| `http.route`, `http.response.status_code`, `client.id` | When relevant | Same names as metrics and spans ([04](04-endpoint-coverage.md)) |\n| `service.*`, `k8s.*`, `deployment.environment.name` | Never in app code | Added once as resource attributes by the SDK / collectors ([16](16-collector-templates.md)) |\n\n## Naming (nomenclature)\n\n| Rule | Example | Source |\n|---|---|---|\n| Use **OTel semantic convention names** when one exists | `http.route`, `error.type`, `exception.message`, `db.system.name`, `messaging.destination.name` | OTel semconv |\n| Lowercase, dot-separated namespaces, `snake_case` inside a part | `checkout.retry_count` | OTel naming rules |\n| Custom fields: prefix with the **application or domain name**, never an existing semconv namespace and never `otel.` | `checkout.order_id`, not `http.order_id` | OTel naming rules |\n| Same concept, same name, in logs, spans and metrics | `client.id` everywhere | This standard |\n| Constant `message`, variable data in attributes | `\"Payment authorization failed\"` + `error.type` | Searchability |\n| No units or types in names; put units in the value or the name's meaning | `duration_ms` only if the logger can't carry units; prefer `duration` in seconds | OTel naming (metrics) ⚠️ |\n\n## Severity levels\n\n| Level | SeverityNumber | Use for | Production |\n|---|---|---|---|\n| TRACE | 1–4 | Step-by-step internals | Off |\n| DEBUG | 5–8 | Diagnostic detail for developers | Off, or sampled / time-boxed |\n| INFO | 9–12 | Lifecycle and business events (`order.created`, startup, config loaded) | On |\n| WARN | 13–16 | Something unexpected, **handled** (retry succeeded, fallback used) | On |\n| ERROR | 17–20 | The operation **failed**: a request, a message, a job | On |\n| FATAL | 21–24 | The process cannot continue | On |\n\nOTel: ERROR (17) and above mean an erroneous situation; unhandled exceptions that don't stop the app are ERROR, ones that shut it down are FATAL. A log level is **not an alert**: alerts come from SLOs and counts ([11](11-alerting.md)).\n\n## What to log, and what never to log\n\n| Log | Don't log |\n|---|---|\n| Errors with context (what failed, for whom, why) | Every successful request (metrics and spans cover it) |\n| Business events (order placed, payment failed, refund) | Secrets: passwords, tokens, API keys, connection strings, JWTs |\n| State changes (config loaded, feature flag flipped, circuit opened) | Full card numbers (PCI), CVV, bank accounts |\n| Security events (login failed, permission denied) → also to the audit trail | Personal data in clear text (email, phone, name, address, national IDs) |\n| Retries and fallbacks (WARN) | Whole request/response bodies, file contents, large payloads |\n| Startup / shutdown with version | Stack traces at WARN or INFO; the same error once per loop iteration |\n\n## Masking in layers\n\n\u003cdiv data-widget=\"viz\" data-chart=\"log-masking\">\u003c/div>\n\n| Layer | How | Catches |\n|---|---|---|\n| **1. Don't log it** | Code review, structured logging (log fields, not objects), allow-lists of fields | Most leaks: the cheapest fix |\n| **2. Logger redaction** | Redaction / destructuring policies in the logging library (e.g. classify fields as personal and redact or hash them) | Known sensitive fields in your own code |\n| **3. Collector gateway** | `transform/redact`: credentials in key=value pairs, Bearer/Basic, JWTs, emails, card numbers, URL query values ([collector/gateway.yaml](../collector/)) | Library and third-party logs you don't control; one rule set for all services |\n| **4. Dynatrace OpenPipeline** | Masking processor in the Processing stage, before storage in Grail; works for all ingest channels | A central safety net for anything that slipped through |\n| **5. Storage** | Bucket per log class with retention and access rights; audit logs separate | Limits exposure of what remains |\n\nDynatrace recommends combining masking **at capture** and **at ingest** (two layers). Lab evidence: before gateway masking, auto-instrumentation sent a database username in **40,892** spans to Dynatrace; the gateway rules fixed it for every backend at once, proven by an end-to-end redaction test.\n\n**Pseudonymize instead of deleting** when you need to correlate: a salted hash of a user ID lets you count \"affected users\" and follow one session without storing who it is ⚠️ (check your privacy/legal rules).\n\n## Collection\n\n| Rule | Why |\n|---|---|\n| Containers write to **stdout/stderr**; the OTel agent reads `/var/log/pods` with `filelog` and parses JSON ([16](16-collector-templates.md)) | No log files or sidecars per app |\n| Or the app sends OTLP logs through an OTel log bridge/appender | Trace context attached automatically |\n| **One path per stream** (file collection *or* OTLP *or* OneAgent log module) | Two paths = duplicates and double cost |\n| Multiline stack traces: emit them **inside** the JSON (`exception.stacktrace`), not as separate lines | Line-based collectors split them otherwise |\n| Persistent queue + checkpoints on the agent | Lab: 0 log lines lost during a 10-min backend outage (83% lost with defaults) |\n| Don't log the collector's own logs through the same pipeline | Feedback loops |\n\n## Volume, retention and cost\n\n| Log class | Retention ⚠️ | Dynatrace |\n|---|---|---|\n| Application logs (debugging) | 14–35 days | Default log bucket (35 days) or a custom bucket |\n| Audit / security logs | Per compliance (often 1+ year) | Custom bucket with long retention and restricted access |\n| Debug / verbose (when enabled) | 3–7 days | Short-retention bucket |\n| Health checks, probe noise | Drop at the gateway | – |\n\nGrail stores logs in **buckets** with their own retention (custom buckets from 1 day to ~10 years; default log bucket 35 days), assigned by rules or OpenPipeline. Logs are billed per GiB ingested, retained and queried ([17](17-dynatrace-integration.md#cost-what-drives-the-bill-dps)). Biggest levers: don't log successes, keep DEBUG off, drop noise at the gateway, route each class to the right bucket.\n\n## Correlation\n\n| Link | How |\n|---|---|\n| Log → trace | `trace_id` / `span_id` on the record. With OTLP ingest, Dynatrace maps them to `trace_id` / `span_id` fields; the UI links logs and traces |\n| Trace → logs | Logs view filtered by the trace ID |\n| Logs ↔ service, version, team | Same resource attributes as spans and metrics ([04](04-endpoint-coverage.md)) |\n| Mixed OneAgent + OTel | IDs from the OTel API differ from OneAgent's: keep one tracing agent per service ([17](17-dynatrace-integration.md)) |\n\n## Log-based alerts\n\nAlerts need numbers, so turn the log query into a time series first.\n\n```text\n// Dynatrace (DQL shape): provider timeouts in payment logs, per provider\nfetch logs\n| filter service.name == \"payments\" and error.type == \"PROVIDER_TIMEOUT\"\n| makeTimeseries timeouts = count(), by:{ payment.provider }, interval:5m\n// Custom alert: timeouts > 20 for 5 min → ticket to payments\n```\n\n| Practice | Why |\n|---|---|\n| Alert on `event.name` / `error.type`, not on free text | Wording changes; fields don't |\n| If a log alert fires often and matters, emit a **metric** instead | Cheaper and faster |\n| Absence: alert when a service **stops logging** (count == 0 for 10 min) | A silent service is often a dead one |\n\n\u003cdetails>\n\u003csummary>Open-source variant (Loki ruler)\u003c/summary>\n\n```yaml\ngroups:\n  - name: payments-logs\n    rules:\n      - alert: PaymentProviderTimeouts\n        expr: sum by (provider) (count_over_time({service_name=\"payments\"} | json | error_type=\"PROVIDER_TIMEOUT\" [5m])) > 20\n        for: 5m\n        labels: { severity: ticket, team: payments }\n```\n\n\u003c/details>\n\n## Checklist (per service)\n\n| # | Check |\n|---|---|\n| 1 | JSON, one object per line, to stdout |\n| 2 | Required fields present: timestamp (UTC), level, message, `trace_id`/`span_id` in requests, `error.type` on errors |\n| 3 | Field names follow OTel semconv; custom fields prefixed with the app/domain |\n| 4 | DEBUG off in production; no logging of successful requests |\n| 5 | No secrets or clear-text personal data (redaction test passes) |\n| 6 | One collection path; no duplicates in Dynatrace |\n| 7 | Correct bucket / retention for each log class |\n| 8 | Key events (`event.name`) defined for business and security flows |\n\n## Sources\n\n- [OTel: Logs data model](https://opentelemetry.io/docs/specs/otel/logs/data-model/) (fields, SeverityNumber ranges, ERROR ≥ 17) · [Logs concepts](https://opentelemetry.io/docs/concepts/signals/logs/) ✅ 2026-11-20\n- [OTel semconv: Exceptions in logs](https://opentelemetry.io/docs/specs/semconv/exceptions/exceptions-logs/) · [Naming](https://opentelemetry.io/docs/specs/semconv/general/naming/) (lowercase, namespaces, custom prefixes, `otel.` reserved) ✅ 2026-11-20\n- [Dynatrace: Mask sensitive data in logs](https://docs.dynatrace.com/docs/analyze-explore-automate/logs/lma-use-cases/methods-of-masking-sensitive-data) · [Log processing with OpenPipeline](https://docs.dynatrace.com/docs/analyze-explore-automate/logs/lma-log-processing/lma-openpipeline) · [Mask with the OTel Collector](https://docs.dynatrace.com/docs/ingest-from/opentelemetry/collector-use-cases/redact) ✅ 2026-11-20\n- [Dynatrace: Log storage and retention (buckets)](https://docs.dynatrace.com/docs/analyze-explore-automate/logs/lma-bucket-assignment) · [Optimize log retention](https://docs.dynatrace.com/docs/analyze-explore-automate/logs/lma-use-cases/optimize-log-retention) ✅ 2026-11-20\n- [Dynatrace: Connect log data to traces](https://docs.dynatrace.com/docs/analyze-explore-automate/logs/lma-log-enrichment) · [Ingest OTLP logs](https://docs.dynatrace.com/docs/ingest-from/opentelemetry/otlp-api/ingest-logs) ✅ 2026-11-20\n- Lab: redaction test and log-loss results (`~/projects/aks-observability/results/`) ✅ measured\n- Retention per class, pseudonymization advice: rules of thumb ⚠️ (check your compliance requirements)\n", "standard/06-workload-types.md": "# 06 · Workload types: queues, batch jobs, external dependencies\n\n> RED fits request/response services. Other workloads need different signals: for a queue, \"how far behind\";\n> for a batch job, \"did it succeed recently\"; for a third-party API, \"how is *it* treating us\".\n\n## Pick the model\n\n| Workload | Key question | Core signals | Alert type |\n|---|---|---|---|\n| Request/response API | Are requests served correctly and fast? | RED ([04](04-endpoint-coverage.md)) | SLO burn rate |\n| **Queue consumer** (Kafka, RabbitMQ, SQS) | Are we keeping up? | Lag, age of oldest message, processing errors, processing duration | Lag/age over threshold, DLQ count |\n| **Batch / cron job** | Did it run, succeed, and finish in time? | Last success timestamp, duration, failures | \"No success in 2 intervals\", count of failures |\n| **External dependency** (payment provider, SaaS API) | Is the provider failing us? | Client-side RED by `server.address`, timeouts, circuit-breaker state | Ratio + min count; synthetic checks |\n| **Data pipeline** | Is the data fresh and correct? | Freshness (data age), row counts, validation failures | Freshness SLO |\n\n## Queues and async processing\n\n### The queue model: why a backlog grows\n\n\u003cdiv data-widget=\"viz\" data-chart=\"queue-flow\">\u003c/div>\n\n| Quantity | Meaning |\n|---|---|\n| **Arrival rate** (λ) | Messages produced per second |\n| **Processing rate** (μ) | Messages the consumers finish per second (consumers × rate per consumer) |\n| **Backlog** (L) | Messages waiting. Grows whenever λ > μ, by (λ − μ) per second |\n| **Wait time** (W) | How late the work is |\n\n**Little's law:** in steady state, L = λ × W, so **W ≈ backlog / processing rate**. 60,000 waiting messages at 500 msg/s processed = 2 minutes late. That is why **oldest-message age** (or end-to-end delay) is the SLI users feel, and lag in messages is only its cause: the same lag means seconds at peak throughput and hours when consumers are slow.\n\n### Signals\n\n| Signal | Source | Why |\n|---|---|---|\n| Arrival rate | Producer spans / `messaging.client.sent.messages`, broker metrics | Demand |\n| Processing rate | `messaging.client.consumed.messages`, `messaging.process.duration` (OTel semconv, development) | Supply |\n| **Oldest message age** / end-to-end delay | Broker metric (e.g. SQS age of oldest message), or now − produce timestamp on the consumer span | **The SLI** |\n| Backlog / lag | Broker or kafka-exporter (`kafka_consumergroup_lag`), **per partition** | Cause; capacity planning |\n| Processing errors and retries | Consumer spans with `error.type`, retry counter | Poison messages, flaky dependencies |\n| Dead-letter queue | DLQ depth / messages added | Every DLQ message is a failed promise → **count alert** |\n| Consumer utilization | Busy time / total, consumers vs max | At max = capacity limit ([13](13-capacity-and-saturation.md)) |\n\n### Problems you only find per partition, per group, per message\n\n| Problem | Symptom | Measure |\n|---|---|---|\n| **Partition skew** (Kafka) | Total lag looks fine; one partition stuck or hot | Lag and age **per partition**; consumers per partition |\n| More consumers than partitions | Extra consumers sit idle | Max useful consumers = partitions |\n| **Poison message** | Same message fails again and again, blocks a partition | Retries per message, DLQ growth |\n| **Retry storm** | Retries multiply load during an incident | Retry rate vs arrival rate; exponential backoff with jitter ([09](09-internal-services.md#protect-callers-from-slow-dependencies)) |\n| Rebalancing loops | Throughput drops to 0 repeatedly | Consumer group rebalances per hour |\n\n### Alerts ⚠️\n\n| Alert | Condition | Severity |\n|---|---|---|\n| Queue SLO burn | Oldest-message-age SLO burning fast ([10](10-slos-and-error-budgets.md)) | Page (tier 1) |\n| Backlog growing at max consumers | Autoscaler at max AND backlog grew for 15 min | Page / ticket |\n| DLQ received messages | Count > 0 | Ticket (page if money) |\n| Consumer group stopped | Processing rate = 0 while arrival > 0 for 5 min | Page |\n\n```text\n// DQL shape: processing rate vs arrival rate for one queue (consumer and producer spans)\nfetch spans\n| filter messaging.destination.name == \"orders\"\n| makeTimeseries { produced = countIf(span.kind == \"producer\"), consumed = countIf(span.kind == \"consumer\") }, interval:1m\n| fieldsAdd net_growth = produced[] - consumed[]\n```\n\n### Autoscaling consumers\n\nKEDA scales consumers on lag or queue length (Kafka, RabbitMQ, SQS, …). Set the maximum to the number of partitions, alert when it is at max while age grows, and check what `lagThreshold` means in your KEDA version (total vs average lag differs between versions).\n\n\u003cdetails>\n\u003csummary>Open-source variant (PromQL)\u003c/summary>\n\n```promql\n# Lag growing for 15 minutes (consumers not keeping up)\nsum by (consumergroup, topic) (kafka_consumergroup_lag) > 10000\nand\nderiv(sum by (consumergroup, topic) (kafka_consumergroup_lag)[15m:1m]) > 0\n```\n\n\u003c/details>\n\n### Traces across the queue\n\nPropagate trace context in message headers. The consumer span **links** to the producer span (OTel messaging conventions), so one order stays one trace from the API through the queue to the worker. Lab finding: an experimental .NET instrumentation broke this continuity; test it after every agent upgrade ([15](15-opentelemetry-practices.md)).\n\n## Batch and cron jobs\n\n| Signal | How |\n|---|---|\n| Last success time | Job pushes `job_last_success_timestamp_seconds` at the end (Pushgateway for **service-level** jobs; node-exporter textfile collector for machine-level jobs) |\n| Kubernetes Jobs | kube-state-metrics: `kube_job_status_failed`, `kube_job_status_succeeded`, `kube_cronjob_status_last_successful_time` |\n| Duration | `job_duration_seconds` pushed at the end, or Job start/completion times |\n\n\u003cdetails>\n\u003csummary>Open-source variant (PromQL)\u003c/summary>\n\n```promql\n# Nightly job (runs every 24h) hasn't succeeded in 2 intervals → alert\ntime() - job_last_success_timestamp_seconds{job=\"nightly-billing\"} > 2 * 86400\n\n# Kubernetes CronJob: last success too old\ntime() - kube_cronjob_status_last_successful_time{cronjob=\"nightly-billing\"} > 2 * 86400\n\n# Any failed Job (count alert)\nkube_job_status_failed{namespace=\"batch\"} > 0\n```\n\n\u003c/details>\n\nPrometheus guidance: alert when a batch job **hasn't succeeded recently enough**, with a threshold of at least two full run intervals. Jobs that run more often than about every 15 minutes should become long-running services.\n\n## Data pipelines (freshness, coverage, correctness)\n\n| SLI | Definition (SRE Workbook) | Example SLO ⚠️ |\n|---|---|---|\n| **Freshness** | % of data processed within a time bound, or age of the newest complete data, or time since the last successful run | 99% of orders visible in reporting within 30 min |\n| **Coverage** | Batch: % of runs that processed (at least) the expected amount of data. Streaming: % of records processed within a window | 99% of nightly runs cover 100% of the day's partitions |\n| **Correctness** | % of output that is right, checked **independently** of the pipeline's own logic, e.g. with **golden data** (test records with known expected results) | 99.99% of golden records correct |\n\n| Practice | Why |\n|---|---|\n| Measure **end to end** (source → final table), not only per stage | Data can be lost *between* stages (a dropped field, a skipped partition) |\n| Inject golden / canary records and check them at the end | Correctness without knowing every real answer |\n| Alert on freshness SLO burn and on \"no successful run in 2 intervals\" | Late data is the most common pipeline failure |\n| Row counts vs the same period last week | Silent partial loads |\n\n## External dependencies\n\nYou don't own the provider, but you own your experience of it.\n\n| Signal | Example | Why |\n|---|---|---|\n| Client-side RED | `http.client.request.duration` by `server.address` | Their errors and latency, seen from your side |\n| Timeouts / retries | `error.type=\"timeout\"`, retry counters | Hidden latency and load amplification |\n| Circuit breaker state | `circuit_breaker_state{dependency=\"payments-api\"}` | Shows when you're failing fast on purpose |\n| Synthetic check | Blackbox exporter / k6 against the provider's health or sandbox | Detects outages even with no traffic |\n\n\u003cdetails>\n\u003csummary>Open-source variant (PromQL)\u003c/summary>\n\n```promql\n# Provider error ratio from our side, with a minimum-count guard\n(\n  sum by (server_address) (rate(http_client_request_duration_seconds_count{server_address=\"api.payments.example\", http_response_status_code=~\"5..|429\"}[10m]))\n  /\n  sum by (server_address) (rate(http_client_request_duration_seconds_count{server_address=\"api.payments.example\"}[10m]))\n  > 0.05\n)\nand\nsum by (server_address) (increase(http_client_request_duration_seconds_count{server_address=\"api.payments.example\", http_response_status_code=~\"5..|429\"}[10m])) > 20\n```\n\n\u003c/details>\n\n| Practice | Why |\n|---|---|\n| Route provider alerts to the **owning team**, with the provider's status page in the runbook | You can't fix it, but you must communicate and mitigate |\n| Track the provider's SLA vs what you measure | Evidence for service credits and vendor reviews |\n| Separate \"they're down\" from \"we're calling wrong\" (4xx vs 5xx) | Different owners |\n\n## Sources\n\n- [OTel semconv: messaging metrics](https://opentelemetry.io/docs/specs/semconv/messaging/messaging-metrics/): `messaging.client.consumed.messages`, `messaging.process.duration` (development stage) ✅ 2026-11-20\n- [OTel semconv: messaging spans](https://opentelemetry.io/docs/specs/semconv/messaging/messaging-spans/): links between producer and consumer 📚\n- [Prometheus: When to use the Pushgateway](https://prometheus.io/docs/practices/pushing/): service-level batch jobs only; textfile collector for machine-level ✅ 2026-11-20\n- [Prometheus: Alerting practices](https://prometheus.io/docs/practices/alerting/): batch jobs, \"not succeeded recently enough\", 2 intervals ✅ 2026-11-20\n- [OTel semconv: HTTP client metrics](https://opentelemetry.io/docs/specs/semconv/http/http-metrics/) 📚\n- [kube-state-metrics: Job and CronJob metrics](https://github.com/kubernetes/kube-state-metrics/tree/main/docs/metrics/workload) 📚\n", "standard/07-frontend-experience.md": "# 07 · Frontend and user experience\n\n> Backend metrics say the API answered in 120 ms. The user may still have waited 4 s for the page.\n> Measure **what the user's browser experienced** (real user monitoring), **whether key journeys work when nobody\n> is using them** (synthetic monitoring), and **link both to backend traces**.\n\n## How it fits together\n\n\u003cdiv data-widget=\"viz\" data-chart=\"frontend-flow\">\u003c/div>\n\n| Method | Answers | Tool (Dynatrace backend) | Open-source alternative |\n|---|---|---|---|\n| **Real User Monitoring (RUM)** | What did real users experience, on which browser, country, page? | Dynatrace RUM JavaScript | Grafana Faro, OTel browser SDK (experimental) |\n| **Synthetic monitoring** | Does login/checkout work right now, from outside, even at 3 a.m.? | Dynatrace synthetic monitors (browser clickpaths, HTTP) | k6, blackbox exporter, OTel `httpcheck` (internal only) |\n| **Frontend → backend link** | Which backend call made this page slow? | W3C trace context from RUM to the OTel-instrumented backend | Faro + OTel traces |\n\nOpenTelemetry has **no stable RUM specification** yet, and the browser SDK is **experimental**. If you send frontend data through plain OTel SDKs into Dynatrace, you lose RUM features (sessions, user actions, Core Web Vitals scoring, session replay). Dynatrace's recommended setup is **RUM JavaScript in the frontend + OpenTelemetry in the backend**, linked by W3C trace context.\n\n## What to measure\n\n### Core Web Vitals (Google's user-experience metrics)\n\n| Metric | Measures | Good | Needs improvement | Poor |\n|---|---|---|---|---|\n| **LCP** (Largest Contentful Paint) | Loading: when the main content appeared | ≤ 2.5 s | 2.5–4.0 s | > 4.0 s |\n| **INP** (Interaction to Next Paint) | Responsiveness: delay after a click or key press | ≤ 200 ms | 200–500 ms | > 500 ms |\n| **CLS** (Cumulative Layout Shift) | Visual stability: content jumping around | ≤ 0.1 | 0.1–0.25 | > 0.25 |\n\nJudge each at the **75th percentile of real page visits** (3 of 4 visits must be \"good\"). INP replaced FID; tools that still show FID are outdated.\n\n### Beyond Web Vitals\n\n| Signal | Why | Typical SLI |\n|---|---|---|\n| JavaScript errors per session | Broken UI that the backend never sees | % of sessions without errors |\n| Failed XHR/fetch calls (by endpoint) | Backend errors as the user saw them, incl. CORS and timeouts | % of successful requests from the browser |\n| User action duration (click → done) | The real \"it's slow\" | % of key actions \u003c 2 s |\n| Journey / funnel completion | Business impact (login → cart → pay) | conversion rate per step |\n| Apdex | One satisfaction score per app | Apdex ≥ 0.9 ⚠️ |\n| Segment: browser, device, country, release | Problems hidden in averages | per-segment p75 |\n\n### Frontend SLOs (examples ⚠️)\n\n| SLO | Target |\n|---|---|\n| LCP ≤ 2.5 s for the checkout page | 75% of visits (Google's threshold), tighten to 90% if you can |\n| Key user action \"Pay\" completes without error | 99.5% over 28 days |\n| Synthetic checkout journey succeeds | 99.9% of runs, from 3 locations |\n\nAlert on SLO burn, not on single slow page views ([11](11-alerting.md), [10](10-slos-and-error-budgets.md)).\n\n## Synthetic monitoring\n\n| Rule | Why |\n|---|---|\n| Script the **business journeys** (login, search, checkout), not only the home page | The home page is rarely what breaks |\n| Run from **several locations** and alert when ≥ 2 fail ⚠️ | One location failing is often the location's network |\n| Use **dedicated test accounts** and mark synthetic traffic (header / user agent) | Filter it out of real-user SLOs and business KPIs |\n| Internal endpoints: OTel `httpcheck` in the cluster collector ([collector/cluster.yaml](../collector/)) | Cheap availability check for services without public UI |\n| Low-traffic apps: synthetics are the only reliable SLI at night | Real traffic is too thin for ratios ([11 §3](11-alerting.md)) |\n\n## Privacy and cost\n\n| Topic | Practice |\n|---|---|\n| Personal data | Mask user input, IP addresses and URLs with IDs; session replay masked by default |\n| Consent | Respect the cookie/consent banner (opt-in mode in the RUM agent) |\n| Cost | RUM is billed per session (session replay costs more); sample sessions for high-traffic sites |\n| Sampling | Keep 100% of sessions with errors if your tool allows it |\n\n## Sources\n\n- [web.dev: Web Vitals](https://web.dev/articles/vitals) · [How the thresholds were defined](https://web.dev/articles/defining-core-web-vitals-thresholds) · [INP](https://web.dev/articles/inp): LCP/INP/CLS thresholds, 75th percentile ✅ 2026-11-20\n- [Dynatrace: OpenTelemetry and Dynatrace](https://docs.dynatrace.com/docs/ingest-from/opentelemetry): no stable OTel RUM spec; RUM JS + OTel backend linked by W3C trace context ✅ 2026-11-20\n- [Dynatrace: Real User Monitoring](https://docs.dynatrace.com/docs/observe/digital-experience/rum) · [Experience Vitals](https://docs.dynatrace.com/docs/obse
