"><\/div>\n\n| Level | Criteria (any one is enough) ⚠️ | Examples |\n|---|---|---|\n| **SEV1 · Critical** | Tier-1 journey down or unusable for most users · data loss or a security breach exposing customer data · SLA breach in progress for a key client | Checkout returns errors for > 50% of requests; customer data exposed |\n| **SEV2 · Major** | Tier-1 journey degraded for many users, or down for one important client · tier-2 service down with user impact · fast error-budget burn on a tier-1 SLO | Fabrikam (SLA client) can't pay; p99 latency 5× for 30 min |\n| **SEV3 · Minor** | Partial loss of functionality for a minority of users · tier-2/3 degradation with a workaround · issue that becomes SEV2 if ignored | One region slow; batch job late but within the business deadline |\n| **SEV4 · Low** | No current user impact · cosmetic or internal issue · risk to address in working hours | Disk forecast full in 10 days; a non-critical alert misbehaving |\n\nMake the criteria **measurable** in your own version (e.g. % of users or requests affected, which journeys, which clients). Google's rule of thumb for declaring an incident at all: a **second team** is needed, the problem is **visible to customers**, or it is **unsolved after an hour** of focused work.\n\n### Incident severity: actions\n\n| | SEV1 | SEV2 | SEV3 | SEV4 |\n|---|---|---|---|---|\n| **Notification** | Page on-call + Incident Commander + team lead | Page on-call + IC | Page the owning team (high urgency in hours, ticket out of hours if no user impact) | Ticket |\n| **Acknowledge within** ⚠️ | 5 min | 5 min | 30 min | Next working day |\n| **Roles** | IC, Ops lead, Comms lead (separate people) | IC + Ops (IC may handle comms) | Owner on-call | Owner |\n| **Incident channel / doc** | Yes, immediately | Yes | Optional | No |\n| **Internal updates** ⚠️ | Every 30 min | Every 60 min | At resolution | – |\n| **External / client comms** | Status page + affected clients within 30 min | Affected clients | Only if asked | – |\n| **Leadership** | Informed immediately | Informed | – | – |\n| **Change freeze** | Yes, for affected services | Yes, for affected services | No | No |\n| **Postmortem** | **Required** (blameless), within 5 working days | **Required** | Optional (required if it repeats) | No |\n| **Error budget** | Counts; triggers the policy if > 20% used ([10](#standard-10-slos-and-error-budgets)) | Counts | Counts | – |\n\n### Rules\n\n| Rule | Why |\n|---|---|\n| **When unsure, pick the higher level**; lower it later | Under-reacting costs more than over-reacting |\n| **Don't debate severity on the incident call**; settle it in the postmortem | Time goes to mitigation |\n| Severity can go **up or down** during the incident; announce every change | The response must match the current impact |\n| Severity is about **impact**, not about how hard the fix is | A one-line fix to a full outage is still SEV1 |\n| Mitigate first (rollback, failover, feature flag), find the root cause later | Users first |\n| Only the Ops lead changes production during SEV1/SEV2 | No conflicting changes |\n\n### In Dynatrace\n\n| Concept | Dynatrace |\n|---|---|\n| Severity of events and problems | Standardized event severity: **1 Critical · 2 Major · 3 Minor · 4 Warning · 5 Informational**; a problem takes the highest severity of its events |\n| Category of the problem | Availability, Error, Slowdown, Resource contention, Custom alert, Monitoring unavailable |\n| Map to SEV and route | A **Workflow** on the problem trigger reads severity, category and the service's `tier` / `team`, sets the SEV, and notifies accordingly (SEV1/2 page the IC and the team; SEV3 pages the team; SEV4 opens a ticket). Routing workflows are generated per team ([dynatrace/](#dynatrace-readme)) |\n| Custom alerts | Set the event severity in the alert's event template, consistent with the tier (e.g. tier-1 SLO fast burn → Critical/Major) |\n\n## Communication flows\n\n### 1. Incident flow\n\n```text\nAlert fires → routed by team label → on-call acknowledges (≤ 5 min for pages)\n  → incident channel opened (#inc-YYYYMMDD-checkout) → roles: Incident Commander, Ops, Comms\n  → status updates every 30 min (internal) / per SLA (clients)\n  → resolved → postmortem in ≤ 5 working days (blameless)\n  → action items with owners → tracked until closed → standard/playbook updated\n```\n\n| Role | Does |\n|---|---|\n| Incident Commander | Coordinates, decides, keeps the timeline |\n| Ops lead | Investigates and fixes |\n| Comms | Status page, client and stakeholder updates |\n\n### 2. Change flow (deploys)\n\n| Step | Communication |\n|---|---|\n| Deploy starts / ends | Automatic message + Grafana annotation (who, what version, PR link) |\n| Regression detected | Alert with `suspect: deploy` to the deploying team |\n| Rollback | Message in the deploy channel + annotation |\n| Error budget exhausted | Notice to team + manager: freeze non-critical changes |\n\n### 3. Standard-change flow (changing alerts, dashboards, SLOs)\n\n| Step | How |\n|---|---|\n| Propose | Pull request to the alert rules / this guide |\n| Review | Service owner + SRE review against [11-alerting](#standard-11-alerting) |\n| Shadow | New or changed alerts go to a non-paging receiver for 1–2 weeks |\n| Announce | Short note in the team channel: what changed, why, what to expect |\n| Changelog | Every change recorded with date and reason |\n\n### 4. Recurring rituals\n\n| Ritual | Cadence | Who | Output |\n|---|---|---|---|\n| On-call handover | Each rotation | Outgoing + incoming on-call | Open issues, noisy alerts list |\n| Alert review | Weekly / bi-weekly | Team + SRE | Delete, tune or fix noisy alerts |\n| SLO review | Monthly | Team, manager, business owner | Budget status, targets, priorities |\n| Observability health report | Quarterly | SRE → leadership | Maturity score, KPIs, roadmap |\n\n## Sources\n\n- Google SRE Book, ch. 14 *Managing Incidents*, ch. 15 *Postmortem Culture*\n- PagerDuty Incident Response docs (roles, IC)\n- [PagerDuty: Severity levels](https://response.pagerduty.com/before/severity_levels/) · [Atlassian: Incident severity levels](https://www.atlassian.com/incident-management/kpis/severity-levels) · [Atlassian incident handbook (postmortems for SEV1/2)](https://www.atlassian.com/incident-management/handbook/incident-response) ✅ 2026-11-20\n- [Google SRE Book: Managing incidents (when to declare)](https://sre.google/sre-book/managing-incidents/) · [Workbook: Incident response (IC, CL, OL)](https://sre.google/workbook/incident-response/) ✅ 2026-11-20\n- [Dynatrace: Standardized event severity](https://docs.dynatrace.com/docs/analyze-explore-automate/alerting-and-notifications/standardized-event-severity) · [Categories of Davis events](https://docs.dynatrace.com/docs/discover-dynatrace/platform/davis-ai/root-cause-analysis/concepts/events/event-types) ✅ 2026-11-20\n- SEV criteria thresholds, acknowledgement times, update cadences: rules of thumb ⚠️\n- Backstage software catalog\n- Prometheus Alertmanager routing docs\n\n> Official links and verification status: [REFERENCES.md](#references)\n"}, {"group": "6 · People & process", "path": "standard/21-incident-response-and-on-call.md", "slug": "standard-21-incident-response-and-on-call", "title": "21 · Incident response, runbooks, postmortems and on-call", "md": "# 21 · Incident response, runbooks, postmortems and on-call\n\n> **In 30 seconds:** the loop is **alert → runbook → incident → postmortem → better alert and runbook**. Every page\n> links to a **runbook** with first checks and safe mitigations; incidents follow the severity rules ([20](#standard-20-ownership-and-communication--severity-levels-and-actions));\n> every SEV1/SEV2 gets a **blameless postmortem** with tracked actions; and **on-call** is designed so people can do it\n> for years: ≤ 2 incidents per shift, clean handovers, clear escalation, practice before the real thing.\n\n## The incident loop\n\n<div data-widget=\"viz\" data-chart=\"incident-lifecycle\"><\/div>\n\n| Phase | Ends when | Metric ([23](#standard-23-measuring-effectiveness)) |\n|---|---|---|\n| Detect | An alert fires (or a customer reports) | Time to detect (MTTD); % detected by monitoring |\n| Acknowledge | A human owns it | Time to acknowledge (MTTA) |\n| Mitigate | Users are no longer affected (rollback, failover, flag off) | Time to mitigate |\n| Resolve | The system is back to normal and stable | Time to restore/resolve (define which \"R\" you use) |\n| Learn | Postmortem done, actions tracked | % actions closed on time; repeat incidents |\n\n## Runbooks\n\nThe SRE book reports about a **3× better MTTR** when responders follow a playbook written in advance instead of \"winging it\". Every alert that pages has one.\n\n| Section | Contents |\n|---|---|\n| **What this alert means** | The symptom in user terms, the SLO or threshold, why it pages |\n| **Impact** | Who is affected, how to see how many (dashboard link with variables filled) |\n| **First checks (5 min)** | 3–5 concrete checks in order: recent deployment? one client or all? dependencies? saturation? |\n| **Mitigations** | Safe actions, most reversible first: roll back, scale out, disable a feature flag, fail over, shed load. Exact commands or buttons |\n| **Escalation** | When and whom: second line, owning team of a dependency, Incident Commander (SEV rules) |\n| **Verify** | How to confirm it's fixed (which tile turns green) |\n| **Background** | Architecture notes, known issues, links to past postmortems |\n\n| Runbook rule | Why |\n|---|---|\n| Written for someone tired at 3 a.m. who doesn't know this service | That's who reads it |\n| Commands copy-pasteable, with the namespace/service filled in | No mistakes under stress |\n| Owned by the service team; reviewed when the alert fires (update it right after) | Runbooks rot otherwise; the SRE workbook asks on-call to update the playbook when its page fires |\n| One runbook per alert, linked from the alert itself (`runbook` property) | One click from the page |\n| Automate the steps you repeat every time (Workflows, scripts) | Toil reduction ([23](#standard-23-measuring-effectiveness--toil)) |\n\nTemplate: [framework/runbook-template.md](#framework-runbook-template).\n\n## Postmortems\n\n| Rule | Why |\n|---|---|\n| **Required** for SEV1 and SEV2, a single incident using > 20% of the error budget, and any repeat incident | Learning, not blame ([10](#standard-10-slos-and-error-budgets)) |\n| **Blameless**: describe systems and decisions, not people's mistakes | People must feel safe to tell the truth |\n| Draft within **5 working days**, reviewed with the people involved | Memory fades fast |\n| Timeline from data: problem events, deployment events, chat, traces | Facts, not recollection |\n| **Contributing factors**, not one \"root cause\" | Incidents have several causes |\n| Every action has an **owner, priority and due date**, tracked in the backlog | Untracked actions never happen |\n| Monthly review of open actions; share learnings widely | Close the loop |\n| Update the guide: playbook status, runbook, alert, dashboard | The standard improves from real incidents |\n\nTemplate: [framework/postmortem-template.md](#framework-postmortem-template).\n\n## On-call\n\n| Practice | Rule ⚠️ | Source |\n|---|---|---|\n| **Load** | ≤ 2 incidents per 12-hour shift; median close to 0 | SRE book / workbook |\n| **Rotation size** | At least 6–8 people per rotation (or two time zones) so nobody is on call more than ~1 week in 6–8 | SRE book (≥ 8 single-site, 6 per site multi-site) |\n| **Escalation** | Primary → secondary (5–10 min) → team lead / Incident Commander | – |\n| **Handover** | At every shift change: open incidents, noisy alerts, ongoing changes, things to watch | SRE workbook |\n| **After a rough night** | Time off the next morning; follow-up work moves to the next shift | Sustainability |\n| **Training** | Shadow a shift, then reverse-shadow, then primary; **Wheel of Misfortune** role-plays on past incidents | SRE book |\n| **Tooling** | Pages carry runbook + dashboard links; one page per incident (Davis grouping + Workflow routing) | [11](#standard-11-alerting) |\n| **Review** | Weekly: pages, noisy alerts, toil; give the pager back to the dev team if the service stays below standard | SRE workbook |\n\n```text\nHandover note (end of shift)\n- Incidents: SEV3 #1234 orders-worker lag, mitigated (scaled to 6), RCA pending → owner payments\n- Noisy alerts: \"checkout · per-client ratio\" fired twice at night for client \"tiny\" → raise min errors (ticket #567)\n- Changes in flight: Postgres minor upgrade Thursday 10:00 (platform-data)\n- Watch: disk forecast for orders-db crosses limit in ~9 days\n```\n\n## Wheel of Misfortune (practice)\n\nA role-play of a past incident: one person acts as \"the system\", the on-call trainee investigates and responds, a facilitator keeps time and notes. Afterwards, update the runbook and the dashboards with what was missing. Run it monthly with new on-call members; use real postmortems as scripts.\n\n## Common mistakes\n\n| ❌ | ✅ |\n|---|---|\n| Alert without a runbook, or a runbook that says \"investigate\" | Concrete checks and mitigations |\n| Root cause = \"human error\" | Ask why the system allowed it |\n| Postmortem actions in a document nobody reads | Tracked tickets with owners and dates |\n| Same 3 people always on call | Bigger rotation, follow-the-sun, fewer pages |\n| Severity debated during the incident | Decide fast, adjust later ([20](#standard-20-ownership-and-communication--severity-levels-and-actions)) |\n\n## Sources\n\n- [Google SRE Book: Being on-call](https://sre.google/sre-book/being-on-call/) · [Managing incidents](https://sre.google/sre-book/managing-incidents/) · [Postmortem culture](https://sre.google/sre-book/postmortem-culture/) · [Accelerating SREs to on-call (Wheel of Misfortune)](https://sre.google/sre-book/accelerating-sre-on-call/) · [Introduction (playbooks ~3× MTTR)](https://sre.google/sre-book/introduction/) ✅ 2026-11-20\n- [Google SRE Workbook: On-call (handoffs, playbook upkeep)](https://sre.google/workbook/on-call/) · [Incident response](https://sre.google/workbook/incident-response/) · [Postmortem culture](https://sre.google/workbook/postmortem-culture/) · [Operational overload](https://sre.google/workbook/overload/) ✅ 2026-11-20\n- [Atlassian: MTTA, MTTR, MTBF](https://www.atlassian.com/incident-management/kpis/common-metrics) ✅ 2026-11-20\n- Escalation timings, handover format: rules of thumb ⚠️\n"}, {"group": "6 · People & process", "path": "standard/22-resilience.md", "slug": "standard-22-resilience", "title": "22 · Resilience: backups, disaster recovery, chaos engineering, progressive delivery", "md": "# 22 · Resilience: backups, disaster recovery, chaos engineering, progressive delivery\n\n> **In 30 seconds:** a backup you have never restored is a hope, not a backup. Give every important service an\n> **RPO** (how much data you may lose) and **RTO** (how long recovery may take), **test restores and failover** against\n> them, run **game days** to prove alerts, runbooks and failover work, and limit the blast radius of every change with\n> **canaries, feature flags and automatic rollback**.\n\n## RPO and RTO\n\n| Term | Meaning | Example |\n|---|---|---|\n| **RPO** (recovery point objective) | Maximum acceptable data loss, measured in time | 5 min: replicas or log shipping every few minutes |\n| **RTO** (recovery time objective) | Maximum acceptable time to restore business operations | 1 h: restore + switch traffic within an hour |\n\n| Tier ⚠️ | RPO | RTO | Typical setup |\n|---|---|---|---|\n| 1 | ≤ 5 min | ≤ 1 h | Replication across zones/regions, automated failover, tested runbook |\n| 2 | ≤ 1 h | ≤ 4 h | Frequent backups, scripted restore |\n| 3 | ≤ 24 h | ≤ 1 day | Daily backups, documented restore |\n\nAzure Well-Architected guidance: measure **actual restore times against RPO and RTO**, test **whole critical flows** (a component can restore in time while the flow misses its RTO because dependencies restore after it), test **failback** too, and run **at least one production DR drill per year**.\n\n## What to measure\n\n| Signal | Why | Source |\n|---|---|---|\n| Last successful backup per data store (age) | RPO at risk when it's older than the RPO | Backup job metrics / logs → custom alert (\"no success in 2 intervals\", [06](#standard-06-workload-types--batch-and-cron-jobs)) |\n| Backup size trend | A sudden drop often means a broken backup | Backup job metrics |\n| Replication lag | Real RPO for replicated stores | DB / broker metrics ([09](#standard-09-internal-services)) |\n| **Restore test result and duration** | The only proof the backup works; real RTO | Restore test runs (scheduled job + SDLC/custom event) |\n| Failover drill duration | Real RTO for the full flow | Game day record |\n\n## Chaos engineering and game days\n\nPrinciples of Chaos Engineering: define **steady state** as a measurable output that shows normal behavior, hypothesize it holds while you inject a real-world failure, run it (eventually in production), and **minimize the blast radius**.\n\n| Step | Example |\n|---|---|\n| 1. Steady state | checkout SLI ≥ 99.9%, p95 < 300 ms, orders queue age < 60 s |\n| 2. Hypothesis | \"If one orders-db replica dies, checkout stays within SLO and an alert fires in < 5 min\" |\n| 3. Blast radius | Staging first; then production, one zone, business hours, a kill switch ready |\n| 4. Inject | Kill pods, add latency, drop a dependency, fill a disk, cut the collector (Chaos Mesh, Azure Chaos Studio, scripts) |\n| 5. Observe | SLO, alerts, problems, traces, runbook usefulness |\n| 6. Abort rules | Stop immediately if the SLO burns fast or customers complain |\n| 7. Learn | Fix gaps, update runbooks and alerts, schedule the next one |\n\n| Game day calendar (quarterly ⚠️) | Proves |\n|---|---|\n| Kill a tier-1 pod / node / zone | Redundancy, autoscaling, alerting |\n| Dependency latency or outage | Timeouts, retries, circuit breakers ([09](#standard-09-internal-services)) |\n| Restore a database from backup into a new instance | RPO/RTO, restore runbook |\n| Cut the telemetry pipeline | Collector self-monitoring alerts ([16](#standard-16-collector-templates--self-monitoring)) |\n| Bad release | Release regression alert, rollback ([12](#standard-12-releases-and-dora)) |\n\nThe aks-observability lab already ran these patterns: pod kill, DB latency, RabbitMQ outage, OOM, pipeline cut-offs, log-loss during a backend outage. Its results are in [17](#standard-17-dynatrace-integration--what-the-lab-measured-aks-observability-2026-10). Template: [framework/game-day-template.md](#framework-game-day-template).\n\n## Progressive delivery: limit the blast radius of changes\n\n| Technique | How | Signal that decides |\n|---|---|---|\n| **Canary** | Send a small share of traffic to the new version, compare with the old | Error ratio / latency **by `service.version`** ([12](#standard-12-releases-and-dora)) |\n| **Automatic analysis and rollback** | Argo Rollouts / Flagger analysis, or Dynatrace Site Reliability Guardian after the deployment event | SLO and golden-signal objectives |\n| **Feature flags** | Ship code dark, turn on gradually, turn off instantly | Error ratio per flag variant; flag change events on dashboards |\n| **Blue/green** | Two environments, switch traffic at once, switch back fast | Same as canary, at the switch |\n| **Error budget gate** | No risky releases when the budget is spent ([10](#standard-10-slos-and-error-budgets)) | SLO budget |\n\nFeature flags: prefer a vendor-neutral API (OpenFeature, a CNCF project) so code doesn't lock into one flag vendor; emit flag evaluations or changes as events so \"errors started when flag X turned on\" is visible next to deployments.\n\n## Common mistakes\n\n| ❌ | ✅ |\n|---|---|\n| Backups monitored, restores never tested | Scheduled restore tests with measured duration |\n| RTO for a database, not for the business flow | Test the whole flow, including DNS and clients |\n| Chaos in production on day one | Staging first, small blast radius, abort rules |\n| Canary judged by eye | Automated analysis by version against SLO objectives |\n| Feature flags that live forever | Remove flags after rollout; track flag age |\n\n## Sources\n\n- [Azure Well-Architected: Disaster recovery](https://learn.microsoft.com/en-us/azure/well-architected/reliability/disaster-recovery) · [Reliability testing](https://learn.microsoft.com/en-us/azure/well-architected/reliability/reliability-test) · [Reliability targets (RTO/RPO)](https://learn.microsoft.com/en-us/azure/well-architected/reliability/metrics) ✅ 2026-11-20\n- [Principles of Chaos Engineering](https://principlesofchaos.org/) ✅ 2026-11-20\n- [Google SRE Book: Testing for reliability](https://sre.google/sre-book/testing-reliability/) · [Workbook: Canarying releases](https://sre.google/workbook/canarying-releases/) ✅ 2026-11-20\n- [OpenFeature](https://openfeature.dev/) ✅ 2026-11-20 · [Argo Rollouts analysis](https://argo-rollouts.readthedocs.io/en/stable/features/analysis/) ✅ · [Dynatrace: Release validation (Site Reliability Guardian)](https://docs.dynatrace.com/docs/deliver/quality-gates) ✅\n- RPO/RTO per tier, game day cadence: rules of thumb ⚠️\n"}, {"group": "6 · People & process", "path": "standard/23-measuring-effectiveness.md", "slug": "standard-23-measuring-effectiveness", "title": "23 · Measuring effectiveness: is the observability working, and what did I change?", "md": "# 23 · Measuring effectiveness: is the observability working, and what did I change?\n\n> **In 30 seconds:** measure **outcomes**, not outputs. Not \"dashboards built\" but: are problems **found by monitoring\n> before customers** (detection), **fixed faster** (response), are pages **worth waking up for** (alert quality), is\n> every service **covered** (coverage), and does it cost what it should (cost)? Record a few fields on every incident,\n> compute the same KPIs every month, and keep an **impact log** of what you changed and what moved.\n\n## The scorecard\n\n<div data-widget=\"viz\" data-chart=\"effectiveness-tiles\"><\/div>\n\n| Family | KPI | Definition | Target ⚠️ | Data from |\n|---|---|---|---|---|\n| **Detection** | % incidents detected by monitoring | Incidents whose first signal was an alert ÷ all incidents | > 80% | Incident record (`detected_by`) |\n| | MTTD (time to detect) | First alert − impact start | Down, minutes | Incident record, problem start |\n| **Response** | MTTA (time to acknowledge) | Acknowledged − alerted | < 5 min (pages) | On-call tool |\n| | Time to mitigate | Users no longer affected − impact start | Down | Incident record |\n| | MTTR (define one \"R\") | Resolved − impact start (state which R: repair, recovery, resolve) | Down | Incident record / problem end |\n| **Alert quality** | Precision | Pages that needed action ÷ all pages | > 80–90% | On-call review |\n| | Recall | Incidents preceded by an alert ÷ incidents | > 80% | Incident record |\n| | Pages per on-call shift | Incidents per 12 h shift | ≤ 2 | On-call tool |\n| | Notifications per incident | Notifications ÷ incidents | ≈ 1 | On-call tool / Workflows |\n| **Coverage** | Services meeting the definition of done | Tier-1/2 services passing [03](#standard-03-definition-of-done) ÷ all | 100% tier 1 | Monaco/CI checks ([18](#standard-18-automation-and-scale)) |\n| | Services with an SLO | Tier-1 services with SLO + policy ÷ all tier-1 | 100% | SLO app |\n| | Time to onboard a new service | First deploy → fully observed | < 1 day | Pipeline events |\n| **Reliability** | SLO compliance | Services within SLO over 28 days ÷ all with SLO | Up | SLO app |\n| | Repeat incidents | Incidents with the same contributing factor within 90 days | Down | Postmortems |\n| | Postmortem actions closed on time | Closed by due date ÷ due | > 80% | Backlog |\n| **Delivery** | DORA (frequency, lead time, CFR, recovery, rework) | [12](#standard-12-releases-and-dora) | Trend | SDLC events |\n| **Operations** | Toil % | Time on toil ÷ total ops time | < 50% | Survey / ticket tags ([below](#standard-23-measuring-effectiveness--toil)) |\n| | After-hours pages | Pages outside working hours per week | Down | On-call tool |\n| **Cost** | Observability cost per service / per team | Ingest + retention cost by `team` | Stable or down per unit of traffic | Billing metrics ([17](#standard-17-dynatrace-integration--cost-what-drives-the-bill-dps)) |\n| **Adoption** | Dashboards and alerts outside Git | Hand-made objects | 0 | Monaco diff |\n| | Maturity score | [02](#standard-02-maturity-model) per dimension | Up each quarter | Quarterly self-assessment |\n\n## Record these fields on every incident\n\nEvery KPI above comes from a handful of fields. Make them mandatory in the incident template.\n\n| Field | Example |\n|---|---|\n| Impact start | 14:05 (from data, not from the first message) |\n| Detected at · **detected by** | 14:09 · alert / customer / employee / synthetic |\n| Acknowledged at | 14:10 |\n| Mitigated at · resolved at | 14:14 · 14:19 |\n| Severity (SEV1–4) · service · tier | SEV2 · checkout · 1 |\n| Alert(s) that fired · runbook used (y/n) · runbook helpful (y/n) | release regression · y · y |\n| Change related? (deployment / config / none) | deployment 1.42.0 |\n| Postmortem link · actions | link · 2 actions |\n\n## How the trend should look\n\n<div data-widget=\"viz\" data-chart=\"detection-trend\"><\/div>\n\n## Toil\n\nToil (SRE book): work that is **manual, repetitive, automatable, tactical, without enduring value, and grows with the service**. Google keeps it **under 50%** of SRE time; its surveys average about a third.\n\n| Step | How |\n|---|---|\n| Measure | Tag tickets as toil; quarterly survey \"% of your time on toil\"; count manual runbook steps executed |\n| Rank | By hours per month × people affected |\n| Remove | Top 3 per quarter: automate (Workflows, scripts), fix the cause, or delete the work |\n| Track | Toil % per quarter in the scorecard |\n\n## Cases: what \"effective\" looks like in numbers\n\n| Case | Before | Change | After | Evidence type |\n|---|---|---|---|---|\n| **Pipeline resilience** | 83% of logs lost in a 10-min backend outage | Persistent agent queue, retries without limit, backpressure | **0% lost**, also with an agent restart | ✅ Measured in the aks-observability lab |\n| **Label churn** | 470 new series per container restart, 50 labels | Label allow-list in the gateway | **18 new series**, 28 labels | ✅ Measured in the lab |\n| **Pipeline failure detection** | Dynatrace built-in \"monitoring unavailable\": ~24 min | Collector self-monitoring alerts | **4–11 min** | ✅ Measured in the lab |\n| **Alert noise** | ~9 pages/week, 12% acted on | Symptom/SLO alerts, guards, shadow mode, deleted 29 alerts | ~1 page/week, 90% acted on | Example ([case study](#examples-case-study)) |\n| **Detection** | 60% of incidents reported by customers, MTTD 40 min | Per-client and per-version alerts, synthetic journeys | 15% customer-reported, MTTD 4 min | Example ⚠️ |\n| **Coverage at scale** | 10% of services with an SLO, 2 weeks to onboard | `observability.yaml` + Monaco pipeline | 95% with SLO, onboard in < 1 day | Example ⚠️ |\n| **Release safety** | Change failure rate 18%, recovery 45 min | Version split, deployment events, release validation, rollback runbook | CFR 8%, recovery 14 min | Example ⚠️ |\n| **Cost** | All metrics and histograms sent to Dynatrace | Gateway filter: drop unused histograms, label allow-list | −35% metric data points billed | Example ⚠️ |\n\nUse the same definitions before and after; otherwise the comparison means nothing.\n\n## Measuring yourself (impact as an SRE)\n\n| Practice | How |\n|---|---|\n| **Impact log** | One line per change: date · problem · what you did · **measurable result** · link (PR, postmortem, dashboard) |\n| **Baseline first** | Record the KPI *before* you change anything (pages/week, MTTD, cost, coverage) |\n| **Outcomes over outputs** | \"Pages −80%\" beats \"built 12 dashboards\"; \"MTTD 40 → 4 min\" beats \"added alerts\" |\n| **Quarterly review** | Scorecard + maturity rescore ([02](#standard-02-maturity-model)); pick next quarter's top 3 |\n| **Ask the users of your work** | On-call survey (sleep, trust in alerts, runbook quality); service teams' onboarding feedback |\n| **Tell it as a story** | Situation → task → action → result with numbers: for reviews, interviews and posts |\n\n```text\nImpact log\n2026-10-22 · Logs lost during backend outages (83%) · persistent queue + backpressure in collectors · 0% lost in chaos test · results/log-loss.md\n2026-10-20 · Collector failures invisible for ~24 min · self-monitoring alerts on otelcol_* · detected in 4–11 min · results/pipeline-faults.md\n```\n\n## Common mistakes\n\n| ❌ | ✅ |\n|---|---|\n| Counting outputs (dashboards, alerts, configs) | Outcomes: detection, response, quality, coverage, cost |\n| MTTR without saying which \"R\" | Define the start and end points once |\n| Using KPIs as targets for individuals or to rank teams | Trends per team; DORA warns against metrics as targets (Goodhart's law) |\n| Measuring only after the change | Baseline first |\n| A scorecard nobody looks at | Monthly review, quarterly decisions |\n\n## Sources\n\n- [Atlassian: MTTA, MTTR, MTBF](https://www.atlassian.com/incident-management/kpis/common-metrics) · [Choosing incident KPIs](https://www.atlassian.com/incident-management/kpis) ✅ 2026-11-20\n- [Google SRE Book: Eliminating toil](https://sre.google/sre-book/eliminating-toil/) · [Being on-call](https://sre.google/sre-book/being-on-call/) ✅\n- [Google SRE Workbook: Operational overload (pager budget)](https://sre.google/workbook/overload/) ✅ 2026-11-20\n- [DORA four keys](https://dora.dev/guides/dora-metrics-four-keys/) ✅\n- Lab cases: `~/projects/aks-observability/results/` (log-loss, cardinality, pipeline-faults) ✅ measured\n- Targets and the example cases: rules of thumb / illustrative ⚠️\n"}, {"group": "6 · People & process", "path": "framework/transition-plan.md", "slug": "framework-transition-plan", "title": "Transition plan: from an existing observability setup to the standard", "md": "# Transition plan: from an existing observability setup to the standard\n\n> You almost never start from zero. There are already dashboards, alerts, maybe two tools, and people used to them.\n> Principles: **assess before changing · pilot one service · run old and new in parallel · delete only after proof · communicate every step.**\n\n## Phases at a glance\n\n| Phase | Duration (typical) | Goal | Exit criteria |\n|---|---|---|---|\n| 0 · Assess | 1–2 weeks | Know what exists and what hurts | Inventory + maturity score + pilot chosen |\n| 1 · Foundations | 2–3 weeks | Conventions everyone will reuse | Labels, routing, templates merged |\n| 2 · Pilot | 3–4 weeks | Prove the standard on 1 service | Pilot meets definition of done + before/after numbers |\n| 3 · Rollout | waves of 2–4 weeks | Bring other services over | Each wave meets definition of done |\n| 4 · Decommission | per wave | Remove old alerts/dashboards/tools | No old rule left without reason |\n| 5 · Operate | ongoing | Keep it healthy | Rituals running, KPIs trending right |\n\nDurations are rough guides for a mid-size team (10–30 services). Adjust.\n\n---\n\n## Phase 0 · Assess\n\n| Task | How | Output |\n|---|---|---|\n| Inventory services | Service catalog, `kubectl get deploy -A`, APM service list | List with owner, criticality (tier 1/2/3) |\n| Inventory alerts | Export alert definitions; problems per alert in 30d (Problems app / DQL), % actioned | Alert table ([11 §7](#standard-11-alerting--7-cleaning-up-a-noisy-alert-set)) |\n| Inventory dashboards | Grafana API: last viewed, owner | Keep / merge / delete list |\n| Pain interviews | 30 min with on-call, team leads, a business owner | Top 5 pains in their words |\n| Maturity score | [02-maturity-model.md](#standard-02-maturity-model) | Current vs target per dimension |\n| Choose pilot | Tier 1, a motivated team, real pain, not the most complex | Pilot service + sponsor |\n\n## Phase 1 · Foundations (decide once, reuse everywhere)\n\n| Decision | Standard |\n|---|---|\n| Naming & semantic conventions | OTel semconv; `http.route`, no raw URLs |\n| Required resource attributes | `service.name`, `service.version`, `team`, `deployment.environment.name` ([04](#standard-04-endpoint-coverage)) |\n| Severity scheme | `page` / `ticket` only |\n| Alert routing | Alertmanager tree by `team` → `severity` ([20](#standard-20-ownership-and-communication)) |\n| Templates | SLO rules (Sloth/Pyrra), service dashboard with `$service/$client/$version`, runbook template |\n| Deploy markers | Pipeline or Argo CD → annotations ([12](#standard-12-releases-and-dora)) |\n| CI checks | `promtool check rules` + lint: `team`, `severity`, `runbook_url` required |\n\n## Phase 2 · Pilot\n\n1. Baseline numbers **before** changing: pages/week, % actioned, MTTD, alerts count.\n2. Define SLOs with the team + business owner.\n3. Add the new alerts in **shadow mode** (non-paging receiver) next to the old ones.\n4. After 1–2 weeks compare: did the new alerts catch every real incident? Fewer false positives?\n5. Switch paging to the new alerts; keep the old ones in shadow for one more cycle.\n6. Inject failures (bad image tag, dependency down) to validate ([03 #12](#standard-03-definition-of-done)).\n7. Write the playbook and a short internal post with the before/after.\n\n## Phase 3 · Rollout in waves\n\n| Wave | Services | Why this order |\n|---|---|---|\n| 1 | Remaining tier 1 | Biggest value, same pattern as the pilot |\n| 2 | Tier 2 | Reuse templates, less hand-holding |\n| 3 | Tier 3 / batch / internal | Mostly count and absence alerts |\n\nEach wave: service team does the work (R), SRE reviews (C), same shadow → cutover → validate steps.\n\n## Phase 4 · Decommission\n\n| Rule | Why |\n|---|---|\n| Delete an old alert only after its replacement caught a real or injected failure | Never create a blind spot |\n| Archive, don't destroy, dashboards for 30 days | Someone may still need one |\n| Tool migration (e.g. two APMs): dual-ship telemetry via the OTel Collector during the overlap | Compare data before switching off |\n\n## Phase 5 · Operate\n\n| KPI | Target |\n|---|---|\n| Pages per on-call shift | ≤ 2 |\n| % pages actioned | > 80–90% |\n| Services meeting definition of done | rising to 100% of tier 1 |\n| MTTD / time to restore | trending down |\n| Change failure rate | trending down |\n\n## Communication plan for the transition\n\n| When | Audience | Message | Channel |\n|---|---|---|---|\n| Kick-off | All engineering + managers | Why we change, what changes for them, timeline | All-hands / email |\n| Each phase start/end | Affected teams | What happens this phase, what they need to do | Team channel |\n| Before cutover | On-call of the service | Which alerts change, new runbooks, how to report problems | Handover + channel |\n| Monthly | Leadership | Progress, KPIs before/after, risks | Short report |\n| After each wave | Everyone | Wins with numbers (\"pages −60%\") | Internal post |\n\n## RACI for the transition\n\n| Activity | SRE / Observability | Platform | Service teams | Eng. managers |\n|---|---|---|---|---|\n| Plan and standard | **A/R** | C | C | I |\n| Foundations (collector, routing, templates) | A | **R** | I | I |\n| Service migration | C | C | **A/R** | I |\n| Prioritization and time allocation | C | C | C | **A/R** |\n| Decommission | A | R | R | I |\n\n## Sources\n\n- Google SRE Workbook, ch. 2 *Implementing SLOs*, ch. 5 *Alerting on SLOs*\n- Strangler fig pattern (Martin Fowler): replace incrementally, run in parallel\n- OTel Collector docs: multiple exporters for dual shipping\n\n> Official links and verification status: [REFERENCES.md](#references)\n"}, {"group": "6 · People & process", "path": "framework/slo-document-template.md", "slug": "framework-slo-document-template", "title": "SLO document template", "md": "# SLO document template\n\n> One per service (or per critical user journey). Keep it to one page. Based on the structure of the\n> [SRE Workbook's example SLO document](https://sre.google/workbook/slo-document/).\n\n| Field | Value |\n|---|---|\n| Service | |\n| Owner (team) | |\n| Status | draft / approved |\n| Approved by | service owner · SRE · business owner |\n| Approved on | YYYY-MM-DD |\n| Next review | YYYY-MM-DD (monthly or quarterly) |\n| Error budget policy | link to [error-budget-policy](#framework-error-budget-policy-template) copy |\n\n## 1. Service overview\n\nWhat the service does, who uses it (internal teams, clients A/B/C), and which user journeys depend on it.\n\n## 2. SLIs and SLOs\n\n| Journey | SLI type | SLI definition (good / valid) | Measured at | SLO | Window |\n|---|---|---|---|---|---|\n| Checkout | Availability | non-5xx responses / all requests to `/api/checkout` | gateway | 99.9% | 28d |\n| Checkout | Latency | requests < 500 ms / all requests | gateway | 99% | 28d |\n\nPer-client targets (if multi-tenant):\n\n| Client | Contract | SLO |\n|---|---|---|\n| | | |\n\n## 3. Rationale\n\nWhy these SLIs and targets: current performance over the last 4 weeks, what users notice, what the SLA promises.\n\n## 4. Error budget\n\n| SLO | Budget (28d) | Approx. in requests or minutes |\n|---|---|---|\n| 99.9% | 0.1% | e.g. 1,000 bad requests per 1,000,000 |\n\n## 5. Alerting\n\nBurn-rate alerts per [standard/03](#standard-11-alerting) (links to the rule files and dashboard).\n\n## 6. Clarifications and caveats\n\nWhat does **not** count: load tests, known bad clients, planned maintenance, 4xx caused by callers, etc.\n\n## 7. Change log\n\n| Date | Change | Why |\n|---|---|---|\n"}, {"group": "6 · People & process", "path": "framework/error-budget-policy-template.md", "slug": "framework-error-budget-policy-template", "title": "Error budget policy template", "md": "# Error budget policy template\n\n> Adapted from the [SRE Workbook's example error budget policy](https://sre.google/workbook/error-budget-policy/).\n> The policy is **not a punishment**. It's an agreement made in advance, so a spent budget leads to a decision\n> instead of an argument. Values marked ⚠️ are suggestions to adjust.\n\n| Field | Value |\n|---|---|\n| Applies to | services / SLO documents |\n| Owners | service owner · SRE · engineering manager |\n| Approved on | YYYY-MM-DD |\n| Review | yearly or after a policy escalation |\n\n## 1. Goals and non-goals\n\n| Goals | Non-goals |\n|---|---|\n| Protect users from repeated SLO misses | Punish teams for missing SLOs |\n| Give a clear signal to balance reliability and features | Stop all change (halting releases is a last resort) |\n\n## 2. While the service is within its SLO\n\nReleases and feature work continue normally.\n\n## 3. When the budget is exhausted (over the last 4 weeks)\n\n- All changes and releases stop **except P0 issues and security fixes**, until the service is back within its SLO.\n- The team prioritizes reliability work.\n\nReliability work is **mandatory** when the overrun was caused by:\n\n| Cause | Example |\n|---|---|\n| The team's own code bug or procedural error | Bad config pushed without canary |\n| A hard dependency found in a postmortem that could be softened | No timeout or fallback to a downstream |\n| Errors that were miscategorized and hid budget spend | 5xx counted as success |\n\n## 4. Exemptions (feature work may continue)\n\n| Cause | Why exempt |\n|---|---|\n| Company-wide network or infrastructure problem | Not within the team's control |\n| Another team's service (which has frozen its own releases) | The owner is already acting |\n| Out-of-scope traffic (load tests, penetration tests) | Not real users |\n\n## 5. Outage policy\n\n| Trigger | Required action |\n|---|---|\n| A single incident uses **> 20%** of the 4-week budget | Postmortem with at least one **P0 action item** |\n| A class of outage uses > 20% of the quarter's budget | A P0 item in next quarter's plan |\n\n## 6. Escalation\n\nIf the owners disagree about the budget calculation or the actions, escalate to [role, e.g. head of engineering] ⚠️.\n\n## 7. Communication\n\n| Event | Who is told | Channel |\n|---|---|---|\n| Budget below 50% ⚠️ | Team | Team channel (automatic) |\n| Budget exhausted, freeze starts | Team, manager, dependent teams | Channel + email |\n| Freeze ends | Same | Channel |\n\n## 8. Signatures\n\n| Role | Name | Date |\n|---|---|---|\n| Service owner | | |\n| SRE | | |\n| Engineering manager | | |\n"}, {"group": "6 · People & process", "path": "framework/runbook-template.md", "slug": "framework-runbook-template", "title": "Runbook template", "md": "# Runbook template\n\n> One runbook per paging alert, linked from the alert (`runbook` property). Written for someone tired at 3 a.m. who\n> doesn't know this service. Guide: [21](#standard-21-incident-response-and-on-call--runbooks).\n\n| Field | Value |\n|---|---|\n| Alert | e.g. `checkout · SLO fast burn` |\n| Service · tier · owner | checkout · 1 · payments |\n| Last reviewed | YYYY-MM-DD (update it every time the alert fires) |\n\n## What this alert means\n\nOne or two sentences in user terms: who is affected and what they see. The SLO or threshold behind it.\n\n## Impact: how bad is it?\n\n- L1 dashboard (link with `service` filled in): error ratio, per client, per version.\n- Rough severity guide: all clients → SEV1/2; one client → check SLA ([20](#standard-20-ownership-and-communication--severity-levels-and-actions)).\n\n## First checks (5 minutes)\n\n1. **Recent change?** Deployment events in the last 60 min (L1 \"per version\" row).\n2. **One client or all?** Per-client table.\n3. **Dependencies?** Client-side errors to DB / payments-api / auth (traces, service flow).\n4. **Saturation?** Pods at memory limit, HPA at max, connection pool full.\n5. **Platform?** Open Davis problems on the cluster or the database.\n\n## Mitigations (most reversible first)\n\n| If | Do | Command / button |\n|---|---|---|\n| New version is worse | Roll back | `kubectl rollout undo deploy/checkout -n shop` |\n| HPA at max, latency rising | Scale out | `kubectl scale deploy/checkout -n shop --replicas=<n>` |\n| New feature suspected | Turn the flag off | Flag `new-pricing` → off |\n| Dependency down | Fail over / shed load | link to the dependency's runbook |\n\n## Escalation\n\n| When | Whom |\n|---|---|\n| Not mitigated in 15 min, or SEV1/2 | Incident Commander (page) |\n| Dependency at fault | Owning team's on-call (from the service catalog) |\n\n## Verify\n\nWhich tile must turn green, and for how long, before you call it resolved.\n\n## Background\n\nArchitecture notes, known issues, links to past postmortems for this alert.\n"}, {"group": "6 · People & process", "path": "framework/postmortem-template.md", "slug": "framework-postmortem-template", "title": "Postmortem template (blameless)", "md": "# Postmortem template (blameless)\n\n> Required for SEV1/SEV2, an incident using > 20% of the error budget, or a repeat incident.\n> Describe systems and decisions, not people's mistakes. Guide: [21](#standard-21-incident-response-and-on-call--postmortems).\n\n| Field | Value |\n|---|---|\n| Title | e.g. \"checkout errors for Fabrikam after release 1.42.0\" |\n| Date · severity · services | 2026-11-20 · SEV2 · checkout |\n| Authors · reviewers | |\n| Status | draft / reviewed / actions closed |\n\n## Summary\n\nThree sentences: what happened, impact, how it was fixed.\n\n## Impact\n\n| Measure | Value |\n|---|---|\n| Users / clients affected | |\n| Duration of impact | impact start → mitigated |\n| Error budget used | % of the 28-day budget (per SLO, per client SLO) |\n| SLA / financial impact | |\n\n## Timeline (from data)\n\n| Time (UTC) | Event | Source |\n|---|---|---|\n| 14:02 | Deployment 1.42.0 | Deployment event |\n| 14:05 | Impact starts | SLI / per-client error ratio |\n| 14:09 | First alert | Problem / custom alert |\n| 14:10 | Acknowledged | On-call tool |\n| 14:14 | Mitigated (rollback) | Deployment event |\n| 14:19 | Resolved | Problem closed |\n\n**Detection:** detected by alert / customer / employee? Time to detect, acknowledge, mitigate, resolve ([23](#standard-23-measuring-effectiveness)).\n\n## Contributing factors\n\nSeveral, not one \"root cause\". For each: why did the system allow it?\n\n## What went well · what went badly · where we got lucky\n\n## Action items\n\n| Action | Type (prevent / detect / mitigate / process) | Owner | Priority | Due | Ticket |\n|---|---|---|---|---|---|\n\n## Updates to the standard\n\nRunbook, alert, dashboard, playbook status, guide section changed because of this incident.\n"}, {"group": "6 · People & process", "path": "framework/game-day-template.md", "slug": "framework-game-day-template", "title": "Game day template (chaos experiment or restore test)", "md": "# Game day template (chaos experiment or restore test)\n\n> Prove that alerts, runbooks, failover and restores work, before an incident proves they don't.\n> Guide: [22](#standard-22-resilience).\n\n| Field | Value |\n|---|---|\n| Name · date · environment | e.g. \"orders-db replica loss\" · 2026-12-03 · staging → prod (one zone) |\n| Owner · participants · observer | |\n| Abort rule | Stop if checkout SLO burns > 6× or a customer reports impact |\n| Kill switch | How to stop the injection immediately |\n\n## Steady state (measurable)\n\ncheckout SLI ≥ 99.9% · p95 < 300 ms · orders queue age < 60 s\n\n## Hypothesis\n\n\"If <failure>, then <steady state holds> and <alert X fires in < N min>, and the runbook leads to recovery within RTO.\"\n\n## Injection\n\nWhat exactly is broken, how, for how long (tool / command).\n\n## Results\n\n| Expectation | Result | Pass? |\n|---|---|---|\n| Steady state held | | |\n| Alert fired within N min | | |\n| Runbook was enough | | |\n| Recovery within RTO (restore tests: data within RPO) | measured duration | |\n\n## Gaps and actions\n\n| Gap | Action | Owner | Due |\n|---|---|---|---|\n\n## Next game day\n\nDate and scenario.\n"}, {"group": "6 · People & process", "path": "examples/case-study.md", "slug": "examples-case-study", "title": "Case study: one endpoint, three clients, one bad release", "md": "# Case study: one endpoint, three clients, one bad release\n\n> A **fictional** but realistic story that walks through the whole guide on the real stack:\n> **OpenTelemetry → Dynatrace**. Names and numbers are invented; each step links to the section it applies.\n\n## The setup\n\n| Item | Value |\n|---|---|\n| Service | `checkout` (Go), endpoint `POST /api/checkout`, archetype: HTTP API |\n| Team | `payments`, 5 engineers, one on-call per week |\n| Clients | **Northwind** (70% of traffic), **Contoso** (25%), **Fabrikam** (5%, contract with 99.95% SLA) |\n| Traffic | ~100 req/s at peak, ~5 req/s at night, ~60 req/s on average (~145M requests per 28 days) |\n| Stack | OTel auto-instrumentation, agent / cluster / gateway collectors, Dynatrace backend, ActiveGate for Kubernetes |\n| Before | 38 alerts (mostly CPU, memory, pod restarts), ~9 pages per week, nobody trusts them |\n\n<div data-widget=\"viz\" data-chart=\"traffic-share\"><\/div>\n\n## Step 1 · Assess ([02](#standard-02-maturity-model), [transition plan](#framework-transition-plan) phase 0)\n\n| Dimension | Score | Evidence |\n|---|---|---|\n| Instrumentation | 2 | OTel auto-instrumentation, RED from spans |\n| Context | 1 | No `service.version`, no `client.id` |\n| Alerting | 1 | 38 cause alerts, 12% of pages acted on |\n| Delivery | 0 | Deployments invisible in Dynatrace |\n| Ownership | 1 | Every problem goes to one shared channel |\n\nTarget: level 3 for Context, Alerting and Delivery within one quarter.\n\n## Step 2 · Locate the layers ([01](#standard-01-layers))\n\n| Layer | What matters here |\n|---|---|\n| Business | Checkouts per minute; Fabrikam's contract |\n| Service | RED for `POST /api/checkout`, **per client** |\n| Delivery | Which version is serving |\n| Resources | DB connection pool, memory vs limit (diagnosis only) |\n\n## Step 3 · Add context ([04](#standard-04-endpoint-coverage), [12](#standard-12-releases-and-dora), [16](#standard-16-collector-templates))\n\n- Middleware sets `client.id` from the API key on spans (3 values: bounded).\n- The pipeline sets the pod label `app.kubernetes.io/version`; the collectors' `k8sattributes` turns it into `service.version`.\n- The gateway's label allow-list keeps `client.id` and `service.version`, so they reach Dynatrace on every signal.\n- After `kubectl rollout status`, the pipeline sends a **deployment SDLC event** to Dynatrace.\n\n## Step 4 · SLOs and the policy ([10](#standard-10-slos-and-error-budgets))\n\n| SLO (Dynatrace SLO app, DQL SLI) | Target | Budget (28d) |\n|---|---|---|\n| Availability, all clients | 99.9% | ~145,000 bad requests |\n| Availability, Fabrikam | 99.95% | ~3,600 bad requests (Fabrikam ≈ 7.25M requests) |\n| Latency < 500 ms | 99% | – |\n\nThe SLO document and error budget policy are signed by the team lead, SRE and Fabrikam's account manager. All of it is generated from `observability.yaml` by the onboarding pipeline ([18](#standard-18-automation-and-scale)).\n\n## Step 5 · Replace the alerts ([11](#standard-11-alerting))\n\n| Old (removed after a shadow period) | New |\n|---|---|\n| CPU > 80%, memory > 85%, pod restarted (×12 variants) | Dashboard only; Davis keeps OOM / crash-loop problems |\n| `errors > 100` | SLO burn-rate custom alert (fast and slow burn) |\n| – | Per-client error ratio > 5% **and** > 20 errors (custom alert, `by:{client.id}`) |\n| – | Release regression: error ratio by `service.version` |\n| – | No checkouts in 15 min (business hours) |\n| One shared channel | A Workflow routes problems with `team = payments` to the payments on-call |\n\nNew alerts ran in **shadow mode** (non-paging channel) for two weeks: they caught both real incidents; the old set added 17 false pages.\n\n## Step 6 · The incident\n\n| Time | Event | Where it shows |\n|---|---|---|\n| 14:02 | Pipeline deploys `checkout 1.42.0` (rolling update) and sends a deployment event | Deployment marker on the L1 dashboard |\n| 14:05 | Fabrikam's requests hit a new code path that fails for their currency | Per-client table: Fabrikam error % turns red |\n| 14:07 | Total error ratio only 0.4% (Fabrikam is 5% of traffic): below the fast-burn threshold | The old `errors > 100` would also have stayed silent |\n| 14:09 | **Release regression** alert: 1.42.0 at 4.1% vs 1.41.3 at 0.2% | Davis opens a problem, related to the deployment |\n| 14:11 | **Fabrikam error-ratio** alert: 8%, ~240 errors in 10 min | Grouped into the **same problem** |\n| 14:12 | The Workflow pages the payments on-call; the link opens L1 with `service = checkout` | Per-version and per-client rows show the split |\n| 14:14 | Rollback (`kubectl rollout undo`); rollback event sent | Second marker on the dashboard |\n| 14:19 | Error ratio back to baseline; alerts close; problem resolved | – |\n| 14:30 | Budget check: overall ~4,000 errors ≈ 3% of the 28-day budget; Fabrikam ~400 ≈ 11% of its budget | SLO app |\n\n<div data-widget=\"viz\" data-chart=\"incident-timeline\"><\/div>\n\n**Time to detect: 4 min after the first errors. Time to restore: 14 min.** Comms posted an update to Fabrikam at 14:20 ([20](#standard-20-ownership-and-communication)).\n\n<div data-widget=\"viz\" data-chart=\"state-timeline\"><\/div>\n\n## Step 7 · After the incident ([20](#standard-20-ownership-and-communication), [10](#standard-10-slos-and-error-budgets))\n\n| Output | Content |\n|---|---|\n| Postmortem | Blameless; cause: currency edge case not covered by tests; release validation didn't include Fabrikam traffic |\n| Action items | Contract test for all client currencies (P1); Site Reliability Guardian objective **per client** after each deployment (P1) |\n| Policy check | Fabrikam budget used 11%: under the 20% rule, so no mandatory P0; the team made the fixes P1 anyway |\n| DORA | 1 failed deployment; recovery time 14 min (from the deployment and rollback events) |\n| Guide update | `playbooks/release-regression.md` status → *validated in production*; note in 11 about per-client release validation |\n\n## Step 8 · Results after one quarter\n\n<div data-widget=\"viz\" data-chart=\"case-results\"><\/div>\n\n| KPI | Before | After |\n|---|---|---|\n| Alerts | 38 | 9 |\n| Pages per week | ~9 | ~1 |\n| % pages acted on | 12% | 90% |\n| Time to detect (median) | 40 min (client reported) | 4 min |\n| Maturity: Context / Alerting / Delivery | 1 / 1 / 0 | 3 / 3 / 2 |\n\n## What this case shows\n\n| Lesson | Section |\n|---|---|\n| The global total hid a broken client | [04](#standard-04-endpoint-coverage--multiple-clients-on-one-service) |\n| `service.version` turned \"something is wrong\" into \"1.42.0 is wrong\" | [12](#standard-12-releases-and-dora) |\n| The minimum-count guard kept nights quiet; the per-client ratio caught the small client | [11](#standard-11-alerting) |\n| Davis grouped two alerts into one problem; a Workflow sent one page to the right team | [11](#standard-11-alerting), [17](#standard-17-dynatrace-integration) |\n| The policy turned a budget number into a decision | [10](#standard-10-slos-and-error-budgets) |\n| Shadow mode made it safe to delete 29 alerts | [transition plan](#framework-transition-plan) |\n| One service file generated SLOs, alerts and routing | [18](#standard-18-automation-and-scale) |\n"}, {"group": "Playbooks", "path": "playbooks/release-regression.md", "slug": "playbooks-release-regression", "title": "Playbook: Errors went up after a release", "md": "# Playbook: Errors went up after a release\n\n| Field | Value |\n|---|---|\n| Problem | \"Error rate jumped. Was it the deploy? Which version?\" |\n| Layer(s) | Delivery → Service |\n| Method | RED split by `service.version` + deploy markers |\n| Status | draft (not yet validated in lab) |\n| Last validated | – |\n\n## When to use it\n\n- Error rate or latency changed and a deploy happened in the last ~1h.\n- During a rolling update or canary (two versions serve traffic at once).\n- Someone asks \"should we roll back?\".\n\n## Signals needed\n\n| Signal | Name / attribute | Exists? |\n|---|---|---|\n| Metric | `http_server_request_duration_seconds_*` with `service_version` label | |\n| Metric | `kube_deployment_status_observed_generation` (kube-state-metrics) | |\n| Event | Grafana annotation `deploy` with `version:<tag>` | |\n| Trace | `service.version` resource attribute | |\n| Log | `service.version` field | |\n\n## Queries\n\n```text\n// Dynatrace (DQL shape): error ratio per version during the rollout\nfetch spans\n| filter service.name == \"checkout\" and span.kind == \"server\"\n| makeTimeseries { total = count(), errors = countIf(http.response.status_code >= 500) }, by:{ service.version }\n| fieldsAdd error_ratio = errors[] / total[]\n```\n\nOpen-source variant (PromQL):\n\n\n```promql\n# Error ratio per version (compare old vs new during rollout)\nsum by (service_version) (rate(http_server_request_duration_seconds_count{service_name=\"$service\", http_response_status_code=~\"5..\"}[5m]))\n/\nsum by (service_version) (rate(http_server_request_duration_seconds_count{service_name=\"$service\"}[5m]))\n\n# Traffic share per version (is the rollout progressing?)\nsum by (service_version) (rate(http_server_request_duration_seconds_count{service_name=\"$service\"}[5m]))\n\n# Latency p99 per version\nhistogram_quantile(0.99, sum by (service_version, le) (rate(http_server_request_duration_seconds_bucket{service_name=\"$service\"}[5m])))\n```\n\n## Alerts\n\n- Regression of one version vs the other: [standard/12 §3](#standard-12-releases-and-dora--3-alerts-that-know-about-releases)\n- SLO burn + recent deploy → `suspect: deploy`: [standard/12 §3](#standard-12-releases-and-dora--3-alerts-that-know-about-releases)\n\n## Dashboard\n\n| Row | Panel |\n|---|---|\n| RED overview | Deployment events overlaid on every time series |\n| Delivery | Error % by `service_version` (one line per version), traffic share by version (stacked), p99 by version |\n| Table | version · first seen · req/s · error % · p99 |\n\n## Validation (lab)\n\n1. Deploy version A (healthy). Generate load (k6 / OTel Demo load generator).\n2. Deploy version B with an injected bug (e.g. env var `FAIL_RATE=0.2`) using a rolling update with `maxSurge: 1`.\n3. Expect: annotation at deploy time; two lines on \"error % by version\"; B ≫ A; alert with `suspect: deploy` routed to the owning team.\n4. Roll back: `kubectl rollout undo deploy/<name>`; the alert resolves; record time to detect and time to restore.\n\n## Owners and communication\n\n| Who | Action |\n|---|---|\n| Deploying team (on-call) | Decide rollback; post in deploy channel |\n| SRE | Help if the cause isn't the release |\n| Comms (if client-facing) | Status update per incident flow ([standard/20](#standard-20-ownership-and-communication)) |\n\n## In Dynatrace\n\nVersion from `service.version` (OTel) or the pod label; deployment SDLC events from the pipeline; Davis relates the problem to the deployment; Site Reliability Guardian validates the release and can gate a rollback ([12](#standard-12-releases-and-dora)).\n\n## Sources\n\n- OTel semconv `service.version`; Kubernetes recommended labels\n- Grafana annotations; Argo Rollouts analysis\n- DORA: change failure rate\n"}, {"group": "Playbooks", "path": "playbooks/multi-client-endpoint.md", "slug": "playbooks-multi-client-endpoint", "title": "Playbook: Multi-client endpoint", "md": "# Playbook: Multi-client endpoint\n\n| Field | Value |\n|---|---|\n| Problem | \"One client complains but the global dashboard looks fine\" |\n| Layer(s) | Service (per client) |\n| Method | RED by `client.id` + minimum-count guard, see [standard/04](#standard-04-endpoint-coverage--multiple-clients-on-one-service) |\n| Status | draft (alert tested with promtool; not yet validated in a lab) |\n| Last validated | 2026-11-20, `rules/tests/patterns.test.yml` |\n\n## When to use it\n\n- A client reports errors or slowness, and the total error rate and latency look normal.\n- A service has clients of very different sizes (one is 70% of traffic, another 5%).\n- Contracts (SLAs) differ per client.\n\n## Signals needed\n\n| Signal | Name / attribute | Exists? |\n|---|---|---|\n| Metric | `http_server_request_duration_seconds_*` with a `client_id` label (bounded: tens of values) | |\n| Trace | `client.id` span attribute | |\n| Log | `client_id` field | |\n| Source of the ID | Middleware from API key / JWT, or span metrics connector dimension at the gateway | |\n\n## Queries\n\n```text\n// Dynatrace (DQL shape): error ratio and volume per client from server spans\nfetch spans\n| filter service.name == \"checkout\" and span.kind == \"server\"\n| makeTimeseries { total = count(), errors = countIf(http.response.status_code >= 500) }, by:{ client.id }\n| fieldsAdd error_ratio = errors[] / total[]\n```\n\nOpen-source variant (PromQL):\n\n\n```promql\n# Error ratio per client (compare with the total)\nsum by (client_id) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\", http_response_status_code=~\"5..\"}[5m]))\n/\nsum by (client_id) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[5m]))\n\n# Share of traffic per client (is the broken one small?)\nsum by (client_id) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[5m]))\n/ ignoring (client_id) group_left\nsum(rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[5m]))\n\n# p95 per client\nhistogram_quantile(0.95, sum by (client_id, le) (rate(http_server_request_duration_seconds_bucket{service_name=\"checkout\"}[5m])))\n\n# Did a client go silent? (traffic now vs same time last week)\nsum by (client_id) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[30m]))\n< 0.2 * sum by (client_id) (rate(http_server_request_duration_seconds_count{service_name=\"checkout\"}[30m] offset 1w))\n```\n\n## Alerts\n\n| Alert | Rule | Status |\n|---|---|---|\n| Client error ratio high | `ClientErrorRatioHigh` in [rules/patterns.rules.yml](#rules-readme) (ratio > 5% **and** > 20 errors in 10m, `for: 5m`) | ✅ tested |\n| Client went silent | Query above, `for: 15m`, ticket (page if the client has an SLA) | ⚠️ not tested |\n| Per-client SLO | Copy the burn-rate rules with `by (service_name, client_id)` and the client's target | ⚠️ not tested |\n\n## Dashboard\n\n| Row | Panel |\n|---|---|\n| Per client | Table: req/s · errors (1h) · error % (colored) · p95, sorted by error % ([dashboards/service-red.json](#dashboards-readme)) |\n| Per client | Meter list of error budget left per client ([14](#standard-14-dashboards)) |\n| Overview | Traffic share per client as a segmented bar, not a pie |\n\n## Validation\n\n1. Generate traffic for three clients with very different volumes (k6 scenarios with different API keys).\n2. Inject errors for the smallest client only (feature flag or fault injection by header).\n3. Expect: total error rate stays below the global alert; `ClientErrorRatioHigh{client_id=\"small\"}` fires; the table shows it on top.\n4. Lower the small client's traffic to 1 request per minute with 1 error: the guard keeps the alert silent.\n\n## Owners and communication\n\n| Who | Action |\n|---|---|\n| Service team on-call | Investigates, mitigates |\n| Account manager / client contact | Informed when an SLA client is affected (comms flow in [20](#standard-20-ownership-and-communication)) |\n\n## In Dynatrace\n\nWith OpenTelemetry, `client.id` arrives as a span/metric attribute: split by it in DQL, build a custom alert per client (ratio + minimum count) and per-client SLOs for SLA clients. With OneAgent only: request attributes + calculated metrics split by that attribute.\n\n## Sources\n\n- [Span metrics connector: dimensions](https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/connector/spanmetricsconnector/README.md) ✅\n- [Prometheus: Unit testing for rules](https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/) ✅\n"}, {"group": "Playbooks", "path": "playbooks/dora-from-pipelines.md", "slug": "playbooks-dora-from-pipelines", "title": "Playbook: DORA metrics from pipelines", "md": "# Playbook: DORA metrics from pipelines\n\n| Field | Value |\n|---|---|\n| Problem | \"We don't know how often or how safely we ship\" |\n| Layer(s) | Delivery |\n| Method | DORA metrics from pipeline and incident events, see [standard/04](#standard-12-releases-and-dora--4-dora-metrics) |\n| Status | draft (not yet validated in a lab) |\n| Last validated | – |\n\n## When to use it\n\n- Leadership asks \"are we getting faster or safer?\"\n- You want to prove that observability work (deploy markers, regression alerts) reduced change failures.\n- You're starting the portfolio phases on CI/CD and want before/after numbers.\n\n## The five metrics and their events\n\n| Metric | Event needed | Where it comes from |\n|---|---|---|\n| Deployment frequency | \"deploy succeeded\" per service | Pipeline step after `kubectl rollout status` or Argo CD `on-deployed` |\n| Change lead time | Commit time of each change in the deploy | Git (`git log` between previous and current deployed SHA) |\n| Change failure rate | Deploy marked failed: rollback, hotfix, or incident with `suspect: deploy` | Rollback step, incident tool, alert labels |\n| Failed deployment recovery time | Failed deploy → service restored | Incident open/resolve, or rollback finished |\n| Deployment rework rate | Unplanned deploys caused by an incident | Deploys tagged `hotfix` / linked to an incident |\n\n## Option A · Prometheus (simple, approximate ⚠️)\n\nThe pipeline pushes one gauge per service at the end of each deploy. Use the Pushgateway only because a deploy is a **service-level batch job** (the one valid use the Prometheus docs allow).\n\n```bash\n# Last step of the deploy job\ncat <<EOF | curl -s --data-binary @- \"$PUSHGATEWAY/metrics/job/deploy/service/checkout\"\ndeploy_last_timestamp_seconds $(date +%s)\ndeploy_last_lead_time_seconds $LEAD_TIME_SECONDS\nEOF\n\n# Rollback / hotfix step: push only the failure timestamp (POST replaces only metrics with the same name)\necho \"deploy_last_failed_timestamp_seconds $(date +%s)\" \\\n  | curl -s --data-binary @- \"$PUSHGATEWAY/metrics/job/deploy/service/checkout\"\n```\n\n```promql\n# Deployment frequency: deploys in the last 7 days (each push changes the timestamp)\nchanges(deploy_last_timestamp_seconds{service=\"checkout\"}[7d])\n\n# Failed deploys in the last 30 days (each rollback pushes a new timestamp)\nchanges(deploy_last_failed_timestamp_seconds{service=\"checkout\"}[30d])\n\n# Change failure rate (30 days)\nchanges(deploy_last_failed_timestamp_seconds{service=\"checkout\"}[30d])\n/\nchanges(deploy_last_timestamp_seconds{service=\"checkout\"}[30d])\n```\n\n`changes()` counts value changes, so each push with a new timestamp counts as one event. A gauge that only flips between 0 and 1 would count hours in the failed state, not failures.\n\nLimits: medians of lead time and recovery time are awkward in Prometheus because a gauge repeats its last value at every scrape. Use option B for those.\n\n## Option B · Event store (accurate)\n\n| Tool | How |\n|---|---|\n| Apache DevLake | Collects from GitHub/GitLab/Jenkins/Jira/PagerDuty and ships DORA dashboards for Grafana |\n| Grafana annotations as events | The pipeline posts annotations tagged `deploy`, `rollback`, `hotfix`; query them via the annotations API for counts |\n| OTel CI/CD semantic conventions | Pipeline runs as spans/metrics (`cicd.pipeline.run.duration`); still release candidate |\n\n## Dashboard\n\nStat tiles with a sparkline per metric, compared with the previous period ([14](#standard-14-dashboards--1--stat-tiles-the-first-row)). Change failure rate and recovery time are \"down is good\".\n\n## Validation\n\n1. Deploy 5 times in a lab (kind + OTel Demo service); make one deploy fail and roll back.\n2. Expect: frequency = 5, failures = 1, change failure rate = 20%, recovery time = rollback duration.\n3. Compare with the pipeline history by hand.\n\n## Owners and communication\n\n| Who | Action |\n|---|---|\n| Team | Reviews DORA monthly with the SLO review |\n| Engineering manager | Uses trends, never individual comparisons ⚠️ (DORA warns against using metrics as targets for teams) |\n\n## Dynatrace equivalent\n\nDeployment events (`CUSTOM_DEPLOYMENT` or SDLC events) and release validation with Site Reliability Guardian; DORA dashboards from SDLC events. *(📚 verify.)*\n\n## Sources\n\n- [DORA four keys](https://dora.dev/guides/dora-metrics-four-keys/) · [metrics history](https://dora.dev/insights/dora-metrics-history/) ✅\n- [Prometheus: When to use the Pushgateway](https://prometheus.io/docs/practices/pushing/) ✅\n- [OTel semconv: CI/CD](https://opentelemetry.io/docs/specs/semconv/cicd/) ✅\n- [Apache DevLake](https://devlake.apache.org/) 📚\n"}, {"group": "Playbooks", "path": "playbooks/noisy-alerts-cleanup.md", "slug": "playbooks-noisy-alerts-cleanup", "title": "Playbook: Noisy alerts cleanup", "md": "# Playbook: Noisy alerts cleanup\n\n| Field | Value |\n|---|---|\n| Problem | \"On-call gets too many alerts and ignores most of them\" |\n| Layer(s) | All (process) |\n| Method | Inventory → classify → delete / tune / group → measure, see [standard/11 §7](#standard-11-alerting--7-cleaning-up-a-noisy-alert-set) |\n| Status | draft |\n| Last validated | – |\n\n## When to use it\n\n- More than ~2 pages per on-call shift (Google SRE limit).\n- People mute channels or acknowledge without reading.\n- The same incident produces many notifications.\n\n## Step 1 · Inventory (last 30 days)\n\n```promql\n# Times each alert started firing\nsort_desc(sum by (alertname) (changes(ALERTS{alertstate=\"firing\"}[30d])))\n\n# Alerts firing right now and for how long they have been active\nALERTS{alertstate=\"firing\"}\n```\n\nExport notifications from Alertmanager or the incident tool and build this table:\n\n| Alert | Fires / month | % acted on | Symptom or cause | Duplicate of | Owner | Runbook |\n|---|---|---|---|---|---|---|\n| | | | | | | |\n\n## Step 2 · Decide per alert\n\n| Finding | Action | Pattern |\n|---|---|---|\n| Fires often, nobody acts | Delete, or move to a dashboard | – |\n| Cause alert (CPU, memory, one pod) | Replace with a symptom / SLO alert | [rules/checkout-slo.rules.yml](#rules-readme) |\n| Ratio firing at night | Add a minimum-count guard | `ClientErrorRatioHigh` in [rules/patterns.rules.yml](#rules-readme) |\n| Count firing at peak | Convert to a ratio | [11 §1](#standard-11-alerting) |\n| Flapping | More dealerting samples, longer windows, multi-window burn rate | [10](#standard-10-slos-and-error-budgets) |\n| Many alerts per incident | Davis problem grouping + one Workflow per team (Alertmanager `group_by` / inhibition in the open-source variant) | below |\n| No owner or runbook | Assign, or delete | [20](#standard-20-ownership-and-communication) |\n\n```yaml\n# Alertmanager: one notification per service incident; silence pod alerts while the service page fires\nroute:\n  group_by: [alertname, service_name, client_id]\n  group_wait: 30s\n  group_interval: 5m\n  repeat_interval: 4h\ninhibit_rules:\n  - source_matchers: [severity=\"page\"]\n    target_matchers: [severity=\"ticket\"]\n    equal: [service_name]\n```\n\n## Step 3 · Shadow, then cut over\n\nNew and changed alerts go to a non-paging receiver for 1–2 weeks. Compare: did they catch every real incident? How many false positives did the old ones produce? Then switch paging ([transition plan](#framework-transition-plan)).\n\n## Step 4 · Measure\n\n| KPI | Target |\n|---|---|\n| Pages per on-call shift | ≤ 2 |\n| % of pages acted on | > 80–90% ⚠️ |\n| Notifications per incident | ≈ 1 |\n| Alerts with owner + runbook | 100% |\n\nShow the trend as stat tiles with sparklines in the monthly review ([14](#standard-14-dashboards)).\n\n## Validation\n\nRe-run the inventory query after 30 days and compare with step 1. The case study went from 38 alerts and ~9 pages per week to 9 alerts and ~1 page per week ([examples/case-study.md](#examples-case-study)).\n\n## Owners and communication\n\n| Who | Action |\n|---|---|\n| SRE | Facilitates the review, owns the standard |\n| Service teams | Decide on their alerts (they are accountable) |\n| On-call | Brings the noisy-alert list to each handover |\n\n## Dynatrace equivalent\n\nDavis groups related events into one problem automatically; alerting profiles filter which problems notify whom. *(📚 verify.)*\n\n## Sources\n\n- [Google SRE Book, *Being On-Call*](https://sre.google/sre-book/being-on-call/) ✅\n- [Prometheus Alertmanager configuration](https://prometheus.io/docs/alerting/latest/configuration/): `group_by`, `inhibit_rules` 📚\n- [Prometheus alerting practices](https://prometheus.io/docs/practices/alerting/) ✅\n"}, {"group": "Reference", "path": "collector/README.md", "slug": "collector-readme", "title": "Collector configs", "md": "# Collector configs\n\n> OpenTelemetry Collector base templates, validated with the pinned collector image (`make check-collector`).\n> Derived from the aks-observability lab, where their behavior was tested. Guide: [16](#standard-16-collector-templates).\n\n| File | Tier | What |\n|---|---|---|\n| <span class=\"repo-path\">collector/agent.yaml<\/span> | DaemonSet | Container logs (`filelog`), kubelet stats, OTLP from local pods; JSON log parsing; persistent disk queue |\n| <span class=\"repo-path\">collector/cluster.yaml<\/span> | Deployment, 1 replica | `k8s_cluster` (state, restarts, OOM reason), `k8sobjects` (events), `httpcheck` (internal synthetics) |\n| <span class=\"repo-path\">collector/gateway.yaml<\/span> | Deployment, 2+ | Identity, redaction, label allow-list, health-check filter, delta, export to **Dynatrace**, self-monitoring to Dynatrace |\n| <span class=\"repo-path\">collector/gateway-fanout.yaml<\/span> | Deployment | Variant: same stream to Dynatrace **and** an open-source stack (Mimir/Loki/Tempo) |\n| <span class=\"repo-path\">collector/check.sh<\/span> | – | `otelcol validate` on every file (dummy env + dummy service account in `testdata/`) |\n\n## Status\n\n| Check | Result |\n|---|---|\n| `validate` with `otel/opentelemetry-collector-contrib:0.162.0` (all four files) | ✅ 2026-11-20 |\n| Behavior (log loss, churn, masking, self-monitoring alerts) | ✅ measured in the lab with the original Helm values these templates come from |\n\n## Adapt\n\n| Setting | File |\n|---|---|\n| `DT_ENDPOINT`, `DT_API_TOKEN` (SaaS or in-cluster ActiveGate) | gateway |\n| `K8S_CLUSTER_NAME`, `K8S_CLUSTER_UID`, `DEPLOY_ENV` | gateway |\n| Gateway service address `otel-gateway.observability.svc` | agent, cluster |\n| Label allow-list, redaction rules | gateway |\n| `httpcheck` targets | cluster |\n| Tail sampling / `cumulative_to_delta`: same trace or series must reach the same gateway replica | gateway |\n"}, {"group": "Reference", "path": "dynatrace/README.md", "slug": "dynatrace-readme", "title": "Dynatrace as code (Monaco)", "md": "# Dynatrace as code (Monaco)\n\n> **In 30 seconds:** SRE owns the **templates** (the baseline). Each service owns one short **`observability.yaml`**.\n> `generate.py` turns every service file into Monaco configs (SLOs, custom alerts) and one routing workflow per team;\n> one shared L1 dashboard serves all services through its `$service` variable. CI runs a dry run on every PR and\n> `monaco deploy` on merge. Guide: [18](#standard-18-automation-and-scale).\n\n## Layout\n\n```text\ndynatrace/\n├── manifest.yaml              ← environments + projects; URLs and credentials from CI secrets\n├── services-src/              ← one observability.yaml per service (in real life: in each service repo)\n│   ├── checkout.yaml          ← archetype: api\n│   ├── orders-worker.yaml     ← archetype: queue-consumer\n│   └── nightly-billing.yaml   ← archetype: batch\n├── templates/                 ← the baseline, owned by SRE (\"one side\")\n│   ├── slo-availability.json · slo-latency.json · slo-queue-age.json\n│   ├── alert-burn-rate.json · alert-client-ratio.json · alert-dlq.json · alert-batch-overdue.json\n│   └── workflow-route-team.json\n├── shared/                    ← deployed once\n│   ├── config.yaml            ← document (kind: dashboard, private: false)\n│   └── dashboard-service.json ← L1 dashboard with a $service variable\n├── projects/                  ← GENERATED by generate.py, never edited by hand\n│   ├── services/<service>/config.yaml\n│   └── teams/<team>/config.yaml\n├── generate.py                ← service files → Monaco configs\n└── check.py                   ← offline check: templates exist, parameters provided, rendered JSON valid\n```\n\n## What each archetype gets\n\n| Archetype | Configs generated | Monaco type |\n|---|---|---|\n| `api` | Availability SLO, latency SLO (if `latency_ms`), fast-burn alert, per-client error-ratio alert (if `per_client`) | `slo-v2`, `settings` (`builtin:davis.anomaly-detectors`) |\n| `queue-consumer` | Oldest-message-age SLO, DLQ count alert, backlog-growing-at-max-consumers alert (if `max_consumers`) | `slo-v2`, `settings` |\n| `batch` | \"No successful run in 2 intervals\" alert | `settings` |\n| `platform-service` | Internal SLO from callers' client spans (`server.address`), one saturation alert per listed resource (e.g. connections) | `slo-v2`, `settings` |\n| every team | Workflow: problems with `team = <team>` → the team's on-call channel | `automation` (`workflow`) |\n| everyone | One L1 service dashboard | `document` (`dashboard`) |\n\nAlerts set `team` and `runbook` on the event they raise, so the team's Workflow can route them and the page carries the runbook.\n\n## Pipeline\n\n| Step | Command | When |\n|---|---|---|\n| Generate | `python3 dynatrace/generate.py` | PR and merge (fails if a service file misses `service`, `team`, `tier`, `archetype` or `runbook`) |\n| Offline check | `python3 dynatrace/check.py` | PR |\n| Dry run against the tenant | `monaco deploy dynatrace/manifest.yaml --dry-run` | PR |\n| Deploy | `monaco deploy dynatrace/manifest.yaml` | Merge to main |\n| Remove a retired service | Delete its service file and run `monaco delete` with a delete file listing its config IDs | When a service is decommissioned |\n\nCredentials (CI secrets): `DT_ENV_URL`, `DT_API_TOKEN` (settings), `DT_OAUTH_CLIENT_ID` / `DT_OAUTH_CLIENT_SECRET` (SLOs, documents, workflows), with only the scopes those configs need.\n\n## Rules\n\n| Rule | Why |\n|---|---|\n| **Config IDs include the service or team name** | Monaco identifies objects by ID; a shared ID would make each service overwrite the last |\n| **Bootstrap templates with `monaco download`**: build one SLO, alert, dashboard and workflow in the UI for a pilot service, download, then replace values with `{{ .param }}` | The JSON schema is the tenant's, not a guess; the templates here are shapes to show the idea |\n| Keep templates simple: parameters only, no logic | Monaco docs advise it; logic belongs in `generate.py` |\n| Escape workflow expressions as `{{ \"{{\" }} … {{ \"}}\" }}` | Workflows use `{{ }}` too; Monaco would try to fill them |\n| Documents created by Monaco are private unless `private: false` | Otherwise only the deploying identity sees the dashboard |\n| Nobody edits generated objects in the UI | The next deploy overwrites them; change the template or the service file |\n| Thresholds are tier defaults in `generate.py`; a service can override them in its file | One place for defaults, explicit exceptions |\n\n## Status\n\n| Check | Result |\n|---|---|\n| `generate.py` on the four example services | 10 service configs + 3 team workflows |\n| `check.py` (parameters, rendered JSON, unique IDs) | ✅ 14 configs valid |\n| `monaco deploy --dry-run` | Run it in your CI against your tenant |\n\n## Sources\n\n- [Monaco: configuration YAML](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/configuration/yaml-configuration-saas) · [type fields (settings, automation, document, slo-v2)](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/configuration/yaml-configuration-saas-type-fields) · [projects and manifest](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/configuration/projects) · [CLI commands (deploy, download, delete)](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/reference/commands-saas) · [Go templating](https://docs.dynatrace.com/docs/deliver/configuration-as-code/monaco/guides/configuration-as-code-advanced-use-case) ✅ 2026-11-20\n- [Dynatrace: anomaly detectors via API (StaticThresholdAnomalyDetectionAnalyzer)](https://docs.dynatrace.com/docs/dynatrace-intelligence/anomaly-detection/set-up-anomaly-detectors-via-api) · [Workflow event triggers](https://docs.dynatrace.com/docs/analyze-explore-automate/workflows/build/trigger/event-trigger) · [SLOs](https://docs.dynatrace.com/docs/deliver/service-level-objectives) ✅ 2026-11-20\n- Template JSON bodies: illustrative shapes ⚠️ (export real ones with `monaco download`)\n"}, {"group": "Reference", "path": "AGENTS.md", "slug": "agents", "title": "AGENTS.md: how to use the Observability Guide", "md": "# AGENTS.md: how to use the Observability Guide\n\nYou are helping an SRE with observability. The stack is **OpenTelemetry for collection and Dynatrace as the backend**\n(ActiveGate, some OneAgent). This repository is the **standard**: base every recommendation on it, cite the file and\nsection, and explain *why*. Default to Dynatrace concepts (DQL, SLO app, custom alerts, Davis problems, Workflows,\nDynatrace dashboards; configuration as code with **Monaco only**); use Prometheus/PromQL only when asked (open-source variants are in collapsed boxes).\n\n## Map (six parts)\n\n| Part | Path | Use it for |\n|---|---|---|\n| Start | `stan
